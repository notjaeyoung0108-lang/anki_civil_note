:root{ --bg:#f4f5f7; --card:#fff; --ink:#1e242b; --dim:#6b747d; --line:#e2e5e9;
       --ok:#2f7d5d; --accent:#2f5d8a; --warn:#a8552f; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181c; --card:#1c2126; --ink:#e6e9ec; --dim:#98a1aa; --line:#2b3238;
         --accent:#7aa6d2; } }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:"NoteHead","NoteBody","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:16px; line-height:1.6; }
header{ background:var(--card); border-bottom:1px solid var(--line);
  padding:15px 16px; text-align:center; }
header b{ font-size:20px; letter-spacing:-.01em; font-weight:normal; }
main{ max-width:720px; margin:0 auto; padding:14px 14px 48px; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:6px 14px; margin:0 0 12px; }
.card.pad{ padding:14px 16px; }
h2{ font-size:14px; margin:22px 0 8px; padding:0 4px; color:var(--dim); }
.bar{ display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--dim);
  margin:0 0 12px; padding:0 4px; }
.bar b{ color:var(--ink); font-size:18px; }

/* 과목 → 단원 두 단계 */
.subj{ border-bottom:1px solid var(--line); }
.subj:last-child{ border-bottom:0; }
.subj > button{ width:100%; display:flex; align-items:center; gap:10px; padding:13px 4px;
  background:none; border:0; color:inherit; font:inherit; font-size:16.5px; cursor:pointer;
  text-align:left; }
.subj > button .caret{ width:0; height:0; flex:0 0 8px; margin-left:3px;
  border-left:6px solid var(--dim); border-top:4.5px solid transparent;
  border-bottom:4.5px solid transparent; transition:transform .15s; }
.subj[open] > button .caret{ transform:rotate(90deg); }
.subj > button .nm{ flex:1; }
.subj > button .n{ font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; }
.subj > button .due, .unit .due{ color:var(--accent); font-weight:700;
  font-size:inherit; }
.units{ display:none; padding:0 0 8px 14px; }
.ch{ border-top:1px solid var(--line); }
.ch:first-child{ border-top:0; }
.chh{ width:100%; display:flex; align-items:center; gap:9px; padding:10px 4px;
  background:none; border:0; color:var(--dim); font:inherit; font-size:14px;
  cursor:pointer; text-align:left; }
.chh .caret{ width:0; height:0; flex:0 0 7px;
  border-left:5px solid var(--line); border-top:4px solid transparent;
  border-bottom:4px solid transparent; transition:transform .15s; }
.ch[open] .chh{ color:var(--ink); }
.ch[open] .chh .caret{ transform:rotate(90deg); border-left-color:var(--dim); }
.chh .nm{ flex:1; }
.chh .n{ font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.chu{ display:none; padding:0 0 6px 16px; }
.ch[open] .chu{ display:block; }
.unit.todo{ padding:8px 4px 8px 10px; border-top:1px solid var(--line); opacity:.45; }
.unit.todo .n{ font-size:11.5px; }
.subj[open] .units{ display:block; }
a.unit, .unit.todo{ display:block; color:inherit; text-decoration:none; padding:9px 4px 9px 10px;
  border-top:1px solid var(--line); }
.unit .t{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.unit .t > span:first-child{ font-size:15px; }   /* > 없으면 .n 안의 .due 까지 잡힌다 */
.unit .n{ font-size:12.5px; color:var(--dim); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.prog{ height:5px; border-radius:3px; background:var(--line); overflow:hidden; margin-top:5px; }
.prog i{ display:block; height:100%; background:var(--ok); }

.hm{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,11px); gap:3px;
  overflow-x:auto; padding:2px; }
.hm i{ width:11px; height:11px; border-radius:2.5px; background:var(--line); }
.tools{ display:flex; gap:8px; flex-wrap:wrap; }
.tools button{ border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:9px; padding:9px 13px; font:inherit; font-size:14px; cursor:pointer; }
.tools button.go{ border-color:var(--accent); background:var(--accent); color:#fff; font-weight:700; }
.note{ font-size:12.5px; color:var(--dim); margin-top:8px; line-height:1.55; }
label.row{ display:block; font-size:12.5px; color:var(--dim); margin:8px 0 2px; }
input[type=text], input[type=password]{ width:100%; padding:9px 10px; border-radius:9px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit;
  font-size:14px; }
.st{ font-size:12.5px; margin-top:10px; }
.st.ok{ color:var(--ok); } .st.err{ color:var(--warn); }

function merge(inc){
  let n = 0;
  for (const [id, st] of Object.entries(inc.s||{})){
    const mine = S.s[id];
    if (!mine || (st.reps||0) > (mine.reps||0)){ S.s[id] = st; n++; }
  }
  const seen = new Set(S.log.map(l => l.t+"|"+l.id));
  (inc.log||[]).forEach(l => { if (!seen.has(l.t+"|"+l.id)){ S.log.push(l); n++; } });
  S.log.sort((a,b) => a.t-b.t);
  save();
  return n;
}

/* ── GitHub 동기화 ─────────────────────────────────────────
   깃 저장소의 파일 하나(review-log.json)를 공용 노트로 쓴다. 서버도 DB도 없다.
   토큰은 이 브라우저에만 두고, **기록 저장소 하나에만** 권한을 준 fine-grained PAT 를 쓴다. */
async function gh(path, opt){
  const c = cfg();
  try{
    return await fetch("https://api.github.com/repos/" + c.repo + "/contents/" + path, opt);
  }catch(e){
    throw new Error("GitHub 에 닿지 못했습니다 — 인터넷 연결이나 사내망 차단을 확인하세요 ("
                    + e.message + ")");
  }
}
function b64enc(str){
  const b = new TextEncoder().encode(str);
  let s = ""; b.forEach(x => s += String.fromCharCode(x));
  return btoa(s);
}
function b64dec(b64){
  const bin = atob(b64.replace(/\s/g, ""));
  const arr = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(arr);
}
function headers(){
  const c = cfg();
  return { "Authorization": "Bearer " + c.token, "Accept": "application/vnd.github+json",
           "X-GitHub-Api-Version": "2022-11-28" };
}

async function pull(){
  const c = cfg();
  if (!c.repo || !c.token) throw new Error("저장소와 토큰을 먼저 넣으세요");
  const r = await gh(c.path || "review-log.json", { headers: headers() });
  if (r.status === 404) return { n: 0, sha: null, empty: true };
  if (r.status === 401) throw new Error("토큰이 거부됐습니다 (401) — 토큰을 다시 확인하세요");
  if (r.status === 403) throw new Error("권한이 없습니다 (403) — 토큰에 그 저장소의 Contents 읽기·쓰기를 주세요");
  if (!r.ok) throw new Error("내려받기 실패 " + r.status + " — " + (await r.text()).slice(0,120));
  const j = await r.json();
  const n = merge(JSON.parse(b64dec(j.content)));
  return { n, sha: j.sha };
}

async function push(sha){
  const c = cfg();
  if (!c.repo || !c.token) throw new Error("저장소와 토큰을 먼저 넣으세요");
  const path = c.path || "review-log.json";
  if (sha === undefined){                       // sha 를 모르면 먼저 알아본다
    const r0 = await gh(path, { headers: headers() });
    sha = r0.ok ? (await r0.json()).sha : null;
  }
  const body = { message: "복습 기록 " + new Date().toISOString().slice(0,16).replace("T"," "),
                 content: b64enc(JSON.stringify(S)) };
  if (sha) body.sha = sha;
  const r = await gh(path, { method:"PUT", headers: headers(), body: JSON.stringify(body) });
  if (!r.ok) throw new Error("올리기 실패 " + r.status + " — " + (await r.text()).slice(0,120));
  const c2 = cfg(); c2.last = Date.now(); setCfg(c2);
}

function say(msg, kind){
  const el = document.getElementById("st");
  if (el){ el.textContent = msg; el.className = "st " + (kind||""); }
}

async function syncNow(){
  say("맞추는 중…");
  try{
    const { n, sha, empty } = await pull();
    await push(empty ? null : sha);
    say("맞췄습니다" + (n ? " · 새로 받은 기록 " + n + "건" : ""), "ok");
    render();
  }catch(e){ say(e.message, "err"); }
}

/* ── 화면 ─────────────────────────────────────────────────── */
function render(){
  const t = Date.now(), today = dayKey(t);
  const byDay = {}; S.log.forEach(l => { const k=dayKey(l.t); byDay[k]=(byDay[k]||0)+1; });
  let streak = 0; for (let d=today; byDay[d]; d-=DAY) streak++;

  const opened = openSet();
  const stat = u => {
    const seen = u.rids.filter(r => S.s[r]).length;
    const due  = u.rids.filter(r => S.s[r] && S.s[r].due <= t).length;
    const solid= u.rids.filter(r => S.s[r] && S.s[r].step === null && S.s[r].ivl >= 21).length;
    return { all: u.rids.length, seen, due, solid };
  };

  const subj = [];
  for (const u of UNITS){
    let g = subj.find(x => x.key === u.subj);
    if (!g){ g = { key:u.subj, name:u.subjName, units:[] }; subj.push(g); }
    g.units.push(u);
  }
  const ORDER = ["응용역학", "측량학", "수리학", "철콘", "토질", "상하수도공학"];
  subj.sort((a,b) => {
    const ia = ORDER.indexOf(a.key), ib = ORDER.indexOf(b.key);
    if (ia !== ib) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    return a.name.localeCompare(b.name, "ko");
  });

  let allN=0, seenN=0, dueN=0, solidN=0, rows="";
  for (const g of subj){
    // 장별로 묶는다
    const chs = [];
    for (const u of g.units){
      let c = chs.find(x => x.ch === u.ch);
      if (!c){ c = { ch:u.ch, title:u.chTitle, units:[] }; chs.push(c); }
      c.units.push(u);
      if (!c.title && u.chTitle) c.title = u.chTitle;
    }
    chs.sort((a,b) => a.ch - b.ch);
    chs.forEach(c => c.units.sort((a,b) => a.ord - b.ord));

    let a=0, se=0, d=0, so=0, done=0, inner="";
    for (const c of chs){
      let cd=0, cw=0;
      let lines="";
      for (const u of c.units){
        if (!u.file){                                    // 아직 안 쓴 단원
          lines += `<div class="unit todo"><div class="t">`
            + `<span>${u.ord}. ${esc(u.title)}</span><span class="n">아직</span></div></div>`;
          continue;
        }
        cw++; done++;
        const st = stat(u); a+=st.all; se+=st.seen; d+=st.due; so+=st.solid; cd+=st.due;
        lines += `<a class="unit" href="${u.file}?v=${BUILD}"><div class="t">`
          + `<span>${u.ord}. ${esc(u.title)}</span>`
          + `<span class="n">${st.due ? `<span class="due">복습 ${st.due}</span> · ` : ""}`
          + `${st.seen}/${st.all}</span></div>`
          + `<div class="prog"><i style="width:${(st.solid/st.all*100).toFixed(0)}%"></i></div></a>`;
      }
      const ck = g.key + "|" + c.ch;
      inner += `<div class="ch"${opened.has(ck) ? " open" : ""} data-k="${esc(ck)}">`
        + `<button class="chh"><span class="caret"></span>`
        + `<span class="nm">제${c.ch}장${c.title ? " " + esc(c.title) : ""}</span>`
        + `<span class="n">${cd ? `<span class="due">복습 ${cd}</span> · ` : ""}`
        + `${cw}/${c.units.length}</span></button>`
        + `<div class="chu">${lines}</div></div>`;
    }
    allN+=a; seenN+=se; dueN+=d; solidN+=so;
    rows += `<div class="subj"${opened.has(g.key) ? " open" : ""} data-k="${esc(g.key)}">`
      + `<button><span class="caret"></span><span class="nm">${esc(g.name)}</span>`
      + `<span class="n">${d ? `<span class="due">복습 ${d}</span> · ` : ""}`
      + `${done}/${g.units.length}단원 · ${se}/${a}</span></button>`
      + `<div class="units">${inner}</div></div>`;
  }

  const start = today - 83*DAY - (new Date(today).getDay())*DAY;
  const max = Math.max(1, ...Object.values(byDay));
  let hm = "";
  for (let d=start; d<=today; d+=DAY){
    const n = byDay[d]||0, al = n ? (0.25+0.75*Math.min(1,n/max)) : 0;
    hm += `<i title="${new Date(d).toLocaleDateString()} · ${n}회"`
       + (n ? ` style="background:rgba(47,125,93,${al.toFixed(2)})"` : "") + `></i>`;
  }

  const c = cfg();
  document.getElementById("app").innerHTML = `
    <div class="bar"><span>오늘 <b>${byDay[today]||0}</b>회</span>
      <span>연속 <b>${streak}</b>일</span>
      <span>누적 <b>${S.log.length}</b>회</span>
      <span>복습할 것 <b>${dueN}</b></span></div>
    <div class="card">${rows}</div>
    <h2>최근 12주</h2><div class="card pad"><div class="hm">${hm}</div>
      <div class="note">빈칸 ${allN}개 중 ${seenN}개 시작 · 단단함(간격 21일 이상) ${solidN}개.
        막대는 단단함 비율입니다.</div></div>
    <h2>기기 사이 맞추기</h2>
    <div class="card pad">
      <div class="tools">
        <button class="go" id="sync">지금 맞추기</button>
        <button id="pl">내려받기만</button>
        <button id="ps">올리기만</button>
      </div>
      <div class="st" id="st">${c.last ? "마지막 " + new Date(c.last).toLocaleString() : ""}</div>
      <label class="row">기록 저장소 (owner/repo — <b>비공개</b>로 만드세요)</label>
      <input type="text" id="repo" value="${esc(c.repo||"")}" placeholder="y0ung0108/j0-review-log">
      <label class="row">파일 경로</label>
      <input type="text" id="path" value="${esc(c.path||"review-log.json")}">
      <label class="row">GitHub 토큰 (fine-grained · 그 저장소의 Contents 읽기·쓰기만)</label>
      <input type="password" id="token" value="${esc(c.token||"")}" placeholder="github_pat_...">
      <div class="tools" style="margin-top:10px">
        <button id="savecfg">저장</button>
        <button id="auto" aria-pressed="${!!c.auto}">${c.auto ? "열 때 자동 켬" : "열 때 자동 끔"}</button>
      </div>
      <div class="note">서버도 데이터베이스도 없습니다 — 깃 저장소의 파일 하나를 공용 노트로 씁니다.
        <b>기록 저장소는 비공개로</b> 만들고, 토큰은 그 저장소 하나에만 권한을 주세요.
        토큰은 이 브라우저에만 저장됩니다.</div>
    </div>
    <h2>하루 새 빈칸 상한</h2>
    <div class="card pad">
      <div class="tools">${CAPS.map(v => `<button data-cap="${v}" aria-pressed="${cap()===v}">`
        + (v > 1000 ? "제한 없음" : v + "개") + `</button>`).join("")}</div>
      <div class="note">오늘 새로 시작한 빈칸 ${newToday()}개 / 상한 ${cap()}개.
        복습(이미 본 빈칸)은 상한과 무관하게 전부 나옵니다. 상한이 없으면 한 단원에
        200개짜리도 한 번에 다 열게 되고, 그러면 다음 날 복습이 감당이 안 됩니다.</div>
    </div>
    <h2>파일로 옮기기</h2>
    <div class="card pad"><div class="tools">
        <button id="exp">내보내기</button>
        <button id="imp">가져오기</button>
        <button id="rst">전부 지우기</button></div>
      <div class="note">깃을 안 쓸 때. 가져오기는 <b>합칩니다</b>(같은 빈칸은 복습 횟수가 많은 쪽).
        <br>빌드 ${BUILT}</div>
      <input type="file" id="f" accept=".json" style="display:none"></div>`;

  const wireToggle = sel => document.querySelectorAll(sel).forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const d = b.parentElement, k = d.getAttribute("data-k"), o = openSet();
      if (d.hasAttribute("open")){ d.removeAttribute("open"); o.delete(k); }
      else { d.setAttribute("open",""); o.add(k); }
      setOpen(o);
    };
  });
  wireToggle(".subj > button");
  wireToggle(".ch > button.chh");

  const val = id => document.getElementById(id).value.trim();
  document.getElementById("savecfg").onclick = () => {
    const c2 = cfg();
    c2.repo = val("repo"); c2.path = val("path") || "review-log.json"; c2.token = val("token");
    setCfg(c2); say("저장했습니다", "ok");
  };
  document.getElementById("auto").onclick = () => {
    const c2 = cfg(); c2.auto = !c2.auto; setCfg(c2); render();
  };
  document.querySelectorAll("[data-cap]").forEach(b => {
    b.onclick = () => { localStorage.setItem("j0-cap", b.dataset.cap); render(); };
  });
  document.getElementById("sync").onclick = syncNow;
  document.getElementById("pl").onclick = async () => {
    say("내려받는 중…");
    try{ const r = await pull(); say(r.empty ? "저장소에 기록 파일이 아직 없습니다"
          : "받았습니다 · 새 기록 " + r.n + "건", "ok"); render(); }
    catch(e){ say(e.message, "err"); }
  };
  document.getElementById("ps").onclick = async () => {
    say("올리는 중…");
    try{ await push(); say("올렸습니다", "ok"); }
    catch(e){ say(e.message, "err"); }
  };

  document.getElementById("exp").onclick = () => {
    const b = new Blob([JSON.stringify(S)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "review-log-" + new Date().toISOString().slice(0,10) + ".json";
    a.click();
  };
  document.getElementById("imp").onclick = () => document.getElementById("f").click();
  document.getElementById("f").onchange = ev => {
    const fr = new FileReader();
    fr.onload = () => { try{ const n = merge(JSON.parse(fr.result));
        say("합쳤습니다 · 새 기록 " + n + "건", "ok"); render();
      }catch(e){ say("읽지 못했습니다: "+e.message, "err"); } };
    fr.readAsText(ev.target.files[0]);
  };
  document.getElementById("rst").onclick = () => {
    if (confirm("복습 기록을 전부 지웁니다. 되돌릴 수 없습니다.")){
      S = {s:{}, log:[]}; save(); render(); }
  };
}

render();
const c0 = cfg();
if (c0.auto && c0.repo && c0.token) syncNow();
window.addEventListener("focus", () => { S = load(); render(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){ S = load(); render(); }
});
</script></body></html>
