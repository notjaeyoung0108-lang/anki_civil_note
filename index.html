:root{ --bg:#f4f5f7; --card:#fff; --ink:#1e242b; --dim:#6b747d; --line:#e2e5e9;
       --ok:#2f7d5d; --accent:#2f5d8a; --warn:#a8552f; --bad:#a33a3a;
       --cell:#e6e8ea; --fill:74,124,229; --thead:#f2f4f6;
       --shadow:0 1px 3px rgba(30,36,43,.07), 0 12px 28px rgba(30,36,43,.11);
       --shadow-s:0 1px 2px rgba(30,36,43,.10), 0 4px 10px rgba(30,36,43,.10);
       --tabh:calc(52px + env(safe-area-inset-bottom)); }
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181c; --card:#1c2126; --ink:#e6e9ec; --dim:#98a1aa; --line:#2b3238;
         --accent:#7aa6d2; --ok:#5aab86; --bad:#d1746f; --warn:#d19a6f;
         --cell:#262c32; --fill:110,152,240; --thead:#232930;
         --shadow:0 1px 3px rgba(0,0,0,.45), 0 12px 30px rgba(0,0,0,.55);
         --shadow-s:0 1px 2px rgba(0,0,0,.4), 0 4px 10px rgba(0,0,0,.4); } }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:"NoteHead","NoteBody","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:16px; line-height:1.6; }

/* ── 머리 ── */
header{ position:sticky; top:0; z-index:10; background:var(--card);
  border-bottom:1px solid var(--line); padding:13px 10px;
  padding-top:calc(13px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:6px; }
header b{ flex:1; text-align:center; font-size:19px; font-weight:normal;
  letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header button{ background:none; border:0; color:var(--dim); font:inherit; font-size:13.5px;
  cursor:pointer; padding:6px 8px; border-radius:8px; display:flex; align-items:center;
  gap:5px; min-width:62px; }
header button:disabled{ visibility:hidden; }
header #gear{ justify-content:flex-end; }
.tri{ width:0; height:0; border-right:6px solid currentColor;
  border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; }

main{ max-width:720px; margin:0 auto; padding:12px 14px calc(20px + var(--tabh)); }

/* ── 아래 탭 — 화면 셋을 오간다 ── */
#tabs{ position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
  background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); }
/* 탭은 flex 로 가운데 정렬한다 — 배지(숫자 알약)를 `vertical-align` 픽셀값으로 밀면
   글자 크기를 고칠 때마다 그 숫자를 다시 맞춰야 한다. */
#tabs a{ flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
  padding:15px 0 16px; text-decoration:none;
  color:var(--dim); font-size:16px; line-height:1.2; letter-spacing:-.01em; }
#tabs a.on{ color:var(--accent); }
/* 배지도 실측 보정이다 — `align-items:center` 는 **상자**를 맞추지만 주아체 글자는 그
   상자 안에서 위에 앉으므로, 알약이 라벨보다 아래로 내려간 것처럼 보인다.
     · 알약 중앙이 '오답' 글자 잉크 중앙보다 1.12px 아래 → 알약을 그만큼 올린다
     · 알약 안 숫자는 알약 중앙보다 0.75px 위          → 숫자를 그만큼 내린다
   px 로 적는다: 이 값은 **라벨(16px)의 글자 metrics** 에서 나오므로 배지의 em 으로 적으면
   엉뚱하게 따라간다. 탭 글자 크기를 고치면 `_check_align.py` 로 다시 재라. */
#tabs a .n{ display:inline-block; min-width:18px; padding:1px 5px;
  border-radius:9px; background:var(--accent); color:#fff; font-size:10.5px;
  line-height:1.45; transform:translateY(-1.12px); }

/* ── 타일 ── */

.tile{ background:var(--card); border:1px solid var(--line); border-radius:16px;

/* ── 과목 패널 ── */
.panel{ display:block; text-decoration:none; color:inherit; background:var(--card);

.due{ color:var(--accent); font-weight:700; }
.pbody{ display:flex; gap:16px; align-items:flex-start; }
.pstat{ flex:1; min-width:0; font-size:12px; color:var(--dim); line-height:1.7;

/* 12주 = 7행 × 12열. 칸을 고정 크기로 작게 잡아 촘촘하게 붙인다. */
.hm{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,10px);

.hm i{ border-radius:2.5px; background:var(--cell); }

/* ── 과목 화면: 장 → 절 ── */
.card{ background:var(--card); border:1px solid var(--line); border-radius:20px;

.card.pad{ padding:15px 18px; }
h2.sec{ font-size:13px; margin:20px 0 8px; padding:0 6px; color:var(--dim); }

.chh{ width:100%; display:flex; align-items:center; gap:9px; padding:12px 2px;

.chh .caret{ width:0; height:0; flex:0 0 7px;

  border-bottom:4px solid transparent; transition:transform .15s; }
.ch[open] .chh{ color:var(--ink); }
.ch[open] .chh .caret{ transform:rotate(90deg); border-left-color:var(--dim); }
.chh .nm{ flex:1; }
.chh .n{ font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.chu{ display:none; padding:0 0 8px 15px; }
.ch[open] .chu{ display:block; }
a.unit, .unit.todo{ display:block; color:inherit; text-decoration:none;

.unit.todo{ opacity:.42; }
.unit .t{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.unit .t > span:first-child{ font-size:15px; }
.unit .n{ font-size:12.5px; color:var(--dim); white-space:nowrap;

.unit.todo .n{ font-size:11.5px; }
.dot{ display:inline-block; width:7px; height:7px; border-radius:4px;
  background:var(--line); margin-right:6px; vertical-align:1px; }
.dot.s1{ background:var(--warn); } .dot.s2{ background:var(--accent); }
.dot.s3{ background:var(--ok); }

/* ── 오늘의 덱 안내 ── */
.deckhead{ background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:18px 20px 20px; margin-bottom:12px; }
.deckhead h3{ margin:0 0 4px; font-size:15px; font-weight:normal; color:var(--dim); }
.deckhead .big{ font-size:30px; line-height:1.25; font-variant-numeric:tabular-nums; }

.deckhead .sub{ font-size:13px; color:var(--dim); margin-top:6px; line-height:1.7; }

/* ── 카드 ── */
.cnt{ text-align:center; font-size:12.5px; margin:2px 0 10px;
  font-variant-numeric:tabular-nums; }
.cnt a{ color:var(--dim); text-decoration:none; display:inline-block;

.cnt a b{ font-weight:normal; color:var(--ink); }
.fcard{ background:var(--card); border:1px solid var(--line); border-radius:20px;

.fq{ margin:auto 0; text-align:center; }
.fq .ch{ font-size:15px; color:var(--dim); border:0; }
.fq .ti{ font-size:29px; line-height:1.38; margin-top:6px; }
.fa .ti{ font-size:22px; margin-bottom:16px; }
.fa{ margin-top:4px; }
.bn{ margin:0 0 12px; }
.bh{ font-size:18px; display:flex; gap:9px; align-items:baseline; }
/* 제목 번호는 **각진 검정 네모**다 (둥글리면 아래 (1)(2) 목록과 무게가 비슷해져
   어느 쪽이 상위인지 눈에 안 온다). */
/* 숫자는 크게, 상자는 그대로. font-size 를 올리면서 line-height 를 조여 상자 높이를
   20px 안팎으로 유지한다 (14 × 1.15 + 여백 2 + 테두리 3 ≈ 21). */
.bh i{ font-style:normal; flex:0 0 auto; min-width:25px; text-align:center;
  border:1.5px solid var(--ink); border-radius:0; font-size:15px; color:var(--ink);
  padding:1px 4px; line-height:1.2; }
/* 주아체(BMJUA)는 글리프가 em 박스 **위쪽에** 붙어 있어, line-height 로 가운데를 맞춰도
   숫자와 제목이 떠 보인다. 아래 두 값은 **헤드리스 크롬에 실제로 그려 픽셀로 잰 것**이다
   (재는 방법은 study/CLAUDE.md 의 '숫자 정렬' 참조). em 으로 적어 글자 크기를 바꿔도 따라온다.
     · 네모칸 숫자 12px  — 잉크 중앙이 칸 중앙보다 1.5px 위 → 0.125em
     · 제목    15.5px — 잉크 중앙이 칸 중앙보다 3.0px 위 → 0.19em
   ⚠ `.bh` 의 font-size·line-height 나 네모칸의 padding·border 를 고치면 이 값도 다시 재라.
   ⚠ 한때 캔버스로 매번 재서 맞췄는데, **서체가 올라오기 전에 잰 값이 캐시에 박혀** 대체
     서체 기준으로 5px 씩 밀렸다. 이 자리에선 고정값이 더 튼튼하다. */
.bh i > span{ display:inline-block; transform:translateY(0.125em); }
.bh > span{ display:inline-block; transform:translateY(0.105em); }
#tabs .n > span{ display:inline-block; transform:translateY(0.75px); }
/* 소제목 번호는 노트와 같은 표기 — `1.` 이 아니라 `(1)`. */
.bs{ margin:9px 0 0; padding-left:29px; color:var(--dim); font-size:15.5px;

.bs li{ margin:3px 0; }

/* 채점 단추는 아래 탭 **위에** 앉아야 한다 — 탭이 늘 보이므로 그만큼 띄운다. */
.acts{ position:sticky; bottom:calc(8px + var(--tabh)); margin-top:12px; }
.flip{ width:100%; border:0; border-radius:14px; background:var(--ink); color:var(--bg);

#grades{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
/* 채점 단추는 **색으로 채운다.** 글자는 같은 계열의 짙은 색 — 흰 글자로 두면 셋이
   비슷해 보여서, 손이 기억하는 것이 '자리' 뿐이 된다. 색은 테마에 따라 바뀌지 않는다
   (어두운 화면에서 뒤집히면 빨강·초록의 뜻이 흔들린다). */
#grades button{ border:0; border-radius:14px; padding:12px 4px; font:inherit;

#grades button:active{ transform:translateY(1px); }

#grades .g2{ background:#D3D3D3; color:#1e242b; }

/* ── 풀이 시트 ── */

/* 풀이의 **내용**은 Pretendard 로. 여기가 앱에서 가장 긴 산문(연결)이라, 손글씨체나

   본문을 조용히 두는 것이 요점이라 네모 배지나 각주 목록을 두지 않는다: 번호가 곧

   로. 시험 문제는 낱말 하나가 답을 가르므로(`…만`·`아닌 것은`) 글자가 또렷해야 한다. */

/* ⚠ **수식은 Pretendard 를 태우지 않는다.** MathML 의 글자는 지금 브라우저가 그리는 대로
   두는 것이 안전하다 — 서체를 바꾸면 그리스문자·프라임의 모양과 자리가 함께 흔들린다.

  /* 글자를 상자 한가운데로 —— 한글은 밑으로 삐치는 획이 거의 없어서, 줄상자 기준으로

  var _ink = {};

        }

      if (top >= 0) r = { asc: (baseY - top) / S, desc: (bot - baseY) / S };

  /* 잉크를 **자기 줄상자 한가운데**로 맞춘다. 알약 한가운데에 맞추면 두 줄 이상일 때
     통째로 어긋나므로 기준은 늘 첫 줄이다. 알약과의 정렬은 CSS(align-items:center)가
     맡고, 여기서는 줄상자 안의 위아래 쏠림만 없앤다. */
  function center(msgEl, boxEl) {

window.J0Sync = (function () {
  var KEY = "j0-review-v1", SKEY = "j0-sync";
  /* 저장소·경로는 **빌드에서 박는다.** 사이트를 올린 그 저장소에 기록 파일을 같이 둔다 —
     사람이 화면에서 저장소 이름을 적어 넣게 하면 기기마다 틀리게 적어 어긋난다. */
  var REPO = "notjaeyoung0108-lang/j0-review-log", PATH = "review-log.json";

  function cfg() { try { return JSON.parse(localStorage.getItem(SKEY) || "{}"); }
                   catch (e) { return {}; } }
  function setCfg(c) { localStorage.setItem(SKEY, JSON.stringify(c)); }
  function where() { return { repo: REPO, path: PATH }; }

  function ready() { return !!REPO; }
  function canWrite() { return !!(REPO && cfg().token); }

  function load() {
    try { var r = JSON.parse(localStorage.getItem(KEY) || "{}");
          return { s: r.s || {}, log: r.log || [] }; }
    catch (e) { return { s: {}, log: [] }; }
  }
  function save(S) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

     저장소(localStorage)에 바로 쓰므로, 부르는 쪽은 끝나고 다시 읽어야 한다.
     돌려주는 수는 **새로 들어온 채점 기록(log) 건수**다. 상태(s) 갱신까지 같이 세면
     다른 기기에서 한 번 채점한 것이 사람에게 "2건" 으로 보인다. */
  function merge(inc) {
    var S = load(), n = 0;
    var incS = (inc && inc.s) || {}, incL = (inc && inc.log) || [];
    for (var id in incS) {
      var mine = S.s[id];
      if (!mine || (incS[id].reps || 0) > (mine.reps || 0)) S.s[id] = incS[id];
    }
    var seen = {};
    S.log.forEach(function (l) { seen[l.t + "|" + l.id] = 1; });
    incL.forEach(function (l) {
      var k = l.t + "|" + l.id;

    if (r.status === 401) return "토큰이 거부됐습니다 (401) — 토큰을 다시 확인하세요";
    if (r.status === 403) return put

      : "요청이 너무 많거나 막혔습니다 (403) — 토큰을 넣으면 넉넉해집니다";
    if (r.status === 404) return put
      ? "저장소를 찾지 못했습니다 (404) — 이름이 맞는지, 토큰에 그 저장소 권한이 있는지 보세요"
      : "찾지 못했습니다 (404)";
    if (r.status === 409) return "다른 기기와 부딪혔습니다 (409) — 잠시 뒤 다시 하세요";
    if (r.status === 422) return "올리지 못했습니다 (422) — 파일 경로를 확인하세요";

        // 합치기 **전에** '내게만 있는 기록' 을 센다. 0 이면 올릴 게 없다는 뜻이라

  }

const UNITS = [{"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/계획급수량-산정", "name": "계획급수량-산정", "title": "계획급수량의 산정", "ch": 1, "chTitle": "상수도시설 계획", "ord": 4, "file": "n-5b24cafdbe.html", "card": {"oneline": "도시가 쓰는 물은 하나인데 재는 시선이 셋(<strong>1일 평균 · 1일 최대 · 시간 최대</strong>)이고, 시설마다 어느 시선으로 지을지가 정해져 있다. 배율은 <strong>100 : 150 : 225</strong>.", "bone": [{"n": "1", "t": "급수량과 그 구성", "subs": ["급수량과 원단위", "사용목적별 구성", "소화용수"]}, {"n": "2", "t": "계획급수량 3종", "subs": ["계획 1일 평균급수량", "계획 1일 최대급수량", "계획 시간 최대급수량"]}, {"n": "3", "t": "시설별 설계기준", "subs": ["어느 급수량으로 무엇을 짓나", "완충 저류가 갈림길", "한 장으로 꿰기"]}], "link": [{"k": "목적", "html": "<p>시설은 평균이 아니라 <strong>감당해야 할 첨두</strong>로 지어야 한다. 평균 용량으로 지으면 아침 첨두에 수압이 무너진다. 그 첨두를 숫자로 붙잡은 것이 1일 최대·시간 최대이고, 이 값들이 뒤 단원(취수·도수·송수·정수·배수) 설계의 입구 숫자다 ― 제1장의 관문.</p>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup>에서 <strong>무엇을 재는지</strong>를 정한다: 단위는 총량이 아니라 1인 1일당 <strong>원단위(lpcd)</strong> 이고, 그 안에 실제로 쓴 물·새는 물(불명수량)·화재 대비(소화용수)가 성격을 달리해 들어간다. 그다음 ⁠<sup class=\"rs\">2</sup>에서 <strong>언제를 기준으로 재는가</strong> ― 1년 평균, 가장 많이 쓴 날, 그 날의 가장 몰린 1시간. 뒤로 갈수록 커지고 그 배율이 첨두계수다. 마지막 ⁠<sup class=\"rs\">3</sup>는 <strong>어느 시설을 어느 값으로 짓나</strong>이고, 규칙은 하나 ― 그 앞에 <strong>완충 저류</strong>가 있느냐.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 원단위와 총량의 차이 ② 세 급수량이 각각 무엇을 재고 왜 뒤로 갈수록 커지나 ③ 왜 시설마다 기준이 다른가</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/계획급수인구의-추정", "name": "계획급수인구의-추정", "title": "계획급수인구의 추정", "ch": 1, "chTitle": "상수도시설 계획", "ord": 3, "file": "n-ba34e98937.html", "card": {"oneline": "시설 크기는 오늘의 사람 수가 아니라 목표연도의 사람 수로 정해진다. 그래서 이 단원은 하나뿐이다 ― 과거 인구라는 점 몇 개에 <strong>어떤 모양의 곡선을 씌워 앞으로 늘여 그릴 것인가</strong>.", "bone": [{"n": "1", "t": "무엇을 추정하나 ― 계획급수인구와 급수보급률", "subs": ["계획급수인구와 급수보급률", "외삽이라는 문제 ― 곡선의 모양이 답을 정한다", "추정의 신뢰도를 좌우하는 세 가지"]}, {"n": "2", "t": "자기 자료로 늘여 그리는 여섯 가지 식", "subs": ["등차급수법 ― 해마다 같은 인구수만큼", "등비급수법 ― 해마다 같은 비율로", "최소자승법 ― 모든 점을 한꺼번에", "지수곡선식 (Peggy 함수식법)", "감소증가율법 ― 남은 여유분에 비례해 사그라든다", "Logistic 곡선법 (논리곡선법)"]}, {"n": "3", "t": "어느 식을 고를 것인가", "subs": ["비상관법 ― 상위 지역 인구에 묻어간다", "타도시와의 비교법 ― 닮은 도시의 곡선을 빌린다", "한 장으로 ― 선택 기준과 함정"]}], "link": [{"k": "목적", "html": "<p>시설은 계획년한 15~20년을 내다보고 짓는다. 그러니 곱해야 할 인구는 <strong>지금이 아니라 목표연도의 인구</strong>다. 그런데 손에 있는 것은 과거의 점 몇 개뿐이고 답은 그 <strong>바깥</strong>에 있다 ― 정답이 하나로 정해지지 않는 외삽 문제라서 추정법이 여러 개인 것이다. 과대추정 = 빈 시설에 돈, 과소추정 = 몇 년 못 가 물 부족. 이 값이 §4 총급수량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Q</mi><mo>=</mo><mi>q</mi><mo>×</mo><mi>N</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup></mrow></math></span> 의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N</mi></mrow></math></span> 이다.</p>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup>에서 <strong>무엇을 늘여 그리는지</strong>를 정한다: 상수도가 세는 것은 총인구가 아니라 <strong>실제로 물을 받는 인구</strong>이고, 둘을 잇는 것이 <strong>급수보급률</strong>이다. 그다음 ⁠<sup class=\"rs\">2</sup>의 여섯 식은 <strong>두 번의 물음</strong>으로 갈린다 ― ① 해마다 일정한 것이 인구'수'냐 '비율'이냐(등차/등비, 그리고 자료 전체에 맞추는 최소자승·지수곡선식) ② <strong>끝(포화인구 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span>)이 있느냐</strong>(감소증가율법·Logistic). 마지막 ⁠<sup class=\"rs\">3</sup>는 자기 자료가 못 미더울 때 <strong>남의 인구에 기대는 법</strong>과, 여덟 가지 중 고르는 기준.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 계획급수인구와 급수구역 총인구의 차이, 둘을 잇는 것 ② 왜 &quot;정답 공식&quot;이 없는가 ③ 여섯 식이 갈리는 두 번의 물음</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/마시는물의수질기준", "name": "마시는물의수질기준", "title": "마시는 물의 수질기준", "ch": 2, "chTitle": "수질관리", "ord": 1, "file": "n-7b0894094b.html", "card": {"oneline": "&quot;깨끗한 물&quot; 은 느낌이 아니라 숫자로 정한다. 마셔서 탈이 나는 이유가 여러 갈래라서 기준도 그 갈래대로 나뉜다 ― <strong>어느 갈래인지를 알면 기준값의 자릿수가 보인다.</strong>", "bone": [{"n": "1", "t": "수질기준의 뼈대와 미생물에 관한 기준", "subs": ["다섯 갈래로 갈리는 까닭", "미생물에 관한 기준", "대장균군 ― 병원균을 대신 세는 지표"]}, {"n": "2", "t": "건강상 유해영향 물질 ― 무기물질과 유기물질", "subs": ["건강상 유해영향 무기물질", "건강상 유해영향 유기물질", "페놀 ― 값과 &quot;왜&quot; 를 함께 묻는다"]}, {"n": "3", "t": "소독제·소독부산물질과 심미적 영향물질", "subs": ["소독제 및 소독부산물질", "심미적 영향물질", "수도전에서 먹는 물의 잔류염소"]}, {"n": "4", "t": "상수원수의 수질기준", "subs": ["상수원수(하천) 수질기준", "원수 수질에 따른 정수처리방법", "간이급수시설의 8항목"]}], "link": [{"k": "목적", "html": "<p>1장이 세운 3요소 중 <strong>質</strong> 을 정면으로 다루는 자리. &quot;고친다·지킨다&quot; 를 말하려면 <strong>다 고쳤다는 합격선</strong>이 먼저 있어야 한다. 없으면 처리목표·급수 판정·상수원 비교가 전부 불가능하다.</p>\n<p>교재 핵심문제 11문항 중 9문항이 &quot;기준값이 틀린 것은?&quot; 꼴 ― <strong>값을 직접 묻는 절</strong>이다.</p>\n"}, {"k": "연결", "html": "<p>값이 아니라 <strong>갈래</strong>부터(⁠<sup class=\"rs\">1</sup>, 미생물 기준 + 지표라는 발상) → 몸에 쌓이는 것 둘(⁠<sup class=\"rs\">2</sup>, 무기·유기) → 성격이 뒤집힌 둘(⁠<sup class=\"rs\">3</sup>, 고치다 생긴 것 · 해롭지 않은 것 + 잔류염소) → 방향을 거꾸로(⁠<sup class=\"rs\">4</sup>, 원수 등급 → 처리를 얼마나).</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 60개가 넘는 항목을 다섯으로 묶는 기준은 무엇인가\n② 미생물 기준값의 성격은 왜 다른 갈래와 다른가\n③ 원수 등급과 먹는 물 기준은 방향이 어떻게 다른가</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/물의자정능력", "name": "물의자정능력", "title": "물의 자정능력", "ch": 2, "chTitle": "수질관리", "ord": 2, "file": "n-e1dc58aa79.html", "card": {"oneline": "하천은 스스로 낫는다 ― 그 일을 하는 것은 결국 미생물이고, 미생물은 산소를 쓴다. 그래서 <strong>자정의 대가가 용존산소</strong>이고, 산소 살림이 감당되는지가 자정능력의 한계선이다.", "bone": [{"n": "1", "t": "자정작용 ― 무엇이 물을 낫게 하나", "subs": ["자정작용의 정의", "세 갈래 인자", "자정작용이 활발해지는 조건"]}, {"n": "2", "t": "자정계수 ― 자정능력을 숫자로 재기", "subs": ["탈산소와 재폭기", "자정계수 f", "자정계수를 좌우하는 인자", "자정계수를 키우는 공학적 개입"]}, {"n": "3", "t": "하천의 수질변화 ― Whipple 의 4단계", "subs": ["4단계의 순서", "산소가 남아 있는 동안 ― 앞의 두 지대", "산소가 돌아온 뒤 ― 뒤의 두 지대"]}], "link": [{"k": "목적", "html": "<p>1절이 세운 것 = 마실 만한 물의 합격선(숫자). 이 절이 보는 것 = <strong>더러워진 물이 스스로 돌아오는 과정.</strong>\n1절의 BOD·DO 가 여기서 주인공이 된다.</p>\n<p>없으면 못 하는 것 ― 방류 허용량 판단 / 하천에서 가장 나쁜 지점의 예측 / 자정을 돕는 공학적 수단의 근거.</p>\n"}, {"k": "연결", "html": "<p>무엇이 낫게 하나(⁠<sup class=\"rs\">1</sup>, 세 갈래와 주역) → 낫는 대가를 숫자로(⁠<sup class=\"rs\">2</sup>, 소비 대 공급의 비) →\n그 결과를 하류 거리에 펼쳐 놓기(⁠<sup class=\"rs\">3</sup>, 네 단계).</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 세 갈래 중 어느 것이 주역이고, 왜 나머지 둘은 주역이 될 수 없나\n② 자정을 하는데 왜 용존산소가 오히려 떨어지나\n③ DO 최저점이 왜 투입 지점이 아니라 그 하류에 생기나</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/상수도시설의기본계획", "name": "상수도시설의기본계획", "title": "상수도 시설의 기본계획", "ch": 1, "chTitle": "상수도시설 계획", "ord": 2, "file": "n-69bd1c661f.html", "card": {"oneline": "관을 묻기 전에 <strong>언제까지 · 어디에 · 몇 명에게</strong> 를 먼저 못 박는 절. 1절의 3요소에 <strong>시간축</strong>을 붙인 것이 기본계획이고, 여기서 정한 값이 그대로 §3·§4 의 입력이 된다.", "bone": [{"n": "1", "t": "계획년도 ― 언제까지를 내다보고 짓나", "subs": ["뜻과 기본계획 목표년도", "시설별 설계 계획기간", "계획년도 결정 시 고려사항"]}, {"n": "2", "t": "계획 급수구역과 계획 급수인구 ― 어디에 · 몇 명에게", "subs": ["계획 급수구역", "계획 급수인구", "급수보급률과 Goodrich 공식"]}, {"n": "3", "t": "기본계획의 조사사항 ― 3요소가 조사항목으로 돌아온다", "subs": ["조사사항", "기본계획 = 3요소 + 시간축"]}], "link": [{"k": "목적", "html": "<p>시설은 수십 년 쓰는데 짓는 결정은 지금 해야 한다. 오늘 수요에 맞추면 곧 모자라 도로를 다시 파고, 넉넉히 지으면 쓰지 않는 용량에 돈이 묶인다 → <strong>&quot;어느 시점의 수요에 맞출 것인가&quot;</strong> 를 먼저 정하는 일이 기본계획이다.</p>\n<p>이 절이 없으면 §3 은 <strong>어느 해</strong>의 인구를 추정할지 정할 수 없고, §4 는 곱할 인구가 없다. <strong>뒤 두 절의 입력값을 만드는 절.</strong></p>\n"}, {"k": "연결", "html": "<p>⁠<sup class=\"rs\">1</sup> <strong>시간</strong>을 정한다 ― 계획년도의 뜻, 짧게도 길게도 못 잡는 이유, 시설마다 기간이 갈리는 축, 결정 고려사항 → ⁠<sup class=\"rs\">2</sup> 그 시점의 <strong>공간과 사람</strong> ― 급수구역은 &quot;계획년도에 급수되는 지역&quot;이라 시간축이 먼저여야 정의된다. 총인구가 아니라 물을 받는 인구를 세고, 둘을 잇는 것이 보급률 → ⁠<sup class=\"rs\">3</sup> 그 결정을 <strong>무엇을 보고</strong> 내리나 = 조사사항, 1절 3요소와 나란히 놓는다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 계획년도를 짧게 / 길게 잡을 때 각각 무엇을 잃는가\n② 시설마다 계획기간이 다른 이유를 한 축으로\n③ 급수구역 총인구와 계획급수인구의 차이, 둘을 잇는 값</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/상수도의구성및계통", "name": "상수도의구성및계통", "title": "상수도의 구성 및 계통", "ch": 1, "chTitle": "상수도시설 계획", "ord": 1, "file": "n-5b641a4b28.html", "card": {"oneline": "시설 이름은 전부 &quot;한 줄기 흐름의 어느 구간을 맡는가&quot;로 정해진다. 이름을 외우는 단원이 아니라 <strong>순서를 붙잡는 단원</strong>이다.", "bone": [{"n": "1", "t": "상수도의 정의와 3요소", "subs": ["정의와 수도법이 그은 선", "3요소", "주요 용어", "수도의 종류"]}, {"n": "2", "t": "상수도의 계통", "subs": ["계통 한 줄", "수원과 취수", "도수와 송수 ― 정수장이 가른다", "정수", "배수와 급수", "순서 문제가 나오는 방식"]}, {"n": "3", "t": "계통을 읽는 눈", "subs": ["시설 계통 네 갈래", "지형이 계통을 정한다", "세 조건이 걸리는 자리"]}], "link": [{"k": "목적", "html": "<p>계통에 이름과 순서를 붙이는 자리. 이름표가 없으면 뒤 단원이 공중에 뜬다 ― §4 는 <strong>시설 이름에 급수량을 배정</strong>하는 단원이므로 배정받을 이름이 먼저 있어야 한다.</p>\n<p>교재 학습방향의 목적어가 &quot;정의&quot;가 아니라 <strong>흐름순서</strong>다. 출제도 거의 전부 순서 나열형.</p>\n"}, {"k": "연결", "html": "<p>무엇이 상수도인지 법이 선을 긋고, 만족시켜야 할 조건이 셋임을 못 박는다⁠<sup class=\"rs\">1</sup> → 본체인 계통, 붙잡을 것은 낱말이 아니라 <strong>왜 그 순서여야 하는가</strong>⁠<sup class=\"rs\">2</sup> → 계통 위에서 읽히는 것들⁠<sup class=\"rs\">3</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 세 조건은 무엇이고 왜 하나라도 빠지면 안 되는가\n② 수원에서 수도꼭지까지 구간을 순서대로\n③ 두 번 나오는 &quot;옮김&quot;의 이름이 왜 다른가 ― 한 줄로</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/수질검사및수질오염지표", "name": "수질검사및수질오염지표", "title": "수질검사 및 수질오염지표", "ch": 2, "chTitle": "수질관리", "ord": 4, "file": "n-b21ba3a315.html", "card": {"oneline": "&quot;물이 얼마나 더러운가&quot; 를 직접 잴 방법은 없다. 오염물질이 수천 가지니 <strong>그것들이 공통으로 하는 일 ― 산소를 먹는 것 ― 을 대신 잰다.</strong> 어떻게 먹이느냐로 지표가 갈리고, 무엇까지 세느냐로 값이 갈린다. 지표는 오염 그 자체가 아니라 <strong>오염의 그림자</strong>다.", "bone": [{"n": "1", "t": "수질검사 ― 무엇을 어떤 방법으로 재나", "subs": ["네 갈래 검사 방법", "세균학적 검사와 대장균", "정기 수질검사 ― 무엇을 얼마나 자주"]}, {"n": "2", "t": "산소로 재는 오염 ― BOD · COD · DO", "subs": ["BOD ― 미생물에게 먹여서 재는 값", "계산식 ― 잔존량과 소비량", "COD ― 산화제로 태워서 재는 값", "DO ― 쓰고 남은 산소"]}, {"n": "3", "t": "물 자체의 성질로 재는 지표 ― pH 와 경도", "subs": ["수소이온 농도(pH)", "경도(Hardness)"]}, {"n": "4", "t": "오염물질의 희석 후 혼합 농도", "subs": ["질량보존으로 세우는 식"]}], "link": [{"k": "목적", "html": "<p>앞 세 절은 값이 이미 손에 있다고 전제했다. 이 절은 <strong>그 값이 어떻게 나오는지</strong>를 답한다.\n재는 법이 없으면 기준도, 방류 허용량도, 부영양화 판정도 없다.</p>\n<p>1절의 대장균(병원균을 못 세니 대신 센다)이 쓴 <strong>지표의 논리</strong>를 오염물질 전체로 넓힌 것이 이 절이다.</p>\n"}, {"k": "연결", "html": "<p>재는 방법의 갈래⁠<sup class=\"rs\">1</sup> → 산소로 재는 세 지표와 그 계산⁠<sup class=\"rs\">2</sup> → 물 자신의 성질로 재는 둘⁠<sup class=\"rs\">3</sup> → 섞였을 때의 농도⁠<sup class=\"rs\">4</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 오염 정도를 왜 직접 재지 않고 산소소비량으로 대신 재는가\n② 미생물에게 먹이는 것과 산화제로 태우는 것은 결과가 어떻게 달라지는가\n③ 물이 오염되면 왜 용존산소가 떨어지고, 왜 다시 오르는가</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/호소의물순환및부영양화", "name": "호소의물순환및부영양화", "title": "호소의 물순환 및 부영양화", "ch": 2, "chTitle": "수질관리", "ord": 3, "file": "n-63363687a5.html", "card": {"oneline": "흐르지 않는 물은 자정 방식이 다르다 ― 위아래로 층이 갈려 섞이지 않으니 <strong>바닥이 먼저 썩고</strong>, 거기에 영양염이 쌓이면 조류가 폭발한다. 갈림길은 오직 하나, <strong>위아래의 밀도가 같아지느냐</strong>다.", "bone": [{"n": "1", "t": "호소의 물순환", "subs": ["물의 밀도 ― 한 온도에서만 가장 무겁다", "수심에 따라 갈리는 세 층", "계절이 층을 만들고 허문다", "취수 ― 언제 뜨고 어디서 뜨나"]}, {"n": "2", "t": "부영양화(Eutrophication)", "subs": ["정의와 형성조건", "일어나는 일 ― 조류에서 시작하는 사슬", "판정 지표", "대책 ― 사슬의 어느 고리를 끊나"]}, {"n": "3", "t": "적조 및 녹조현상(Red Tide)", "subs": ["정의", "무엇이 어패류를 죽이나"]}], "link": [{"k": "목적", "html": "<p>2절의 자정은 <strong>흐르는 물</strong>의 이야기였다. 수원의 대부분인 저수지·호수는 갇혀 있다.\n없으면 못 하는 것 ― 바닥이 왜 썩는지 / 계절에 따라 취수 수질이 왜 달라지는지 / 호소에서 왜 조류가 폭발하는지.</p>\n"}, {"k": "연결", "html": "<p>물의 밀도 하나로 층이 갈리는 것을 세우고⁠<sup class=\"rs\">1</sup>, 그 위에 영양염과 생물을 얹는다⁠<sup class=\"rs\">2</sup>. 같은 일이 해역에서 벌어진 것이 ⁠<sup class=\"rs\">3</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 층이 갈리는 까닭을 물의 밀도 하나로 설명할 수 있나\n② 계절이 바뀌면 무엇이 달라져서 층이 무너지는가\n③ 부영양화의 원인에서 결과까지를 끊기지 않는 사슬로 말할 수 있나</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/단위와차원", "name": "단위와차원", "title": "단위와 차원", "ch": 1, "chTitle": "유체의 기본 성질", "ord": 3, "file": "n-2be97116ed.html", "card": {"oneline": "차원은 물리량의 <strong>종류</strong>, 단위는 그것을 재는 <strong>눈금</strong>. 외울 표가 아니라 <strong>식이 맞는지 검사하는 도구</strong>다.", "bone": [{"n": "1", "t": "단위계와 차원", "subs": ["차원과 단위", "두 단위계", "정의에서 차원을 만든다", "단위계 변환", "자주 쓰는 환산값"]}, {"n": "2", "t": "차원해석 ― 식을 검사하고 만드는 데 쓴다", "subs": ["차원 동차성", "실제로 검사한다", "무차원량과 상사"]}], "link": [{"k": "목적", "html": "<p>세 가지가 필요해서 이 절이 있다. ① kgf 계 문제와 SI 문제를 오가야 한다 ― 못 하면 답이 정확히 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 배 틀리는데 검산으로 잘 안 잡힌다. ② 내가 쓴 식이 맞는지 <strong>스스로 검사</strong>할 잣대가 있어야 한다. ③ 크기가 다른 모형과 실물을 견주려면 <strong>무차원수</strong>가 있어야 한다.</p>\n"}, {"k": "연결", "html": "<p>어떤 문제는 물의 단위중량을 1 g/cm³ 로 주고 어떤 문제는 9.81 kN/m³ 로 준다. 같은 물의 같은 성질인데 숫자가 9,810 배 다르다. 게다가 앞 두 절에서 만든 식을 옮겨 적다가 지름을 위아래로 바꿔 놓아도 답은 그냥 나온다 ― 맞는지 확인할 방법이 없다. 이 절은 그 둘을 각각 해결한다.</p>\n<p>먼저 <strong>차원과 단위를 갈라야</strong> 한다⁠<sup class=\"rs\">1-1</sup>. 둘을 섞어 쓰면 &quot;cm 를 m 로 바꾸는 일&quot;과 &quot;밀도를 단위중량으로 바꾸는 일&quot;이 같은 일처럼 보이는데, 앞은 눈금만 바꾸는 일이라 언제나 가능하고 뒤는 <strong>질량에서 힘으로 건너가는 일</strong>이라 중력가속도를 곱해야 한다. 구분이 서면 단위계가 왜 둘인지도 자연스럽게 나온다⁠<sup class=\"rs\">1-2</sup> ― 물리학은 장소가 바뀌어도 안 변하는 질량을 기본으로 잡았고, 공학 현장은 저울로 바로 재는 힘을 기본으로 잡았다. 둘을 잇는 다리는 오직 하나, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F</mi><mo>=</mo><mi>m</mi><mi>a</mi></mrow></math></span> 다.</p>\n<p>그다음이 이 절의 진짜 알맹이다. 파생량의 차원은 외우는 것이 아니라 <strong>정의에서 만들어 내는 것</strong>이다⁠<sup class=\"rs\">1-3</sup>. 속도는 길이를 시간으로 나눈 것이니 곧바로 나오고, 밀도는 질량을 부피로 나눈 것이니 그대로 나온다. 정의를 한글로 읽을 수만 있으면 표 전체가 그 자리에서 복원된다. 여기까지 오면 단위계 변환도 두 단계로 정리된다⁠<sup class=\"rs\">1-4</sup> ― <strong>차원을 바꾸고, 중력가속도를 처리한다.</strong> 질량에서 힘으로 갈 때는 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 를 곱해 흡수시키고, 힘에서 질량으로 갈 때는 숨어 있던 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 가 밖으로 나온다. 자주 쓰는 환산값도 함께 정리해 두는데⁠<sup class=\"rs\">1-5</sup>, 여기서도 차원이 다른 것끼리는 애초에 환산되지 않는다는 원칙이 그대로 검사기가 된다.</p>\n<p>도구가 서면 <strong>쓸 차례</strong>다⁠<sup class=\"rs\">2</sup>. 등호의 양변은 차원이 같아야 하고 더하고 빼는 항끼리도 같아야 한다⁠<sup class=\"rs\">2-1</sup> ― 법칙이 눈금을 바꿔도 성립해야 하기 때문이다. 이 한 줄이 검사기가 되어 앞 절들의 식을 몇 초 만에 확인해 주고, 일부러 틀리게 적은 식은 계산기 없이 걸러 낸다⁠<sup class=\"rs\">2-2</sup>. 게다가 나온 차원이 무엇인지가 <strong>어디를 고칠지까지</strong> 알려 준다. 다만 이 검사는 필요조건일 뿐이라 무차원 계수는 못 잡는다 ― 2절의 4 와 2 를 바꿔 써도 차원은 통과한다. 마지막으로 차원이 통째로 지워진 양들을 본다⁠<sup class=\"rs\">2-3</sup>. 눈금을 바꿔도 값이 변하지 않으므로 <strong>크기가 다른 모형과 실물을 견주는 유일한 언어</strong>가 되고, 뒷장의 상사와 모형실험이 전부 여기에 얹힌다.</p>\n<p>차원은 <strong>종류</strong>, 단위는 <strong>눈금</strong>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 차원과 단위의 차이\n② 두 단위계를 잇는 다리\n③ 차원 검사의 두 규칙과 그 검사가 못 잡는 것</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/부체와상대정지", "name": "부체와상대정지", "title": "부체와 상대정지", "ch": 2, "chTitle": "정수역학", "ord": 3, "file": "n-3d6084d599.html", "card": {"oneline": "물은 밀어낸 부피만큼의 제 무게로 물체를 떠받친다. 뜨느냐는 크기 싸움, 안 뒤집히느냐는 작용점 싸움. 그릇째 움직이면 수면은 중력에 관성력을 더한 방향에 직각으로 앉는다.", "bone": [{"n": "1", "t": "부력 ― 물이 떠받치는 힘", "subs": ["압력차가 곧 부력이다", "뜨는가 가라앉는가 ― 부체의 평형 일반식", "부체에서 눈여겨보는 자리들"]}, {"n": "2", "t": "부체의 안정", "subs": ["기울면 부심이 옮겨 간다 ― 경심", "경심고", "안정 판정"]}, {"n": "3", "t": "상대정지", "subs": ["겉보기 중력 ― 세 경우를 꿰는 하나", "수평 등가속도", "연직 등가속도", "등속 회전하는 원통 속의 수면"]}], "link": [{"k": "목적", "html": "<p>얼마나 잠기는지를 모르면 얼마나 실을 수 있는지 못 정하고, 기울었을 때 되돌아오는지를 모르면 뒤집힌다. 앞은 힘의 크기, 뒤는 힘의 작용 위치 문제다. 상대정지는 그릇이 움직이는데 물은 그릇에 대해 정지한 상황 ― 흐름이 아니라 아직 정수역학이다.</p>\n"}, {"k": "연결", "html": "<p>⁠<sup class=\"rs\">1</sup>에서 떠받치는 힘을 세운다(1절 압력의 뺄셈이다). 거기서 나온 평형식 한 줄에 숫자를 꽂는 것이 이 절 계산의 절반. 뜨기만 해서는 안 되므로 ⁠<sup class=\"rs\">2</sup>에서 작용점으로 옮겨 간다 ― 기울면 잠긴 모양이 바뀌어 부력의 작용선이 옮겨 가고, 그 새 작용선이 중심선과 만나는 높이가 무게중심보다 위냐 아래냐로 갈린다. ⁠<sup class=\"rs\">3</sup>는 주인공이 물체에서 그릇으로 바뀐다. 세 경우는 관성력을 중력에 더한 한 방향으로 묶인다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 떠받치는 힘이 왜 &quot;밀어낸 물의 무게&quot;와 정확히 같은가 ② 뜨는 것과 안정한 것이 왜 다른 물음인가 ③ 상대정지 세 경우가 왜 한 뿌리인가</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/유체의기본성질", "name": "유체의기본성질", "title": "유체의 기본 성질", "ch": 1, "chTitle": "유체의 기본 성질", "ord": 1, "file": "n-119413004b.html", "card": {"oneline": "유체는 <strong>아무리 작은 전단응력에도 정지하지 못하고 계속 흐르는 물질</strong>이다. 그 정의에서 2장의 대전제(정지 → 전단응력 0 → 압력은 면에 수직)가 나오고, 나머지 용어는 전부 <strong>무게 쪽·점성 쪽 측정량</strong> 둘로 갈린다.", "bone": [{"n": "1", "t": "유체란 무엇인가 ― 전단응력을 못 버티는 물질", "subs": ["고체와 유체를 가르는 한 가지", "뉴턴의 점성법칙", "정지한 유체 ― 2장의 출발점"]}, {"n": "2", "t": "유체의 무게를 재는 양들 ― 밀도·단위중량·비중·비체적", "subs": ["밀도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ρ</mi></mrow></math></span> (= 비질량)", "중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>W</mi></mrow></math></span> 와 단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>γ</mi></mrow></math></span> (= 비중량)", "비중과 비체적", "네 양의 관계"]}, {"n": "3", "t": "유체의 점성을 재는 양들 ― 점성계수와 동점성계수", "subs": ["점성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>μ</mi></mrow></math></span>", "동점성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ν</mi></mrow></math></span>", "온도·압력에 따른 변화"]}], "link": [{"k": "목적", "html": "<p>계산을 시작하기 전에 <strong>&quot;물이란 어떤 물질인가&quot;</strong> 를 못 박고, 다음 장의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><msub><mi>γ</mi><mi>w</mi></msub><mi>h</mi></mrow></math></span> 에 넣을 숫자의 출처를 마련한다. 없으면 두 군데가 즉시 무너진다 ― 정지한 물의 압력이 왜 면에 수직으로만 작용하는지 설명할 수 없고, 밀도와 단위중량을 바꿔 써서 답이 정확히 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 배만큼 틀린다.</p>\n"}, {"k": "연결", "html": "<p>수도관 안의 물이 관벽을 얼마나 세게 미는지 계산해야 한다고 하자. 식에 넣을 숫자는 전부 물의 성질에서 나오는데, 그러려면 먼저 <strong>물이 어떤 물질인지</strong>를 정해야 한다. 강철도 힘을 받으면 변형하는데, 왜 강철은 &quot;흐른다&quot;고 하지 않는가.</p>\n<p>가르는 것은 무게도 모양도 아니고 <strong>전단응력 앞에서의 거동</strong> 하나다⁠<sup class=\"rs\">1-1</sup>. 고체는 저항이 변형량에 비례해서 어느 자리에선가 균형이 잡혀 멈추지만, 유체는 저항이 <strong>변형되는 빠르기</strong>에 비례해서 힘이 0 이 아닌 한 계속 흐른다. 이 정의를 그대로 식으로 옮긴 것이 뉴턴의 점성법칙이고⁠<sup class=\"rs\">1-2</sup>, 거기서 비례상수로 등장하는 것이 점성계수다. 고체의 훅의 법칙과는 자리 하나 차이인데 ― 변형각이 아니라 변형각의 <strong>변화율</strong>에 비례한다는 것이 그 차이다.</p>\n<p>그런데 이 정의를 거꾸로 읽으면 훨씬 큰 것이 나온다⁠<sup class=\"rs\">1-3</sup>. 물이 흐르지 않고 정지해 있다는 관찰 자체가 <strong>속도경사가 0</strong> 이라는 뜻이고, 그러면 전단응력이 0 이다. 면에 걸리는 힘은 나란한 성분과 수직 성분뿐이므로, 나란한 쪽이 사라지면 <strong>압력은 면에 수직으로만</strong> 남는다. 2장 정수압의 성질이 전부 이 한 줄 위에 선다.</p>\n<p>정의가 섰으면 이제 <strong>재야 한다.</strong> 재는 양은 두 가족뿐이다. 하나는 <strong>무게 쪽</strong>이다⁠<sup class=\"rs\">2</sup>. 뿌리는 밀도이고⁠<sup class=\"rs\">2-1</sup>, 여기에 중력가속도를 곱하면 단위중량이 된다⁠<sup class=\"rs\">2-2</sup>. 둘을 g/cm³ 나 t/m³ 로 쓰면 값이 똑같이 &quot;1&quot; 이라 구별이 지워지는데, SI 로 옮기는 순간 두 숫자가 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 배만큼 갈린다 ― 이 절에서 가장 비싸게 치르는 실수다. 물을 기준으로 나누면 단위가 사라져 비중이 되고, 뒤집으면 비체적이 된다⁠<sup class=\"rs\">2-3</sup>. 비중은 무차원이라 단위가 붙은 선지는 그 자리에서 오답이고, 거꾸로 쓰면 <strong>비중 하나로 밀도와 단위중량이 다 나온다</strong> ― 2장 액주계에 쓰는 수은의 값이 거기서 온다. 그러니 넷은 새로 외울 정의가 아니라 밀도 하나를 곱하고 나누고 뒤집은 것이다⁠<sup class=\"rs\">2-4</sup>.</p>\n<p>다른 하나는 <strong>점성 쪽</strong>이다⁠<sup class=\"rs\">3</sup>. ⁠<sup class=\"rs\">1</sup>에서 비례상수로만 등장했던 점성계수가 실제로 얼마이고 무엇으로 재는지를 여기서 본다⁠<sup class=\"rs\">3-1</sup>. 그것을 밀도로 나눈 동점성계수가 따로 필요한 이유는⁠<sup class=\"rs\">3-2</sup>, 점성계수가 붙잡는 힘이고 밀도가 계속 가려는 관성이라서 <strong>운동을 다루는 식에는 늘 이 묶음으로 나오기</strong> 때문이다 ― 뒷장의 레이놀즈수가 그것이다. 둘은 단위로 가르면 헷갈리지 않는다. 마지막으로 온도가 오르면 액체는 점성이 줄고 기체는 느는데⁠<sup class=\"rs\">3-3</sup>, 원인이 서로 달라 방향까지 반대다.</p>\n<p>유체는 <strong>전단으로 정의</strong>되고, <strong>무게와 점성 두 가족으로 측정</strong>된다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 고체와 유체를 가르는 기준, 그리고 거기서 &quot;정지 유체엔 전단응력이 없다&quot;가 나오는 길\n② 네 무게량이 밀도에 각각 어떤 연산을 한 것인가\n③ 점성계수와 동점성계수의 차이와 온도에 따른 방향</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/전수압", "name": "전수압", "title": "전수압 (Total Hydrostatic Force)", "ch": 2, "chTitle": "정수역학", "ord": 2, "file": "n-c890ed2fbd.html", "card": {"oneline": "전수압은 정수압 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><mi>γ</mi><mi>h</mi></mrow></math></span> 를 면 전체에 걸쳐 다 합친 하나의 합력이다. 묻는 것은 둘뿐 ― <strong>크기</strong>와 <strong>작용점</strong>. 등압분할·곡면·원관은 전부 이 둘의 변주다.", "bone": [{"n": "1", "t": "평면에 작용하는 전수압", "subs": ["압력 삼각형과 평균압력", "전수압의 크기", "작용점(수압중심)의 위치", "도형별 도심과 단면2차모멘트 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>G</mi></msub></mrow></math></span>", "작용점의 정체 ― 압력분포도의 도심"]}, {"n": "2", "t": "등압분할법", "subs": ["균등한 힘으로 나누기", "분할점의 깊이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>h</mi><mi>m</mi></msub></mrow></math></span>"]}, {"n": "3", "t": "곡면에 작용하는 전수압", "subs": ["수평분력 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P</mi><mi>x</mi></msub></mrow></math></span>", "연직분력 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P</mi><mi>y</mi></msub></mrow></math></span>", "수압에 의한 원관의 두께", "다섯 공식을 꿰는 한 줄"]}], "link": [{"k": "목적", "html": "<p>정수압은 <strong>한 점</strong>의 압력이라 설계에 못 쓴다. 필요한 것은 면 전체의 <strong>총 힘</strong>(걸쇠·댐 단면 검토)과 그 힘의 <strong>작용 지점</strong>(힌지 위치·전도 모멘트). 압력이 깊이마다 다르니 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P</mi><mo>≠</mo><mi>p</mi><mo>×</mo><mi>A</mi></mrow></math></span> ― 면 위에서 적분해야 한다.</p>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup> <strong>평면</strong>을 푼다(곡면은 지점마다 압력 방향이 달라 어렵다). 여기서 결과가 둘 나오는데 나오는 자리가 다르다 ― 그냥 적분하면 <strong>크기</strong>, 거리를 한 번 더 곱해 모멘트로 적분하면 <strong>작용점</strong>이고 후자는 늘 도심보다 아래다. 그래서 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>G</mi></msub></mrow></math></span> 와 도형별 표가 따라온다. 나머지는 전부 재활용 ― ⁠<sup class=\"rs\">2</sup> <strong>등압분할</strong>은 크기 공식을 누적으로, ⁠<sup class=\"rs\">3</sup> <strong>곡면</strong>은 수평(투영면에 평면 공식) · 연직(물기둥 무게)으로 쪼갠 것이고 원관 두께는 그 수평분력의 특수 케이스다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 크기는 왜 도심에서 나오고 작용점은 왜 도심보다 아래인가 ② <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>G</mi></msub></mrow></math></span> 는 어느 면의 어느 축에 대한 값인가 ③ 등압분할·곡면·원관이 각각 어느 공식의 재활용인가</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/정수압", "name": "정수압", "title": "정수압 (Static Pressure)", "ch": 2, "chTitle": "정수역학", "ord": 1, "file": "n-df62f397ba.html", "card": {"oneline": "정지한 물은 면을 수직으로, 깊이에 비례해서, 한 점에서는 모든 방향으로 똑같이 누른다. 셋을 따로 외우지 말고 두 뿌리로 ― 전단력 0 과 물기둥의 무게.", "bone": [{"n": "1", "t": "정수압의 정의와 성질", "subs": ["정수압과 단위중량", "전단력 0 ― 모든 성질의 뿌리", "수심에 비례한다", "한 점에서 모든 방향이 같다"]}, {"n": "2", "t": "절대압과 계기압", "subs": ["무엇을 0으로 보는가", "표준대기압"]}, {"n": "3", "t": "정수압의 응용", "subs": ["수압기와 파스칼 원리", "액주계", "단위·극한 검증"]}], "link": [{"k": "목적", "html": "<p>묻는 것은 늘 &quot;물이 이 면을 얼마나 세게 미는가&quot;. 흐르면 속도·마찰·관성이 얽히므로 <strong>정지</strong>부터 연다. 남는 변수는 둘(깊이 · 단위중량)뿐이고, 거기서 나온 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><mi>γ</mi><mi>h</mi></mrow></math></span> 가 전수압·부력의 토대다. 없으면 다음 단원 전수압이 성립하지 않는다.</p>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup>에서 정의와 성질을 세운다. 교재의 성질 6가지는 <strong>뿌리가 둘</strong>뿐 ― 정지한 액체가 전단을 못 버틴다는 사실에서 <em>수직 작용</em>과 <em>등방성</em>이, 위에 얹힌 물기둥의 무게에서 <em>수심 비례</em> <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><mi>γ</mi><mi>h</mi></mrow></math></span> 가 나온다. 그다음 ⁠<sup class=\"rs\">2</sup>에서 그 값을 읽으려면 <strong>무엇을 0으로 보는가</strong>를 정해야 하고(절대압/계기압), ⁠<sup class=\"rs\">3</sup>의 수압기·액주계는 두 뿌리를 어디에 쓰느냐의 문제일 뿐이다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 성질 6가지가 어느 두 뿌리에서 갈라지나 ② <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><mi>γ</mi><mi>h</mi></mrow></math></span> 에서 왜 넓이·모양이 사라지나 ③ 등방성과 깊이 비례가 왜 모순이 아닌가</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/표면장력과모관고", "name": "표면장력과모관고", "title": "표면장력과 모관고", "ch": 1, "chTitle": "유체의 기본 성질", "ord": 2, "file": "n-9c41c24f65.html", "card": {"oneline": "표면 분자는 아래쪽에서만 당겨져 표면이 오그라들려 한다. 그 인장력이 <strong>닫히면 물방울 내부압</strong>, <strong>벽에 붙으면 모관고</strong>를 만든다.", "bone": [{"n": "1", "t": "표면장력", "subs": ["표면이 막처럼 행동하는 이유", "물방울의 내부압력"]}, {"n": "2", "t": "모관현상 (capillarity)", "subs": ["응집력과 부착력 ― 접촉각이 갈림길", "유리관 모관고", "연직 평판 모관고"]}, {"n": "3", "t": "압축율과 유체의 분류", "subs": ["평균 압축율과 체적탄성계수", "유체의 분류"]}], "link": [{"k": "목적", "html": "<p>유체를 <strong>덩어리로</strong> 재는 양(1절)만으로는 물방울이 둥근 것도, 가는 관에서 물이 저 혼자 오르는 것도 설명이 안 된다. 표면에서만 분자의 사정이 달라지기 때문이다. 이것이 없으면 막히는 곳이 셋 ― <strong>액주계·피에조미터의 읽음 오차</strong>(관이 가늘면 없는 압력이 읽힌다), <strong>토질의 모관현상과 동상</strong>, 그리고 물을 비압축성으로 놓는 <strong>가정의 근거</strong>.</p>\n"}, {"k": "연결", "html": "<p>가느다란 유리관을 물에 담그면 물이 저 혼자 위로 기어오른다. 아무도 밀지 않았는데 중력을 거스른다. 1절이 만든 덩어리 잣대로는 이 장면을 설명할 수 없다 ― 이것은 유체 내부가 아니라 <strong>표면</strong>에서만 일어나는 일이기 때문이다.</p>\n<p>이유는 분자 수준에 있다⁠<sup class=\"rs\">1-1</sup>. 안쪽 분자는 사방에서 당겨져 합력이 0 이지만, <strong>표면 분자는 위쪽에 이웃이 없어 안쪽으로만 당겨진다.</strong> 표면 전체가 안으로 당겨지면 표면은 넓이를 줄이려 하고, 그 성질이 인장력으로 나타난다. 여기서 곧바로 <strong>표면장력은 힘이 아니라 단위 길이당 힘</strong>이라는 사실이 따라 나오는데, 이 한 줄을 놓치면 뒤의 모든 식에서 길이를 곱하는 자리를 놓친다.</p>\n<p>그 막이 무엇을 하는지는 두 장면으로 갈린다. 첫 장면은 <strong>막이 닫힌 경우</strong>다⁠<sup class=\"rs\">1-2</sup>. 물방울처럼 사방을 감싸면 막이 오그라들며 안에 든 것을 눌러 내부 압력이 바깥보다 높아진다. 얼마나 높은지는 물방울을 반으로 잘라 힘의 평형을 세우면 나오고, 거기서 튀어나온 계수 4 의 정체는 <strong>둘레 나누기 단면적</strong>이다. 비눗방울에서 8 이 되는 것도 막이 두 겹이라 붙잡는 길이가 두 배이기 때문이다.</p>\n<p>둘째 장면은 <strong>막이 벽에 붙은 경우</strong>다⁠<sup class=\"rs\">2</sup>. 그런데 벽에 붙을지 말지는 액체 혼자 정하지 못한다⁠<sup class=\"rs\">2-1</sup> ― 액체끼리 뭉치려는 응집력과 벽에 달라붙으려는 부착력이 겨루고, 그 승부가 <strong>접촉각</strong>으로 드러난다. 부착력이 이기면 액체가 벽을 타고 올라 물기둥을 매달아 들고, 응집력이 이기면 반대로 내려간다. 오르는 높이는 물방울과 <strong>완전히 같은 논법</strong> ― 드는 힘과 매달린 무게를 같다고 놓는 것 ― 으로 나온다⁠<sup class=\"rs\">2-2</sup>. 드는 힘은 관 둘레에 붙고 버틸 무게는 단면적에 붙으므로, 가늘어지면 무게가 훨씬 빨리 줄어 <strong>가는 관일수록 높이 오른다.</strong> 접촉각이 90° 를 넘으면 코사인이 음수가 되어 부호가 그대로 하강을 말해 주니 수은용 식을 따로 둘 필요도 없다. 관을 평판으로 바꾸면 계수가 4 에서 2 로 바뀌는데⁠<sup class=\"rs\">2-3</sup>, 4 도 2 도 외울 숫자가 아니라 둘 다 <strong>붙잡는 길이 ÷ 매달리는 단면적</strong>이다.</p>\n<p>여기까지가 절 이름이 가리키는 내용이다. 나머지 둘은 앞과 인과로 이어지지 않지만 <strong>서로는 이어진다</strong>⁠<sup class=\"rs\">3</sup>. 압력을 걸었을 때 부피가 얼마나 주는지를 재는 것이 압축율이고⁠<sup class=\"rs\">3-1</sup>, 그 값이 사실상 0 이냐 아니냐가 <strong>압축성과 비압축성</strong>이라는 유체 분류의 첫 갈림길이 되기 때문이다⁠<sup class=\"rs\">3-2</sup>. 물을 비압축성으로 놓는 것이 정의가 아니라 공학적 근사라는 사실이 여기서 드러나고, 점성까지 함께 지운 완전유체가 왜 이 세상에 없는지도 같은 자리에서 정리된다.</p>\n<blockquote>\n<p>표면장력은 <strong>닫히면 내부압</strong>, <strong>벽에 붙으면 모관고</strong>.</p>\n</blockquote>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 표면장력이 왜 &quot;힘&quot;이 아니라 &quot;단위 길이당 힘&quot;인가\n② 물방울의 4, 원관의 4, 평판의 2 가 각각 어디서 온 숫자인가\n③ 물을 비압축성으로 놓는 근거는 무엇이고 완전유체는 왜 없는가</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/단면1차모멘트", "name": "단면1차모멘트", "title": "단면 1차 모멘트", "ch": 1, "chTitle": "힘·모멘트와 단면의 성질", "ord": 2, "file": "n-33b09db397.html", "card": {"oneline": "1절에서 <strong>힘</strong>에 거리를 곱해 더했다. 여기서는 <strong>넓이</strong>에 거리를 곱해 더한다. 그 값이 0 이 되는 축이 지나는 점이 도심이고, 뒤 단원의 계산은 전부 그 축에서 시작한다.", "bone": [{"n": "1", "t": "단면 1차 모멘트 ― 넓이에 거리를 곱해 더한 것", "subs": ["힘의 모멘트를 넓이로 옮긴다", "정의 ― 넓이 × 축까지의 거리를 전부 더한다", "단위와 부호 ― 길이³ 이고, 축을 옮기면 값이 달라진다"]}, {"n": "2", "t": "도심 ― 단면 1차 모멘트가 0 이 되는 축이 지나는 점", "subs": ["도심의 정의", "도심축에 대한 단면 1차 모멘트는 0 이다", "왜 도심을 찾는가 ― 다음 계산의 기준선"]}, {"n": "3", "t": "계산 ― 쪼개 더하고, 구멍은 빼고, 기본단면은 외운다", "subs": ["복합단면 ― 조각의 넓이 × 그 조각 도심까지의 거리를 더한다", "구멍은 음의 넓이", "기본단면의 도심과 1차 모멘트"]}], "link": [{"k": "목적", "html": "<p>단면적이 같아도 <strong>넓이가 어디에 퍼져 있느냐</strong>에 따라 보의 성능이 달라진다. 그것을 세는 양이 이 절이고, 그 값이 0 이 되는 축(= 도심축)이 뒤 단원 계산의 <strong>기준선</strong>이 된다. 기준선을 잘못 잡으면 그 뒤의 숫자가 전부 틀린다.</p>\n"}, {"k": "연결", "html": "<p>같은 재료, 같은 양의 강재로 만든 두 보가 있다. 하나는 납작하게 눕힌 판이고 하나는 세워 놓은 판인데, 단면적이 똑같은데도 <strong>세운 쪽이 훨씬 잘 버틴다.</strong> 달라진 것은 넓이가 어디에 퍼져 있는가 하나뿐이다. 그러니 단면을 넓이 하나의 숫자로만 보면 안 되고, 넓이가 축에서 얼마나 떨어져 앉아 있는지를 세는 양이 따로 있어야 한다.</p>\n<p>그 셈은 새로 만들 필요가 없다⁠<sup class=\"rs\">1-1</sup>. 1절 바리뇽의 식에서 <strong>힘 자리에 넓이를 넣기만</strong> 하면 된다. 얇고 균질한 판이면 무게가 넓이에 비례하니 물리적으로도 같은 이야기이고, 힘도 재료도 들어가지 않으므로 결과는 <strong>모양과 좌표만으로 정해지는 수</strong>가 된다. 정의는 적분으로 적히지만⁠<sup class=\"rs\">1-2</sup>, 실전에서 쓰는 것은 거의 언제나 <strong>전체 넓이 곱하기 도심까지의 거리</strong>라는 곱셈 한 줄이다.</p>\n<p>곱해지는 것이 바뀌었으니 성질도 바뀐다⁠<sup class=\"rs\">1-3</sup>. 단위가 길이의 세제곱이 되고, 좌표에는 부호가 있으니 값이 음수도 0 도 될 수 있다. 이 두 가지가 3절의 단면 2차 모멘트와 갈리는 지점인데, 거기서는 거리를 두 번 곱해 <strong>부호가 지워지기</strong> 때문이다. 그리고 축을 평행이동하면 값이 따라 움직이므로, 축을 모르면 값 하나는 아무 정보도 되지 못한다.</p>\n<p>값이 축에 딸려 있다는 것을 확인하고 나면 질문이 자연스럽게 뒤집힌다 ― 그렇다면 <strong>값을 0 으로 만드는 축은 어디인가</strong>⁠<sup class=\"rs\">2</sup>. 그 축이 지나는 점이 도심이고⁠<sup class=\"rs\">2-1</sup>, 정의를 그대로 뒤집으면 도심의 좌표 식이 나온다. 균질한 판을 손가락으로 받쳐 균형이 잡히는 점이라는 그림도 같은 것을 말한다. 그러니 &quot;도심축에 대한 1차 모멘트는 0&quot;이라는 문장은 새 정리가 아니라 <strong>정의를 다시 읽은 것</strong>이다⁠<sup class=\"rs\">2-2</sup> ― 축 위쪽 몫과 아래쪽 몫이 정확히 상쇄된다.</p>\n<p>이 자리를 왜 찾는가 하면, <strong>다음 계산의 자를 어디에 대고 잴지 정하는 일</strong>이기 때문이다⁠<sup class=\"rs\">2-3</sup>. 보가 휘면 늘지도 줄지도 않는 층이 생기는데, 순수휨에서 축방향 합력이 0 이어야 하므로 그 층은 1차 모멘트가 0 인 축, 곧 도심축을 지난다. 3절의 평행축 정리가 깔끔한 것도 유도 중에 나오는 항이 도심축에서 사라지기 때문이다.</p>\n<p>마지막은 계산이다⁠<sup class=\"rs\">3</sup>. 정의는 적분이지만 실제로는 아는 모양으로 쪼개서 <strong>조각의 넓이에 그 조각 도심까지의 거리를 곱해 더하면</strong> 된다⁠<sup class=\"rs\">3-1</sup> ― 바리뇽 그대로이고, 대칭축이 있으면 도심이 반드시 그 위에 있으니 계산 전에 대칭부터 찾는 것이 빠르다. 뚫린 구멍은 <strong>음의 넓이</strong>로 다루는데⁠<sup class=\"rs\">3-2</sup>, 분자에서도 분모에서도 빼야 한다는 것이 가장 흔한 실수다. 그리고 직사각형·삼각형·반원의 도심 위치만 외워 두면 대부분의 문제가 곱셈과 덧셈으로 끝난다⁠<sup class=\"rs\">3-3</sup>.</p>\n<p><strong>넓이에 거리를 곱해 더한다. 그 값이 0 이 되는 자리가 도심이다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 1절의 어느 식에서 왔고 무엇이 바뀌었나\n② 왜 음수·0 이 될 수 있나\n③ 도심을 찾아 두면 뒤에서 무엇이 편해지나</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/단면2차극모멘트", "name": "단면2차극모멘트", "title": "단면 2차 극모멘트", "ch": 1, "chTitle": "힘·모멘트와 단면의 성질", "ord": 3, "file": "n-2fad3b8893.html", "card": {"oneline": "2절에서 넓이에 거리를 <strong>한 번</strong> 곱했다. 여기서는 <strong>두 번</strong> 곱한다. 축에서 재면 휨에 대한 저항, 점에서 재면 비틀림에 대한 저항이고, 제곱이라 부호가 지워져 값이 항상 양수다.", "bone": [{"n": "1", "t": "단면 2차 모멘트 ― 거리를 두 번 곱하면 저항이 된다", "subs": ["정의 ― 2절에서 무엇이 갈리나", "평행축 정리 ― 도심축에서만 출발할 수 있다", "기본단면의 단면 2차 모멘트"]}, {"n": "2", "t": "단면 2차 극모멘트 ― 축이 아니라 점에 대한 저항", "subs": ["정의 ― 거리를 극(점)에서 잰다", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>P</mi></msub><mo>=</mo><msub><mi>I</mi><mi>X</mi></msub><mo>+</mo><msub><mi>I</mi><mi>Y</mi></msub></mrow></math></span> ― 외울 식이 아니라 두 줄로 만드는 식", "기본단면의 극모멘트"]}, {"n": "3", "t": "단면 상승모멘트 ― 부호를 가질 수 있는 유일한 2차량", "subs": ["정의 ― 두 거리를 한 번씩 곱한다", "대칭축이 있으면 0 이 된다", "평행축 정리"]}, {"n": "4", "t": "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I</mi></mrow></math></span> 를 나눠 쓰는 두 양 ― 단면계수와 단면 2차 반지름", "subs": ["단면계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Z</mi></mrow></math></span> ― 연단거리로 나눈다", "단면 2차 반지름 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi></mrow></math></span> ― 넓이로 나누고 뿌리를 씌운다", "여섯 양을 한 줄로 ― 단위와 부호로 구별한다"]}], "link": [{"k": "목적", "html": "<p>2절 여백 필기가 정의 그 자체다: <strong>&quot;이 단면이 휘어지는 것에 얼마나 저항하는가.&quot;</strong> 그런데 1차 모멘트는 하필 <strong>도심축(= 중립축)에서 0</strong> 이 되어 그 &quot;얼마나&quot;를 못 잰다. 원인은 부호이고, 부호를 지우는 방법이 제곱이다. 게다가 제곱은 먼 것을 크게 세므로 &quot;넓이가 멀리 퍼질수록 잘 버틴다&quot;가 식에 저절로 들어온다. 없으면 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi><mo>=</mo><mi>M</mi><mi>y</mi><mo>/</mo><mi>I</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E</mi><mi>I</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>τ</mi><mo>=</mo><mi>T</mi><mi>r</mi><mo>/</mo><msub><mi>I</mi><mi>P</mi></msub></mrow></math></span> · 세장비를 전부 못 쓴다.</p>\n"}, {"k": "연결", "html": "<p>2절이 만든 자로는 &quot;이 단면이 휘어지는 것에 얼마나 저항하는가&quot;를 잴 수 없다. 1차 모멘트는 하필 <strong>도심축에서 정확히 0</strong> 이 되는데, 보가 휠 때 기준이 되는 축이 바로 그 도심축이기 때문이다 ― 재려는 자리에서 자가 0 을 가리키는 셈이다.</p>\n<p>0 이 되는 원인은 부호다. 축 위쪽 조각과 아래쪽 조각이 서로 상쇄되니, <strong>부호를 지우면 된다.</strong> 가장 자연스러운 방법이 제곱이고, 거리를 한 번 더 곱하는 순간 위아래가 똑같이 양수로 쌓여 상쇄가 사라진다⁠<sup class=\"rs\">1-1</sup>. 게다가 제곱은 먼 것을 훨씬 크게 세므로 <strong>&quot;넓이가 축에서 멀리 퍼질수록 잘 버틴다&quot;가 식 안에 저절로 들어온다</strong> ― 같은 넓이를 어디에 두느냐로 값이 열아홉 배까지 갈리는 것이 그 결과이고, I형강과 중공단면을 쓰는 이유가 그 안에 다 있다. 거리가 하나 늘었을 뿐인데 <strong>단위·부호·도심축에서의 값</strong> 셋이 한꺼번에 달라지는 것이 이 항의 요점이다.</p>\n<p>축을 옮기는 방법도 2절과 같은 구조다⁠<sup class=\"rs\">1-2</sup>. 전개하면 나오는 교차항이 <strong>도심축에 대한 1차 모멘트</strong>라 0 으로 사라지고, 남는 것이 넓이 곱하기 거리의 제곱이다. 붙는 항이 언제나 양수이므로 <strong>도심축 값이 항상 최소</strong>라는 사실도 이 한 줄에서 증명된다. 그러니 기본단면도 도심축 값 셋만 외우면 되고, 상·하단축 값은 그 정리로 그 자리에서 만들어 낸다⁠<sup class=\"rs\">1-3</sup>.</p>\n<p>그다음이 절 이름이다⁠<sup class=\"rs\">2</sup>. 회전에 두 종류가 있기 때문인데, 보가 휘는 것은 단면이 <strong>축</strong>을 중심으로 기우는 일이고 축이 비틀리는 것은 단면이 <strong>점</strong>을 중심으로 도는 일이다. 거리를 점에서 재기만 하면 극모멘트가 되고⁠<sup class=\"rs\">2-1</sup>, 원형 축의 비틀림 식이 여기에 선다. 그리고 피타고라스 한 줄 때문에 <strong>극모멘트가 직교하는 두 축 값의 합</strong>이라는 사실이 곧바로 따라 나온다⁠<sup class=\"rs\">2-2</sup> ― 외울 식이 아니라 두 줄이면 다시 만들어지는 식이다. 기본단면의 극모멘트도 그 합으로 만든다⁠<sup class=\"rs\">2-3</sup>.</p>\n<p>세 번째는 상승모멘트다⁠<sup class=\"rs\">3</sup>. 같은 거리를 두 번 곱하는 대신 두 방향 거리를 한 번씩 곱한 것인데, 제곱이 아니라서 <strong>부호가 살아남는다</strong>⁠<sup class=\"rs\">3-1</sup>. 이 절에서 유일하게 음수가 될 수 있어 &quot;2차 모멘트는 항상 양수&quot;라는 문장의 예외처럼 보이는데, 갈림선은 하나 ― 제곱이냐 아니냐다. 그리고 대칭축이 하나라도 있으면 짝이 상쇄되어 0 이 되는데⁠<sup class=\"rs\">3-2</sup>, 조건이 <strong>대칭축</strong>이지 도심축이 아니라는 점이 2절과 갈리는 자리다. 축을 옮기는 식도 있는데⁠<sup class=\"rs\">3-3</sup>, 여기서는 이동거리를 <strong>부호까지 살려서</strong> 곱해야 한다.</p>\n<p>마지막은 만든 값을 <strong>나누어 쓰는 두 양</strong>이다⁠<sup class=\"rs\">4</sup>. 연단까지의 거리로 나누면 단면계수가 되어 휨응력을 바로 주고⁠<sup class=\"rs\">4-1</sup>, 넓이로 나누고 뿌리를 씌우면 단면 2차 반지름이 되어 기둥의 좌굴을 판정한다⁠<sup class=\"rs\">4-2</sup>. 새 개념이 아니라 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I</mi></mrow></math></span> 의 사용설명서다. 여섯 양이 다 모이면 헷갈리기 쉬운데, <strong>단위와 부호</strong> 두 가지로 가르면 그 자리에서 정리된다⁠<sup class=\"rs\">4-3</sup>.</p>\n<p><strong>거리를 두 번 곱한다. 축에서 재면 휨, 점에서 재면 비틀림이다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 거리를 한 번 더 곱했을 뿐인데 단위·부호·도심축 값이 왜 셋 다 달라지나\n② 휨과 비틀림은 각각 어떤 회전이고 거리를 어디서 재나\n③ <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>P</mi></msub><mo>=</mo><msub><mi>I</mi><mi>X</mi></msub><mo>+</mo><msub><mi>I</mi><mi>Y</mi></msub></mrow></math></span> 를 두 줄로 유도할 수 있나</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/변형률및탄성계수", "name": "변형률및탄성계수", "title": "변형률 및 탄성계수", "ch": 2, "chTitle": "응력과 변형", "ord": 1, "file": "n-01a283a401.html", "card": {"oneline": "1장은 힘을 셌고, 2장은 그 힘이 물체를 얼마나 바꾸는지를 센다. 힘은 <strong>단면적으로</strong>, 변형은 <strong>원래 길이로</strong> 나눠야 크기의 영향이 지워지고 재료의 성질만 남는다.", "bone": [{"n": "1", "t": "변형률 ― 변형을 원래 크기로 나눈 무차원 값", "subs": ["변형은 되돌아오기도 하고 남기도 한다", "종변형률과 횡변형률", "포아송비와 포아송수", "체적변형률"]}, {"n": "2", "t": "탄성계수 ― 응력과 변형률을 잇는 재료 고유의 상수", "subs": ["탄성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E</mi></mrow></math></span>", "온도변화가 만드는 변형과 응력", "전단탄성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G</mi></mrow></math></span> 와 전단변형", "체적탄성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 와 세 계수의 관계"]}], "link": [{"k": "목적", "html": "<p>같은 강봉이라도 굵기가 다르면 늘어난 길이가 100배 차이 난다. 힘과 변형을 그대로 적으면 <strong>그 부재의 기록</strong>일 뿐 재료의 성질이 아니다. 나눠서 무차원으로 만들어야 재료표가 생기고 설계가 된다.</p>\n"}, {"k": "연결", "html": "<p>재기 쉬운 <strong>변형률</strong>부터⁠<sup class=\"rs\">1</sup>. 단, 되돌아오는 구간(탄성)에서만 비례하므로 그 무대를 먼저 확인한다. 방향이 둘이라 종·횡을 따로 세고, 그 비가 <strong>포아송비</strong>다. 부피 변화도 포아송비가 정한다. 다음이 응력과 변형률을 잇는 <strong>탄성계수</strong>⁠<sup class=\"rs\">2</sup> ― 선도의 직선구간 기울기. 모드가 셋이라 계수도 셋이지만, 등방재료에서 <strong>독립인 것은 둘</strong>이다.</p>\n<p><strong>힘을 단면적으로, 변형을 원래 길이로 나눈다. 남는 것이 재료의 성질이다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 원래 길이로 나누는가 ② 종·횡을 따로 세는 이유 ③ 계수가 셋인데 독립이 둘인 이유</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/응력", "name": "응력", "title": "응력", "ch": 2, "chTitle": "응력과 변형", "ord": 2, "file": "n-dc74a38001.html", "card": {"oneline": "1절이 &quot;얼마나 변했나&quot;를 셌고, 이 절은 &quot;속에서 얼마나 버티고 있나&quot;를 센다. 같은 힘이라도 <strong>잘라 보는 면</strong>에 따라 그 면의 응력이 달라진다 ― 응력은 면과 방향을 함께 가진 양이다.", "bone": [{"n": "1", "t": "수직응력과 전단응력 ― 응력은 면에 딸린 양이다", "subs": ["두 갈래를 가르는 것은 힘의 방향 하나", "경사면의 응력 ― 1축 응력상태", "2축 응력상태"]}, {"n": "2", "t": "조합응력 ― 두 재료가 한 하중을 나눠 받는다", "subs": ["탄성계수비 ― 변형이 같으니 딱딱한 쪽이 더 받는다", "각 재료가 받는 응력"]}, {"n": "3", "t": "하중이 축력이 아닐 때 ― 비틀림응력과 원환응력", "subs": ["비틀림응력", "원환응력"]}], "link": [{"k": "목적", "html": "<p>1절의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi><mo>=</mo><mi>P</mi><mo>/</mo><mi>A</mi></mrow></math></span> 에는 &quot;축에 직각인 면&quot; 이라는 전제가 숨어 있다. 면을 기울이면 <strong>면적이 커지고 힘이 갈려</strong> 값이 달라진다. 이 절이 없으면 45° 파괴·조합 부재의 검토·관 두께 산정이 안 된다.</p>\n"}, {"k": "연결", "html": "<p>두 응력을 가르는 기준(면에 대한 힘의 방향)을 세우고⁠<sup class=\"rs\">1</sup>, 면을 돌려 경사면·2축으로 넓힌다. 그다음 상황이 바뀌는 두 경우 ― 재료가 둘일 때⁠<sup class=\"rs\">2</sup>, 하중이 축력이 아닐 때⁠<sup class=\"rs\">3</sup>.</p>\n<p><strong>면을 정하지 않고 응력을 말할 수 없다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 두 응력을 가르는 기준 하나 ② 면을 돌리면 무엇 둘이 동시에 변하나 ③ 조합 부재에서 어느 쪽이 더 받나, 그 근거 조건은</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/축하중부재", "name": "축하중부재", "title": "축하중 부재", "ch": 2, "chTitle": "응력과 변형", "ord": 3, "file": "n-9d584fa1ae.html", "card": {"oneline": "1절이 변형률을, 2절이 응력을 세웠다. 이 절은 그 둘을 곱해 <strong>&quot;몇 mm 늘어나는가&quot;</strong> 를 낸다. 그 관계를 뒤집으면 부재가 스프링 하나(상수 둘)로 바뀐다.", "bone": [{"n": "1", "t": "축방향 변형량 ― 두 절의 결과를 곱한 것", "subs": ["늘어난 길이", "구간마다 다르면 나눠서 더한다", "자중이 만드는 늘어남"]}, {"n": "2", "t": "강성도와 유연도 ― 같은 관계를 양쪽에서 본 두 상수", "subs": ["강성도", "유연도", "두 상수가 구조해석의 두 갈래를 가른다"]}], "link": [{"k": "목적", "html": "<p>현장이 묻는 것은 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ε</mi></mrow></math></span> 도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi></mrow></math></span> 도 아니라 <strong>늘어난 길이</strong>다(부재 이음·케이블 처짐·신축이음). 그리고 그 비례관계를 상수로 굳혀야 부재를 스프링 하나로 바꿔 3장 이후 구조해석에 넘길 수 있다.</p>\n"}, {"k": "연결", "html": "<p>1절·2절을 곱해 변형량을 세우고⁠<sup class=\"rs\">1</sup>, 그 식의 전제(하중·단면·재료가 일정)가 깨지면 구간을 끊어 더한다. 그다음 같은 관계를 뒤집어 상수 둘을 세운다⁠<sup class=\"rs\">2</sup>.</p>\n<p><strong>나눈 것을 되곱해 부재의 답으로 돌아온다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 변형량 식의 숨은 전제 셋 ② 구간을 어디서 끊나 ③ 같은 관계인데 왜 상수가 둘인가</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/힘과모멘트", "name": "힘과모멘트", "title": "힘과 모멘트", "ch": 1, "chTitle": "힘·모멘트와 단면의 성질", "ord": 1, "file": "n-0724b0acca.html", "card": {"oneline": "힘은 크기만으로 정해지지 않는다. <strong>어디에 어느 방향으로 걸리는가</strong>가 결과를 바꾸고, 그 '어디'를 숫자 하나로 바꾼 것이 모멘트다.", "bone": [{"n": "1", "t": "힘 ― 크기·방향·작용점", "subs": ["힘의 3요소와 작용선", "두 힘의 합성 ― 평행사변형", "힘의 분해 ― 삼각형을 푼다", "라미의 정리 ― 세 힘의 평형"]}, {"n": "2", "t": "모멘트 ― 회전시키는 능력", "subs": ["모멘트의 정의와 부호", "바리뇽의 정리", "우력 ― 합력 0, 회전만"]}, {"n": "3", "t": "마찰력 ― 접촉면이 되미는 힘", "subs": ["마찰력과 마찰계수", "마찰각과 경사면"]}], "link": [{"k": "목적", "html": "<p>같은 힘이라도 문 손잡이를 밀면 열리고 경첩 옆을 밀면 안 열린다. <strong>작용점이 만드는 회전 효과</strong>를 힘 × 거리 하나로 바꾸는 것이 이 절이다. 없으면 평형방정식의 셋째 줄 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>∑</mo><mi>M</mi><mo>=</mo><mn>0</mn></mrow></math></span> 이 없어 반력부터 못 구하고, 응용역학의 나머지가 통째로 서지 못한다.</p>\n"}, {"k": "연결", "html": "<p>문을 손잡이에서 밀면 열리고, 경첩 바로 옆을 같은 힘으로 밀면 꿈쩍도 안 한다. 힘의 크기와 방향은 같은데 결과가 다르다 ― 달라진 것은 <strong>어디에 걸었나</strong> 하나뿐이다. 이 절은 그 '어디'를 셈에 넣을 자리를 만든다.</p>\n<p>먼저 힘이 무엇으로 정해지는지부터 못 박는다⁠<sup class=\"rs\">1-1</sup>. 크기·방향·작용점 셋이고, 작용점을 지나 힘 방향으로 그은 직선이 작용선이다. 강체에서는 힘을 이 <strong>작용선 위로는</strong> 얼마든지 옮겨도 평형과 반력이 같은데, 벗어나면 달라진다 ― 이 한 가지가 뒤의 모든 이야기를 연다.</p>\n<p>앞의 두 요소는 벡터의 성질이라 화살표로 더하고 뺄 수 있다. 둘을 합칠 때 쓰는 것이 평행사변형의 대각선이고⁠<sup class=\"rs\">1-2</sup>, 반대로 하나를 둘로 나눌 때는 그 평행사변형의 절반인 삼각형을 사인법칙으로 푼다⁠<sup class=\"rs\">1-3</sup>. 세 힘이 평형이면 그 삼각형이 아예 <strong>닫혀 버리는데</strong>⁠<sup class=\"rs\">1-4</sup>, 닫힌 삼각형에 사인법칙을 그대로 적용한 것이 라미의 정리다 ― 새 공식이 아니라 같은 삼각형의 다른 얼굴이다.</p>\n<p>문제는 세 번째 요소인 <strong>작용점</strong>이다. 이것은 화살표 덧셈에 들어가지 않는다. 작용선을 벗어나 옮기는 순간 무언가가 달라지는데, 그 달라지는 몫을 재는 양이 모멘트다⁠<sup class=\"rs\">2-1</sup>. 힘 곱하기 거리인데 그 거리가 아무 거리가 아니라 <strong>회전중심에서 작용선까지의 수직거리</strong>여야 한다. 왜 수직인지는 두 갈래로 설명된다 ― 이동성 덕분에 힘을 수선의 발까지 옮길 수 있고, 분해해 보면 팔 방향 성분은 회전중심을 향하므로 모멘트가 0 이다.</p>\n<p>정의가 서면 두 가지가 따라 나온다. 여러 힘을 하나로 묶은 합력이 <strong>어디에 서야 하는지</strong>를 알려 주는 것이 바리뇽의 정리인데⁠<sup class=\"rs\">2-2</sup>, 모멘트가 힘에 대해 선형이기 때문에 성립한다. 다음 절의 도심 식이 이 식에서 힘을 면적으로 바꾼 것뿐이라는 점도 여기서 예고된다. 반대로 합력이 0 인데 회전만 남는 특수한 짝이 우력이다⁠<sup class=\"rs\">2-3</sup>. 기준점을 어디로 잡아도 값이 같은데, 두 힘의 모멘트를 빼면 기준점까지의 거리가 지워지기 때문이다. 그 성질 덕분에 <strong>힘을 옆으로 옮기는 일</strong>이 계산 가능해지고, 편심하중을 축하중과 모멘트로 가르는 계산이 거기서 나온다.</p>\n<p>마지막으로 교재는 마찰력을 이 절에 함께 실었다⁠<sup class=\"rs\">3</sup>. 마찰력은 앞의 힘들과 성격이 다르다 ― 주어지는 값이 아니라 <strong>상대가 미는 만큼 되미는 반응</strong>이고, 다만 상한이 접촉면 수직력에 비례한다⁠<sup class=\"rs\">3-1</sup>. 그래서 아직 미끄러지지 않은 상태에 최대값을 그대로 대입하면 틀린다. 그 비례상수를 각으로 바꿔 부른 것이 마찰각인데⁠<sup class=\"rs\">3-2</sup>, 판을 기울여 미끄러지기 시작하는 각만 재면 계수를 얻는다 ― 토질의 내부마찰각이 하는 일과 같은 뿌리다.</p>\n<p><strong>힘은 밀고, 모멘트는 돌린다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 작용점이 왜 나머지 둘과 성격이 다른가\n② 왜 팔이 '수직거리'인가\n③ 우력이 기준점과 무관한 이유</p>\n"}}, {"subj": "철콘", "subjName": "철근콘크리트 및 강구조", "sid": "s-bd8ade", "unit": "철콘/t형단면보", "name": "t형단면보", "title": "T형 단면보", "ch": 3, "chTitle": "보의 휨설계", "ord": 3, "file": "n-e3de72e888.html", "card": {"oneline": "T형보는 새 이론이 아니다. 슬래브가 압축을 거들어 주는 만큼 압축폭을 넓게 잡아 주는 직사각형보이고, 갈림길은 &quot;압축블록이 플랜지를 넘느냐&quot; 하나뿐이다.", "bone": [{"n": "1", "t": "플랜지의 유효폭", "subs": ["T형보로 거동하는 까닭", "유효폭의 정의", "대칭 T형보의 유효폭", "반 T형보의 유효폭"]}, {"n": "2", "t": "T형 단면의 판정", "subs": ["판정 기준과 절차", "부(-)모멘트 구간"]}, {"n": "3", "t": "T형 보의 휨강도", "subs": ["압축을 둘로 쪼개는 중첩법", "플랜지 내민부의 철근량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mrow><mi>s</mi><mi>f</mi></mrow></msub></mrow></math></span>", "복부의 등가응력깊이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span>", "설계휨강도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span>", "최대철근비 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub></mrow></math></span>", "단위·극한 검증"]}], "link": [{"k": "목적", "html": "<p>보와 슬래브는 한 번에 타설되어 한 덩어리다. 정(+)모멘트 구간에서는 슬래브가 압축을 거드는데, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>b</mi><mi>w</mi></msub></mrow></math></span> 만 세면 비경제적이고 슬래브 전체를 세면 위험측이다. <strong>&quot;이 보가 자기 몫이라고 주장할 수 있는 폭&quot;</strong> 을 정하고, 그 넓어진 단면의 휨강도를 구하는 것이 목적. 새 역학은 없다 ― 1절의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi><mo>=</mo><mi>T</mi></mrow></math></span> 에 &quot;압축부가 직사각형이 아닐 때&quot; 만 추가된다.</p>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup> <strong>플랜지의 유효폭</strong>. 압축을 셀 폭이 없으면 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi><mo>=</mo><mi>T</mi></mrow></math></span> 를 못 세운다. 이 폭은 유도가 아니라 <strong>규정(암기)</strong> 이다 ― 전단지연으로 불균등한 실제 응력을 &quot;균등 × 좁힌 폭&quot; 으로 치환한 값이기 때문. 폭을 얻어도 곧바로 T형 공식이 아니다: ⁠<sup class=\"rs\">2</sup> <strong>판정</strong>. 압축블록이 플랜지 안에서 끝나면 복부는 압축에 무관하므로 그냥 폭 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b</mi></mrow></math></span> 직사각형보다. 넘칠 때만 진짜 T형. 그때 ⁠<sup class=\"rs\">3</sup> <strong>휨강도</strong> ― 압축부가 둘로 갈려 팔길이가 하나로 안 나오므로, 압축을 두 조각으로 쪼개 각각 직사각형보로 풀고 더한다(중첩).</p>\n<p><strong>압축이 얼마나 깊이 내려가느냐가 이 단원의 모든 것을 가른다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 유효폭을 왜 만들었고 왜 규정값을 외워야 하는가 ② 넓은 플랜지를 얻고도 왜 판정을 한 번 더 하는가 ③ 압축을 왜 둘로 쪼개고, 쪼갠 조각을 무엇으로 푸는가</p>\n"}}, {"subj": "철콘", "subjName": "철근콘크리트 및 강구조", "sid": "s-bd8ade", "unit": "철콘/강도설계법", "name": "강도설계법", "title": "강도설계법 (Strength Design Method)", "ch": 2, "chTitle": "강도설계법의 기본개념과 환산단면적", "ord": 1, "file": "n-a85bbe596b.html", "card": {"oneline": "부서지기 직전의 진짜 거동을 정면으로 계산하고, <strong>하중은 키우고(하중계수)·강도는 깎는(강도감소계수)</strong> 두 겹의 안전장치를 양쪽 끝에 따로 끼운다.", "bone": [{"n": "1", "t": "파괴 순간의 단면 ― 극한상태와 네 가지 약속", "subs": ["극한상태와 극한변형률 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ε</mi><mrow><mi>c</mi><mi>u</mi></mrow></msub></mrow></math></span>", "평면보존 ― 변형률은 직선 분포", "철근의 완전탄소성", "콘크리트 인장강도는 무시"]}, {"n": "2", "t": "등가직사각형 응력블록", "subs": ["곡선을 사각형으로 바꾸는 조건", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>β</mi></mrow></math></span> 와 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>β</mi><mn>1</mn></msub></mrow></math></span> ― 두 표를 헷갈리지 마라 ⚠", "등가블록 공식과 계수값", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>0.85</mn><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub></mrow></math></span> 의 정체"]}, {"n": "3", "t": "두 겹의 안전장치와 설계 조건식", "subs": ["계수하중과 소요강도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>U</mi></mrow></math></span>", "강도감소계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi></mrow></math></span>", "지배단면 ― <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi></mrow></math></span> 를 결정하는 기준", "설계 조건식 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub><mo>≥</mo><msub><mi>M</mi><mi>u</mi></msub></mrow></math></span>"]}], "link": [{"k": "목적", "html": "<p>WSD는 탄성 범위(<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub></mrow></math></span> 의 1/3쯤)에서 멈춰 ① 진짜 안전여유를 모르고 ② 고정하중과 활하중을 똑같이 취급했다. USD는 파괴 순간을 정면으로 계산한다. 키워드 한 단어 = <strong>안전성(safety)</strong>.</p>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup> 파괴 순간의 단면 상태를 가정으로 못박고, 그래도 남는 곡선 적분을 ⁠<sup class=\"rs\">2</sup> 등가직사각형으로 갈아끼운다(저항 쪽 도구 완성). 마지막으로 ⁠<sup class=\"rs\">3</sup> 안전을 하중 쪽·저항 쪽에 나눠 넣고, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi></mrow></math></span> 는 연성이냐 취성이냐(지배단면)로 갈린다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① WSD가 답 못한 것과 USD의 답 ② 곡선을 사각형으로 바꿔도 되는 조건 둘 ③ 안전장치를 왜 양쪽에 나눠 넣나</p>\n"}}, {"subj": "철콘", "subjName": "철근콘크리트 및 강구조", "sid": "s-bd8ade", "unit": "철콘/단철근직사각형보", "name": "단철근직사각형보", "title": "단철근 직사각형 보 (Singly Reinforced Rectangular Beam)", "ch": 3, "chTitle": "보의 휨설계", "ord": 1, "file": "n-513f643d8f.html", "card": {"oneline": "힘의 평형 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi><mo>=</mo><mi>T</mi></mrow></math></span> 하나에서 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span> → <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span> 이 줄줄이 나오고, 철근량이 연성이냐 취성이냐를 가른다. 그 안전한 창이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub><mo>≤</mo><mi>ρ</mi><mo>≤</mo><msub><mi>ρ</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow></math></span>.", "bone": [{"n": "1", "t": "힘의 평형과 휨강도", "subs": ["단철근 직사각형 보", "힘의 평형 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi><mo>=</mo><mi>T</mi></mrow></math></span>", "등가응력블록의 깊이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span>", "공칭휨강도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span>", "설계휨강도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>d</mi></msub></mrow></math></span>"]}, {"n": "2", "t": "파괴 양상과 균형보", "subs": ["세 가지 파괴 시나리오", "균형보 ― 두 파괴가 만나는 경계", "균형 중립축 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>c</mi><mi>b</mi></msub></mrow></math></span>", "균형철근비 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>b</mi></msub></mrow></math></span>"]}, {"n": "3", "t": "철근량의 설계창", "subs": ["최대철근비 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow></math></span>", "최소철근비 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>m</mi><mi>i</mi><mi>n</mi></mrow></msub></mrow></math></span>", "보는 왜 연성으로 강제되나", "단위·극한 검증"]}], "link": [{"k": "목적", "html": "<p>2장의 도구 셋(평면보존 · 등가블록 · 지배단면과 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi></mrow></math></span>)을 실제 보에 처음 휘두른다. 철근을 너무 적게 넣어도 너무 많이 넣어도 파괴는 <strong>갑작스럽다</strong> ― 양쪽 극단이 모두 취성. 그 사이의 연성 영역을 찾는 것이 목적이고, 복철근보 · T형보도 여기서 만든 틀을 그대로 물려받는다.</p>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup> <strong>힘의 평형과 휨강도</strong>로 계산 도구를 완성한다. <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi><mo>=</mo><mi>T</mi></mrow></math></span> 는 미지수가 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span> 하나뿐인 방정식이고, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span> 가 풀리면 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ε</mi><mi>t</mi></msub></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>z</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span> 이 줄줄이 딸려 나온다. 그런데 이 계산은 &quot;파괴 순간 철근이 항복해 있다&quot;를 전제로 깔고 있다 ― 그 전제가 언제 깨지는지가 ⁠<sup class=\"rs\">2</sup> <strong>파괴 양상과 균형보</strong>다. 철근을 늘리면 중립축이 내려가고, 항복과 압괴가 동시에 일어나는 경계가 균형보(<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>b</mi></msub></mrow></math></span>)다. 균형보는 목표가 아니라 위험한 쪽 끝이므로, ⁠<sup class=\"rs\">3</sup> <strong>철근량의 설계창</strong>에서 위·아래로 빗장을 건다.</p>\n<p>철근을 넣는 일은 강도를 키우는 일이 아니라 <strong>파괴 방식을 고르는 일</strong>이다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi><mo>=</mo><mi>T</mi></mrow></math></span> 한 줄에서 왜 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span> → <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span> 이 줄줄이 나오는가 ② 철근을 늘리면 중립축이 어디로 움직이고 왜 파괴 양상이 바뀌는가 ③ 균형보가 왜 목표가 아니라 피해야 할 경계인가</p>\n"}}, {"subj": "철콘", "subjName": "철근콘크리트 및 강구조", "sid": "s-bd8ade", "unit": "철콘/복철근직사각형보", "name": "복철근직사각형보", "title": "복철근 직사각형 보", "ch": 3, "chTitle": "보의 휨설계", "ord": 2, "file": "n-9385b116cf.html", "card": {"oneline": "압축철근은 압축을 거들려고 넣는 게 아니다. 인장철근을 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow></math></span> 천장 너머로 더 넣으면서도 <strong>연성</strong>을 지키려는 장치이고, 계산은 단철근의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>C</mi><mo>=</mo><mi>T</mi></mrow></math></span> 에 항 하나를 더 붙인 것뿐이다.", "bone": [{"n": "1", "t": "복철근 직사각형 보", "subs": ["압축측에도 철근을 배치한 보", "단면 제한 ― <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow></math></span> 천장", "모멘트 반전과 장기처짐"]}, {"n": "2", "t": "두 우력으로의 분해", "subs": ["중첩 ― 콘크리트 우력과 강재 우력", "등가응력블록의 깊이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span>", "공칭휨강도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span>", "모멘트의 기준점", "설계휨강도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span>"]}, {"n": "3", "t": "압축철근의 항복 검토", "subs": ["압축철근의 변형률 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>ε</mi><mi>s</mi><mi>′</mi></msubsup></mrow></math></span>", "항복 조건", "항복하지 않을 때"]}, {"n": "4", "t": "복철근 보의 설계창", "subs": ["균형철근비 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover><mi>ρ</mi><mo stretchy=\"true\">¯</mo></mover><mi>b</mi></msub></mrow></math></span>", "최대철근비 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mover><mi>ρ</mi><mo stretchy=\"true\">¯</mo></mover><mrow><mi>s</mi><mo>,</mo><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow></math></span>", "단위·극한 검증", "풀이 절차"]}], "link": [{"k": "목적", "html": "<p>보 높이를 못 키우는데 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>u</mi></msub></mrow></math></span> 는 크다. <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mi>s</mi></msub></mrow></math></span> 를 늘리려 해도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ρ</mi><mo>≤</mo><msub><mi>ρ</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow></math></span> 라는 천장이 막아 단철근으로는 끝이다. 압축철근이 인장력 일부를 상쇄해 중립축을 끌어올리면 연성이 되살아나 <strong>천장 자체가 올라간다.</strong> 모멘트 반전 부재(지진·이동하중)와 장기처짐 억제도 여기서 해결된다.</p>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup> <strong>복철근 직사각형 보</strong>에서 정의와 새 기호(<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>A</mi><mi>s</mi><mi>′</mi></msubsup></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>d</mi><mi>′</mi></msup></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>f</mi><mi>s</mi><mi>′</mi></msubsup></mrow></math></span>)를 잡고, 압축철근을 넣는 세 이유의 <strong>급이 다르다</strong>는 것을 못 박는다. ⁠<sup class=\"rs\">2</sup> <strong>두 우력으로의 분해</strong>가 계산의 뿌리 ― 중첩으로 쪼개면 단철근 식의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mi>s</mi></msub></mrow></math></span> 자리에 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">(</mo><msub><mi>A</mi><mi>s</mi></msub><mo>−</mo><msubsup><mi>A</mi><mi>s</mi><mi>′</mi></msubsup><mo stretchy=\"false\">)</mo></mrow></math></span> 를 넣고 강재 우력 한 항을 더하는 것으로 끝난다. 그 분해는 &quot;압축철근도 항복한다&quot;를 깔고 있으므로 ⁠<sup class=\"rs\">3</sup> <strong>압축철근의 항복 검토</strong>로 전제를 검산한다(단철근이 ⁠<sup class=\"rs\">1</sup>→⁠<sup class=\"rs\">2</sup>에서 한 것과 같은 구조). 마지막 ⁠<sup class=\"rs\">4</sup> <strong>설계창</strong>에서 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>b</mi></msub></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>m</mi><mi>a</mi><mi>x</mi></mrow></msub></mrow></math></span> 에 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>ρ</mi><mi>′</mi></msup><msubsup><mi>f</mi><mi>s</mi><mi>′</mi></msubsup><mo>/</mo><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span> 가 붙어 커지는 것으로 &quot;압축철근이 문을 연다&quot;가 증명된다.</p>\n<p>복철근보는 <strong>압축을 보강한 보가 아니라 인장을 더 넣기 위한 보</strong>다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 압축철근을 넣는 세 이유 중 성격이 다른 하나와 그 까닭 ② 왜 콘크리트가 상대하는 인장이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">(</mo><msub><mi>A</mi><mi>s</mi></msub><mo>−</mo><msubsup><mi>A</mi><mi>s</mi><mi>′</mi></msubsup><mo stretchy=\"false\">)</mo><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span> 뿐인가 ③ 압축철근이 어떻게 인장철근을 더 넣게 해 주는가</p>\n"}}, {"subj": "철콘", "subjName": "철근콘크리트 및 강구조", "sid": "s-bd8ade", "unit": "철콘/사용성및내구성", "name": "사용성및내구성", "title": "사용성 및 내구성", "ch": 3, "chTitle": "보의 휨설계", "ord": 4, "file": "n-c1dd353300.html", "card": {"oneline": "강도설계가 &quot;부서지나&quot; 였다면 여기는 &quot;평소에 쓸 만한가&quot;. 하중은 사용하중, 재료는 탄성, 보는 것은 처짐·균열·피로 셋.", "bone": [{"n": "1", "t": "처짐", "subs": ["균열이 강성을 먹는다 ― <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>g</mi></msub></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mrow><mi>c</mi><mi>r</mi></mrow></msub></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>e</mi></msub></mrow></math></span>", "균열모멘트 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mrow><mi>c</mi><mi>r</mi></mrow></msub></mrow></math></span>", "유효단면2차모멘트 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>e</mi></msub></mrow></math></span>", "장기처짐 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>δ</mi><mrow><mi>l</mi><mi>t</mi></mrow></msub></mrow></math></span>", "처짐의 제한 ― 최소두께와 허용처짐"]}, {"n": "2", "t": "균열", "subs": ["균열은 개수가 아니라 폭", "균열폭을 키우는 요인", "철근 간격 규정", "허용균열폭"]}, {"n": "3", "t": "피로", "subs": ["반복이 강도를 깎는다", "콘크리트와 부재별 검토 규정", "왜 철근의 피로를 보는가", "응력범위"]}], "link": [{"k": "목적", "html": "<p><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>u</mi></msub><mo>≤</mo><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span> 을 통과해도 출렁임·칸막이벽 균열·누수·철근 부식은 남는다. 붕괴가 아닌데 전부 <strong>사용 불가</strong>. 한계상태가 둘이고 <strong>둘 다</strong> 만족해야 설계 완료.</p>\n<table>\n<thead>\n<tr>\n  <th></th>\n  <th>강도 ULS</th>\n  <th>사용성·내구성 SLS</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>하중</td>\n  <td>계수하중 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1.2</mn><mi>D</mi><mo>+</mo><mn>1.6</mn><mi>L</mi></mrow></math></span></td>\n  <td><strong>사용하중</strong> <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D</mi><mo>+</mo><mi>L</mi></mrow></math></span></td>\n</tr>\n<tr>\n  <td>재료</td>\n  <td>극한상태</td>\n  <td><strong>탄성범위</strong></td>\n</tr>\n<tr>\n  <td>기호</td>\n  <td><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>u</mi></msub><mo>,</mo><mtext> </mtext><msub><mi>M</mi><mi>n</mi></msub><mo>,</mo><mtext> </mtext><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span></td>\n  <td><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>a</mi></msub><mo>,</mo><mtext> </mtext><mi>δ</mi><mo>,</mo><mtext> </mtext><msub><mi>f</mi><mi>s</mi></msub><mo>,</mo><mtext> </mtext><msub><mi>w</mi><mi>k</mi></msub></mrow></math></span></td>\n</tr>\n</tbody>\n</table>\n<blockquote class=\"warn\">\n<p>⚠ 두 쪽 기호를 섞으면 전부 틀린다. 내구성은 시간축이 더 붙는다 ― 균열 = 수분·산소·염화물의 통로 → &quot;50년 뒤에도 철근이 사나&quot;.</p>\n</blockquote>\n"}, {"k": "연결", "html": "<p>먼저 ⁠<sup class=\"rs\">1</sup> <strong>처짐</strong>. 공식은 재료역학 그대로인데 RC 에서는 <strong><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I</mi></mrow></math></span> 가 상수가 아니다</strong> ― 모멘트가 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mrow><mi>c</mi><mi>r</mi></mrow></msub></mrow></math></span> 을 넘는 구간만 갈라지므로 위치마다 단면이 다르고, 대표값 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>e</mi></msub></mrow></math></span> 를 만들어야 한다. 그다음 시간이 그 처짐을 얼마나 더 키우는지(<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>λ</mi><mi>Δ</mi></msub></mrow></math></span>)를 얹고, 계산이 번거로우니 &quot;두께로 때우는 문&quot;도 함께 연다. 다음이 ⁠<sup class=\"rs\">2</sup> <strong>균열</strong> ― RC 에서 균열은 정상이고 문제는 개수가 아니라 <strong>폭</strong>이다. 흡수할 총 신장량은 이미 정해져 있으니 고를 수 있는 것은 <strong>몇 개로 나누는가</strong>뿐. 마지막이 ⁠<sup class=\"rs\">3</sup> <strong>피로</strong> ― 하중이 <strong>오르내린 횟수</strong>를 세며, 사하중은 최대·최소에 똑같이 들어가 소거된다.</p>\n<p>세 갈래는 하나로 모인다 ― <strong>강도가 좋아진 만큼 사용성은 나빠진다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 강도와 사용성이 하중·재료상태에서 어떻게 다른가 ② 왜 RC 처짐에서 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I</mi></mrow></math></span> 를 상수로 못 쓰는가 ③ 균열에서 문제가 왜 개수가 아니라 폭인가</p>\n"}}, {"subj": "철콘", "subjName": "철근콘크리트 및 강구조", "sid": "s-bd8ade", "unit": "철콘/철근의종류및성질", "name": "철근의종류및성질", "title": "철근의 종류 및 성질", "ch": 1, "chTitle": "철근콘크리트의 기본개념", "ord": 4, "file": "n-313195f026.html", "card": {"oneline": "철근은 이름에 강도(SD400)가, 호칭에 굵기(D22)가 적혀 있다. 그리고 항복 뒤에는 응력이 더 늘지 않으므로, 설계는 그 철근에 대해 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span> 하나만 안다.", "bone": [{"n": "1", "t": "철근의 종류와 규격", "subs": ["원형철근과 이형철근", "강종 표기", "공칭지름·공칭단면적"]}, {"n": "2", "t": "철근의 역학적 성질", "subs": ["탄성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>s</mi></msub></mrow></math></span>", "항복과 항복고원", "탄성계수비 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi></mrow></math></span>"]}, {"n": "3", "t": "용도에 따른 분류", "subs": ["휨 인장을 받는 주철근 계열", "전단·비틀림에 저항하는 철근", "힘을 나누고 균열을 막는 보조철근", "열일곱 이름을 가르는 한 줄"]}], "link": [{"k": "목적", "html": "<p>도면에 &quot;SD400 D22 4개&quot;를 적으려면 <strong>강도·굵기·항복변형률</strong>이 수치로 있어야 한다. 1절은 &quot;인장은 철근이 받는다&quot;까지 말하고 멈췄는데, 그 문장으로는 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mi>s</mi></msub></mrow></math></span> 도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T</mi><mo>=</mo><msub><mi>A</mi><mi>s</mi></msub><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span> 도 못 쓴다. 재료를 숫자로 바꾸는 절이다. 교재 학습방향도 같은 곳을 짚는다 ― <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>s</mi></msub></mrow></math></span> 는 언급이 없으면 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>2.0</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup></mrow></math></span> MPa, 탄성계수비, 그리고 <strong>용도별 명칭의 출제율이 높다.</strong></p>\n"}, {"k": "연결", "html": "<p>도면에 &quot;SD400 D22 4개&quot;라고 적으려 한다고 하자. 1절은 인장을 철근이 받는다고만 했고, 그 문장으로는 아무것도 계산할 수 없다. 이 이름들이 각각 무엇을 보증하는지부터 알아야 한다.</p>\n<p>먼저 이름을 뜯는다⁠<sup class=\"rs\">1</sup>. 앞 글자는 <strong>표면의 모양</strong>이다⁠<sup class=\"rs\">1-1</sup> ― D 는 돌기가 있다는 뜻이고, 1절에서 부착력의 대부분을 만든다고 했던 그 마디가 여기서 <strong>규격의 이름</strong>으로 올라온다. 뒤에 붙은 숫자는 그 철근이 보증하는 <strong>최소항복강도</strong>다⁠<sup class=\"rs\">1-2</sup>. 곧 강종 이름은 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span> 를 적어 둔 것이고, &quot;최소&quot;라는 말은 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub></mrow></math></span> 와 같은 성격의 보증된 하한이라는 뜻이다. 남은 D22 는 굵기인데, 마디 때문에 단면이 자리마다 달라 <strong>지름을 하나로 정할 수가 없다</strong>⁠<sup class=\"rs\">1-3</sup>. 그래서 무게를 재서 같은 무게의 매끈한 원형철근으로 환산하고 그 값에 &quot;공칭&quot;이라는 단서를 붙인다 ― 누가 재도 같은 것이 무게뿐이기 때문이다.</p>\n<p>이름이 보증한 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span> 가 <strong>왜 설계의 기준이 되는지</strong>가 다음이다⁠<sup class=\"rs\">2</sup>. 항복 전의 기울기는 강종이 달라도 같다⁠<sup class=\"rs\">2-1</sup>. 탄성계수는 원자 결합의 뻣뻣함이고, 강도를 올리는 조작은 항복점만 올리기 때문이다. 그러니 강종이 바뀌면 달라지는 것은 <strong>항복변형률 하나뿐</strong>이다. 그리고 곡선에는 항복점에서 응력이 멈춘 채 변형만 크게 늘어나는 구간이 있는데⁠<sup class=\"rs\">2-2</sup>, 이 평평한 구간 덕분에 세 가지가 한꺼번에 성립한다 ― 항복 뒤 응력이 일정하다는 완전탄소성 가정, 늘어난 정도를 몰라도
