과 한 달 뒤에 깰 것이 다르고, 원주형으로 만들었는지 입방체로 만들었는지에 따라서도 다르다. 그러니 &quot;이 콘크리트의 강도는 24 MPa 이다&quot;라는 말은 <strong>언제 어떻게 잰 값인지를 못 박기 전에는</strong> 아무 뜻이 없다.</p>\n<p>그래서 먼저 <strong>약속</strong>을 정한다⁠<sup class=\"rs\">1-1</sup>. 재령 28일과 표준 공시체다. 하필 압축강도를 대표값으로 삼는 것은 설계가 콘크리트에게 맡기는 일이 압축뿐이고, 시험이 쉬우며 흩어짐이 작고, 무엇보다 <strong>나머지 강도들이 압축강도와 함께 움직이기</strong> 때문이다. 그런데 이 약속이 왜 그토록 중요한지는 시험 방법을 보면 드러난다 ― 같은 콘크리트라도 공시체를 작게 만들거나 입방체로 만들면 <strong>값이 더 높게 나오고</strong>, 그래서 1보다 작은 보정계수로 되돌려야 한다⁠<sup class=\"rs\">1-2</sup>. 약속 위에서 값을 지배하는 변수는 하나, <strong>물-시멘트비</strong>다⁠<sup class=\"rs\">1-3</sup>. 수화에 쓰이지 못한 잉여수가 빠져나간 자리가 공극으로 남기 때문인데, 그 공극이 그대로 1절의 철근 부식 통로가 된다.</p>\n<p>약속이 정해지면 이제 그 값이 <strong>두 얼굴</strong>을 갖는다⁠<sup class=\"rs\">2</sup>. 도면에 적히는 값이 설계기준압축강도이고⁠<sup class=\"rs\">2-1</sup>, 현장이 겨냥하는 값이 배합강도다⁠<sup class=\"rs\">2-2</sup>. 둘이 갈라지는 원인은 단 하나, <strong>흩어짐</strong>이다. 설계값에 딱 맞춰 배합하면 시험값의 절반이 미달로 나오므로 흩어짐만큼 평균을 올려야 한다. 그래서 계산에 표준편차가 들어오고⁠<sup class=\"rs\">2-3</sup>, 시험을 몇 회 했느냐에 따라 그 값을 보정계수로 키우거나 아예 쓰지 않는 표로 대신한다 ― <strong>흩어짐을 모르면 더 비싸게 배합해야 한다</strong>는 것이 그 표의 뜻이다. 그리고 아무리 잘 배합해도 콘크리트가 철근 사이와 거푸집 구석을 채우지 못하면 그 강도가 실물에서 나오지 않으므로, 배합에서는 <strong>굵은 골재의 최대치수</strong>도 함께 정한다⁠<sup class=\"rs\">2-4</sup>.</p>\n<p>마지막으로 나머지 강도를 본다⁠<sup class=\"rs\">3</sup>. 인장은 <strong>직접 잡아당겨 잴 수가 없다</strong> ― 물림장치 부근에서 먼저 깨지고 편심에 취약하기 때문이다. 그래서 원주형 공시체를 눕혀 눌러 쪼개거나⁠<sup class=\"rs\">3-1</sup>, 보를 휘어 꺾어서 잰다⁠<sup class=\"rs\">3-2</sup>. 두 시험은 같은 콘크리트에서도 다른 값을 주는데, 휨인장은 탄성 가정으로 계산한 <strong>겉보기 값</strong>이라 늘 더 크게 나온다. 시험하지 않을 때 쓰는 식은 둘 다 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub></mrow></msqrt></mrow></math></span> 꼴인데⁠<sup class=\"rs\">3-3</sup>, 비례가 아니라 제곱근인 것은 인장파괴가 <strong>결함에서 시작된 균열이 번지는</strong> 현상이라 압축강도만큼 빠르게 늘지 않기 때문이다. 1절의 &quot;약 1/10&quot;이라는 어림이 어디까지 통하는지도 여기서 정리된다.</p>\n<p><strong>압축강도는 재고, 나머지 강도는 환산한다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 &quot;재령 28일·표준 공시체&quot;가 없으면 강도가 정의되지 않나\n② <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub></mrow></math></span> 와 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>r</mi></mrow></msub></mrow></math></span> 은 왜 갈라지나\n③ 왜 비례가 아니라 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub></mrow></msqrt></mrow></math></span> 인가</p>\n"}}, {"subj": "철콘", "subjName": "철근콘크리트 및 강구조", "sid": "s-bd8ade", "unit": "철콘/콘크리트의성질", "name": "콘크리트의성질", "title": "콘크리트의 성질", "ch": 1, "chTitle": "철근콘크리트의 기본개념", "ord": 3, "file": "n-24de916397.html", "card": {"oneline": "콘크리트는 하중을 준 순간에만 변형하는 재료가 아니다. 순간의 변형은 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>c</mi></msub></mrow></math></span> 가, 그 뒤의 변형은 <strong>크리프(지속하중이 있어야)</strong> 와 <strong>건조수축(하중과 무관)</strong> 이 맡는다.", "bone": [{"n": "1", "t": "하중을 주는 순간의 변형 ― 탄성계수", "subs": ["곡선이 직선이 아니다", "구조기준의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>c</mi></msub></mrow></math></span>", "초기접선탄성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mrow><mi>c</mi><mi>i</mi></mrow></msub></mrow></math></span>", "탄성계수비 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi></mrow></math></span>"]}, {"n": "2", "t": "시간이 지나며 늘어나는 변형 ― 크리프", "subs": ["크리프란", "크리프계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi></mrow></math></span>", "크리프를 키우는 것 · 줄이는 것", "크리프가 남기는 결과"]}, {"n": "3", "t": "하중 없이도 생기는 변형 ― 건조수축", "subs": ["왜 줄어드나", "영향을 미치는 요인", "구속되면 응력이 된다", "크리프와 건조수축을 가르는 한 줄"]}], "link": [{"k": "목적", "html": "<p>강도(2절) 옆에는 <strong>얼마나 변형하는가</strong>가 붙어야 설계가 된다. 처짐 계산에 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>c</mi></msub></mrow></math></span> 가, 환산단면에 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi></mrow></math></span> 이, 장기거동에 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi></mrow></math></span> 와 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ε</mi><mrow><mi>d</mi><mi>s</mi></mrow></msub></mrow></math></span> 가 필요하다. 그리고 다 지어 놓고 몇 년 뒤에 처짐이 두세 배가 되거나 하중을 얹은 적 없는 벽이 갈라지는 일이 실제로 일어나는데, 그 범인이 이 절에 있다. 없으면 3장 처짐·2장 환산단면적·PSC 손실이 입력값을 잃는다.</p>\n"}, {"k": "연결", "html": "<p>기둥에 하중을 얹고 계측기를 붙여 두었다고 하자. 재하 순간에 눈금이 움직이고 멈춘다. 그런데 하중을 그대로 둔 채 몇 달을 기다리면 눈금이 계속 움직인다. 게다가 하중을 얹은 적도 없는 옆 벽에 금이 간다. 이 절은 그 셋을 각각 누가 맡는지 정리한다.</p>\n<p>먼저 <strong>재하 순간의 변형</strong>이다⁠<sup class=\"rs\">1</sup>. 강재라면 탄성계수 한 값이면 끝이지만, 콘크리트는 응력-변형률 곡선이 <strong>원점을 떠나자마자 휘어서</strong> 어디서 기울기를 재느냐에 따라 값이 달라진다⁠<sup class=\"rs\">1-1</sup>. 휘는 이유는 계면의 미세균열이 자라며 내부가 손상되기 때문이다. 그러니 재는 자리를 약속해야 하고, 별도 언급이 없으면 할선탄성계수를 뜻한다. 그 값을 주는 기준식은 <strong>단위질량과 강도</strong> 둘에 매달려 있다⁠<sup class=\"rs\">1-2</sup> ― 밀도가 높을수록, 곧 공극이 적을수록 뻣뻣한데 이는 2절의 물-시멘트비 이야기와 같은 것이고, 강도가 커져도 세제곱근으로만 는다. 강도는 제곱근, 탄성계수는 세제곱근이라는 대비를 여기서 잡아 둔다. 크리프 계산에는 다른 자리의 기울기를 쓰는데⁠<sup class=\"rs\">1-3</sup>, 크리프계수의 분모가 <strong>재하 순간의</strong> 탄성변형이어야 하기 때문이다. 마지막으로 이 값을 철근 쪽과 나눈 것이 탄성계수비이고⁠<sup class=\"rs\">1-4</sup>, 1절의 부착에서 두 재료의 변형률이 같다는 사실과 합쳐져 2장 환산단면적의 뿌리가 된다.</p>\n<p>여기까지는 전부 <strong>하중을 얹은 그 순간</strong>의 이야기다. 하중을 그대로 두고 기다리면 응력이 하나도 늘지 않았는데 변형만 는다 ― 크리프다⁠<sup class=\"rs\">2-1</sup>. 물리를 잡아 두면 요인 목록을 외울 필요가 없어진다. 하중을 받은 겔 속의 흡착수가 밀려 이동하는 것이라서, <strong>크리프하는 것은 시멘트풀뿐이고 골재는 크리프하지 않는다.</strong> 크기는 탄성변형의 몇 배인지로 세는데⁠<sup class=\"rs\">2-2</sup>, 옥내·옥외·수중의 값 셋도 외울 것이 아니라 습도 순서에서 그대로 나온다. 그러면 교재의 요인 열한 개가 두 줄로 정리된다⁠<sup class=\"rs\">2-3</sup> ― <strong>물이 얼마나 있고 얼마나 쉽게 빠져나가는가, 골격이 얼마나 굳어 있는가.</strong> 온도가 두 번 나오는 것도 모순이 아니다(재하 중이냐, 재하 전 양생이냐). 그 결과는 처짐 증가와 응력 재분배, 프리스트레스 손실로 나타나는데⁠<sup class=\"rs\">2-4</sup>, 장기처짐 식의 분모에 압축철근비가 듣는 이유가 <strong>철근은 크리프하지 않기 때문</strong>이라는 데서 앞의 물리와 이어진다.</p>\n<p>마지막으로 <strong>하중이 아예 없어도 생기는 변형</strong>이 있다⁠<sup class=\"rs\">3</sup>. 수화에 필요한 것보다 많이 넣은 물이 증발하며 부피가 주는 건조수축이다⁠<sup class=\"rs\">3-1</sup>. 2절에서 강도를 떨어뜨린 그 물이 여기서는 부피를 줄이는 것인데, 그 크기가 1절의 인장한계보다 두 배에서 일곱 배나 된다. 영향을 주는 요인도 원리 하나로 정리된다⁠<sup class=\"rs\">3-2</sup> ― 줄어드는 것은 시멘트풀이고, 골재와 철근은 안 줄면서 붙잡으며, 말릴 물이 있어야 줄어든다.</p>\n<p>여기서 결정적인 것은 건조수축 자체는 응력이 아니라는 점이다⁠<sup class=\"rs\">3-3</sup>. <strong>줄어드는 것을 무엇인가가 막는 순간에만</strong> 인장이 된다. 막는 것이 철근이면 콘크리트에 약한 인장이 걸리고, 부재 양단이 물려 있으면 인장강도를 훌쩍 넘어 갈라진다 ― 1절의 &quot;균열은 피할 수 없다&quot;가 하중 없이도 성립하는 자리다. 두 변형을 나란히 놓고 보면 가르는 기준은 결국 하나로 남는다⁠<sup class=\"rs\">3-4</sup>.</p>\n<p><strong>순간에 얼마나 ― 시간이 지나 얼마나 더 ― 하중 없이도 얼마나.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 &quot;어디서 재는지&quot;부터 약속해야 하나\n② 크리프와 건조수축을 가르는 한 가지\n③ 건조수축은 왜 그 자체로는 응력이 아닌데 균열을 만드나</p>\n"}}, {"subj": "측량학", "subjName": "측량학", "sid": "s-91a4ee", "unit": "측량학/관측값의-처리방법", "name": "관측값의-처리방법", "title": "관측값의 처리방법", "ch": 1, "chTitle": "측량학 개론", "ord": 6, "file": "n-c6e5d2700f.html", "card": {"oneline": "여러 번 잰 값에서 가장 믿을 만한 값 하나와 그 값의 신뢰도를 뽑아낸다. 뿌리는 단 하나 ― 잔차 제곱합 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo stretchy=\"false\">[</mo><mi>v</mi><mi>v</mi><mo stretchy=\"false\">]</mo></mrow></math></span> 를 최소로.", "bone": [{"n": "1", "t": "오차의 종류", "subs": ["착오 · 정오차 · 우연오차", "정규분포와 오차의 3법칙"]}, {"n": "2", "t": "최확값", "subs": ["최확값 = 산술평균", "최소제곱법", "경중률과 가중평균"]}, {"n": "3", "t": "정밀도", "subs": ["잔차와 평균제곱근 오차", "평균의 오차", "확률오차"]}], "link": [{"k": "목적", "html": "<p>참값은 볼 수 없다. 손에 쥔 관측값만으로 <strong>어느 값을 적을지</strong>(최확값)와 <strong>얼마나 믿을지</strong>(정밀도)를 계산해내는 것이 이 절이다. 이것이 있어야 성과에 &quot;± 몇 mm&quot;를 붙일 수 있다. 수준측량의 오차배분, 트래버스 조정, 삼각망 조정이 모두 이 절 위에 선다.</p>\n"}, {"k": "연결", "html": "<p>같은 거리를 여러 번 쟀고 값이 다 다르다. 그중 무엇을 성과로 적어야 할까. 참값을 볼 수 없으니 관측값만으로 답을 만들어야 하는데, 그 전에 <strong>손에 쥔 값들이 쓸 만한지부터 걸러야 한다</strong>⁠<sup class=\"rs\">1</sup>.</p>\n<p>거르는 기준은 5절에서 이미 나왔다. 오차는 성질이 셋이라 처리법도 셋이다⁠<sup class=\"rs\">1-1</sup> ― 착오는 아예 버리고, 정오차는 원인을 알아 빼낸다. 그러면 <strong>우연오차만 남는다.</strong> 이것은 없앨 수 없으니 다스릴 수밖에 없는데, 다스릴 수 있는 이유가 있다. 우연오차는 아무렇게나 흩어지는 것이 아니라 <strong>종 모양으로 모이기</strong> 때문이다⁠<sup class=\"rs\">1-2</sup>. 작은 오차가 큰 오차보다 많고, 같은 크기라면 플러스와 마이너스가 비슷하게 나온다.</p>\n<p>이 종 모양 하나에서 두 갈래가 동시에 나온다. 하나는 <strong>&quot;어느 값이 가장 그럴듯한가&quot;</strong> 다⁠<sup class=\"rs\">2</sup>. 종의 한가운데가 답이고, 그것이 산술평균이다⁠<sup class=\"rs\">2-1</sup>. 왜 하필 평균인지는 잔차의 제곱합을 가장 작게 만드는 값을 찾아보면 나온다⁠<sup class=\"rs\">2-2</sup>. 그리고 관측마다 믿을 정도가 다르면 5절에서 본 무게를 달아 가중평균을 쓴다⁠<sup class=\"rs\">2-3</sup>.</p>\n<p>다른 하나는 <strong>&quot;그 값을 얼마나 믿나&quot;</strong> 다⁠<sup class=\"rs\">3</sup>. 종이 좁으면 믿을 만하고 넓으면 아니므로, 퍼진 정도를 수로 적으면 그것이 정밀도다⁠<sup class=\"rs\">3-1</sup>. 그런데 여러 번 재서 평균을 냈으니, 개별 관측보다 그 평균이 더 믿을 만하다 ― 얼마나 더 믿을 만한지가 따로 계산된다⁠<sup class=\"rs\">3-2</sup>. 같은 퍼짐을 다른 확률 기준으로 적으면 확률오차가 된다⁠<sup class=\"rs\">3-3</sup>.</p>\n<p>둘이 만나 <code>최확값 ± 오차</code> 한 줄이 되고, 그것이 성과에 적히는 값이다.</p>\n<p>착오는 <strong>버리고</strong>, 정오차는 <strong>빼고</strong>, 우연오차는 <strong>평균 낸다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 세 오차가 왜 처리법이 다른가 ② 왜 하필 산술평균이 최확값인가 ③ <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>m</mi></mrow></math></span> 과 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>m</mi><mi>x</mi></msub></mrow></math></span> 는 무엇이 다르고 왜 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msqrt><mrow><mi>n</mi></mrow></msqrt></mrow></math></span> 이 붙는가</p>\n"}}, {"subj": "측량학", "subjName": "측량학", "sid": "s-91a4ee", "unit": "측량학/오차의원인과종류", "name": "오차의원인과종류", "title": "오차의 원인과 종류", "ch": 1, "chTitle": "측량학 개론", "ord": 5, "file": "n-0b87493203.html", "card": {"oneline": "오차는 없앨 수 없다. <strong>어디서 왔는지</strong>를 알면 성질이 정해지고, 성질이 정해지면 <strong>여러 번 재면 어떻게 쌓이는지</strong>가 정해지고, 그러면 그 값을 <strong>얼마나 믿을지</strong>가 숫자로 정해진다.", "bone": [{"n": "1", "t": "오차의 원인", "subs": ["발생 원인 셋", "원인의 분류와 종류의 분류는 축이 다르다"]}, {"n": "2", "t": "오차의 종류", "subs": ["정오차", "우연오차", "어느 오차가 오차론의 대상인가"]}, {"n": "3", "t": "무게(경중률)", "subs": ["무게 = 측정값의 신뢰 정도를 표시하는 값", "오차와의 비례관계", "최확값과 보정량"]}], "link": [{"k": "목적", "html": "<p>오차를 0 으로 만드는 길은 없고, 정확도를 올리는 데는 시간과 비용이 든다. 그래서 실제 판단은 &quot;없애자&quot;가 아니라 <strong>&quot;이 목적에 오차가 어디까지 허용되나, 그 수준을 가장 싸게 얻는 길은 무엇인가&quot;</strong> 이다. 1절이 평면측량과 대지측량을 요구 정밀도로 갈랐던 그 선을 그으려면, 오차가 얼마나 생기는지를 먼저 셈할 수 있어야 한다.</p>\n"}, {"k": "연결", "html": "<p>거리를 열 번 쟀는데 값이 조금씩 다르다고 하자. 무엇부터 물어야 할까. 오차를 없앨 수는 없으니, 먼저 <strong>어디서 생겼는지</strong>를 묻는다⁠<sup class=\"rs\">1</sup>. 재는 데 관여하는 것은 셋뿐이다 ― 기계, 사람, 환경⁠<sup class=\"rs\">1-1</sup>. 원인이 셋으로 정해지면 손볼 자리도 곧바로 보인다.</p>\n<p>원인을 알면 다음 물음이 따라온다 ― <strong>그 원인이 확실한가</strong>⁠<sup class=\"rs\">2</sup>. 확실하면 매번 같은 쪽으로 값을 밀기 때문에 오차가 그대로 쌓인다. 이것이 정오차이고, 쌓이는 방향을 아니까 <strong>찾아서 빼면 된다</strong>⁠<sup class=\"rs\">2-1</sup>. 반면 원인이 불분명하면 어떤 때는 크게, 어떤 때는 작게 나와 서로 지워지므로 훨씬 더디게 자란다. 이것이 우연오차이고, 뺄 수가 없으니 <strong>여러 번 재서 다스린다</strong>⁠<sup class=\"rs\">2-2</sup>. 쌓이는 방식이 다르니 다루는 법도 갈리는 것이고, 그래서 오차론이 대상으로 삼는 것은 우연오차뿐이다⁠<sup class=\"rs\">2-3</sup>. 원인으로 나눈 축과 종류로 나눈 축은 서로 다른 축이라 섞으면 안 된다⁠<sup class=\"rs\">1-2</sup>.</p>\n<p>여러 번 재기로 했으면 그 값들을 하나로 합쳐야 한다. 그런데 그냥 평균 낼 수가 없다 ― 열 번 잰 값과 두 번 잰 값을 같은 자격으로 놓을 수는 없기 때문이다. 그래서 관측마다 <strong>얼마나 믿을 만한지를 수로 달아</strong> 저울질한다. 그것이 무게다⁠<sup class=\"rs\">3-1</sup>.</p>\n<p>무게를 어떻게 정하느냐가 남는데, 답은 앞에서 이미 나왔다. 우연오차가 어떻게 자라는지 알아 뒀으므로, 무게는 그 관측에 남은 오차에서 곧바로 나온다⁠<sup class=\"rs\">3-2</sup>. 그래서 실제로는 <strong>관측횟수나 노선거리만 보고도 무게가 정해진다.</strong> 무게가 정해지면 최확값과 보정량이 따라 나오고⁠<sup class=\"rs\">3-3</sup>, 이 절의 계산은 전부 여기서 나온다.</p>\n<p>원인은 <strong>셋</strong>, 성질은 <strong>둘</strong>, 무게는 <strong>하나</strong>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① &quot;정확하다&quot; 의 뜻과, 정확도를 올릴 때 대가로 드는 것\n② 원인이 확실한 오차와 불분명한 오차가 여러 번 재면 각각 어떻게 자라는가 ― 그리고 <strong>왜</strong>\n③ 관측횟수를 늘리면 무게가 커지는 이유</p>\n"}}, {"subj": "측량학", "subjName": "측량학", "sid": "s-91a4ee", "unit": "측량학/종합", "name": "종합", "title": "종합", "ch": 1, "chTitle": "측량학 개론", "ord": 7, "file": "n-131b9b5cd6.html", "card": {"oneline": "1~6절의 줄기에 매달리지 못한 잔여 항목을 모은 절. 넓은 지역의 삼각형이 평면삼각형이 아니라는 것(구과량), 좌표의 출발점(원점), 시각의 정의, 지구면 위의 선과 각의 이름 ― 넷이다.", "bone": [{"n": "1", "t": "구면삼각형과 구과량", "subs": ["구면삼각형", "구과량", "구과량 계산 ― 방향은 두 가지뿐"]}, {"n": "2", "t": "측량의 원점", "subs": ["평면직각좌표의 원점", "경위도 원점과 수준원점"]}, {"n": "3", "t": "시(時)의 결정", "subs": ["시의 기준 ― 무엇이 한 바퀴 도는가", "세계시와 그 세 단계"]}, {"n": "4", "t": "지구의 기하학적 성질", "subs": ["지구면 위의 선 넷", "위도 네 가지", "기준을 정하는 점과 선"]}], "link": [{"k": "목적", "html": "<p>1~6절이 각각 세운 줄기(정의·분류 / 형상 / 좌표 / 물리 / 오차 / 처리) 어디에 끼워도 흐름이 끊기는 항목들을 모아 둔 자리다. 이 절이 비면 셋이 막힌다 ― 넓은 지역의 삼각측량에서 내각의 합을 <strong>수로 처리할 수 없고</strong>, 좌표의 <strong>출발점</strong>을 모른 채 좌표를 쓰게 되며, 천문측량이 관측하는 <strong>시각</strong>이 무엇인지 모른 채 4장으로 넘어간다.</p>\n"}, {"k": "연결", "html": "<p>1장을 여기까지 읽고 나면 갚지 않은 빚이 남는다. 이 절은 그 빚을 하나씩 갚는다.</p>\n<p>첫째 빚은 1절이 남겼다⁠<sup class=\"rs\">1</sup>. 1절은 곡률을 버릴 수 있는지 <strong>판정만</strong> 했고, 버릴 수 없을 때 실제로 얼마나 어긋나는지는 답하지 않았다. 넓은 지역에서 삼각형을 그리면 그것은 평면삼각형이 아니라 구면삼각형이고⁠<sup class=\"rs\">1-1</sup>, 내각의 합이 180° 를 넘는다. 그 초과분이 구과량이다⁠<sup class=\"rs\">1-2</sup>. 넘는 양을 수로 계산할 수 있어야 삼각망 조정이 가능하므로, 계산 방향은 두 가지로 정리된다⁠<sup class=\"rs\">1-3</sup>.</p>\n<p>둘째 빚은 3절이 남겼다⁠<sup class=\"rs\">2</sup>. 3절은 좌표를 적는 규약을 정했지만, <strong>그 좌표의 출발점을 실제로 어디에 박았는지</strong>는 지나갔다. 평면직각좌표의 원점이 어디이고 왜 거기인지⁠<sup class=\"rs\">2-1</sup>, 경위도의 원점과 높이의 원점은 또 어디인지⁠<sup class=\"rs\">2-2</sup> ― 원점을 모르면 좌표값은 숫자일 뿐 위치가 아니다.</p>\n<p>셋째 빚은 1절이 이름만 적어 둔 것이다⁠<sup class=\"rs\">3</sup>. 천문측량은 별을 보고 위치를 정하는데, 별은 계속 움직이므로 <strong>&quot;언제 봤나&quot;가 곧 &quot;어디서 봤나&quot;</strong> 가 된다. 그래서 시각의 기준이 무엇인지⁠<sup class=\"rs\">3-1</sup>, 그 기준이 어떤 단계를 거쳐 다듬어지는지⁠<sup class=\"rs\">3-2</sup>를 알아야 4장으로 넘어갈 수 있다.</p>\n<p>마지막으로 2·3절이 이미 쓰고 있던 낱말들에 이름을 붙인다⁠<sup class=\"rs\">4</sup>. 지구면 위에 그어지는 선이 넷이고⁠<sup class=\"rs\">4-1</sup>, 위도라는 말도 기준을 무엇으로 잡느냐에 따라 넷으로 갈린다⁠<sup class=\"rs\">4-2</sup>. 기준이 되는 점과 선을 정리하면⁠<sup class=\"rs\">4-3</sup> 1장에서 쓰인 용어가 모두 제자리를 찾는다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 구면삼각형의 내각의 합이 180° 를 넘는 이유와, 그 넘는 양이 무엇에 비례·반비례하는가\n② 원점이 왜 종류별로 따로 있어야 하는가\n③ 측량 교재에 '시(時)' 가 나오는 이유 ― 1절의 무엇과 이어지는가</p>\n"}}, {"subj": "측량학", "subjName": "측량학", "sid": "s-91a4ee", "unit": "측량학/좌표", "name": "좌표", "title": "좌표", "ch": 1, "chTitle": "측량학 개론", "ord": 3, "file": "n-2dafdd6074.html", "card": {"oneline": "좌표는 위치를 적는 <strong>규약</strong>이다. 곡면 위의 점을 평면 숫자로 옮기려면 반드시 무언가를 포기해야 하므로 규약이 여러 개다.", "bone": [{"n": "1", "t": "경위도좌표와 그 기준", "subs": ["경위도좌표", "측지좌표 (= 지리좌표)", "기준 타원체가 값을 정한다"]}, {"n": "2", "t": "평면직각좌표", "subs": ["원점과 두 축", "우리나라의 네 원점", "어디까지 평면으로 눌러도 되나"]}, {"n": "3", "t": "UTM 좌표와 UPS 좌표", "subs": ["UTM 이 하는 일과 구획", "우리나라의 종대·횡대와 축척계수", "UPS 좌표"]}, {"n": "4", "t": "천문좌표", "subs": ["넷을 가르는 축은 기준면 하나", "왜 측량 교재에 하늘 좌표가 나오나"]}], "link": [{"k": "목적", "html": "<p>2절이 계산의 무대(타원체)를 정했지만, 그 무대에는 아직 <strong>눈금이 없다.</strong> 1절이 측량을 &quot;점의 위치를 결정하는 일&quot;이라고 했는데, 그 위치를 적을 규약이 없으면 성과를 주고받을 수 없다. 규약이 여러 개인 것은 불편이 아니라 <strong>필연이다</strong> ― 곡면을 평면 위의 숫자로 적는 완벽한 방법이 없기 때문이다.</p>\n"}, {"k": "연결", "html": "<p>무대 위에 눈금을 그어야 한다. 곡면 위의 점을 적는 가장 자연스러운 방법은 각도다 ― 적도에서 얼마나 올라갔고 본초자오선에서 얼마나 돌았는가⁠<sup class=\"rs\">1-1</sup>. 그런데 각도는 &quot;어느 타원체 위의 각도인가&quot;를 밝히지 않으면 값이 정해지지 않는다. 그래서 좌표에는 기준 타원체가 늘 따라붙고⁠<sup class=\"rs\">1-3</sup>, 같은 지점도 기준을 바꾸면 경위도 값이 바뀐다⁠<sup class=\"rs\">1-2</sup>.</p>\n<p>각도는 적기에는 좋지만 계산에는 불편하다. 면적을 구하거나 거리를 더하려면 직각좌표가 필요하기 때문이다. 그래서 좁은 범위를 평면으로 눌러 x·y 로 적는다⁠<sup class=\"rs\">2-1</sup>. 여기서 1절의 판단이 그대로 되돌아온다 ― 넓게 누르면 오차가 커지므로 <strong>누를 수 있는 범위가 정해져 있고</strong>⁠<sup class=\"rs\">2-3</sup>, 그래서 원점을 하나로 둘 수 없어 우리나라도 넷으로 나눈다⁠<sup class=\"rs\">2-2</sup>.</p>\n<p>같은 발상을 지구 전체로 키운 것이 UTM 이다⁠<sup class=\"rs\">3</sup>. 지구를 세로 띠로 잘라 띠마다 따로 펴면, 각 띠 안에서는 평면으로 다룰 수 있다⁠<sup class=\"rs\">3-1</sup>. 대신 띠 가운데와 가장자리의 왜곡을 나눠 갖도록 축척계수를 1보다 조금 작게 준다⁠<sup class=\"rs\">3-2</sup>. 극지방은 세로 띠로 자를 수 없으니 따로 UPS 를 쓴다⁠<sup class=\"rs\">3-3</sup>.</p>\n<p>마지막으로 기준면을 땅에서 하늘로 옮기면 좌표계가 또 한 벌 나온다⁠<sup class=\"rs\">4</sup>. 넷으로 갈리지만 가르는 축은 하나뿐이다 ― <strong>무엇을 기준면으로 삼았는가</strong>⁠<sup class=\"rs\">4-1</sup>. 측량 교재에 하늘 좌표가 들어 있는 이유는 1절에서 본 천문측량 때문이다 ― 삼각망으로 이을 수 없는 기준을 별에서 가져오려면 별의 자리를 적을 규약이 필요하다⁠<sup class=\"rs\">4-2</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 각도로 적는 것과 평면으로 누르는 것은 각각 무엇을 얻고 잃는가\n② 왜 원점을 하나로 둘 수 없는가 ― 그 판단이 1절의 무엇과 같은가\n③ 좌표계를 가르는 축은 결국 무엇인가</p>\n"}}, {"subj": "측량학", "subjName": "측량학", "sid": "s-91a4ee", "unit": "측량학/지구물리측량", "name": "지구물리측량", "title": "지구 물리측량", "ch": 1, "chTitle": "측량학 개론", "ord": 4, "file": "n-46f44553d8.html", "card": {"oneline": "1~3절이 지구의 <strong>모양과 좌표</strong>를 쟀다면, 이 절은 지구 <strong>내부가 만드는 장(場)</strong> 을 재서 겉으로 안 보이는 것(지오이드의 모양·지하 물질)을 알아낸다. 재는 장이 셋이라 측량도 셋이다.", "bone": [{"n": "1", "t": "중력측량", "subs": ["중력", "중력의 측정방법", "중력의 보정", "중력이상"]}, {"n": "2", "t": "지자기 측량", "subs": ["지자기는 벡터량", "지자기 측정의 3요소"]}, {"n": "3", "t": "탄성파(지진파) 측량", "subs": ["지진파로 지하구조를 읽는다", "탄성파 측량방법"]}], "link": [{"k": "목적", "html": "<p>2절에서 지오이드가 계산의 무대와 어긋난다는 것을 보았고, 그 어긋남을 아는 방법을 두 줄로 적었다 ― 크기는 중력에서, 방향은 연직선 편차에서. <strong>그 &quot;중력에서 정한다&quot;의 실제 절차가 이 절이다.</strong> 1절의 측지학 두 갈래 표에서 물리학적 측지학에 들어 있던 셋(중력 · 지자기 · 탄성파)을 여기서 펼친다. 앞 세 절이 &quot;어디에 있나&quot;를 답했다면, 이 절은 <strong>&quot;그 아래에 무엇이 있나&quot;</strong> 를 답한다.</p>\n"}, {"k": "연결", "html": "<p>지오이드의 모양을 알려면 중력을 재야 한다. 그런데 중력은 지구가 당기는 힘만이 아니다 ― 자전 때문에 생기는 원심력이 함께 들어 있고, 그래서 위도마다 값이 다르다⁠<sup class=\"rs\">1-1</sup>. 재는 방법은 절대적으로 재느냐 어느 기준점과 견주어 재느냐로 갈린다⁠<sup class=\"rs\">1-2</sup>.</p>\n<p>여기서 문제가 하나 생긴다. 잰 자리마다 높이도 다르고 주변 지형도 달라서, 값을 그대로 늘어놓으면 서로 견줄 수가 없다. 그래서 <strong>같은 조건으로 환산하는 보정</strong>이 필요하다⁠<sup class=\"rs\">1-3</sup> ― 높이 차이를 걷어내고, 사이에 낀 흙의 무게를 빼고, 주변 산과 골의 영향을 되돌린다. 보정을 다 하고도 값이 이론값과 다르면, 남은 차이는 잰 방식 탓이 아니라 <strong>땅속에 무엇이 있기 때문</strong>이다. 그것이 중력이상이고⁠<sup class=\"rs\">1-4</sup>, 지하 자원 탐사가 여기서 나온다.</p>\n<p>같은 일을 자기장으로 하면 지자기 측량이다⁠<sup class=\"rs\">2</sup>. 다만 중력과 결정적으로 다른 점이 하나 있다 ― 중력은 늘 아래를 향하지만 <strong>자기장은 방향이 제멋대로다</strong>⁠<sup class=\"rs\">2-1</sup>. 그래서 크기 하나로는 부족하고, 어느 쪽으로 얼마나 기울었는지까지 적어야 해서 재는 값이 셋으로 늘어난다⁠<sup class=\"rs\">2-2</sup>.</p>\n<p>중력과 지자기는 둘 다 이미 있는 장을 받아 적는 일이다. 반면 탄성파 측량은 <strong>내가 파를 쏘아 보내고 돌아오는 것을 받는다</strong>⁠<sup class=\"rs\">3-1</sup>. 능동적이므로 목표 깊이를 내가 정할 수 있고, 그래서 얕은 곳을 볼 때와 깊은 곳을 볼 때 방법이 갈린다⁠<sup class=\"rs\">3-2</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 1~3절과 이 절은 관측 대상이 어떻게 다른가\n② 중력을 재면 왜 지오이드의 모양을 알게 되는가\n③ 중력은 값 하나인데 지자기는 왜 값이 셋인가</p>\n"}}, {"subj": "측량학", "subjName": "측량학", "sid": "s-91a4ee", "unit": "측량학/지구의형상과크기", "name": "지구의형상과크기", "title": "지구의 형상과 크기", "ch": 1, "chTitle": "측량학 개론", "ord": 2, "file": "n-b6d6eda8f5.html", "card": {"oneline": "실제 지구는 울퉁불퉁해서 수식이 없다. 그래서 <strong>높이는 물이 만든 면</strong>에서 재고 <strong>계산은 수식이 있는 면</strong>에서 하며, 두 면의 어긋남은 따로 관리한다. 계산용 면의 모양과 크기는 <strong>장·단반경 → 편평률·이심률 → 곡률반경</strong> 순으로 적힌다.", "bone": [{"n": "1", "t": "세 개의 면 ― 실제 지표면 · 지오이드 · 지구타원체", "subs": ["왜 면을 세 개나 쓰나", "지오이드 ― 평균해수면을 육지까지 늘인 면", "지구타원체의 세 층위", "지오이드 고 ― 두 면의 어긋남"]}, {"n": "2", "t": "타원체의 모양을 재는 두 수 ― 편평률과 이심률", "subs": ["타원의 방정식과 장·단반경", "편평률의 정의", "이심률의 정의", "지구가 타원체인 증거"]}, {"n": "3", "t": "지구의 크기와 곡률반경", "subs": ["구로 볼 때 ― 삼축반경의 산술평균", "회전타원체로 볼 때 ― 세 반경", "위도 1° 의 거리"]}], "link": [{"k": "목적", "html": "<p>1절은 지구를 반경 하나짜리 공으로 놓고 썼다. 이 절은 그 빚 둘을 갚는다. 하나는 <strong>그 반경 값이 어디서 나왔는가</strong>이고, 다른 하나는 거리·각과 달리 <strong>높이에는 물리적 기준면이 따로 필요하다</strong>는 사실이다. 지표면을 평면 도면에 옮기려면 지구의 형상과 크기를 알아야 하는데, <strong>구로 보는가 회전타원체로 보는가에 따라 곡률반경이 달라진다.</strong></p>\n"}, {"k": "연결", "html": "<p>계산을 하려면 무대가 필요하다. 그런데 실제 지표면은 울퉁불퉁해서 방정식이 없다 ― 잴 수는 있어도 그 위에서 계산할 수는 없다. 그래서 무대를 두 개 빌려 온다⁠<sup class=\"rs\">1-1</sup>. 하나는 물이 스스로 만든 면이다. 육지에 운하를 파서 바닷물을 끌어들이면 물이 멈추는 높이가 있고, 그 면이 <strong>지오이드</strong>다⁠<sup class=\"rs\">1-2</sup>. 물이 멈춘 곳이니 중력 방향에 수직이고, 그래서 <strong>높이의 기준</strong>이 된다 ― 해발 0 m 가 여기다. 그런데 지오이드도 방정식이 없다. 계산은 못 한다.</p>\n<p>그래서 두 번째 무대가 필요하다. 매끈한 수학적 면인 <strong>지구타원체</strong>다⁠<sup class=\"rs\">1-3</sup>. 방정식이 있으니 좌표와 거리를 여기서 계산한다. 1절에서 &quot;기준 회전타원체 면상에 투영한 거리&quot;라고 했던 그 면이 이것이다. 그러면 자연히 문제가 하나 남는다 ― 높이를 재는 면과 계산하는 면이 서로 다르니 둘이 어긋난다. 그 어긋남을 <strong>지오이드 고</strong>라 부르고 따로 관리한다⁠<sup class=\"rs\">1-4</sup>.</p>\n<p>계산용 면을 정했으면 그 면이 어떻게 생겼는지 적어야 한다. 타원은 장반경과 단반경 둘로 정해지므로⁠<sup class=\"rs\">2-1</sup>, 납작한 정도도 그 둘로 만든 비 하나면 된다. 그 비를 만드는 방법이 두 가지 있어서 <strong>편평률</strong>⁠<sup class=\"rs\">2-2</sup>과 <strong>이심률</strong>⁠<sup class=\"rs\">2-3</sup>이 따로 있는 것이지, 서로 다른 성질을 재는 것이 아니다. 지구가 왜 납작한지는 원인이 하나다 ― 자전이다⁠<sup class=\"rs\">2-4</sup>.</p>\n<p>모양을 적었으면 남은 것은 크기다⁠<sup class=\"rs\">3</sup>. 그런데 여기서 &quot;지구 반경&quot;이 하나로 안 정해진다. 구로 뭉개 보면 삼축반경을 평균한 값 하나가 나오고⁠<sup class=\"rs\">3-1</sup>, 이것이 1절에서 쓴 6,370 km 다. 타원체로 두면 위도와 방향마다 곡률이 달라 반경이 셋으로 갈린다⁠<sup class=\"rs\">3-2</sup>. 같은 이유로 위도 1° 에 해당하는 지표 거리도 위도에 따라 달라진다⁠<sup class=\"rs\">3-3</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 계산에 쓰는 면과 높이의 기준이 되는 면을 왜 따로 두는가, 둘은 왜 어긋나는가 ② 장·단반경만으로 납작한 정도를 적는 두 방법 ③ &quot;지구 반경&quot; 이 하나로 정해지지 않는 이유</p>\n"}}, {"subj": "측량학", "subjName": "측량학", "sid": "s-91a4ee", "unit": "측량학/측량의정의및분류", "name": "측량의정의및분류", "title": "측량의 정의 및 분류", "ch": 1, "chTitle": "측량학 개론", "ord": 1, "file": "n-139d7a5b88.html", "card": {"oneline": "측량은 점의 위치를 <strong>거리 · 방향 · 고저차</strong>로 정하는 일이다. 그런데 실제 측량 대상은 곡면이고 도면은 평면이므로, <strong>그 차이를 무시할 수 있는 범위가 어디까지인가</strong>가 측량을 두 갈래로 가른다. 가르는 기준은 거리가 아니라 <strong>요구 정밀도</strong>다.", "bone": [{"n": "1", "t": "측량의 정의와 3요소", "subs": ["측량의 정의 ― 고전과 현대", "측량의 3요소", "측량에서 말하는 거리"]}, {"n": "2", "t": "평면측량과 대지측량", "subs": ["둘을 가르는 기준", "곡면과 평면의 차를 구하는 식", "평면으로 간주되는 범위", "측지학의 두 갈래"]}, {"n": "3", "t": "그 밖의 분류 기준", "subs": ["측량 순서에 따른 분류", "목적 · 방법 · 기계에 따른 분류", "천문측량의 목적"]}], "link": [{"k": "목적", "html": "<p>측량은 점의 위치를 숫자로 만드는 일이다. 그런데 실제 측량 대상은 반경 6,370 km 의 곡면이고, 성과를 그리는 도면은 평면이다. 곡면을 평면에 옮기면 반드시 오차가 생긴다. 오차가 생기는 것 자체는 피할 수 없으므로, <strong>&quot;그 오차가 허용 오차보다 작으면 없는 것으로 본다&quot;</strong> 는 판단 기준을 세우는 것이 이 절이 하는 일이다. 이 기준이 없으면 좁은 현장에서도 곡률을 계산해야 하고, 넓은 지역은 오차가 쌓여 성과를 쓸 수 없게 된다.</p>\n"}, {"k": "연결", "html": "<p>현장에 나가 점 하나의 위치를 숫자로 남겨야 한다고 하자. 무엇을 재야 할까. 아무 양이나 재면 되는 것이 아니다 ― 거리와 방향을 알면 그 점의 수평위치가 정해지고, 고저차를 더하면 높이가 붙는다. 이 셋이면 3차원 위치가 닫히기 때문에 측량의 3요소는 거리 · 방향 · 고저차다⁠<sup class=\"rs\">1-2</sup>. 옛날에는 이 셋을 재서 도면 한 장으로 끝났지만, 지금은 대상이 우주공간까지 넓어지고 재는 양에 시 · 질량이 들어오면서 결과물도 도면이 아니라 해석이 되었다⁠<sup class=\"rs\">1-1</sup>. 위성은 초 단위로 지나가고 지각도 움직이니 &quot;언제 잰 값인가&quot;가 빠지면 성과가 무의미해진다 ― 그래서 현대 측량은 여기에 시간을 더해 4차원으로 다룬다.</p>\n<p>자, 거리를 재자. 그런데 산을 넘어 잰 길이를 그대로 쓰면 문제가 생긴다. 도면과 좌표는 수평면 위에 그려지므로, 같은 두 점이 지형에 따라 다른 값이 나오면 좌표가 닫히지 않는다. 그래서 측량에서 거리라고 하면 기준 타원체면에 투영한 수평거리다⁠<sup class=\"rs\">1-3</sup>.</p>\n<p>여기서 진짜 문제가 드러난다. 그 수평면은 평면인데 재는 대상은 반경 6,370 km 의 곡면이다. 곡면을 평면에 옮기면 반드시 오차가 생기고, 이건 피할 수 없다. 그러면 공학이 할 수 있는 일은 하나뿐이다 ― <strong>&quot;그 오차가 허용 오차보다 작으면 없는 것으로 본다&quot;</strong> 는 기준을 세우는 것. 이 판단이 측량을 두 갈래로 가른다⁠<sup class=\"rs\">2-1</sup>. 곡률을 버리면 평면측량, 세면 대지측량이고, 가르는 것은 현장의 넓이가 아니라 <strong>요구 정밀도</strong>다.</p>\n<p>그러면 그 오차가 얼마인지 알아야 한다. 같은 두 점을 곡면으로 재면 호, 수평면으로 재면 직선이 되니 그 차를 식으로 계산한다⁠<sup class=\"rs\">2-2</sup>. 식은 상대오차가 거리의 제곱에 비례하고 반경의 제곱에 반비례한다고 말한다 ― 짧으면 무시할 만하지만 길어지면 급격히 커진다. 여기에 정밀도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>/</mo><msup><mn>10</mn><mn>6</mn></msup></mrow></math></span> 을 넣고 풀면 거리 22 km, 반경 11 km, 면적 400 km² 가 나온다⁠<sup class=\"rs\">2-3</sup>. 흔히 외우는 11 km 는 기준이 아니라 이 계산의 답이다.</p>\n<p>곡률을 세기로 한 쪽은 일이 더 커진다⁠<sup class=\"rs\">2-4</sup>. 점들이 서로 어디에 있는지를 다루면 기하학적 측지학, 지구가 어떻게 생겼고 어떻게 움직이는지를 다루면 물리학적 측지학이다.</p>\n<p>마지막으로, 넓이는 측량을 나누는 여러 기준 중 하나일 뿐이다⁠<sup class=\"rs\">3</sup>. 작업 순서로 나누면 골조측량과 세부측량인데 이 순서에는 이유가 있다 ― 세부측량은 앞의 점에 이어 붙으므로 오차가 누적된다. 정밀한 기준점을 먼저 박아 두면 오차가 그 사이에 갇히고, 남은 어긋남은 구간에 배분해 없앨 수 있다⁠<sup class=\"rs\">3-1</sup>. 그 밖에 목적 · 방법 · 기계로 나눈 분류가 있고 시험은 이 기준을 섞어 놓는다⁠<sup class=\"rs\">3-2</sup>. 천문측량의 목적 다섯도 한 줄로 묶인다 ― 삼각망으로 이어 붙일 수 없는 것들의 기준을 하늘에서 가져오는 일이다⁠<sup class=\"rs\">3-3</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 3요소는 무엇이고 왜 그 셋이면 위치가 정해지는가 ② 평면측량과 대지측량을 가르는 기준 한 줄 ― 흔히 외우는 반경 값은 무엇에서 나온 숫자인가 ③ 골조측량을 먼저 하는 이유</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/Darcy의법칙", "name": "Darcy의법칙", "title": "Darcy의 법칙 (Darcy's Law)", "ch": 2, "chTitle": "흙의 투수성과 침투", "ord": 2, "file": "n-bd420be76c.html", "card": {"oneline": "흙 속의 물을 미는 것은 압력이 아니라 전수두다. 그리고 흙 속 흐름은 점성 마찰이 지배하므로 유속이 수두경사에 정확히 정비례한다 ― <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v</mi><mo>=</mo><mi>K</mi><mi>i</mi></mrow></math></span>.", "bone": [{"n": "1", "t": "수두와 동수경사", "subs": ["수두 ― 에너지를 자로 잰다", "전수두 ― 흐름을 몰고 가는 양", "동수경사 ― 구동력의 세기"]}, {"n": "2", "t": "Darcy 법칙", "subs": ["왜 유속이 동수경사에 정비례하는가", "Darcy 법칙과 전투수량", "침투속도 ― 같은 유량, 다른 단면"]}, {"n": "3", "t": "투수계수와 적용한계", "subs": ["투수계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> ― 흙과 물이 함께 만든 값", "적용범위 ― 층류에서만 성립한다", "이 절에서 남길 것"]}], "link": [{"k": "목적", "html": "<p>흙은 통로가 <strong>수십억 개</strong>라 미시 경로를 풀 수 없다 → 거시적으로 평균한 <strong>실험 법칙</strong>. 없으면 침투량·양수량·압밀시간·침투압·필터 설계가 전부 막힌다.</p>\n"}, {"k": "연결", "html": "<p>두 덩어리다. ① <strong>무엇이 미는가</strong>⁠<sup class=\"rs\">1</sup> ― 에너지를 물기둥 높이로 환산해 더한 것이 전수두, 그 차를 이동거리로 나눈 것이 동수경사. ② <strong>그래서 얼마나 흐르는가</strong>⁠<sup class=\"rs\">2</sup> ― 흙 속은 점성 지배라 유속이 구동력에 정비례(<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v</mi><mo>=</mo><mi>K</mi><mi>i</mi></mrow></math></span>)하고, 여기서 유량과 두 종류의 유속이 갈린다. 마지막으로 비례상수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 를 열어보고 이 선형관계가 깨지는 자리를 못 박는다⁠<sup class=\"rs\">3</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 압력이 아니라 전수두인가 ② 왜 제곱도 제곱근도 아닌 <strong>정비례</strong>인가 ③ <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v</mi></mrow></math></span> 와 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>v</mi><mi>s</mi></msub></mrow></math></span> 는 각각 무엇을 무엇으로 나눈 값인가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/동상", "name": "동상", "title": "동상", "ch": 2, "chTitle": "흙의 투수성과 침투", "ord": 7, "file": "n-d4285b1ad1.html", "card": {"oneline": "융기량은 원래 있던 물이 부푼 몫이 아니라 <strong>밖에서 끌어올려 얼린 몫</strong>이다. 그래서 얼음렌즈가 자라고, 봄에 그것이 녹으면 물이 갇혀 지반이 강도를 잃는다. 부푸는 것보다 <strong>녹는 것</strong>이 무섭다.", "bone": [{"n": "1", "t": "동상현상 (Frost heave)", "subs": ["얼음렌즈의 성장", "동상이 일어나는 세 조건", "동상량을 지배하는 요인"]}, {"n": "2", "t": "동결깊이와 동결지수", "subs": ["동결선과 동결깊이", "동결지수와 테레다 공식"]}, {"n": "3", "t": "토질에 따른 동상", "subs": ["왜 실트가 최악인가", "동상성 순서"]}, {"n": "4", "t": "동상의 대책과 연화현상", "subs": ["세 조건을 끊는 대책", "연화현상 (Frost boil)"]}], "link": [{"k": "목적", "html": "<p>2장 내내 따라온 물이 <strong>얼 때</strong> 무슨 일이 나는지. 노반 융기·기초 매설 깊이·해빙기 포장 파괴가 여기서 갈린다. <strong>모관상승이 없으면 동상은 팽창률만큼으로 끝난다</strong> ― 1절과 3절이 이 절에서 만난다.</p>\n"}, {"k": "연결", "html": "<p>⁠<sup class=\"rs\">1</sup> 부푸는 것은 얼음렌즈이고, 렌즈를 키우는 물은 아래에서 올라온다. 그래서 <strong>조건이 셋이고 하나만 끊어도 막힌다</strong>는 구조가 세워진다. 그러면 두 가지 양이 필요해진다 ― <strong>얼마나 깊이 얼었나</strong>⁠<sup class=\"rs\">2</sup>, <strong>어떤 흙에서 심한가</strong>⁠<sup class=\"rs\">3</sup>. 뒤의 것에서 1절(높이 오르려면 가늘어야)과 3절(제 시간에 오려면 굵어야)이 정면으로 부딪히고, <strong>곱이 최대가 되는 중간 입경</strong>이 최악이 된다. ⁠<sup class=\"rs\">4</sup> 는 끊기 ― 대책은 나열이 아니라 <strong>어느 조건을 끊는가</strong>로 묶인다. 그리고 봄의 연화가 이 절의 결론이다.</p>\n<p>끌어올려서 <strong>얼고</strong>, 녹아서 <strong>무너진다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 팽창률만으로 융기를 설명할 수 없는 이유 ② 점토도 모래도 아닌 중간이 왜 최악인가 ③ 왜 봄이 더 무서운가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/모관현상", "name": "모관현상", "title": "모관현상 (Capillarity)", "ch": 2, "chTitle": "흙의 투수성과 침투", "ord": 1, "file": "n-273e15167e.html", "card": {"oneline": "흙의 공극은 무수히 가는 관 다발이다. 가늘수록 물이 높이 오르고, 그 물은 매달려 있어 음(-)압이라 흙을 오히려 단단하게 한다.", "bone": [{"n": "1", "t": "모관상승고", "subs": ["표면장력과 접촉각", "모관상승고 공식", "Hazen 경험식", "흙 종류에 따른 상승고와 상승속도"]}, {"n": "2", "t": "모관대의 부(-)압", "subs": ["매달린 물의 공극수압", "유효응력의 증가와 겉보기 점착력"]}], "link": [{"k": "목적", "html": "<p>비도 안 왔는데 지하수면 <strong>위쪽</strong> 수 m 가 젖어 있다. 물이 <strong>중력을 거슬러</strong> 올라간 것. 설명 못 하면 막히는 것 셋: 지하수면 위 함수 상태 · 동상(frost heave) · <strong>3장 유효응력</strong>이 왜 지하수면 위에서 반대로 움직이는가.</p>\n"}, {"k": "연결", "html": "<p>모관상승은 <strong>힘의 균형 하나</strong>로 결정된다. ⁠<sup class=\"rs\">1</sup>에서 그 힘 둘(표면장력 ↔ 물기둥 무게)을 세운다. 드는 힘은 관 <strong>둘레</strong>, 버틸 무게는 관 <strong>단면적</strong>에 붙으므로 가늘어지면 무게가 훨씬 빨리 준다 ― 여기서 상승고 공식이 통째로 나온다. 흙의 공극은 원관이 아니라 지름을 못 재므로 그 자리를 잴 수 있는 값으로 바꿔 쓴 것이 Hazen 식이고, 흙 종류별 순서가 곧바로 따라 나온다. 그다음 ⁠<sup class=\"rs\">2</sup>은 <strong>올라간 물이 무엇을 하나</strong> ― 매달린 물은 눌리는 게 아니라 당겨지므로 음(-)압이고, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>σ</mi><mi>′</mi></msup><mo>=</mo><mi>σ</mi><mo>−</mo><mi>u</mi></mrow></math></span> 에서 빼는 것이 더하는 것이 되어 유효응력이 <strong>커진다.</strong></p>\n<p>모관현상은 두 문장이다 ― <strong>가늘수록 높이 오른다</strong>, 그리고 <strong>그 물은 음압이라 흙을 단단하게 한다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 가는 관일수록 높이 오르는가 ― 둘레와 단면적으로 ② 왜 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>D</mi></mrow></math></span> 대신 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi><mo>·</mo><msub><mi>D</mi><mrow><mn>10</mn></mrow></msub></mrow></math></span> 을 쓰는가 ③ 모관대의 물은 왜 음압이고 그것이 왜 유효응력을 <strong>키우는가</strong></p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/연경도에서구하는지수", "name": "연경도에서구하는지수", "title": "연경도에서 구하는 지수", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 5, "file": "n-f5397eb2a9.html", "card": {"oneline": "한계끼리 빼면 <strong>흙 자체의 성질</strong>(소성지수)이고, 그 폭 위에 자연함수비를 얹으면 <strong>지금의 상태</strong>(액성지수·연경지수)다. 나누는 것은 언제나 소성지수.", "bone": [{"n": "1", "t": "한계끼리의 차이로 만든 지수 ― 소성지수와 수축지수", "subs": ["소성지수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>p</mi></msub></mrow></math></span> ― 반죽이 유지되는 폭", "소성지수가 말해 주는 것", "수축지수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>s</mi></msub></mrow></math></span> ― 반고체 구간의 폭"]}, {"n": "2", "t": "자연함수비를 그 폭 위에 놓은 지수 ― 액성지수와 연경지수", "subs": ["액성지수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>L</mi></msub></mrow></math></span> ― 소성한계에서 얼마나 올라와 있나", "연경지수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>c</mi></msub></mrow></math></span> ― 액성한계에서 얼마나 내려와 있나", "두 지수의 합이 1"]}, {"n": "3", "t": "유동곡선의 기울기에서 나온 지수 ― 유동지수와 터프니스지수", "subs": ["유동지수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>f</mi></msub></mrow></math></span> ― 유동곡선의 기울기", "터프니스지수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>t</mi></msub></mrow></math></span>", "단위와 극한"]}], "link": [{"k": "목적", "html": "<p>자연함수비가 33 % 라는 말만 들어서는 아무 판단도 할 수 없다. 어떤 흙에서는 이미 흐르는 값이고 다른 흙에서는 아직 굳은 값이기 때문이다. 판단하려면 그 흙의 한계들과 <strong>나란히 놓고 봐야</strong> 하는데, 그 일을 매번 눈으로 하지 말고 <strong>숫자 하나로 만드는 것</strong>이 이 절이다. 이것이 없으면 9절의 소성도표와 군지수, 6절의 활성도를 계산할 수 없고, 시추한 점토가 연약한지 굳었는지 숫자로 보고할 방법도 없다.</p>\n"}, {"k": "연결", "html": "<p>시추한 점토의 자연함수비가 33 % 라는 보고를 받았다고 하자. 4절이 그 흙의 액성한계 45 %, 소성한계 25 % 를 이미 알려 주었으니 이제는 판단할 수 있다 ― 33 은 두 값 사이에 있으므로 소성 상태다. 이 &quot;나란히 놓고 보기&quot;를 숫자로 바꾸는 것이 이 절의 일이고, 그 숫자는 두 종류로 갈린다.</p>\n<p>먼저 <strong>한계끼리 빼는 데서</strong> 시작한다⁠<sup class=\"rs\">1</sup>. 소성한계와 액성한계 사이가 흙이 물러진 채 버티는 구간이니, 그 폭이 곧 그 흙이 얼마나 찰진가를 말한다. 이것이 소성지수다⁠<sup class=\"rs\">1-1</sup>. 점토분이 많을수록 물 껍질을 두껍게 두를 여지가 커서 폭이 넓어지고, 물을 많이 먹는 흙은 부피가 크게 변하고 크게 가라앉으므로 기초 지반으로 부적당하다는 결론이 그대로 따라 나온다⁠<sup class=\"rs\">1-2</sup>. 같은 방식으로 반고체 구간의 폭을 재면 수축지수가 되는데, 가운데의 소성한계가 한 번은 빼는 쪽, 한 번은 빼이는 쪽으로 쓰인다는 것만 조심하면 된다⁠<sup class=\"rs\">1-3</sup>. 이 두 값에는 <strong>자연함수비가 들어가지 않는다.</strong> 비가 와도 변하지 않으니 흙의 신분증이고, 그래서 9절의 분류에 쓸 수 있다.</p>\n<p>신분증을 만들었으면 이제 그 위에 <strong>지금의 상태를 얹는다</strong>⁠<sup class=\"rs\">2</sup>. 폭이 20 % 인데 자연함수비가 소성한계보다 8 % 위에 있다면, 이 흙은 구간의 아래에서 0.4 만큼 올라온 자리에 있다 ― 액성지수다⁠<sup class=\"rs\">2-1</sup>. 같은 자리를 반대편 끝인 액성한계에서 세면 연경지수가 되고⁠<sup class=\"rs\">2-2</sup>, 두 눈금이 같은 구간을 반대 방향으로 재기 때문에 <strong>둘을 더하면 언제나 1</strong> 이 된다⁠<sup class=\"rs\">2-3</sup>. 이 한 줄이 두 지수를 헷갈리지 않게 묶어 주고 검산까지 대신한다. 그리고 자연함수비가 구간 밖으로 나가면 값이 0 아래나 1 위로 튀는데, <strong>그 순간이 곧 판정</strong>이다.</p>\n<p>마지막 갈래만 출처가 다르다⁠<sup class=\"rs\">3</sup>. 4절의 액성한계 시험에서 우리는 유동곡선이라는 직선을 이미 그려 놓고 25 회 한 점만 읽고 버렸는데, <strong>기울기에도 정보가 있다</strong> ― 함수비가 변할 때 강도가 얼마나 빨리 변하는가. 그것이 유동지수다⁠<sup class=\"rs\">3-1</sup>. 소성지수를 유동지수로 나눈 터프니스지수는 액성한계에서 소성한계까지 가는 동안 강도가 몇 배로 커지는지를 말한다⁠<sup class=\"rs\">3-2</sup>. 여섯 지수를 다 만들었으면 단위와 극한으로 한 번씩 때려 보는 것으로 마무리하는데, 유동지수만 단위가 % 라는 것도 이 자리에서 드러난다⁠<sup class=\"rs\">3-3</sup>.</p>\n<p><strong>한계는 흙의 성질, 지수는 지금의 상태.</strong> 나누는 것은 언제나 소성지수다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 소성지수와 액성지수는 무엇이 다른가 ― 흙의 성질과 지금의 상태\n② 액성지수와 연경지수는 같은 구간을 어느 끝에서 재는가, 그래서 합이 왜 1 인가\n③ 유동지수만 출처가 다른 이유</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/유선망", "name": "유선망", "title": "유선망", "ch": 2, "chTitle": "흙의 투수성과 침투", "ord": 5, "file": "n-4ee3a8f052.html", "card": {"oneline": "2차원 침투는 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v</mi><mo>=</mo><mi>K</mi><mi>i</mi></mrow></math></span> 로 한 번에 못 푼다. 유선과 등수두선을 직교하도록, 칸이 한 모양이 되도록 그려 놓으면 침투량·수압·동수경사가 전부 <strong>칸을 세는 일</strong>로 바뀐다.", "bone": [{"n": "1", "t": "유선망 ― 무엇을 어떻게 그린 그림인가", "subs": ["기본가정과 Laplace 연속방정식", "유선과 등수두선, 그리고 그 사이", "유선망의 특성 ― 왜 칸을 한 모양으로 맞추나", "경계조건 ― 그물을 그리기 전에 네 변을 정한다"]}, {"n": "2", "t": "침투수량 ― 칸을 세어 유량을 구한다", "subs": ["한 칸에서 잃는 수두와 한 유로가 나르는 유량", "침투수량 (등방성, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K</mi><mi>h</mi></msub><mo>=</mo><msub><mi>K</mi><mi>z</mi></msub></mrow></math></span>)", "이방성 흙일 때 (<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>K</mi><mi>h</mi></msub><mo>≠</mo><msub><mi>K</mi><mi>z</mi></msub></mrow></math></span>)"]}, {"n": "3", "t": "임의의 점에서의 간극수압", "subs": ["그 점의 전수두", "위치수두 · 압력수두 · 간극수압", "어디가 가장 위험한가 ― 칸의 폭과 동수경사"]}], "link": [{"k": "목적", "html": "<p>2차원 침투는 점마다 흐름의 방향과 세기가 달라 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>i</mi><mo>=</mo><mi>h</mi><mo>/</mo><mi>L</mi></mrow></math></span> 의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>L</mi></mrow></math></span> 조차 정할 수 없다. 식 대신 <strong>그림으로 푼다.</strong> 단 그림이 답을 주려면 그리는 규칙이 있어야 한다.</p>\n"}, {"k": "연결", "html": "<p>그물을 세우고(⁠<sup class=\"rs\">1</sup> 가정·용어·특성·경계조건), 그 위에서 센다 ― 침투수량⁠<sup class=\"rs\">2</sup>과 간극수압⁠<sup class=\"rs\">3</sup>. 같은 그물이 가장 위험한 자리도 짚어 준다 → 6절.</p>\n<hr />\n"}], "check": ""}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/유효응력의개념", "name": "유효응력의개념", "title": "유효응력의 개념", "ch": 3, "chTitle": "유효응력", "ord": 1, "file": "n-ff2b548c03.html", "card": {"oneline": "흙을 누르는 힘 중 물이 받아낸 몫을 빼고 남은 것만이 입자를 밀착시킨다. 강도·침하·파괴는 전부 그 남은 몫 하나에 달려 있다.", "bone": [{"n": "1", "t": "응력의 정의", "subs": ["전응력 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi></mrow></math></span>", "간극수압 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u</mi></mrow></math></span>", "유효응력 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>σ</mi><mi>′</mi></msup></mrow></math></span>"]}, {"n": "2", "t": "상황에 따른 유효응력 계산", "subs": ["포화된 흙의 경우", "공극수압계를 설치하여 간극수압을 측정하는 경우", "지표면에 무한히 넓은 등분포하중이 작용하는 경우", "세 경우를 꿰는 한 줄"]}], "link": [{"k": "목적", "html": "<p>힘의 <strong>총합</strong>이 아니라 <strong>그 힘을 누가 받고 있는가</strong>가 갈림길. 해저지반이 안 무너지는 것과 분사현상을 한 틀로 설명한다. 없으면 4장(압축성)·5장(전단강도)·7장(사면안정)이 통째로 성립하지 않는다.</p>\n"}, {"k": "연결", "html": "<p>유효응력은 혼자 정의되지 않고 <strong>다른 두 응력의 차이로만</strong> 정의된다. 그래서 먼저 ⁠<sup class=\"rs\">1</sup> <strong>응력의 정의</strong>로 도구를 만든다 ― 갈라지기 전의 전체가 전응력, 물이 가져가는 몫이 간극수압, 빼고 남은 것이 유효응력이다. 그다음 ⁠<sup class=\"rs\">2</sup>에서 <strong>지반 상태에 따라 그 둘을 세는 방법이 달라지는</strong> 세 경우를 본다.</p>\n<p><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi></mrow></math></span> 는 <strong>세고</strong>, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>u</mi></mrow></math></span> 는 <strong>재고</strong>, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>σ</mi><mi>′</mi></msup></mrow></math></span> 은 <strong>뺀다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 세 응력이 각각 무엇을 세는 값인가 ② 왜 물이 받은 몫은 강도에 못 들어가는가 ③ 왜 물기둥이 어떤 때는 지워지고 어떤 때는 안 지워지는가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/입도분포곡선", "name": "입도분포곡선", "title": "입도분포곡선 (입경가적곡선, Grain-Size Distribution)", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 8, "file": "n-16f30fef06.html", "card": {"oneline": "곡선 한 장에서 읽은 세 개의 입경으로 두 개의 계수를 만들어, 이 흙의 섞임이 좋은가(양입도)를 숫자로 판정한다.", "bone": [{"n": "1", "t": "입경가적곡선", "subs": ["반대수 용지 위의 누적곡선", "곡선이 놓인 자리 ― 조립토와 세립토", "삼각좌표 분류", "곡선에서 읽는 세 입경"]}, {"n": "2", "t": "두 계수와 입도의 판정", "subs": ["균등계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C</mi><mi>u</mi></msub></mrow></math></span>", "곡률계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>C</mi><mi>g</mi></msub></mrow></math></span>", "양입도 · 빈입도 · 갭입도 판정"]}], "link": [{"k": "목적", "html": "<p>입도분석의 결과(원자료)를 공학적 판단으로 번역하는 다리다. 흙을 쓸 때 정말 알고 싶은 것은 둘 ― <strong>물이 잘 통하나</strong>(댐 심벽·필터·배수층), <strong>다지면 단단해지나</strong>(도로·제방 성토). 그런데 두 답을 지배하는 것은 알갱이 하나의 크기가 아니라 크기들의 <strong>섞임</strong>이다. 그 섞임을 눈으로 보고 숫자로 재는 방법이 이 절이고, 이것이 없으면 9절 통일분류법이 통째로 성립하지 않는다.</p>\n"}, {"k": "연결", "html": "<p>같은 모래를 두 통 받았는데 하나는 물이 콸콸 빠지고 다른 하나는 다져도 물이 잘 안 통한다고 하자. 7절이 만든 표를 보면 둘 다 &quot;모래&quot;이고 알갱이 크기도 겹친다. 갈린 것은 크기가 아니라 <strong>크기들이 섞인 방식</strong>이다.</p>\n<p>먼저 원자료를 그림으로 옮긴다⁠<sup class=\"rs\">1-1</sup>. 입경이 수만 배 차이라 산술 눈금에 그리면 잔 알갱이가 원점 쪽에 뭉개지므로, 가로축만 대수로 편 반대수 용지에 그린다. 세로에는 &quot;그보다 작은 것이 몇 % 인가&quot;를 <strong>누적</strong>해 올리는데, 누적이라는 사실 하나에서 곡선의 성질이 따라 나온다 ― 내려올 수가 없으니 중간에 요철이 생기지 않는다.</p>\n<p>곡선이 그려지면 읽을 것이 둘이다. 첫째는 <strong>곡선이 놓인 자리</strong>다⁠<sup class=\"rs\">1-2</sup>. 가로축의 어느 구간에 무게가 몰렸는지가 곧 자갈·모래·실트·점토의 함유율이고, 그것이 조립토냐 세립토냐를 가른다. 이 둘은 물이 빠지는 속도부터 버티는 방식까지 성질이 통째로 갈린다 ― 조립토는 마찰로, 세립토는 점착으로 버틴다. 성분비만으로 흙 이름을 매기는 삼각좌표 분류도 있지만 크기만 볼 뿐 연경도를 반영하지 못해 공학에서는 잘 쓰지 않는다⁠<sup class=\"rs\">1-3</sup>. 둘째로 읽을 것은 <strong>곡선의 모양</strong>인데, 모양은 통째로 전할 수 없으니 대표점 셋으로 요약한다⁠<sup class=\"rs\">1-4</sup>. 그중 가장 잔 쪽 대표를 유효입경이라 따로 부르는 것은 물의 흐름을 <strong>가장 좁은 통로</strong>가 지배하기 때문이고, 그래서 투수계수 추정식이 그 값의 제곱으로 세워진다.</p>\n<p>하필 셋을 고른 이유는 다음 단계에서 드러난다⁠<sup class=\"rs\">2</sup>. 모양에서 궁금한 것이 정확히 둘이기 때문이다 ― <strong>얼마나 넓게 퍼졌나</strong>와 <strong>중간이 매끄럽게 이어졌나.</strong> 앞의 것은 굵은 쪽 대표를 잔 쪽 대표로 나눈 균등계수가 되고⁠<sup class=\"rs\">2-1</sup>, 뒤의 것은 그 사이에 세 번째 점을 끼워 만든 곡률계수가 된다⁠<sup class=\"rs\">2-2</sup>. 곡률계수의 정체는 가운데 점이 양 끝의 기하평균에 얼마나 가까운가이므로, 기준값 1~3 도 외운 숫자가 아니라 그 결과다. 두 계수가 각각 다른 결함을 잡으므로 <strong>둘 다 통과해야</strong> 양입도다⁠<sup class=\"rs\">2-3</sup>. 그리고 왜 넓게 퍼진 흙이 좋은 흙인지는 계수 이전에 알갱이 충전 그림 한 장에서 이미 정해져 있다 ― 큰 알갱이의 틈을 작은 알갱이가 메우면 촘촘하고 단단해지지만, <strong>바로 그 때문에 물은 안 통한다.</strong></p>\n<p>곡선은 <strong>그리고</strong>, 세 입경은 <strong>읽고</strong>, 두 계수는 <strong>나눈다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 가로축만 대수눈금이고, 왜 곡선에 요철이 생길 수 없는가\n② 모양에서 볼 것이 왜 &quot;퍼짐&quot;과 &quot;중간&quot; 둘인가\n③ 골고루 섞인 흙은 왜 물이 <strong>안</strong> 통하는가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/투수계수", "name": "투수계수", "title": "투수계수", "ch": 2, "chTitle": "흙의 투수성과 침투", "ord": 3, "file": "n-1797b3b2eb.html", "card": {"oneline": "2절은 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 를 비례상수로만 두고 끝냈다. 열어보면 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 는 흙만의 성질이 아니다 ― 물의 점성·온도와 흙의 구조(간극비·입경·형상·포화도)가 함께 정한다. 그래서 재는 방법도 흙 종류로 갈린다.", "bone": [{"n": "1", "t": "투수계수를 정하는 것들", "subs": ["투수계수의 정체", "간극비", "물의 점성과 온도 보정", "식에 안 보이는 것들"]}, {"n": "2", "t": "실내 투수시험 ― 흙 종류가 시험법을 정한다", "subs": ["왜 하나의 시험으로 안 되나", "정수위 투수시험 (Constant head test)", "변수위 투수시험 (Falling head test)", "압밀시험"]}, {"n": "3", "t": "현장 투수시험과 경험공식", "subs": ["양수시험", "Hazen 경험공식", "이 절에서 남길 것"]}], "link": [{"k": "목적", "html": "<p>2절의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>v</mi><mo>=</mo><mi>K</mi><mi>i</mi></mrow></math></span> 에 넣을 <strong>숫자</strong>가 없으면 침투량·압밀시간·필터 재료·양수량이 전부 막힌다. 그런데 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 는 흙의 성질과 물의 성질이 겹쳐 있고, 흙마다 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mn>10</mn><mrow><mn>10</mn></mrow></msup></mrow></math></span> 배 차이가 난다 → 환산이 둘 필요하고, 시험법이 셋으로 갈린다.</p>\n"}, {"k": "연결", "html": "<p>세 덩어리다. ① <strong><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 안을 연다</strong>⁠<sup class=\"rs\">1</sup> ― 식의 생김새에서 간극비 환산과 온도 환산이 곧바로 따라 나온다. ② <strong>그래도 계산은 안 된다 → 잰다</strong>⁠<sup class=\"rs\">2</sup> ― 재려는 양이 너무 작아지면 다른 양으로 바꿔 잰다는 한 줄기가 시험법 셋을 만든다. ③ <strong>실내가 놓친 것을 현장에서 메운다</strong>⁠<sup class=\"rs\">3</sup> ― 교란·대표성·흐름방향. 마지막으로 입도만으로 어림하는 지름길.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 가 흙만의 성질이 아니라는 근거를 식에서 짚기 ② 왜 기준 온도로 환산하나 ③ 정수위와 변수위가 갈리는 이유 ― 무엇을 재고 무엇을 못 재나</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/평균투수계수", "name": "평균투수계수", "title": "비균질 토층의 평균투수계수", "ch": 2, "chTitle": "흙의 투수성과 침투", "ord": 4, "file": "n-faa1083398.html", "card": {"oneline": "물은 게으르다. 층이 여럿이면 <strong>흐름 방향에 따라 값을 정하는 층이 달라지고</strong>, 여러 층을 하나로 묶는 평균의 방식도 방향마다 달라진다.", "bone": [{"n": "1", "t": "수평방향 평균투수계수", "subs": ["무엇이 층마다 같은가", "하나의 등가 층으로 묶기", "계산과 함정"]}, {"n": "2", "t": "수직방향 평균투수계수", "subs": ["이번엔 무엇이 같은가", "하나의 등가 층으로 묶기", "계산과 함정"]}, {"n": "3", "t": "이방성과 등가등방성 투수계수", "subs": ["방향에 따라 값이 다른 이유", "등가등방성 투수계수", "방향에 따른 크기의 대소"]}, {"n": "4", "t": "비균질 토층을 통과하는 유수", "subs": ["경계면에 경사지게 침투하는 경우", "경계면에 수직으로 침투하는 경우"]}], "link": [{"k": "목적", "html": "<p>실제 지반은 켜켜이 층이 쌓여 만들어진다. 층마다 다른 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 를 늘어놓아서는 다음 계산이 안 된다. <strong>여러 층 → 등가 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 하나.</strong> 단 그 하나가 방향에 따라 다르다.</p>\n"}, {"k": "연결", "html": "<p>갈림길은 하나다. 물이 <strong>길을 고를 수 있는가</strong>(⁠<sup class=\"rs\">1</sup> 수평) 없는가(⁠<sup class=\"rs\">2</sup> 수직). 여기서 두 공식이 갈라져 나오고, 둘을 비교하면 방향에 따른 성질·등가값·대소 관계가 따라 나온다⁠<sup class=\"rs\">3</sup>. 마지막이 층 경계를 지나는 순간의 굴절⁠<sup class=\"rs\">4</sup> ― 5절 유선망으로 이어진다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 방향에 따라 지배하는 층이 달라지는가 ② 수평·수직에서 각각 무엇이 더해지는가 ③ 왜 굳이 하나로 묶나</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/활성도와점토광물", "name": "활성도와점토광물", "title": "활성도와 점토광물", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 6, "file": "n-b93fa82740.html", "card": {"oneline": "점토가 물을 얼마나 강하게 붙잡는가는 <strong>광물의 결정구조</strong>가 정하고, 그 결과는 <strong>활성도라는 수 하나</strong>로 잡힌다.", "bone": [{"n": "1", "t": "활성도 (Activity)", "subs": ["활성도 ― 왜 분모가 점토 함유율인가", "활성도에 따른 점토의 분류와 성질", "활성도로 광물을 되짚기 ― 교재 핵심문제 2"]}, {"n": "2", "t": "점토광물의 구조", "subs": ["쉬트 ― 두 기본단위와 세 판", "3대 점토광물의 결정격자 ― 층 사이를 무엇이 묶는가", "동형이질치환 ― 점토 표면이 음전하를 띠는 이유", "그 밖의 점토광물 ― 헬로이사이트 · 질석 · 벤토나이트"]}, {"n": "3", "t": "물과 얽힌 그 밖의 성질", "subs": ["물이 드나들며 생기는 현상 ― Bulking · Swelling · 비화작용", "원심함수당량 (CME) ― 보수력을 숫자로 재기", "단위와 극한으로 때려보기"]}], "link": [{"k": "목적", "html": "<p>소성지수는 흙 <strong>전체</strong>의 찰기라서, 같은 값이 나와도 점토가 많아서인지 광물이 활발해서인지 구별하지 못한다. 전체 효과를 <strong>점토가 들어 있는 양으로 나누면</strong> 알갱이 하나의 성질이 남는다. 그 값이 크다는 것은 물을 층 사이까지 받아들인다는 뜻이므로 곧 부피가 크게 변한다는 예고이고, 그래서 활성도는 <strong>흙의 팽창성 판단 기준</strong>이 된다 ― 활주로·도로 재료 판정이 그 자리다.</p>\n"}, {"k": "연결", "html": "<p>두 시료의 소성지수가 똑같이 20 % 로 나왔다고 하자. 그런데 하나는 흙 무게의 40 % 가 점토이고, 다른 하나는 15 % 만 점토다. 같은 찰기를 내는 데 한쪽은 점토를 두 배 반 넘게 쓴 셈이니, 점토를 적게 쓴 쪽의 점토가 훨씬 활발한 광물이라는 뜻이다. 소성지수만으로는 이 차이를 구별할 수 없다.</p>\n<p>구별하려면 전체 효과를 <strong>점토가 들어 있는 양으로 나누면</strong> 된다⁠<sup class=\"rs\">1-1</sup>. 여기서 분모가 흙 전체 무게가 아니라 점토 함유율이어야 한다는 점이 결정적이다 ― 전체로 나누면 늘 100 으로 나누는 셈이라 값이 묽어지기만 하고 광물 정보는 남지 않는다. 점토만으로 나누어야 알갱이 하나당 찰기가 되고, 그때 비로소 그래프에서 원점을 지나는 직선의 기울기, 곧 광물의 성질이 된다. 그 값이 크면 물을 층 사이까지 받아들인다는 뜻이라 부피가 크게 변하므로, 활성도는 팽창성 판정의 기준이 되어 활주로·도로 재료 판단에 쓰인다⁠<sup class=\"rs\">1-2</sup>. 시험은 거꾸로 소성지수와 점토 함유율을 주고 광물을 되짚게 하는데, 순서는 언제나 소성지수 → 활성도 → 판정이다⁠<sup class=\"rs\">1-3</sup>.</p>\n<p>그런데 왜 광물마다 값이 다른가. 답은 <strong>결정구조</strong>에 있다⁠<sup class=\"rs\">2</sup>. 점토광물은 모두 얇은 판이 겹친 결정체이고, 그 판은 규산 사면체와 알루미나 팔면체라는 두 기본단위로 만들어진다⁠<sup class=\"rs\">2-1</sup> ― 입자가 판상인 이유가 여기서 나온다. 갈림길은 둘뿐이다. <strong>한 단위가 판 몇 장인가</strong>, 그리고 <strong>그 단위 사이를 무엇이 묶는가</strong>⁠<sup class=\"rs\">2-2</sup>. 두 장이 수소결합으로 맞붙으면 층이 벌어지지 않고, 세 장 사이에 빠져나가지 않는 칼륨이 못처럼 박혀도 역시 벌어지지 않는다. 그런데 같은 세 장인데 사이를 묶은 것이 <strong>바뀔 수 있는 양이온</strong>이면 그 틈으로 물이 드나든다. 이 하나로 팽창성과 결합력이 갈리고, <strong>활성도 순서가 여기서 그대로 따라 나온다.</strong> 층 사이에 왜 양이온이 앉아 있는지도 같은 자리에서 풀린다 ― 격자 안쪽에서 원자가 비슷한 크기의 다른 원자로 치환되며 남긴 음전하를 메우러 온 것이다⁠<sup class=\"rs\">2-3</sup>. 1절의 이중층, 4절의 연경도, 5절의 소성지수가 전부 이 음전하에서 출발한 것이었다. 나머지 광물들도 같은 두 기준으로 읽으면 된다⁠<sup class=\"rs\">2-4</sup>.</p>\n<p>마지막으로 <strong>물이 드나들며 생기는 현상과, 물을 붙잡는 힘의 측정</strong>을 모은다⁠<sup class=\"rs\">3</sup>. 모래가 부푸는 것과 점토가 부푸는 것은 원인이 다르고, 점토가 중간 단계를 건너뛰고 갑자기 무너지는 것이 비화작용이다⁠<sup class=\"rs\">3-1</sup>. 그리고 그 흙이 물을 얼마나 세게 붙들고 있는지는 <strong>원심력으로 짜내고 남은 함수비</strong>로 잰다⁠<sup class=\"rs\">3-2</sup>. 이 값이 크면 물이 흐르지 못하니 불투수이고, 흐르지 못하는 물은 그 자리에서 얼어 동상을 일으킨다. 단위와 극한으로 때려 보면 활성도가 왜 무차원인지, 모래에서는 왜 아예 정의되지 않는지가 확인된다⁠<sup class=\"rs\">3-3</sup>.</p>\n<p><strong>소성지수는 흙 전체의 찰기, 활성도는 점토 알갱이 하나의 활발함.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 분모가 왜 흙 전체 무게가 아니라 점토 함유율인가\n② 세 광물의 활성도 순서가 결정구조에서 어떻게 따라 나오는가\n③ 활성도가 크다는 것이 공학적으로 무엇을 뜻하는가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙댐에서의침투", "name": "흙댐에서의침투", "title": "흙 댐에서의 침투", "ch": 2, "chTitle": "흙의 투수성과 침투", "ord": 6, "file": "n-70ce063719.html", "card": {"oneline": "흙 댐은 물을 막는데 <strong>물이 몸통을 통과한다.</strong> 5절과 달리 그물의 위쪽 경계(자유수면)가 처음부터 정해져 있지 않다. 그 선을 먼저 작도하고, 그다음에 유선망을 그린다.", "bone": [{"n": "1", "t": "침윤선과 제체의 경계조건", "subs": ["침윤선 ― 제체 안 흐름의 최상부 유선", "제체의 경계조건 ― 네 변을 먼저 가른다", "침투유량 ― 왜 침윤선을 먼저 그리나"]}, {"n": "2", "t": "침윤선의 작도 ― 기본포물선과 두 번의 보정", "subs": ["초점의 결정", "기본포물선의 작도", "상류측 보정과 하류측 보정"]}, {"n": "3", "t": "필터 ― 침윤선을 낮추고 흙을 잡아 두는 층", "subs": ["필터의 조건", "필터의 설계 (NAVFAC, 1971)", "침윤선이 하류 사면으로 나오면 ― 내부세굴과 그 대책"]}], "link": [{"k": "목적", "html": "<p>널말뚝 문제는 그물을 가둘 네 변이 그림에 다 있었다. 흙 댐은 젖은 부분과 마른 부분의 경계를 <strong>흐름이 스스로 만든다</strong> ― 그물의 뚜껑이 미지수다. 뚜껑을 모르면 칸을 못 그리고, 칸이 없으면 5절 식을 쓸 자리가 없다.</p>\n"}, {"k": "연결", "html": "<p>미지의 그 면에 이름과 성질을 준다(⁠<sup class=\"rs\">1</sup> 침윤선·경계조건) → 포물선이라 가정해 그리고 양 끝을 고친다⁠<sup class=\"rs\">2</sup> → 그 선이 하류 사면으로 나오지 않게 막는다(⁠<sup class=\"rs\">3</sup> 필터·코어·차수판).</p>\n<hr />\n"}], "check": ""}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의각성분의상관관계", "name": "흙의각성분의상관관계", "title": "흙의 각 성분의 상관관계", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 2, "file": "n-21c08856e4.html", "card": {"oneline": "3상을 재는 잣대 다섯은 <strong>서로 독립이 아니다.</strong> 몇 개만 알면 나머지가 따라 나오고, 그 다리가 <strong>포화도 × 간극비 = 비중 × 함수비</strong> 다.", "bone": [{"n": "1", "t": "3상을 재는 양들", "subs": ["3상 모형과 세는 규칙", "부피로 재는 양 ― 간극비 · 간극률 · 포화도", "무게로 재는 양 ― 함수비 · 함수율", "부피와 무게를 잇는 하나 ― 비중"]}, {"n": "2", "t": "관계식 ― 몇 개에서 나머지를 만든다", "subs": ["흙 입자 부피를 1 로 놓는다", "분모를 바꾸는 환산 ― <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi><mo>↔</mo><mi>n</mi></mrow></math></span>, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w</mi><mo>↔</mo><msup><mi>w</mi><mi>′</mi></msup></mrow></math></span>", "부피와 무게를 잇는 다리", "부피가 변하면 ― 체적 변화와 간극비"]}], "link": [{"k": "목적", "html": "<p>현장에서 잴 수 있는 것은 무게뿐이다. 젖은 채로 한 번, 말려서 한 번. 그런데 설계에서 알고 싶은 것은 <strong>간극이 얼마나 남았는가</strong>, 곧 부피다. 잴 수 있는 것과 알고 싶은 것이 어긋나 있으니 그 사이를 잇는 환산식이 필요하고, 그것을 만드는 자리가 이 절이다. 이 절이 없으면 3절의 단위중량 넷과 3장의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span>, 4장의 압밀침하식이 전부 근거 없는 암기식이 된다.</p>\n"}, {"k": "연결", "html": "<p>시료를 받아 저울에 올리면 나오는 숫자는 무게 둘뿐이다 ― 젖은 무게와 110 ℃ 에 말린 무게. 이것으로 &quot;간극이 얼마나 남았나&quot;에 답해야 한다.</p>\n<p>먼저 흙을 세는 규칙부터 정한다⁠<sup class=\"rs\">1-1</sup>. 흙은 알갱이·물·공기의 3상인데 <strong>부피는 세 칸이고 무게는 두 칸</strong>이다 ― 공기의 무게는 물의 800분의 1 수준이라 버리기 때문이다. 이 비대칭 때문에 부피로 재는 잣대와 무게로 재는 잣대를 따로 세워야 한다.</p>\n<p>잣대는 부피 쪽에 셋, 무게 쪽에 둘이다⁠<sup class=\"rs\">1-2</sup>⁠<sup class=\"rs\">1-3</sup>. 분자는 서로 비슷하고 <strong>다른 것은 분모뿐</strong>이다. 간극비와 함수비는 분모가 입자만이고, 간극률과 함수율은 전체이고, 포화도는 간극이다. 시험에서 묻는 함정이 전부 여기서 나온다 ― 분모가 자기를 품는 전체면 값이 100 % 를 넘을 수 없고, 분모가 입자만이면 얼마든지 넘을 수 있다. 간극비가 1 을 넘어도 되는 것과 함수비가 수백 % 까지 가는 것이 같은 이유다.</p>\n<p>그런데 부피 잣대와 무게 잣대는 서로 말이 통하지 않는다. 둘을 잇는 환율이 있어야 하고, 그것이 <strong>비중</strong>이다⁠<sup class=\"rs\">1-4</sup>. 비중은 입자만의 단위중량을 물의 단위중량으로 나눈 값이라, 뒤집어 읽으면 부피 1 을 무게로 바꿔 주는 값이 된다.</p>\n<p>환율까지 갖췄으면 관계식을 만들 수 있다⁠<sup class=\"rs\">2</sup>. 요령은 하나다. 다섯 잣대가 전부 비율이라 크기를 마음대로 정해도 값이 안 변하니, <strong>물이 드나들어도 변하지 않는 입자 부피를 1 로 놓는다</strong>⁠<sup class=\"rs\">2-1</sup>. 그러면 삼상도의 모든 칸이 간극비·포화도·함수비·비중으로 적힌다. 그 뒤로는 그림을 읽기만 하면 된다. 분모만 바꾸는 환산이 언제나 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>x</mi></mrow></mfrac></mrow></math></span> 꼴인 이유가 눈에 보이고⁠<sup class=\"rs\">2-2</sup>, 물의 무게를 부피 쪽으로 한 번 무게 쪽으로 한 번 세어 같다고 놓으면 <strong>포화도 × 간극비 = 비중 × 함수비</strong>라는 다리가 그 자리에서 나온다⁠<sup class=\"rs\">2-3</sup>. 넷 중 셋을 주고 하나를 묻는 문제는 거의 이 식이다.</p>\n<p>마지막으로 흙이 눌리는 경우를 본다. 눌려도 알갱이는 줄지 않고 <strong>간극만 준다.</strong> 그러니 부피 변화는 곧 간극비의 변화이고, 전체 부피가 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>+</mo><mi>e</mi></mrow></math></span> 였으므로 변화율도 그 자리에서 나온다⁠<sup class=\"rs\">2-4</sup>. 4장의 압밀침하가 이 식이다.</p>\n<p><strong>재는 것은 무게, 알고 싶은 것은 부피.</strong> 그 사이를 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>G</mi><mi>s</mi></msub></mrow></math></span> 가 잇는다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 다섯 잣대의 분모가 각각 무엇인가, 그리고 100 % 를 넘을 수 있는 것은 어느 것인가\n② 부피와 무게 사이에 왜 비중이 끼어야 하는가\n③ <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>s</mi></msub><mo>=</mo><mn>1</mn></mrow></math></span> 로 놓으면 무엇이 편해지는가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의공학적분류방법", "name": "흙의공학적분류방법", "title": "흙의 공학적 분류방법", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 9, "file": "n-3a001b76aa.html", "card": {"oneline": "체로 <strong>굵기</strong>를 자르고 물 두 값으로 <strong>찰기</strong>를 재서, 그 둘을 <strong>두 글자 기호</strong>(GW · SM · CH …)로 압축한다. 기호 하나가 곧 그 흙의 거동 예보다.", "bone": [{"n": "1", "t": "분류의 두 축 ― 굵기와 찰기", "subs": ["체 ― 굵기를 자르는 칸막이", "굵은 쪽의 잣대 ― 입도", "가는 쪽의 잣대 ― 연경도와 소성도표"]}, {"n": "2", "t": "통일분류법 (USCS)", "subs": ["기호 두 글자 읽는 법", "분류 기호표 ― 열다섯 개의 기호", "판정 순서와 이중기호"]}, {"n": "3", "t": "AASHTO 분류법", "subs": ["도로의 언어 ― 무엇이 다른가", "군지수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G</mi><mi>I</mi></mrow></math></span>", "A-1 ~ A-7 분류표"]}], "link": [{"k": "목적", "html": "<p>같은 '흙'이라도 강바닥 자갈과 논바닥 진흙은 <strong>완전히 다른 재료</strong>다. 그런데 &quot;이 흙 좀 무른데요&quot;라는 현장 말로는 듣는 사람마다 다른 그림을 떠올린다. 그래서 <strong>측정 가능한 소수의 값</strong>만 재서 기호로 묶는다. 기호 하나로 거동을 예측하는 <strong>통신 코드</strong>이지 암기 게임이 아니다. 이것이 없으면 &quot;N치·함수비&quot; 같은 날것의 숫자가 &quot;이 층은 CH니 압밀침하를 검토한다&quot;는 <strong>설계 판단</strong>으로 번역되지 않는다.</p>\n"}, {"k": "연결", "html": "<p>시추 보고서에 &quot;무른 흙&quot;이라고만 적혀 있으면 읽는 사람마다 다른 그림을 떠올린다. 그런데 흙에서 실제로 잴 수 있는 것은 몇 개 되지 않는다 ― 체를 몇 % 통과했나, 물을 얼마나 먹으면 물러지나. 그 몇 개만으로 흙의 성격을 압축해 전달하는 코드를 만드는 것이 이 절이다.</p>\n<p>먼저 <strong>무엇으로 가를 것인가</strong>부터 정한다⁠<sup class=\"rs\">1-1</sup>. 알갱이를 크기 순으로 늘어놓으면 연속 스펙트럼인데, 체로 칸막이를 치면 굵은 쪽과 가는 쪽이 갈린다. 그 칸막이 중 No.200 이 특별한 것은 그 크기가 <strong>눈과 손의 한계</strong>이고, 그 지점이 공학적 거동이 갈리는 지점과 거의 일치하기 때문이다. 그리고 두 쪽은 <strong>버티는 원리가 다르다</strong> ― 굵은 쪽은 맞물린 마찰로 버티고, 가는 쪽은 표면이 물을 붙잡는 힘이 지배한다. 그래서 잣대는 하나일 수 없고 둘이어야 한다. 8절의 삼각좌표가 공학용에서 밀린 이유도 여기서 설명된다 ― 크기만 보고 찰기를 못 보기 때문이다.</p>\n<p>굵은 쪽 잣대는 8절이 이미 만들어 두었다⁠<sup class=\"rs\">1-2</sup>. 세 대표 입경에서 나온 두 계수가 분포의 폭과 곡선의 매끈함을 재고, 둘 다 만족해야 입도가 양호하다. 자갈과 모래의 기준이 다른 것은 자갈은 조금만 섞여도 틈이 메워지지만 모래는 더 다양한 크기가 있어야 촘촘해지기 때문이다. 가는 쪽 잣대는 4·5절이 만들어 두었다⁠<sup class=\"rs\">1-3</sup>. 세립토는 전부 No.200 을 통과해 입도곡선이 왼쪽에 뭉치므로, 대신 액성한계와 소성지수를 두 축으로 놓은 <strong>소성도표</strong> 위에 찍는다. 그 위의 선 셋이 각각 다른 물음에 답한다 ― A선은 무엇으로 찰진가, B선은 얼마나 먹는가, U선은 그 값이 애초에 가능한가.</p>\n<p>잣대가 서면 기호를 찍는다⁠<sup class=\"rs\">2</sup>. 통일분류법은 <strong>첫 글자에 주된 입자를, 둘째 글자에 그 흙의 성격을</strong> 담아 두 글자로 압축한다⁠<sup class=\"rs\">2-1</sup>. 첫 글자는 체가 정하고 둘째 글자는 두 잣대가 정하므로, <strong>읽는 법만 알면 열다섯 개의 기호표가 매번 다시 만들어진다</strong>⁠<sup class=\"rs\">2-2</sup>. 표를 통째로 외우면 경계에 걸린 흙에서 무너지는데, 걸릴 축이 굵기와 찰기 둘뿐이라 이중기호가 나오는 경우도 딱 둘이다⁠<sup class=\"rs\">2-3</sup>.</p>\n<p>같은 재료로 다른 언어도 만들 수 있다⁠<sup class=\"rs\">3</sup>. 도로 노반만 따지는 쪽은 세립분이 조금만 들어와도 곤란하므로 세립토 문턱을 더 낮게 잡았다⁠<sup class=\"rs\">3-1</sup>. 그리고 &quot;쓸 만한가&quot;를 숫자 하나로 듣고 싶어 하니, 세립분의 <strong>양</strong>과 그 세립분의 <strong>질</strong>을 곱해 벌점으로 합산한 군지수를 얹었다⁠<sup class=\"rs\">3-2</sup> ― 많으면서 찰지기까지 한 흙이 훨씬 나쁘다는 상승효과가 그 곱셈 항에 들어 있다. 마지막 분류표의 번호는 세립분이 적은 순서가 아니라 <strong>노반으로 좋은 순서</strong>이고, 그래서 번호만 들어도 판단이 선다⁠<sup class=\"rs\">3-3</sup>. 두 체계가 다른 것은 흙이 달라서가 아니라 <strong>묻는 질문이 달라서</strong>다.</p>\n<p>굵기는 <strong>자르고</strong>, 찰기는 <strong>재고</strong>, 기호는 <strong>찍는다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 잣대가 하나가 아니라 둘이어야 하는가\n② 두 글자에서 첫 글자·둘째 글자는 각각 무엇이 정하는가\n③ 조립·세립 경계가 왜 USCS 50 %, AASHTO 35 % 로 다른가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의단위중량", "name": "흙의단위중량", "title": "흙의 단위중량", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 3, "file": "n-5978634731.html", "card": {"oneline": "단위중량은 하나가 아니다. <strong>분모는 넷 다 전체 부피 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V</mi></mrow></math></span> 로 같고, 분자에 무엇을 무게로 세느냐</strong>로 습윤·건조·포화·수중이 갈린다.", "bone": [{"n": "1", "t": "네 가지 단위중량 ― 분모는 같고 분자가 다르다", "subs": ["단위중량 ― 분모는 언제나 전체 부피", "습윤단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>t</mi></msub></mrow></math></span> · 건조단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>d</mi></msub></mrow></math></span>", "포화단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span> · 수중단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "다섯의 대소"]}, {"n": "2", "t": "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>G</mi><mi>s</mi></msub></mrow></math></span> 로 표현하기 ― 한 그림에서 넷을 만든다", "subs": ["흙 입자 부피를 1 로 놓는다", "분자만 갈아 끼운다 ― 분모는 넷 다 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>+</mo><mi>e</mi></mrow></math></span>", "식들 사이의 지름길", "단위와 극한", "확인용 계산"]}, {"n": "3", "t": "상대밀도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>D</mi><mi>r</mi></msub></mrow></math></span> ― 같은 흙이 얼마나 촘촘히 쌓였나", "subs": ["왜 필요한가, 왜 사질토뿐인가", "정의와 두 표현", "판정과 시험 방법"]}], "link": [{"k": "목적", "html": "<p>2절이 만든 잣대 다섯은 전부 비(ratio)라서 <strong>무게가 없다.</strong> 그런데 설계가 요구하는 것은 힘이다 ― 깊이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Z</mi></mrow></math></span> 인 점의 연직응력, 옹벽에 걸리는 토압, 사면을 미끄러뜨리는 활동력. 전부 <strong>&quot;이 흙 1 m³ 이 몇 kN 인가&quot;</strong> 를 알아야 첫 줄이 써진다. 게다가 같은 흙이라도 비 온 뒤와 마른 뒤가 다르고 지하수위 위와 아래가 다르므로, 단위중량은 하나로 정의될 수 없고 네 가지 이름이 필요해진다. 이 절이 없으면 3장의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi><mo>=</mo><mi>γ</mi><mi>Z</mi></mrow></math></span> 와 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>σ</mi><mi>′</mi></msup><mo>=</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub><mi>h</mi></mrow></math></span>, 8장의 다짐관리가 전부 시작되지 않는다.</p>\n"}, {"k": "연결", "html": "<p>지하 8 m 지점의 흙이 위쪽 흙에 얼마나 눌리는지를 계산해야 한다고 하자. 필요한 것은 &quot;이 흙 1 m³ 이 몇 kN 인가&quot; 하나인데, 손에 있는 것은 2절이 만든 비율뿐이라 무게가 안 나온다. 게다가 그 8 m 중 위쪽 3 m 는 지하수위 위, 아래 5 m 는 물에 잠겨 있다면 같은 흙이라도 무게가 달라진다.</p>\n<p>먼저 이 값이 무엇을 재는 값인지부터 못 박는다⁠<sup class=\"rs\">1-1</sup>. 분모는 언제나 <strong>간극까지 포함한 전체 부피</strong>다. 2절과 정반대 구조라는 것을 눈여겨 둘 만하다 ― 2절은 분자가 비슷하고 분모가 제각각이었는데, 여기서는 분모가 하나로 고정되고 분자만 갈린다. 그러니 넷을 따로 외울 것이 아니라 &quot;이 이름은 무엇을 무게로 세는가&quot; 한 줄만 갈라 읽으면 된다.</p>\n<p>물까지 전부 세면 습윤이고, 알갱이만 세면 건조다⁠<sup class=\"rs\">1-2</sup>. 건조단위중량은 분자에서만 물을 뺐기 때문에 함수비에 흔들리지 않고 <strong>알갱이가 얼마나 촘촘한지만</strong> 잰다 ― 뒤에서 다짐 판정값과 상대밀도가 굳이 이 값을 쓰는 이유가 이것이다. 간극이 물로 가득 차면 포화인데, 이것은 새 정의가 아니라 습윤의 특별한 경우다⁠<sup class=\"rs\">1-3</sup>. 넷 중 수중만 성격이 다르다. 다른 셋이 &quot;무엇을 셀까&quot;라는 약속의 문제라면 수중은 <strong>물속에서는 무게가 실제로 줄어든다</strong>는 물리이고, 그래서 빼는 대상이 습윤이 아니라 포화여야 한다 ― 완전히 잠겨야 부력이 성립하고, 잠겼다면 간극도 이미 물로 차 있기 때문이다. 여기까지 오면 다섯의 대소는 외울 목록이 아니라 <strong>분자를 세면 나오는 순서</strong>가 된다⁠<sup class=\"rs\">1-4</sup>.</p>\n<p>그런데 정의만으로는 계산이 안 된다. 현장에서 무게와 부피를 직접 재기 어렵고, 문제도 무게가 아니라 간극비·함수비·비중을 준다. 그래서 네 정의를 2절의 잣대로 옮겨 적어야 한다⁠<sup class=\"rs\">2</sup>. 요령은 2절과 같다 ― <strong>입자 부피를 1 로 놓으면</strong>⁠<sup class=\"rs\">2-1</sup> 모든 칸이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w</mi></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>G</mi><mi>s</mi></msub></mrow></math></span> 로 적히고, 분모가 넷 다 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>+</mo><mi>e</mi></mrow></math></span> 로 같아진다. 남는 일은 분자를 갈아 끼우는 것뿐이라 <strong>네 식이 그림 한 장에서 전부 나온다</strong>⁠<sup class=\"rs\">2-2</sup>. 부산물로 지름길이 딸려 나오는데⁠<sup class=\"rs\">2-3</sup>, 그중 하나가 2절이 남긴 숙제를 끝낸다 ― 자로 잴 수 없던 간극비를 흙을 말려 무게만 재면 얻는다. 만든 식이 맞는지는 단위와 극한으로 스스로 검사할 수 있고⁠<sup class=\"rs\">2-4</sup>, 숫자를 한 벌 넣어 세 갈래로 검산해 보면 확실해진다⁠<sup class=\"rs\">2-5</sup>.</p>\n<p>마지막 물음은 <strong>같은 흙이 얼마나 촘촘히 쌓였나</strong>이다⁠<sup class=\"rs\">3</sup>. 간극비 값 하나만으로는 답할 수 없다. 흙마다 담을 수 있는 간극비의 범위 자체가 다르기 때문이다⁠<sup class=\"rs\">3-1</sup>. 그러니 그 흙 자신의 가장 느슨한 상태와 가장 조밀한 상태를 양 끝으로 잡고 지금이 그 사이 어디인지를 재야 하고, 그 백분율이 상대밀도다⁠<sup class=\"rs\">3-2</sup>. 양 끝을 재현성 있게 만들어 낼 수 있는 흙이 사질토뿐이라 상대밀도도 사질토의 잣대가 되며, 그 시험이 하는 일도 <strong>최대한 엉성하게 쌓아 보고 최대한 촘촘하게 쌓아 보는 것</strong>뿐이다⁠<sup class=\"rs\">3-3</sup>. 점성토의 되고 무름은 4절 연경도가 맡는다.</p>\n<p><strong>분모는 늘 전체 부피. 갈리는 것은 분자뿐이다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 네 단위중량의 분자와 분모가 각각 무엇인가\n② 수중단위중량은 왜 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>t</mi></msub></mrow></math></span> 가 아니라 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span> 에서 빼는가\n③ <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>s</mi></msub><mo>=</mo><mn>1</mn></mrow></math></span> 그림에서 네 식이 어떻게 한꺼번에 나오는가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의연경도", "name": "흙의연경도", "title": "흙의 연경도", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 4, "file": "n-2d4d44f846.html", "card": {"oneline": "같은 점토가 물의 양에 따라 액체처럼도 고체처럼도 행동한다. 그 사이의 <strong>경계 함수비 세 개</strong>를 정해진 시험으로 못 박은 것이 아터버그한계다.", "bone": [{"n": "1", "t": "연경도 ― 물의 양이 흙의 상태를 바꾼다", "subs": ["연경도 ― 점착성이 있는 흙에서만", "네 상태와 세 경계 ― 아터버그한계", "경계는 약속이다 ― 규정된 시험이 곧 정의"]}, {"n": "2", "t": "액성한계 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w</mi><mi>L</mi></msub></mrow></math></span> 와 소성한계 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w</mi><mi>p</mi></msub></mrow></math></span> ― 반죽 구간의 두 끝", "subs": ["액성한계 ― 정의와 시험", "액성한계가 말해 주는 것 (교재 특성)", "소성한계 ― 지름 3 mm 국수", "자연함수비가 셋 중 어디에 있나"]}, {"n": "3", "t": "수축한계 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w</mi><mi>s</mi></msub></mrow></math></span> ― 부피로 정의되는 한계", "subs": ["왜 부피로 정의되나", "수축한계의 두 공식", "수축비와 파생값 ― 한 시험에서 다섯", "단위와 극한"]}], "link": [{"k": "목적", "html": "<p>3절까지의 잣대(간극비·함수비·단위중량)는 흙의 <strong>양</strong>만 말할 뿐 흙이 <strong>어떻게 행동하는지</strong>는 말하지 않는다. 함수비 40 % 라는 말만 듣고는 그 흙을 밟을 수 있는지 흘러내릴지 알 수 없다. 게다가 교재가 못 박은 대로 <strong>세립토는 입도분포보다 연경도가 공학적 성질을 좌우한다.</strong> 그래서 그 흙 자신을 기준으로 한 눈금 ― 몇 % 부터 흐르고, 몇 % 부터 빚어지고, 몇 % 부터 부피가 안 주는가 ― 이 필요하다. 없으면 9절의 소성도표와 5절의 지수들이 통째로 멈춘다.</p>\n"}, {"k": "연결", "html": "<p>현장에서 파낸 점토의 함수비를 쟀더니 40 % 가 나왔다고 하자. 이 숫자 하나로는 아무 판단도 못 한다. 어떤 점토에서 40 % 는 벽돌처럼 단단한 상태이고 다른 점토에서는 흘러내리는 상태이기 때문이다. 그 흙 자신을 기준으로 한 눈금이 없으면 함수비는 뜻을 갖지 못한다.</p>\n<p>먼저 이 눈금이 왜 점성토에만 그어지는지부터 본다⁠<sup class=\"rs\">1-1</sup>. 모래에 물을 부어도 반죽이 되지 않는다 ― 알갱이가 굵어 표면의 힘이 자중에 못 미치므로 물이 그냥 사이를 빠져나간다. 반면 점토는 1절에서 본 대로 판처럼 얇고 표면이 음전하를 띠어 <strong>물을 껍질처럼 붙잡고</strong>, 그 껍질이 윤활막처럼 작동해 미끄러지되 떨어지지는 않게 만든다. 그래서 물의 양이 곧 굳기가 되고, 물이 줄어드는 동안 흙은 액성·소성·반고체·고체 네 상태를 지나며 경계 셋을 만든다⁠<sup class=\"rs\">1-2</sup>. 3절의 상대밀도가 사질토 전용이라 비워 둔 자리를 이 절이 점성토 쪽에서 메운다.</p>\n<p>그런데 이 변화는 <strong>연속</strong>이다. 어디부터 소성인지 눈에 보이는 선이 없고, 손으로 만져 판정하면 사람마다 달라진다. 그래서 경계를 <strong>정해진 동작으로 약속</strong>해 버렸다⁠<sup class=\"rs\">1-3</sup>. 시험 절차에 나오는 숫자들 ― 낙하 높이 1 cm, 홈이 닫히는 길이 1.5 cm, 타격 25 회, 국수 지름 3 mm ― 이 물리상수가 아니라 재현성을 위한 약속인 이유가 이것이다. 다만 그 약속이 <strong>강도 한 점을 고정</strong>하기 때문에, 액성한계 시험은 결과적으로 아주 작은 전단강도 시험이 된다.</p>\n<p>약속을 정했으면 실제로 재야 한다⁠<sup class=\"rs\">2</sup>. 액성한계는 접시에 담은 흙에 홈을 내고 두드려 흙이 스스로 흘러 홈을 메우게 하고, 그때의 타격 횟수를 그 함수비에서의 강도 눈금으로 읽는다⁠<sup class=\"rs\">2-1</sup>. 액성한계가 크다는 것은 그 흙이 물을 많이 먹는다는 뜻이고, 물을 많이 먹으면 마르고 젖을 때 부피가 크게 변하며 하중을 받으면 크게 가라앉는다 ― 노반 재료로 부적당하다는 결론까지가 한 사슬이다⁠<sup class=\"rs\">2-2</sup>. 소성한계는 반대쪽 끝으로, 흙을 국수처럼 밀어 지름 3 mm 에서 막 갈라지는 순간을 잡는다⁠<sup class=\"rs\">2-3</sup>. 두 값 사이가 흙이 물러진 채 버티는 구간이고, 그 폭이 0 이거나 음수이면 아예 소성이 없는 흙이다. 자를 다 만들었으면 마지막으로 현장의 자연함수비를 그 위에 얹어 본다 ― 이 지반이 지금 어느 상태에 서 있는지가 거기서 읽힌다⁠<sup class=\"rs\">2-4</sup>.</p>\n<p>셋 중 수축한계만 성격이 다르다⁠<sup class=\"rs\">3</sup>. 앞의 둘이 동작으로 정의된 반면 이것은 <strong>현상</strong>으로 정의된다 ― 물을 더 빼도 부피가 줄지 않기 시작하는 자리다⁠<sup class=\"rs\">3-1</sup>. 왜 멈추는가 하면, 그때까지는 간극이 물로 꽉 차 있어 물이 나간 만큼 그대로 오그라들다가 알갱이가 서로 닿는 순간부터는 나간 물 자리에 <strong>공기</strong>가 들어오기 때문이다. 곧 <strong>마르면서 마지막까지 포화를 유지하는 함수비</strong>라는 이 한 줄이 이 절의 공식 둘을 낳는다⁠<sup class=\"rs\">3-2</sup>. 그리고 정의가 부피이기 때문에 시험도 무게가 아니라 체적을 재게 되고, 그 한 번의 시험에서 수축비·체적변화계수·선수축·비중 근사·동상성 판정까지 딸려 나온다⁠<sup class=\"rs\">3-3</sup>. 만든 식이 맞는지는 단위와 극한으로 때려 보면 된다⁠<sup class=\"rs\">3-4</sup>.</p>\n<p><strong>같은 흙, 다른 물의 양. 경계는 눈에 없으므로 시험으로 약속한다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 연경도가 왜 점성토에서만 의미를 갖는가 ― 흡착수까지 내려가서\n② 네 상태와 세 경계의 이름·순서, 그리고 셋이 전부 무엇으로 표시되는가\n③ 시험 절차의 숫자들이 물리상수가 아니라 약속인 이유</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의입도분포선", "name": "흙의입도분포선", "title": "흙의 입도분포선", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 7, "file": "n-436babb53b.html", "card": {"oneline": "알갱이의 크기 분포는 <strong>굵은 것은 체로 걸러 남은 무게를 달고, 체를 빠져나간 잔 것은 물속에서 가라앉는 속도로 크기를 되짚어</strong> 알아낸다.", "bone": [{"n": "1", "t": "흙의 입도와 시험의 분업", "subs": ["입도와 입도분석", "적용범위 ― 어디서 방법이 갈리나", "표준체와 체 번호"]}, {"n": "2", "t": "체가름 분석", "subs": ["잔유율과 가적잔유율", "가적통과율과 보정"]}, {"n": "3", "t": "비중계 분석", "subs": ["Stokes 법칙", "현탁액 속 입자의 최대지름", "비중계의 유효깊이", "분산제"]}], "link": [{"k": "목적", "html": "<p>1절의 입경 구분과 6절 활성도의 분모(점토 함유율)를 <strong>실제로 재는 방법</strong>이 여기다. 그런데 알갱이 크기의 범위가 수만 배라 한 가지 방법으로는 전 구간을 못 잰다. 굵은 쪽은 체로 걸러 무게를 달면 되지만 체 눈금은 무한히 작아질 수 없으므로, <strong>체가 항복하는 경계</strong> 아래는 가라앉는 속도로 잰다. 이것이 없으면 8절 곡선에 찍을 점이 없고, 9절 분류의 &quot;No.200체 통과율 50 %&quot; 같은 기준도 셀 수가 없다.</p>\n"}, {"k": "연결", "html": "<p>흙 한 삽을 손에 쥐고 &quot;이 안에 0.002 mm 보다 작은 알갱이가 몇 % 인가&quot;에 답해야 한다고 하자. 6절의 활성도가 그 값을 분모로 요구했는데 재는 방법은 아직 없었다. 그런데 알갱이 크기가 자갈 수십 mm 에서 점토 0.001 mm 까지 <strong>수만 배</strong>라, 한 가지 방법으로 끝에서 끝까지 잴 수가 없다.</p>\n<p>그래서 먼저 <strong>어디서 방법이 갈리는지</strong>를 정한다⁠<sup class=\"rs\">1</sup>. 입도라는 것이 값 하나가 아니라 분포라는 점을 확인하고⁠<sup class=\"rs\">1-1</sup>, 체가 실제로 걸러낼 수 있는 한계에서 경계를 긋는다⁠<sup class=\"rs\">1-2</sup>. 경계가 정해지면 시험이 세 토막으로 나뉜다 ― 굵은 쪽 체가름, 잔 쪽 침강, 그리고 침강이 끝난 시료를 다시 거르는 마무리. 마지막 토막이 필요한 이유는 침강에 넣은 시료 안에 경계보다 굵은 모래가 아직 섞여 있기 때문이다. 이 자리에서 <strong>체 번호와 눈금 크기가 반대로 움직인다</strong>는 것도 함께 정리해 둔다⁠<sup class=\"rs\">1-3</sup>.</p>\n<p>체가름 쪽은 셈이 전부다⁠<sup class=\"rs\">2</sup>. 체마다 남은 무게를 전체 시료로 나누면 잔유율이고, 굵은 체부터 차례로 더해 내려가면 가적잔유율이다⁠<sup class=\"rs\">2-1</sup>. 100 에서 빼면 통과율인데, <strong>남았다와 통과했다는 서로의 여집합</strong>이라는 이 한 줄이 항목 전부이고 시험은 바로 그 뒤집기에서 걸려 넘어지게 만든다⁠<sup class=\"rs\">2-2</sup>. 침강에 쓴 시료가 애초에 No.10 체를 통과한 것뿐이므로 전체 기준으로 되돌리는 보정도 여기에 붙는다.</p>\n<p>침강 쪽은 물리가 하나 필요하다⁠<sup class=\"rs\">3</sup>. 물속의 알갱이는 무게로 내려가고 부력과 항력으로 버티는데, <strong>항력만 속도에 비례</strong>하므로 셋이 맞는 순간부터 더 빨라지지 않는다. 그 일정한 속도를 지름으로 푼 것이 Stokes 법칙이고, 그래서 <strong>속도를 재면 지름을 되짚을 수 있다</strong>⁠<sup class=\"rs\">3-1</sup>. 되짚을 때 실제로 답하는 것은 &quot;지금 이 깊이에 아직 떠 있는 알갱이 중 가장 굵은 것은 얼마인가&quot;이며⁠<sup class=\"rs\">3-2</sup>, 그 깊이를 제대로 세는 일이 유효깊이다⁠<sup class=\"rs\">3-3</sup>. 다만 이 물리는 <strong>알갱이를 구라고 가정</strong>하고 세운 것이라 양 끝에서 깨진다 ― 굵으면 가라앉으며 물을 휘젓고, 너무 잔하면 브라운 운동에 밀린다. 게다가 알갱이가 서로 엉겨 뭉쳐 있으면 덩어리 하나가 굵은 알갱이처럼 가라앉아 아예 다른 흙을 재게 되므로, 분산제로 먼저 떼어놓는다⁠<sup class=\"rs\">3-4</sup>.</p>\n<p><strong>굵은 것은 무게로, 잔 것은 시간으로 잰다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 한 방법으로 전 구간을 못 재는가, 경계는 무엇으로 정해지는가\n② 왜 가라앉는 속도에서 입경을 역산할 수 있는가\n③ 그 역산을 못 믿을 곳은 어디인가 ― 굵은 쪽 · 잔 쪽 · 모양</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의입자구성", "name": "흙의입자구성", "title": "흙의 입자구성", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 1, "file": "n-33c13bd2f9.html", "card": {"oneline": "알갱이가 무엇인지가 같아도 <strong>배열(골격)</strong> 이 다르면 투수성·압축성·강도가 달라진다. 배열 네 가지의 이름과, 무엇이 배열을 정하는가.", "bone": [{"n": "1", "t": "흙의 생성", "subs": ["암석의 순환", "풍화의 두 갈래", "잔적토와 운반토"]}, {"n": "2", "t": "비점성 흙의 입자구성", "subs": ["골격과 간극", "단립구조 (single grained structure)", "봉소구조 (honeycombed structure)"]}, {"n": "3", "t": "점성토의 구조", "subs": ["무엇이 배열을 정하나", "면모구조 (flocculated structure)", "분산구조 (dispersed structure)", "되비빔과 흐트러진 흙"]}, {"n": "4", "t": "흙의 성질", "subs": ["두 성질과 각각의 시험", "왜 시료 상태가 갈리는가", "다음 절로"]}], "link": [{"k": "목적", "html": "<p>흙은 규격을 정해 만들어 온 재료가 아니라 땅에 있던 알갱이 더미다. 그래서 성분표를 읽는 것으로는 강도도 투수성도 알 수 없다. 같은 점토를 성분도 함수비도 그대로 둔 채 손으로 되비비기만 해도 물러지는데, 그때 바뀐 것은 <strong>알갱이의 배열</strong> 하나뿐이다. 흙의 공학적 성질은 성분이 아니라 배열에 적혀 있고, 그 배열에 이름을 붙이는 자리가 이 절이다.</p>\n"}, {"k": "연결", "html": "<p>시추공에서 올린 점토를 두 통 떠서, 하나는 통째로 두고 하나만 손으로 주물러 시험실에 넣었다고 하자. 물을 더 넣지도 빼지도 않았고 성분도 하나 안 바뀌었는데 주무른 쪽이 훨씬 무르게 나온다. 이 한 가지를 설명하려고 절 전체가 움직인다.</p>\n<p>먼저 이 알갱이가 무엇으로 되어 있는지부터 본다⁠<sup class=\"rs\">1</sup>. 암석은 부서져 흙이 되고 흙은 다시 굳어 암석이 되는데, 흙은 그 순환의 종착지가 아니라 <strong>정류장</strong>이다⁠<sup class=\"rs\">1-1</sup>. 여기서 놓치면 안 되는 것은 부서지는 방식이 두 갈래라는 점이다. 물리적 풍화는 잘게 쪼개기만 하고, 화학적 풍화는 광물 자체를 바꾼다. 그래서 <strong>모래는 부서진 조각이고 점토는 새로 만들어진 광물</strong>이다⁠<sup class=\"rs\">1-2</sup> ― 둘은 크기만 다른 것이 아니고, 이 사실이 뒤에서 ⁠<sup class=\"rs\">2</sup>과 ⁠<sup class=\"rs\">3</sup>가 갈리는 뿌리가 된다. 부서진 뒤 제자리에 남았는지 옮겨졌는지로 잔적토와 운반토가 갈리는데⁠<sup class=\"rs\">1-3</sup>, 옮겨졌다는 말은 곧 <strong>물속을 가라앉으며 자리를 잡았다</strong>는 뜻이므로 이야기가 자연히 배열로 넘어간다.</p>\n<p>배열을 보려면 눈을 한 번 바꿔야 한다. 흙을 덩어리 하나로 보지 말고 <strong>알갱이 골격과 그 사이의 간극</strong>으로 갈라 보는 것이다⁠<sup class=\"rs\">2-1</sup>. 그러면 &quot;느슨하다&quot;는 말이 &quot;간극이 많다&quot;가 되고, 다시 공극비라는 숫자가 된다.</p>\n<p>이 눈으로 보면 배열을 정하는 힘이 흙마다 다르다는 것이 드러난다. 굵은 알갱이는 부피에 비해 표면이 좁아 <strong>제 무게가 압도적</strong>이므로, 가라앉아 아래 알갱이에 바로 맞물린다. 이것이 단립구조다⁠<sup class=\"rs\">2-2</sup>. 그런데 알갱이가 작아지면 무게는 세제곱으로 줄고 표면은 제곱으로만 줄어서, 어느 크기부터는 <strong>표면에서 붙잡는 힘이 제 무게를 이긴다.</strong> 그러면 처음 닿은 자리를 지키며 아치를 세워 큰 빈 방을 이고 있게 된다. 이것이 봉소구조다⁠<sup class=\"rs\">2-3</sup>. 아치이기 때문에 간극이 많고, 아치이기 때문에 한 번 무너지면 한꺼번에 내려앉는다.</p>\n<p>점토까지 내려가면 표면의 힘이 이기는 정도가 아니라 <strong>승부를 가린다</strong>⁠<sup class=\"rs\">3</sup>. 판처럼 얇은 입자 사이에는 끌어당기는 흡인력과, 표면에 달라붙은 물 껍질이 겹칠 때 밀어내는 반발력이 함께 있다⁠<sup class=\"rs\">3-1</sup>. 흡인력이 이기면 모서리가 남의 넓은 면에 붙어 엉성한 카드집이 되고(면모구조)⁠<sup class=\"rs\">3-2</sup>, 반발력이 이기면 서로 밀어내며 하나씩 천천히 가라앉아 나란히 눕는다(분산구조)⁠<sup class=\"rs\">3-3</sup>. 카드집은 물길이 넓고 걸리는 데가 있어 투수성과 강도가 크고, 누운 판은 그 반대다. 그리고 맨 처음의 주무른 시료가 여기서 답을 얻는다 ― 되비빔이란 카드집을 부수고 판을 눕히는 일이라, 간극이 늘고 밀도가 떨어지고 강도가 빠진다⁠<sup class=\"rs\">3-4</sup>.</p>\n<p>그러면 이 이야기를 왜 1장 맨 앞에 놓았는지가 정리된다⁠<sup class=\"rs\">4</sup>. 흙의 성질은 <strong>무엇으로 되어 있나</strong>를 묻는 물리적 성질과 <strong>어떻게 거동하나</strong>를 묻는 공학적 성질로 갈리는데⁠<sup class=\"rs\">4-1</sup>, 성분은 부수어도 바뀌지 않지만 거동은 배열이 만들기 때문에 부수면 답이 달라진다. 공학적 성질 시험에 불교란 시료를 써야 한다는 규칙이 여기서 나온다⁠<sup class=\"rs\">4-2</sup>. 그러고 나면 남는 일은 배열을 말이 아니라 숫자로 세는 것이고, 그것이 2절과 3절이다⁠<sup class=\"rs\">4-3</sup>.</p>\n<p>성분은 <strong>생성이</strong>, 배열은 <strong>힘이</strong>, 공학적 성질은 <strong>배열이</strong> 정한다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 잔적토와 운반토를 가르는 한 가지 기준\n② 배열을 정하는 힘이 굵은 흙과 점토에서 왜 다른가 ― 크기와 표면적의 관계로\n③ 네 구조 중 간극이 많은 것은 어느 것들이고, 그 이유는 무엇인가</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/단순보", "name": "단순보", "title": "단순보", "ch": 3, "chTitle": "정정 구조물", "ord": 1, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/캔틸레버보와 게르버보", "name": "캔틸레버보와 게르버보", "title": "캔틸레버보와 게르버보", "ch": 3, "chTitle": "정정 구조물", "ord": 2, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/내민보", "name": "내민보", "title": "내민보", "ch": 3, "chTitle": "정정 구조물", "ord": 3, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/보의 응력", "name": "보의 응력", "title": "보의 응력", "ch": 3, "chTitle": "정정 구조물", "ord": 4, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/정정 라멘", "name": "정정 라멘", "title": "정정 라멘", "ch": 3, "chTitle": "정정 구조물", "ord": 5, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/정정 아치", "name": "정정 아치", "title": "정정 아치", "ch": 3, "chTitle": "정정 구조물", "ord": 6, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/기둥", "name": "기둥", "title": "기둥", "ch": 4, "chTitle": "기둥과 트러스", "ord": 1, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/트러스", "name": "트러스", "title": "트러스", "ch": 4, "chTitle": "기둥과 트러스", "ord": 2, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/
