:root{ --bg:#f4f5f7; --card:#fff; --ink:#1e242b; --dim:#6b747d; --line:#e2e5e9;
       --ok:#2f7d5d; --accent:#2f5d8a; --warn:#a8552f; --bad:#a33a3a;
       --cell:#e6e8ea; --fill:74,124,229; --thead:#f2f4f6;
       --shadow:0 1px 3px rgba(30,36,43,.07), 0 12px 28px rgba(30,36,43,.11);
       --shadow-s:0 1px 2px rgba(30,36,43,.10), 0 4px 10px rgba(30,36,43,.10);
       --tabh:calc(52px + env(safe-area-inset-bottom)); }
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181c; --card:#1c2126; --ink:#e6e9ec; --dim:#98a1aa; --line:#2b3238;
         --accent:#7aa6d2; --ok:#5aab86; --bad:#d1746f; --warn:#d19a6f;
         --cell:#262c32; --fill:110,152,240; --thead:#232930;
         --shadow:0 1px 3px rgba(0,0,0,.45), 0 12px 30px rgba(0,0,0,.55);
         --shadow-s:0 1px 2px rgba(0,0,0,.4), 0 4px 10px rgba(0,0,0,.4); } }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:"NoteHead","NoteBody","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:16px; line-height:1.6; }

/* ── 머리 ── */
header{ position:sticky; top:0; z-index:10; background:var(--card);
  border-bottom:1px solid var(--line); padding:13px 10px;
  padding-top:calc(13px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:6px; }
header b{ flex:1; text-align:center; font-size:19px; font-weight:normal;
  letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header button{ background:none; border:0; color:var(--dim); font:inherit; font-size:13.5px;
  cursor:pointer; padding:6px 8px; border-radius:8px; display:flex; align-items:center;
  gap:5px; min-width:62px; }
header button:disabled{ visibility:hidden; }
header #gear{ justify-content:flex-end; }
.tri{ width:0; height:0; border-right:6px solid currentColor;
  border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; }

main{ max-width:720px; margin:0 auto; padding:12px 14px calc(20px + var(--tabh)); }

/* ── 아래 탭 — 화면 셋을 오간다 ── */
#tabs{ position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex;
  background:var(--card); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); }
/* 탭은 flex 로 가운데 정렬한다 — 배지(숫자 알약)를 `vertical-align` 픽셀값으로 밀면
   글자 크기를 고칠 때마다 그 숫자를 다시 맞춰야 한다. */
#tabs a{ flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
  padding:15px 0 16px; text-decoration:none;
  color:var(--dim); font-size:16px; line-height:1.2; letter-spacing:-.01em; }
#tabs a.on{ color:var(--accent); }
/* 배지도 실측 보정이다 — `align-items:center` 는 **상자**를 맞추지만 주아체 글자는 그
   상자 안에서 위에 앉으므로, 알약이 라벨보다 아래로 내려간 것처럼 보인다.
     · 알약 중앙이 '오답' 글자 잉크 중앙보다 1.12px 아래 → 알약을 그만큼 올린다
     · 알약 안 숫자는 알약 중앙보다 0.75px 위          → 숫자를 그만큼 내린다
   px 로 적는다: 이 값은 **라벨(16px)의 글자 metrics** 에서 나오므로 배지의 em 으로 적으면
   엉뚱하게 따라간다. 탭 글자 크기를 고치면 `_check_align.py` 로 다시 재라. */
#tabs a .n{ display:inline-block; min-width:18px; padding:1px 5px;
  border-radius:9px; background:var(--accent); color:#fff; font-size:10.5px;
  line-height:1.45; transform:translateY(-1.12px); }

/* ── 타일 ── */
.tiles{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:2px 0 12px; }
.tile{ background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:10px 14px 11px; }
.tile .k{ font-size:11.5px; color:var(--dim); letter-spacing:-.01em; }
.tile .v{ font-size:21px; line-height:1.25; font-variant-numeric:tabular-nums; }
.tile .v u{ font-size:12.5px; color:var(--dim); text-decoration:none; margin-left:3px; }
.tile .s{ font-size:11.5px; color:var(--dim); margin-top:1px; }
.tile.hot .v{ color:var(--accent); font-weight:700; }

/* ── 과목 패널 ── */
.panel{ display:block; text-decoration:none; color:inherit; background:var(--card);
  border:1px solid var(--line); border-radius:24px; padding:14px 18px 12px;
  margin:0 0 10px; }
.panel:active{ background:var(--bg); }
.ph{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.ph .nm{ flex:1; font-size:17px; }
.ph .n{ font-size:12.5px; color:var(--dim); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.due{ color:var(--accent); font-weight:700; }
.pbody{ display:flex; gap:16px; align-items:flex-start; }
.pstat{ flex:1; min-width:0; font-size:12px; color:var(--dim); line-height:1.7;
  font-variant-numeric:tabular-nums; }
.pstat b{ color:var(--ink); font-weight:normal; }
.prog{ height:4px; border-radius:3px; background:var(--line); overflow:hidden;
  margin-top:7px; }
.prog i{ display:block; height:100%; background:var(--ok); }

/* 12주 = 7행 × 12열. 칸을 고정 크기로 작게 잡아 촘촘하게 붙인다. */
.hm{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,10px);
  grid-auto-columns:10px; gap:3px; width:fit-content; }
.hm i{ border-radius:2.5px; background:var(--cell); }
.hm.big{ grid-template-rows:repeat(7,13px); grid-auto-columns:13px; gap:4px;
  margin:0 auto; }

/* ── 과목 화면: 장 → 절 ── */
.card{ background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:4px 16px; margin:0 0 12px; }
.card.pad{ padding:15px 18px; }
h2.sec{ font-size:13px; margin:20px 0 8px; padding:0 6px; color:var(--dim); }
.ch{ border-top:1px solid var(--line); }
.ch:first-child{ border-top:0; }
.chh{ width:100%; display:flex; align-items:center; gap:9px; padding:12px 2px;
  background:none; border:0; color:var(--dim); font:inherit; font-size:14.5px;
  cursor:pointer; text-align:left; }
.chh .caret{ width:0; height:0; flex:0 0 7px;
  border-left:5px solid var(--line); border-top:4px solid transparent;
  border-bottom:4px solid transparent; transition:transform .15s; }
.ch[open] .chh{ color:var(--ink); }
.ch[open] .chh .caret{ transform:rotate(90deg); border-left-color:var(--dim); }
.chh .nm{ flex:1; }
.chh .n{ font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.chu{ display:none; padding:0 0 8px 15px; }
.ch[open] .chu{ display:block; }
a.unit, .unit.todo{ display:block; color:inherit; text-decoration:none;
  padding:9px 2px 9px 10px; border-top:1px solid var(--line); }
.unit.todo{ opacity:.42; }
.unit .t{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.unit .t > span:first-child{ font-size:15px; }
.unit .n{ font-size:12.5px; color:var(--dim); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.unit.todo .n{ font-size:11.5px; }
.dot{ display:inline-block; width:7px; height:7px; border-radius:4px;
  background:var(--line); margin-right:6px; vertical-align:1px; }
.dot.s1{ background:var(--warn); } .dot.s2{ background:var(--accent); }
.dot.s3{ background:var(--ok); }

/* ── 오늘의 덱 안내 ── */
.deckhead{ background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:18px 20px 20px; margin-bottom:12px; }
.deckhead h3{ margin:0 0 4px; font-size:15px; font-weight:normal; color:var(--dim); }
.deckhead .big{ font-size:30px; line-height:1.25; font-variant-numeric:tabular-nums; }
.deckhead .big u{ font-size:14px; color:var(--dim); text-decoration:none; margin-left:4px; }
.deckhead .sub{ font-size:13px; color:var(--dim); margin-top:6px; line-height:1.7; }
.go{ display:block; width:100%; margin-top:14px; border:0; border-radius:14px;
  background:var(--accent); color:#fff; font:inherit; font-size:16px; padding:14px;
  cursor:pointer; }
.go:disabled{ background:var(--line); color:var(--dim); }
.mix{ display:flex; gap:6px; margin-top:12px; font-size:12px; color:var(--dim);
  flex-wrap:wrap; }
.mix span{ border:1px solid var(--line); border-radius:9px; padding:3px 9px; }

/* ── 카드 ── */
.cnt{ text-align:center; font-size:12.5px; margin:2px 0 10px;
  font-variant-numeric:tabular-nums; }
.cnt a{ color:var(--dim); text-decoration:none; display:inline-block;
  padding:3px 12px; border:1px solid var(--line); border-radius:99px; }
.cnt a b{ font-weight:normal; color:var(--ink); }
.fcard{ background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:22px 20px; min-height:44vh; display:flex; flex-direction:column;
  box-shadow:var(--shadow); }
.fsubj{ font-size:12.5px; color:var(--dim); }
.fq{ margin:auto 0; text-align:center; }
.fq .ch{ font-size:15px; color:var(--dim); border:0; }
.fq .ti{ font-size:29px; line-height:1.38; margin-top:6px; }
.fa .ti{ font-size:22px; margin-bottom:16px; }
.fa{ margin-top:4px; }
.bn{ margin:0 0 12px; }
.bh{ font-size:18px; display:flex; gap:9px; align-items:baseline; }
/* 제목 번호는 **각진 검정 네모**다 (둥글리면 아래 (1)(2) 목록과 무게가 비슷해져
   어느 쪽이 상위인지 눈에 안 온다). */
/* 숫자는 크게, 상자는 그대로. font-size 를 올리면서 line-height 를 조여 상자 높이를
   20px 안팎으로 유지한다 (14 × 1.15 + 여백 2 + 테두리 3 ≈ 21). */
.bh i{ font-style:normal; flex:0 0 auto; min-width:25px; text-align:center;
  border:1.5px solid var(--ink); border-radius:0; font-size:15px; color:var(--ink);
  padding:1px 4px; line-height:1.2; }
/* 주아체(BMJUA)는 글리프가 em 박스 **위쪽에** 붙어 있어, line-height 로 가운데를 맞춰도
   숫자와 제목이 떠 보인다. 아래 두 값은 **헤드리스 크롬에 실제로 그려 픽셀로 잰 것**이다
   (재는 방법은 study/CLAUDE.md 의 '숫자 정렬' 참조). em 으로 적어 글자 크기를 바꿔도 따라온다.
     · 네모칸 숫자 12px  — 잉크 중앙이 칸 중앙보다 1.5px 위 → 0.125em
     · 제목    15.5px — 잉크 중앙이 칸 중앙보다 3.0px 위 → 0.19em
   ⚠ `.bh` 의 font-size·line-height 나 네모칸의 padding·border 를 고치면 이 값도 다시 재라.
   ⚠ 한때 캔버스로 매번 재서 맞췄는데, **서체가 올라오기 전에 잰 값이 캐시에 박혀** 대체
     서체 기준으로 5px 씩 밀렸다. 이 자리에선 고정값이 더 튼튼하다. */
.bh i > span{ display:inline-block; transform:translateY(0.125em); }
.bh > span{ display:inline-block; transform:translateY(0.105em); }
#tabs .n > span{ display:inline-block; transform:translateY(0.75px); }
/* 소제목 번호는 노트와 같은 표기 — `1.` 이 아니라 `(1)`. */
.bs{ margin:9px 0 0; padding-left:29px; color:var(--dim); font-size:15.5px;
  list-style:none; counter-reset:bs; }
.bs li{ margin:3px 0; }
.bs li::before{ counter-increment:bs; content:"(" counter(bs) ") ";
  font-variant-numeric:tabular-nums; }
/* 채점 단추는 아래 탭 **위에** 앉아야 한다 — 탭이 늘 보이므로 그만큼 띄운다. */
.acts{ position:sticky; bottom:calc(8px + var(--tabh)); margin-top:12px; }
.flip{ width:100%; border:0; border-radius:14px; background:var(--ink); color:var(--bg);
  font:inherit; font-size:16px; padding:15px; cursor:pointer; }
#grades{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
/* 채점 단추는 **색으로 채운다.** 글자는 같은 계열의 짙은 색 — 흰 글자로 두면 셋이
   비슷해 보여서, 손이 기억하는 것이 '자리' 뿐이 된다. 색은 테마에 따라 바뀌지 않는다
   (어두운 화면에서 뒤집히면 빨강·초록의 뜻이 흔들린다). */
#grades button{ border:0; border-radius:14px; padding:12px 4px; font:inherit;
  cursor:pointer; box-shadow:var(--shadow-s); }
#grades button:active{ transform:translateY(1px); }
#grades b{ display:block; font-size:14.5px; font-weight:700; }
#grades span{ display:block; font-size:10.5px; margin-top:2px; opacity:.72; }
#grades .g1{ background:#eb8d8d; color:#ba1a1a; }
#grades .g2{ background:#D3D3D3; color:#1e242b; }
#grades .g3{ background:#94d197; color:#118c17; }
.solve{ display:block; margin:10px 0 0 auto; border:1px solid var(--line);
  background:var(--card); color:var(--dim); border-radius:11px; padding:7px 14px;
  font:inherit; font-size:13px; cursor:pointer; }

/* ── 풀이 시트 ── */
#sheet{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.4);
  display:flex; align-items:flex-end; }
#sheet[hidden]{ display:none; }
#sheetbox{ background:var(--card); width:100%; max-height:88vh; overflow:auto;
  border-radius:20px 20px 0 0; padding:18px 18px calc(24px + env(safe-area-inset-bottom)); }
#sheetbox .hd{ display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
#sheetbox .hd b{ flex:1; font-size:16px; font-weight:normal; }
#sheetbox .hd button{ border:0; background:none; color:var(--dim); font:inherit;
  font-size:13px; cursor:pointer; padding:4px 2px; }
/* 풀이의 **내용**은 Pretendard 로. 여기가 앱에서 가장 긴 산문(연결)이라, 손글씨체나
   제목체로 문단을 읽으면 눈이 빨리 지친다. 라벨(`목적`·`연결`)까지 같이 넘긴다. */
#sheetbox .ol, #sheetbox p, #sheetbox li, #sheetbox td, #sheetbox th,
#sheetbox blockquote, #sheetbox .chk, #sheetbox h4{
  font-family:"NoteSans","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
/* 연결 산문이 뼈대를 가리키는 어깨번호 — `[3]`·`[3-2]` 가 이걸로 렌더된다.
   본문을 조용히 두는 것이 요점이라 네모 배지나 각주 목록을 두지 않는다: 번호가 곧
   뼈대 번호이므로 아래에 목록을 둘 이유가 없다. */
.rs{ font-size:.66em; color:var(--accent); vertical-align:super; line-height:0;
  font-weight:700; letter-spacing:0; }
.ol{ font-size:15.5px; border-left:3px solid var(--accent); padding-left:11px;
  margin:0 0 14px; color:var(--ink); }
#sheetbox h4{ margin:16px 0 5px; font-size:14px; color:var(--dim); font-weight:normal; }
#sheetbox p{ margin:7px 0; font-size:15.5px; }
.chk{ margin-top:16px; border-top:1px solid var(--line); padding-top:10px;
  font-size:14.5px; color:var(--dim); }

/* ── 오답노트 ── */
/* 오답 카드도 암기 카드와 같은 판이다 — 그림자를 주고, **문제·보기·해설 전부 Pretendard**
   로. 시험 문제는 낱말 하나가 답을 가르므로(`…만`·`아닌 것은`) 글자가 또렷해야 한다. */
.qcard{ box-shadow:var(--shadow); }
.qtext{ font-size:17px; line-height:1.75; }
.qtext, .sol, .sol p, .src summary{
  font-family:"NoteSans","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }

/* ⚠ **수식은 Pretendard 를 태우지 않는다.** MathML 의 글자는 지금 브라우저가 그리는 대로
   두는 것이 안전하다 — 서체를 바꾸면 그리스문자·프라임의 모양과 자리가 함께 흔들린다.
   위 규칙들보다 뒤에 와야 이긴다(선택자 무게가 같다). */
#sheetbox math, .qtext math, .opts button math, .sol math{
  font-family:"NoteBody","Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
.opts{ margin-top:16px; display:grid; gap:7px; }
/* ⚠ `font:inherit` 를 쓰지 마라. 축약형이라 **font-family 까지** 되돌려 놓는다 —
   위의 Pretendard 규칙과 무게가 같고 이 규칙이 뒤에 있어서, 보기 글자만 조용히
   주아체로 돌아가 있었다. 필요한 것(서체·크기·줄높이)만 따로 적는다. */
.opts button{ text-align:left; border:1px solid var(--line); background:var(--card);
  color:var(--ink); border-radius:13px; padding:11px 13px; font-size:16px;
  font-family:"NoteSans","Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  line-height:1.55; cursor:pointer; display:flex; gap:9px; align-items:baseline; }
.opts button i{ font-style:normal; color:var(--dim); flex:0 0 auto; }
.opts button.pick{ border-color:var(--accent); }
.opts button.right{ border-color:var(--ok); background:rgba(47,125,93,.09); }
.opts button.wrong{ border-color:var(--bad); background:rgba(163,58,58,.09); }
.sol{ margin-top:16px; border-top:1px solid var(--line); padding-top:12px;

.sol p{ margin:8px 0; }
.src{ margin-top:14px; }

.src img{ max-width:100%; margin-top:10px; border:1px solid var(--line);

/* ── 수식·표 (노트와 같은 규칙) ── */
math{ font-size:1.02em; line-height:normal; }

#sheetbox blockquote.note{ border-left-color:var(--accent); }
#sheetbox ul, #sheetbox ol{ padding-left:20px; font-size:15.5px; }

/* ── 설정 ── */
.note{ font-size:12.5px; color:var(--dim); margin-top:9px; line-height:1.55; }
label.row{ display:block; font-size:12.5px; color:var(--dim); margin:10px 0 3px; }

  border-radius:11px; padding:9px 14px; font:inherit; font-size:14px; cursor:pointer; }

.kv b{ color:var(--ink); font-weight:normal; }
.empty{ text-align:center; color:var(--dim); font-size:13.5px; padding:26px 10px; }

<script>

window.J0Toast = (function () {
  var box = null, timer = null;
  var CSS = ""
    + "#j0toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));"
    + "transform:translateX(-50%) translateY(10px);z-index:9999;max-width:min(92vw,520px);"

    + "#j0toast.ok .j0t-m{color:#9fd3b6;}"
    + "#j0toast.err .j0t-m{color:#ffc9a3;}"
    + "#j0toast a{color:#9fd3b6;}"
    + "#j0toast .j0t-x{position:relative;flex:0 0 auto;width:24px;height:24px;border:0;"
    + "background:none;padding:0;cursor:pointer;color:#9aa5b1;}"
    + "#j0toast .j0t-x:hover{color:#eef1f4;}"
    + "#j0toast .j0t-x::before,#j0toast .j0t-x::after{content:'';position:absolute;left:5px;"
    + "top:11px;width:14px;height:1.6px;background:currentColor;border-radius:1px;}"
    + "#j0toast .j0t-x::before{transform:rotate(45deg);}"
    + "#j0toast .j0t-x::after{transform:rotate(-45deg);}"

  function ensure() {
    if (box) return box;
    var st = document.createElement("style");
    st.textContent = CSS;
    document.head.appendChild(st);
    box = document.createElement("div");
    box.id = "j0toast";
    box.setAttribute("hidden", "");

                  + '<button class="j0t-x" type="button" title="닫기"></button>';

    document.body.appendChild(box);

  }
  /* 글자를 상자 한가운데로 —— 한글은 밑으로 삐치는 획이 거의 없어서, 줄상자 기준으로
     놓으면 **잉크가 위에 앉는다**(실측 asc 9.75 / desc 1.63). 잉크 경계를 재서 그만큼
     내려 준다. `measureText` 의 actualBoundingBoxDescent 는 값이 엉뚱하므로 캔버스에
     8배로 그려 픽셀로 잰다 — 노트의 번호 상자와 같은 방법이다. */
  var _ink = {};
  function inkOf(font, text) {
    var key = font + "|" + text;
    if (key in _ink) return _ink[key];
    var r = null;
    try {
      var size = parseFloat(font) || 96, S = 8;
      var c = document.createElement("canvas"), g = c.getContext("2d");
      c.width = Math.ceil(size * text.length) + 40;
      c.height = Math.ceil(size * 2.6);
      var baseY = Math.round(size * 1.6);
      g.font = font; g.textBaseline = "alphabetic"; g.fillStyle = "#000";
      g.fillText(text, 5, baseY);
      var d = g.getImageData(0, 0, c.width, c.height).data, top = -1, bot = -1;
      for (var y = 0; y < c.height; y++) {
        for (var x = 0; x < c.width; x++) {
          if (d[(y * c.width + x) * 4 + 3] > 12) { if (top < 0) top = y; bot = y; break; }
        }
      }

    } catch (e) { /* 캔버스를 못 쓰면 보정 없이 간다 */ }
    _ink[key] = r;
    return r;
  }
  /* 잉크를 **자기 줄상자 한가운데**로 맞춘다. 알약 한가운데에 맞추면 두 줄 이상일 때
     통째로 어긋나므로 기준은 늘 첫 줄이다. 알약과의 정렬은 CSS(align-items:center)가
     맡고, 여기서는 줄상자 안의 위아래 쏠림만 없앤다. */
  function center(msgEl, boxEl) {
    msgEl.style.transform = "";
    var cs = getComputedStyle(msgEl), size = parseFloat(cs.fontSize);
    var lh = parseFloat(cs.lineHeight) || size * 1.5;
    var text = (msgEl.textContent || "").replace(/\s+/g, " ").trim().slice(0, 16);
    if (!text) return;
    var ib = inkOf(cs.fontStyle + " " + cs.fontWeight + " " + (size * 8) + "px "
                   + cs.fontFamily, text);
    if (!ib) return;
    // 탐침은 **맨 앞**에 넣는다 — 뒤에 넣으면 여러 줄일 때 마지막 줄을 잰다
    var probe = document.createElement("i");
    probe.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
    msgEl.insertBefore(probe, msgEl.firstChild);
    var base = probe.getBoundingClientRect().top;
    var top = msgEl.getBoundingClientRect().top;
    msgEl.removeChild(probe);
    if (!base) return;
    var d = (top + lh / 2) - (base - (ib.asc - ib.desc) / 2);
    if (Math.abs(d) > 0.05 && Math.abs(d) < 8) {
      msgEl.style.transform = "translateY(" + d.toFixed(2) + "px)";
    }
  }

  function hide() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!box) return;
    box.classList.remove("on");
    setTimeout(function () {
      if (box && !box.classList.contains("on")) box.setAttribute("hidden", "");
    }, 220);
  }
  /* show(글, 종류, 살아있을 ms). ms=0 이면 다음 알림이나 X 로만 사라진다.
     기본은 잠깐(3.2초), 오류는 읽을 시간을 주려고 길게(9초). */
  function show(msg, kind, ms) {
    var b = ensure();
    if (timer) { clearTimeout(timer); timer = null; }
    b.className = kind || "";
    b.querySelector(".j0t-m").innerHTML = msg;
    b.removeAttribute("hidden");
    try { center(b.querySelector(".j0t-m"), b); } catch (e) {}
    requestAnimationFrame(function () { b.classList.add("on"); });
    var life = (ms === undefined) ? (kind === "err" ? 9000 : 3200) : ms;
    if (life > 0) timer = setTimeout(hide, life);
  }
  show.hide = hide;
  return show;
})();

window.J0Sync = (function () {
  var KEY = "j0-review-v1", SKEY = "j0-sync";
  /* 저장소·경로는 **빌드에서 박는다.** 사이트를 올린 그 저장소에 기록 파일을 같이 둔다 —
     사람이 화면에서 저장소 이름을 적어 넣게 하면 기기마다 틀리게 적어 어긋난다. */
  var REPO = "notjaeyoung0108-lang/j0-review-log", PATH = "review-log.json";

  function cfg() { try { return JSON.parse(localStorage.getItem(SKEY) || "{}"); }
                   catch (e) { return {}; } }
  function setCfg(c) { localStorage.setItem(SKEY, JSON.stringify(c)); }
  function where() { return { repo: REPO, path: PATH }; }
  /* 공개 저장소는 **읽기에 토큰이 필요 없다.** 쓰기만 토큰이 필요하다 —
     그래서 토큰을 안 넣은 기기에서도 진도는 보인다(읽기 전용). */
  function ready() { return !!REPO; }
  function canWrite() { return !!(REPO && cfg().token); }

  function load() {
    try { var r = JSON.parse(localStorage.getItem(KEY) || "{}");
          return { s: r.s || {}, log: r.log || [] }; }
    catch (e) { return { s: {}, log: [] }; }
  }
  function save(S) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* 양쪽 방향으로 합친다 — 같은 빈칸은 복습 횟수가 많은 쪽을 남긴다.
     저장소(localStorage)에 바로 쓰므로, 부르는 쪽은 끝나고 다시 읽어야 한다.
     돌려주는 수는 **새로 들어온 채점 기록(log) 건수**다. 상태(s) 갱신까지 같이 세면
     다른 기기에서 한 번 채점한 것이 사람에게 "2건" 으로 보인다. */
  function merge(inc) {
    var S = load(), n = 0;
    var incS = (inc && inc.s) || {}, incL = (inc && inc.log) || [];
    for (var id in incS) {
      var mine = S.s[id];
      if (!mine || (incS[id].reps || 0) > (mine.reps || 0)) S.s[id] = incS[id];
    }
    var seen = {};
    S.log.forEach(function (l) { seen[l.t + "|" + l.id] = 1; });
    incL.forEach(function (l) {
      var k = l.t + "|" + l.id;
      if (!seen[k]) { S.log.push(l); seen[k] = 1; n++; }
    });
    S.log.sort(function (a, b) { return a.t - b.t; });
    save(S);
    return n;
  }

  function headers() {
    var c = cfg();
    var h = { "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28" };
    // 토큰이 없으면 Authorization 을 붙이지 않는다 — 붙이면 빈 값으로 401 이 된다
    if (c.token) h["Authorization"] = "Bearer " + c.token;
    return h;
  }
  function gh(path, opt) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, opt)
      .catch(function (e) {
        throw new Error("GitHub 에 닿지 못했습니다 — 인터넷 연결이나 사내망 차단을 확인하세요 ("
                        + e.message + ")");
      });
  }
  function b64enc(str) {
    var b = new TextEncoder().encode(str), s = "";
    b.forEach(function (x) { s += String.fromCharCode(x); });
    return btoa(s);
  }
  function b64dec(b64) {
    var bin = atob(String(b64).replace(/\s/g, ""));
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(arr);
  }
  function guard() {
    if (!REPO) throw new Error("기록 저장소가 정해지지 않았습니다 (빌드에서 박습니다)");
  }
  function guardWrite() {
    guard();
    if (!cfg().token) throw new Error("올리려면 토큰이 필요합니다 — 목록의 '설정'에서 넣으세요");
  }
  function why(r, put) {
    if (r.status === 401) return "토큰이 거부됐습니다 (401) — 토큰을 다시 확인하세요";
    if (r.status === 403) return put
      ? "권한이 없습니다 (403) — 토큰에 이 저장소의 Contents 읽기·쓰기를 주세요"
      : "요청이 너무 많거나 막혔습니다 (403) — 토큰을 넣으면 넉넉해집니다";
    if (r.status === 404) return put
      ? "저장소를 찾지 못했습니다 (404) — 이름이 맞는지, 토큰에 그 저장소 권한이 있는지 보세요"
      : "찾지 못했습니다 (404)";
    if (r.status === 409) return "다른 기기와 부딪혔습니다 (409) — 잠시 뒤 다시 하세요";
    if (r.status === 422) return "올리지 못했습니다 (422) — 파일 경로를 확인하세요";
    return "실패 " + r.status;
  }

  function pull() {
    guard();
    return gh(PATH, { headers: headers() }).then(function (r) {
      if (r.status === 404) return { n: 0, sha: null, empty: true,
                                     ahead: load().log.length };
      if (!r.ok) return r.text().then(function (t) {
        throw new Error(why(r, false) + " — " + t.slice(0, 120)); });
      return r.json().then(function (j) {
        var inc = JSON.parse(b64dec(j.content));
        // 합치기 **전에** '내게만 있는 기록' 을 센다. 0 이면 올릴 게 없다는 뜻이라
        // 빈 커밋을 만들지 않는다 — 앱을 열 때마다 커밋이 쌓이면 이력이 쓰레기가 된다.
        var rem = {};
        (inc.log || []).forEach(function (l) { rem[l.t + "|" + l.id] = 1; });
        var ahead = load().log.filter(function (l) {
          return !rem[l.t + "|" + l.id]; }).length;
        return { n: merge(inc), sha: j.sha, empty: false, ahead: ahead };
      });
    });
  }

  function put(sha) {
    var p = PATH;
    var body = { message: "복습 기록 "
                   + new Date().toISOString().slice(0, 16).replace("T", " "),
                 content: b64enc(JSON.stringify(load())) };
    if (sha) body.sha = sha;
    return gh(p, { method: "PUT", headers: headers(), body: JSON.stringify(body) })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) {
          throw new Error(why(r, true) + " — " + t.slice(0, 120)); });
        stamp();
      });
  }

  function push(sha) {
    guardWrite();
    if (sha !== undefined) return put(sha);
    return gh(PATH, { headers: headers() }).then(function (r0) {
      return r0.ok ? r0.json().then(function (j) { return put(j.sha); }) : put(null);
    });
  }

  /* 받고 → 합치고 → 올린다. 두 기기에서 같은 날 공부해도 서로 지우지 않는다.
     토큰이 없는 기기에서는 **받기까지만** 하고 조용히 끝낸다 (readonly). */
  function sync() {
    return pull().then(function (r) {
      // 비공개 저장소를 토큰 없이 치면 404 가 온다 — '파일이 아직 없음' 과 구분이
      // 안 되므로 empty 를 그대로 넘겨 부르는 쪽이 솔직하게 말하게 한다.
      if (!canWrite()) { stamp(); return { n: r.n, readonly: true, empty: r.empty }; }
      if (!r.ahead) { stamp(); return { n: r.n, uptodate: true }; }
      return put(r.empty ? null : r.sha).then(function () { return { n: r.n }; });
    });
  }
  function stamp() { var c = cfg(); c.last = Date.now(); setCfg(c); }
  /* 마지막으로 맞춘 뒤 ms 가 지났나 — 새로고침마다 무턱대고 치지 않게 한다 */
  function stale(ms) {
    var c = cfg();
    return !c.last || (Date.now() - c.last) > (ms || 120000);
  }

  return { cfg: cfg, setCfg: setCfg, ready: ready, canWrite: canWrite, where: where,
           load: load, save: save, merge: merge, pull: pull, push: push, sync: sync,
           stale: stale };
})();

</script>
<script>
const UNITS = [{"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/계획급수량-산정", "name": "계획급수량-산정", "title": "계획급수량의 산정", "ch": 1, "chTitle": "상수도시설 계획", "ord": 4, "file": "n-5b24cafdbe.html", "card": {"oneline": "도시가 쓰는 물은 하나인데 재는 시선이 셋(<strong>1일 평균 · 1일 최대 · 시간 최대</strong>)이고, 시설마다 어느 시선으로 지을지가 정해져 있다. 배율은 <strong>100 : 150 : 225</strong>.", "bone": [{"n": "1", "t": "급수량과 그 구성", "subs": ["급수량과 원단위", "사용목적별 구성", "소화용수"]}, {"n": "2", "t": "계획급수량 3종", "subs": ["계획 1일 평균급수량", "계획 1일 최대급수량", "계획 시간 최대급수량"]}, {"n": "3", "t": "시설별 설계기준", "subs": ["어느 급수량으로 무엇을 짓나", "완충 저류가 갈림길"]}], "link": [{"k": "목적", "html": "<p>시설은 평균이 아니라 <strong>감당해야 할 첨두</strong>로 지어야 한다. 평균 용량으로 지으면 아침 첨두에 수압이 무너진다. 그 첨두를 숫자로 붙잡은 것이 1일 최대·시간 최대이고, 이 값들이 뒤 단원(취수·도수·송수·정수·배수) 설계의 입구 숫자가 된다 ― 제1장의 관문이다.</p>\n"}, {"k": "연결", "html": "<p>정수장 용량을 얼마로 잡을지 정해야 한다고 하자. 1년에 쓴 물을 365 로 나눈 하루 평균이면 될 것 같지만, 그렇게 지으면 아침 7시에 수압이 무너진다. 수요가 시각마다 계절마다 요동치기 때문이다. 그러니 설계기준은 평균이 아니라 <strong>감당해야 할 첨두</strong>여야 한다.</p>\n<p>먼저 <strong>무엇을 재는지</strong>부터 정한다⁠<sup class=\"rs\">1-1</sup>. 상수도가 세는 단위는 도시 총량이 아니라 1인이 하루에 쓰는 <strong>원단위</strong>이고, 인구를 곱해야 총량이 된다 ― 두 표현을 섞어 읽으면 답이 통째로 어긋나므로 이 단원에서 가장 많이 틀리는 자리다. 그 값을 정할 때 무엇을 보는지도 여기 붙는데, 방향은 하나다. 덥고 잘살고 잘 갖춰지고 공장이 많으면 더 쓴다.</p>\n<p>그 안에 무엇이 들어가는지는 <strong>성격이 셋으로 갈린다</strong>⁠<sup class=\"rs\">1-2</sup>. 가정·영업·공업·공공용수는 실제로 쓴 물이고, 불명수량은 쓴 것이 아니라 <strong>새는 물</strong>이며, 소화용수는 평상 수요가 아니라 화재 대비다. 새는 물인데도 설계 급수량에 반드시 더하는 것은 그만큼 흘려야 수요지에 도달하기 때문이다. 소화용수만 배분값이 없는 이유도 성격에서 나온다⁠<sup class=\"rs\">1-3</sup> ― 평상시에는 거의 0 이다가 화재 시 몇 분 안에 폭발하므로, 소도시에서는 시설 규모가 이 값으로 정해지기도 한다. 농업용수와 대규모 공장 용수가 여기서 빠지는 것은 1절에서 수도법이 그은 선이 돌아온 것이다.</p>\n<p>무엇을 재는지 정했으면 <strong>언제를 기준으로 재는가</strong>로 넘어간다⁠<sup class=\"rs\">2</sup>. 같은 도시 같은 사람들이 쓰는 물인데, 1년 치를 평균 내면 1일 평균이고⁠<sup class=\"rs\">2-1</sup>, 그중 가장 많이 쓴 날을 보면 1일 최대이며⁠<sup class=\"rs\">2-2</sup>, 그 날 안에서 가장 몰린 한 시간을 보면 시간 최대다⁠<sup class=\"rs\">2-3</sup>. 뒤로 갈수록 커지고 그 배율이 첨두계수인데, 부하율과 첨두부하율이 서로 <strong>역수</strong>라는 것만 잡으면 네 숫자가 두 숫자로 줄어든다.</p>\n<p>여기서 교재가 계수만 던지고 넘어가는 자리가 하나 있다 ― <strong>왜 도시가 작을수록 계수가 큰가.</strong> 사용자 수가 아니라 <strong>수요의 성격이 섞여서</strong> 봉우리끼리 골을 메우기 때문이다. 주거 일변도인 소도시는 아침저녁 봉우리가 그대로 남지만, 대도시는 상업과 공업과 교대근무가 겹쳐 골이 메워진다. 그리고 시간 최대는 1일 최대를 24 로 나눈 뒤 <strong>다시</strong> 첨두계수를 곱하므로 첨두를 두 번 쌓은 값이 되고, 세 값의 비가 100 : 150 : 225 로 정리된다.</p>\n<p>세 값이 준비되면 마지막은 <strong>어느 시설을 어느 값으로 짓느냐</strong>다⁠<sup class=\"rs\">3-1</sup>. 배정은 외울 목록처럼 보이지만 규칙은 하나다⁠<sup class=\"rs\">3-2</sup> ― 그 지점 앞에 <strong>완충 저류가 있느냐</strong>. 저수지가 계절을 통째로 흡수해 주는 상류는 장기 평균으로 충분하고, 취수에서 정수까지는 시간 첨두를 하류의 배수지가 흡수해 주니 가장 많이 쓴 날의 하루치만 감당하면 되며, 배수지를 지나 완충이 사라진 하류는 아침 첨두 한 시간을 그대로 흘려보내야 한다. 상류일수록 평균에 가깝고 하류일수록 첨두에 가깝다.</p>\n<p>세 값은 서로 다른 물이 아니다. <strong>같은 물을 다른 창으로 들여다본 것</strong>이다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 원단위와 총량의 차이\n② 세 급수량이 각각 무엇을 재고 왜 뒤로 갈수록 커지나\n③ 왜 시설마다 기준이 다른가</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/계획급수인구의-추정", "name": "계획급수인구의-추정", "title": "계획급수인구의 추정", "ch": 1, "chTitle": "상수도시설 계획", "ord": 3, "file": "n-ba34e98937.html", "card": {"oneline": "시설 크기는 오늘의 사람 수가 아니라 목표연도의 사람 수로 정해진다. 그래서 이 단원은 하나뿐이다 ― 과거 인구라는 점 몇 개에 <strong>어떤 모양의 곡선을 씌워 앞으로 늘여 그릴 것인가</strong>.", "bone": [{"n": "1", "t": "무엇을 추정하나 ― 계획급수인구와 급수보급률", "subs": ["계획급수인구와 급수보급률", "외삽이라는 문제 ― 곡선의 모양이 답을 정한다", "추정의 신뢰도를 좌우하는 세 가지"]}, {"n": "2", "t": "자기 자료로 늘여 그리는 여섯 가지 식", "subs": ["등차급수법 ― 해마다 같은 인구수만큼", "등비급수법 ― 해마다 같은 비율로", "최소자승법 ― 모든 점을 한꺼번에", "지수곡선식 (Peggy 함수식법)", "감소증가율법 ― 남은 여유분에 비례해 사그라든다", "Logistic 곡선법 (논리곡선법)"]}, {"n": "3", "t": "어느 식을 고를 것인가", "subs": ["비상관법 ― 상위 지역 인구에 묻어간다", "타도시와의 비교법 ― 닮은 도시의 곡선을 빌린다"]}], "link": [{"k": "목적", "html": "<p>시설은 계획년한 15~20년을 내다보고 짓는다. 그러니 곱해야 할 인구는 <strong>지금이 아니라 목표연도의 인구</strong>다. 그런데 손에 있는 것은 과거의 점 몇 개뿐이고 답은 그 <strong>바깥</strong>에 있다 ― 정답이 하나로 정해지지 않는 외삽 문제라서 추정법이 여러 개인 것이다. 과대추정은 빈 시설에 돈을 묻는 일이고 과소추정은 몇 년 못 가 물이 모자라는 일이다. 이 값이 §4 총급수량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Q</mi><mo>=</mo><mi>q</mi><mo>×</mo><mi>N</mi><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>3</mn></mrow></msup></mrow></math></span> 의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>N</mi></mrow></math></span> 이다.</p>\n"}, {"k": "연결", "html": "<p>수도관 굵기도 정수장 용량도 펌프 크기도 전부 &quot;몇 명이 물을 쓰느냐&quot;에서 출발한다. 그런데 시설은 15~20년을 내다보고 짓는데 그때의 인구는 아무도 모른다. 손에 있는 것은 과거 인구조사 자료, 곧 <strong>점 몇 개</strong>뿐이고 구하려는 값은 그 점들의 바깥에 있다.</p>\n<p>그러니 늘여 그리기 전에 <strong>무엇을 늘여 그리는지</strong>부터 정해야 한다⁠<sup class=\"rs\">1-1</sup>. 상수도가 세는 인구는 급수구역 안의 총인구가 아니라 실제로 물을 받는 사람 수이고, 둘을 잇는 것이 급수보급률이다. 그래서 이 단원의 출발점은 인구 하나가 아니라 <strong>인구와 보급률 둘</strong>이다.</p>\n<p>여기까지 정하고 나면 곧바로 갈림길이 나온다⁠<sup class=\"rs\">1-2</sup>. 점 사이를 메우는 것이 아니라 점 바깥으로 밀고 나가는 <strong>외삽</strong>이라, 같은 점들을 지나는 곡선이 무수히 많고 미래로 갈수록 부챗살처럼 벌어진다. 그러니 식 이름보다 <strong>&quot;이 식은 무엇이 일정하다고 보는 모형인가&quot;</strong> 가 먼저다. 추정의 신뢰도를 좌우하는 것도 셋인데⁠<sup class=\"rs\">1-3</sup>, 그중 곡선 모양을 잘못 고르는 일이 가장 무겁다 ― 계산이 아무리 정확해도 모양이 틀리면 답이 틀린다.</p>\n<p>모양을 고르는 순간 식이 따라 나온다⁠<sup class=\"rs\">2</sup>. 여섯 가지가 줄줄이 나오지만 실은 <strong>두 번의 물음</strong>으로 갈린다. 첫째, 해마다 일정한 것이 무엇인가 ― 같은 인구 <strong>수</strong>가 일정하면 직선이 되고⁠<sup class=\"rs\">2-1</sup>, 같은 <strong>비율</strong>이 일정하면 복리로 불어나 지수곡선이 된다⁠<sup class=\"rs\">2-2</sup>. 그래서 앞은 과소평가로, 뒤는 과대평가로 기운다. 이 둘은 양 끝 두 점만 쓰므로 끝점 하나가 튀면 그 튐이 수십 년 뒤로 증폭되는데, 그 약점을 메우려고 자료 전체에 맞추는 최소자승법⁠<sup class=\"rs\">2-3</sup>과 곡선까지 맞추는 지수곡선식⁠<sup class=\"rs\">2-4</sup>이 나온다.</p>\n<p>둘째 물음은 <strong>끝이 있는가</strong>이다. 앞의 넷은 전부 계속 는다고 보지만 현실의 도시에는 물리적 한계, 곧 포화인구가 있다. 늘어나는 몫이 <strong>남은 여유분</strong>에 비례해 사그라든다고 보면 감소증가율법이 되고⁠<sup class=\"rs\">2-5</sup>, 증가 속도를 <strong>지금 사람 수와 남은 여지의 곱</strong>에 비례시키면 초기 완만 구간이 생겨 S자가 된다⁠<sup class=\"rs\">2-6</sup>. 두 식의 차이는 그 한 줄뿐이고, 포화인구를 먼저 추정해야 한다는 부담은 둘이 함께 진다.</p>\n<p>그런데 자기 자료가 아예 못 미더운 도시도 있다⁠<sup class=\"rs\">3</sup>. 이때는 더 크고 안정적인 <strong>남의 인구에 묻어간다</strong> ― 상위 지역과의 비율이 유지된다고 보는 비상관법⁠<sup class=\"rs\">3-1</sup>, 닮은 도시의 곡선을 빌려 오는 타도시 비교법⁠<sup class=\"rs\">3-2</sup>이다. 둘 다 계산보다 <strong>누구에게 기대느냐</strong>가 정확도를 정한다.</p>\n<p>여섯 식을 외우는 단원이 아니다. <strong>곡선의 모양을 고르는 단원</strong>이다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 계획급수인구와 급수구역 총인구의 차이, 둘을 잇는 것\n② 왜 &quot;정답 공식&quot;이 없는가\n③ 여섯 식이 갈리는 두 번의 물음</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/마시는물의수질기준", "name": "마시는물의수질기준", "title": "마시는 물의 수질기준", "ch": 2, "chTitle": "수질관리", "ord": 1, "file": "n-7b0894094b.html", "card": {"oneline": "&quot;깨끗한 물&quot; 은 느낌이 아니라 숫자로 정한다. 마셔서 탈이 나는 이유가 여러 갈래라서 기준도 그 갈래대로 나뉜다 ― <strong>어느 갈래인지를 알면 기준값의 자릿수가 보인다.</strong>", "bone": [{"n": "1", "t": "수질기준의 뼈대와 미생물에 관한 기준", "subs": ["다섯 갈래로 갈리는 까닭", "미생물에 관한 기준", "대장균군 ― 병원균을 대신 세는 지표"]}, {"n": "2", "t": "건강상 유해영향 물질 ― 무기물질과 유기물질", "subs": ["건강상 유해영향 무기물질", "건강상 유해영향 유기물질", "페놀 ― 값과 &quot;왜&quot; 를 함께 묻는다"]}, {"n": "3", "t": "소독제·소독부산물질과 심미적 영향물질", "subs": ["소독제 및 소독부산물질", "심미적 영향물질", "수도전에서 먹는 물의 잔류염소"]}, {"n": "4", "t": "상수원수의 수질기준", "subs": ["상수원수(하천) 수질기준", "원수 수질에 따른 정수처리방법", "간이급수시설의 8항목"]}], "link": [{"k": "목적", "html": "<p>1장이 세운 3요소 중 <strong>質</strong> 을 정면으로 다루는 자리. &quot;고친다·지킨다&quot; 를 말하려면 <strong>다 고쳤다는 합격선</strong>이 먼저 있어야 한다. 없으면 처리목표·급수 판정·상수원 비교가 전부 불가능하다.</p>\n<p>교재 핵심문제 11문항 중 9문항이 &quot;기준값이 틀린 것은?&quot; 꼴 ― <strong>값을 직접 묻는 절</strong>이다.</p>\n"}, {"k": "연결", "html": "<p>값이 아니라 <strong>갈래</strong>부터(⁠<sup class=\"rs\">1</sup>, 미생물 기준 + 지표라는 발상) → 몸에 쌓이는 것 둘(⁠<sup class=\"rs\">2</sup>, 무기·유기) → 성격이 뒤집힌 둘(⁠<sup class=\"rs\">3</sup>, 고치다 생긴 것 · 해롭지 않은 것 + 잔류염소) → 방향을 거꾸로(⁠<sup class=\"rs\">4</sup>, 원수 등급 → 처리를 얼마나).</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 60개가 넘는 항목을 다섯으로 묶는 기준은 무엇인가\n② 미생물 기준값의 성격은 왜 다른 갈래와 다른가\n③ 원수 등급과 먹는 물 기준은 방향이 어떻게 다른가</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/물의자정능력", "name": "물의자정능력", "title": "물의 자정능력", "ch": 2, "chTitle": "수질관리", "ord": 2, "file": "n-e1dc58aa79.html", "card": {"oneline": "하천은 스스로 낫는다 ― 그 일을 하는 것은 결국 미생물이고, 미생물은 산소를 쓴다. 그래서 <strong>자정의 대가가 용존산소</strong>이고, 산소 살림이 감당되는지가 자정능력의 한계선이다.", "bone": [{"n": "1", "t": "자정작용 ― 무엇이 물을 낫게 하나", "subs": ["자정작용의 정의", "세 갈래 인자", "자정작용이 활발해지는 조건"]}, {"n": "2", "t": "자정계수 ― 자정능력을 숫자로 재기", "subs": ["탈산소와 재폭기", "자정계수 f", "자정계수를 좌우하는 인자", "자정계수를 키우는 공학적 개입"]}, {"n": "3", "t": "하천의 수질변화 ― Whipple 의 4단계", "subs": ["4단계의 순서", "산소가 남아 있는 동안 ― 앞의 두 지대", "산소가 돌아온 뒤 ― 뒤의 두 지대"]}], "link": [{"k": "목적", "html": "<p>1절이 세운 것 = 마실 만한 물의 합격선(숫자). 이 절이 보는 것 = <strong>더러워진 물이 스스로 돌아오는 과정.</strong>\n1절의 BOD·DO 가 여기서 주인공이 된다.</p>\n<p>없으면 못 하는 것 ― 방류 허용량 판단 / 하천에서 가장 나쁜 지점의 예측 / 자정을 돕는 공학적 수단의 근거.</p>\n"}, {"k": "연결", "html": "<p>무엇이 낫게 하나(⁠<sup class=\"rs\">1</sup>, 세 갈래와 주역) → 낫는 대가를 숫자로(⁠<sup class=\"rs\">2</sup>, 소비 대 공급의 비) →\n그 결과를 하류 거리에 펼쳐 놓기(⁠<sup class=\"rs\">3</sup>, 네 단계).</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 세 갈래 중 어느 것이 주역이고, 왜 나머지 둘은 주역이 될 수 없나\n② 자정을 하는데 왜 용존산소가 오히려 떨어지나\n③ DO 최저점이 왜 투입 지점이 아니라 그 하류에 생기나</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/상수도시설의기본계획", "name": "상수도시설의기본계획", "title": "상수도 시설의 기본계획", "ch": 1, "chTitle": "상수도시설 계획", "ord": 2, "file": "n-69bd1c661f.html", "card": {"oneline": "관을 묻기 전에 <strong>언제까지 · 어디에 · 몇 명에게</strong> 를 먼저 못 박는 절. 1절의 3요소에 <strong>시간축</strong>을 붙인 것이 기본계획이고, 여기서 정한 값이 그대로 §3·§4 의 입력이 된다.", "bone": [{"n": "1", "t": "계획년도 ― 언제까지를 내다보고 짓나", "subs": ["뜻과 기본계획 목표년도", "시설별 설계 계획기간", "계획년도 결정 시 고려사항"]}, {"n": "2", "t": "계획 급수구역과 계획 급수인구 ― 어디에 · 몇 명에게", "subs": ["계획 급수구역", "계획 급수인구", "급수보급률과 Goodrich 공식"]}, {"n": "3", "t": "기본계획의 조사사항 ― 3요소가 조사항목으로 돌아온다", "subs": ["조사사항", "기본계획 = 3요소 + 시간축"]}], "link": [{"k": "목적", "html": "<p>시설은 수십 년 쓰는데 짓는 결정은 지금 해야 한다. 오늘 수요에 맞추면 곧 모자라 도로를 다시 파고, 넉넉히 지으면 쓰지 않는 용량에 돈이 묶인다. 그래서 <strong>&quot;어느 시점의 수요에 맞출 것인가&quot;</strong> 를 먼저 정하는 일이 기본계획이다. 이 절이 없으면 §3 은 어느 해의 인구를 추정할지 정할 수 없고 §4 는 곱할 인구가 없다 ― <strong>뒤 두 절의 입력값을 만드는 절</strong>이다.</p>\n"}, {"k": "연결", "html": "<p>관을 묻으려면 도로를 파야 하고, 정수장을 키우려면 땅을 더 사야 하고, 댐은 아예 다시 지을 수 없다. 그런데 짓는 결정은 지금 해야 한다. 오늘 수요에 딱 맞게 지으면 몇 년 뒤에 모자라 도로를 다시 파고, 아주 넉넉히 지으면 쓰지 않는 용량에 돈이 수십 년 잠긴다. 그러니 <strong>어느 시점의 수요에 맞출 것인가</strong>를 먼저 정해야 한다.</p>\n<p>그래서 이 절은 <strong>시간</strong>부터 정한다⁠<sup class=\"rs\">1</sup>. 계획년도가 무엇인지 ― 어디서부터 재는 몇 년인지 ― 를 정의하고, 왜 무한정 길게 잡을 수 없는지를 본다⁠<sup class=\"rs\">1-1</sup>. 짧게 잡으면 확장 공사가 되풀이되고, 길게 잡으면 돈이 잠기는 데다 먼 미래의 수요 예측 자체가 못 미덥다. 양쪽 손실을 저울에 올린 결과가 표준 목표년도다.</p>\n<p>그런데 시설이라고 다 같지 않다⁠<sup class=\"rs\">1-2</sup>. 댐과 지름 20 cm 관을 같은 기간으로 계획하는 것은 말이 안 된다 ― 하나는 다시 지을 수 없고 하나는 필요할 때 갈아 끼우면 된다. 그래서 갈리는 축은 <strong>확장이 얼마나 어렵고 비싼가</strong> 하나이고, 표에 이자율이 끼어드는 것도 같은 저울 위의 일이다. 미리 크게 짓는 일은 먼 미래에 쓸 용량에 지금 돈을 묶는 일이니, 돈이 비싸면 미리 짓지 않는다. 그 기간을 실제로 정할 때 무엇을 따지는지가 결정 고려사항인데⁠<sup class=\"rs\">1-3</sup>, 시설·도시·돈 세 갈래로 묶으면 앞의 저울과 그대로 짝이 맞는다.</p>\n<p>시간이 정해지면 그 시점의 <strong>공간과 사람</strong>이 정해진다⁠<sup class=\"rs\">2</sup>. 급수구역은 &quot;계획년도에 급수가 되는 지역&quot;이라 정의되므로 <strong>시간축이 먼저 있어야 정의 자체가 성립한다</strong>⁠<sup class=\"rs\">2-1</sup>. 그 경계선도 행정구역선이 아니라 표고와 거리가 그리는 경제선인데, 1절에서 본 자연유하와 펌프가압의 판단이 여기로 돌아온다. 그 구역 안에서 세는 사람은 총인구가 아니라 <strong>실제로 물을 받는 사람</strong>이고⁠<sup class=\"rs\">2-2</sup>, 낮에만 머무는 사람이 쓰는 물은 영업·공공용수에서 이미 세었으므로 인구로 또 세면 이중계산이 된다. 총인구와 급수인구를 잇는 값이 보급률이고⁠<sup class=\"rs\">2-3</sup>, 같은 자리에 Goodrich 식이 붙는다 ― 한 지면의 두 백분율이 하나는 사람의 비, 하나는 물량의 비라는 것만 갈라 두면 헷갈리지 않는다.</p>\n<p>그리고 이 결정들을 <strong>무엇을 보고</strong> 내리는지가 남는다⁠<sup class=\"rs\">3-1</sup>. 조사항목 여섯 중 앞 셋은 1절의 세 조건을 그대로 조사하는 항목이고, 뒤 셋은 시설을 실제로 땅에 놓을 때 부딪히는 조건이다. 3요소를 다 채워도 뒤 셋이 안 되면 시설은 못 짓는다. 그러니 기본계획은 결국 <strong>1절의 3요소에 시간축을 붙인 것</strong>이고⁠<sup class=\"rs\">3-2</sup>, 조사의 첫 항목이 지금 값에서 그치지 않고 장래 값까지 요구하는 것도 그 때문이다.</p>\n<p><strong>1절이 무엇을 갖추나였다면, 이 절은 언제까지·어디에·몇 명에게다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 계획년도를 짧게 / 길게 잡을 때 각각 무엇을 잃는가\n② 시설마다 계획기간이 다른 이유를 한 축으로\n③ 급수구역 총인구와 계획급수인구의 차이, 둘을 잇는 값</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/상수도의구성및계통", "name": "상수도의구성및계통", "title": "상수도의 구성 및 계통", "ch": 1, "chTitle": "상수도시설 계획", "ord": 1, "file": "n-5b641a4b28.html", "card": {"oneline": "시설 이름은 전부 &quot;한 줄기 흐름의 어느 구간을 맡는가&quot;로 정해진다. 이름을 외우는 단원이 아니라 <strong>순서를 붙잡는 단원</strong>이다.", "bone": [{"n": "1", "t": "상수도의 정의와 3요소", "subs": ["정의와 수도법이 그은 선", "3요소", "주요 용어", "수도의 종류"]}, {"n": "2", "t": "상수도의 계통", "subs": ["계통 한 줄", "수원과 취수", "도수와 송수 ― 정수장이 가른다", "정수", "배수와 급수", "순서 문제가 나오는 방식"]}, {"n": "3", "t": "계통을 읽는 눈", "subs": ["시설 계통 네 갈래", "지형이 계통을 정한다", "세 조건이 걸리는 자리"]}], "link": [{"k": "목적", "html": "<p>계통에 이름과 순서를 붙이는 자리다. 이름표가 없으면 뒤 단원이 공중에 뜬다 ― §4 는 <strong>시설 이름에 급수량을 배정</strong>하는 단원이므로 배정받을 이름이 먼저 있어야 한다. 교재 학습방향의 목적어도 &quot;정의&quot;가 아니라 <strong>흐름순서</strong>이고, 출제도 거의 전부 순서 나열형이다.</p>\n"}, {"k": "연결", "html": "<p>수도꼭지를 틀면 물이 나온다. 그 물을 거꾸로 따라가면 집 안의 가는 관에서 도로 아래 굵은 관, 동네보다 높은 곳의 못, 더 굵은 관, 공장 같은 시설, 또 관을 지나 강에 닿는다. 이 사슬에 이름과 순서를 붙이는 것이 이 절이다.</p>\n<p>먼저 <strong>무엇이 상수도인지</strong>부터 정해야 한다⁠<sup class=\"rs\">1-1</sup>. 물을 나르는 시설이라고만 하면 농사용 물길이나 공장 배관과 구별되지 않으므로 수도법이 선을 하나 긋는데, 그 선이 나중에 급수량 계산에서 농업용수를 빼는 근거로 다시 나온다. 그리고 이 시설이 만족시켜야 할 조건이 <strong>셋</strong>임을 못 박는다⁠<sup class=\"rs\">1-2</sup> ― 양이 모자라면 못 쓰고, 넉넉해도 더러우면 못 마시고, 깨끗해도 밀어 주는 힘이 없으면 3층까지 올라가지 않는다. 세 번째만 &quot;많을수록 좋다&quot;가 아닌 것도 눈여겨볼 만한데, 낮으면 안 올라가고 높으면 관이 터지기 때문이다. 같은 자리에서 기본 용어와⁠<sup class=\"rs\">1-3</sup> 법이 나눈 수도의 종류가⁠<sup class=\"rs\">1-4</sup> 함께 정리되는데, 종류를 가르는 축이 <strong>누가 쓰나</strong> 하나라는 것만 잡으면 목록이 저절로 선다.</p>\n<p>그다음이 이 절의 본체인 <strong>계통</strong>이다⁠<sup class=\"rs\">2</sup>. 여기서 붙잡을 것은 낱말 일곱 개가 아니라 <strong>왜 그 순서여야 하는가</strong>다⁠<sup class=\"rs\">2-1</sup>. 물은 자연에 있고 사람은 도시에 있으니 꺼내서 옮기는 일이 먼저 오고, 옮긴 물은 아직 마실 수 없으니 고치는 일이 그다음이며, 고친 물을 다시 옮겨 나눈 뒤 마지막에 집집마다 꽂는다. 이 순서에는 되돌아가는 화살표가 없다.</p>\n<p>한 구간씩 보면, 꺼내는 일은 수원이 무엇이냐에 매여 있어서 취수시설의 이름도 <strong>수원과 짝을 지어</strong> 외워야 한다⁠<sup class=\"rs\">2-2</sup>. 그리고 <strong>옮기는 일이 두 번 나오고 두 이름이 다르다</strong>⁠<sup class=\"rs\">2-3</sup>. 시험이 가장 많이 흔드는 자리인데 가르는 기준은 하나뿐이다 ― 정수장 앞이냐 뒤냐. 앞은 어차피 뒤에서 고칠 원수를 나르니 개수로가 원칙이고, 뒤는 고친 물을 다시 더럽힐 수 없으니 관수로가 원칙이다. 그 사이에 놓인 정수가 <strong>물의 성질을 손대는 유일한 구간</strong>이고⁠<sup class=\"rs\">2-4</sup>, 고치는 일을 한곳에 모으기로 한 이 결정이 계통을 둘로 가른다. 정수장 안의 순서도 큰 것에서 작은 것, 보이지 않는 것으로 가는 논리라 뒤집을 수 없다.</p>\n<p>고친 물은 다시 도시로 나가는데, 나누는 구간의 정의에는 <strong>압과 양이 함께</strong> 들어 있어 수압 계산의 무대가 된다⁠<sup class=\"rs\">2-5</sup>. 여기서 배수지가 왜 필요한지도 설명된다 ― 정수장은 일정하게 돌리는 편이 싸고 도시의 수요는 아침저녁에 몰리니, 그 어긋남을 흡수할 자리가 있어야 한다. 담아둔 높이가 그대로 수압이 되는 것도 같은 시설이 하는 일이다. 계통이 이렇게 서면 순서 문제가 어떤 식으로 흔들리는지도 한눈에 정리된다⁠<sup class=\"rs\">2-6</sup>.</p>\n<p>계통을 세워 두면 그 위에서 <strong>읽히는 것들</strong>이 생긴다⁠<sup class=\"rs\">3</sup>. 교재가 시설을 네 갈래로 묶는 방식이 그렇고⁠<sup class=\"rs\">3-1</sup>, 그중 하나는 물이 아니라 정보가 흐르는 계통이라 흐름도에 자리가 없다. 지형의 높낮이가 구간마다 자연유하와 펌프를 갈라놓는 방식도 계통 위에서만 읽히는데⁠<sup class=\"rs\">3-2</sup>, 정수장은 낮은 데 배수지는 높은 데 있어야 한다는 두 요구가 충돌하는 자리에 펌프가 들어간다. 마지막으로 앞에서 세운 세 조건이 계통의 어느 구간에 각각 걸리는지를 얹으면⁠<sup class=\"rs\">3-3</sup>, 나머지 단원이 전부 이 한 줄 위의 어느 구간인지로 정리된다.</p>\n<p>이름은 흐름에서 나온다. <strong>순서를 알면 이름이 따라오고, 이름만 외우면 순서에서 틀린다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 세 조건은 무엇이고 왜 하나라도 빠지면 안 되는가\n② 수원에서 수도꼭지까지 구간을 순서대로\n③ 두 번 나오는 &quot;옮김&quot;의 이름이 왜 다른가 ― 한 줄로</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/수질검사및수질오염지표", "name": "수질검사및수질오염지표", "title": "수질검사 및 수질오염지표", "ch": 2, "chTitle": "수질관리", "ord": 4, "file": "n-b21ba3a315.html", "card": {"oneline": "&quot;물이 얼마나 더러운가&quot; 를 직접 잴 방법은 없다. 오염물질이 수천 가지니 <strong>그것들이 공통으로 하는 일 ― 산소를 먹는 것 ― 을 대신 잰다.</strong> 어떻게 먹이느냐로 지표가 갈리고, 무엇까지 세느냐로 값이 갈린다. 지표는 오염 그 자체가 아니라 <strong>오염의 그림자</strong>다.", "bone": [{"n": "1", "t": "수질검사 ― 무엇을 어떤 방법으로 재나", "subs": ["네 갈래 검사 방법", "세균학적 검사와 대장균", "정기 수질검사 ― 무엇을 얼마나 자주"]}, {"n": "2", "t": "산소로 재는 오염 ― BOD · COD · DO", "subs": ["BOD ― 미생물에게 먹여서 재는 값", "계산식 ― 잔존량과 소비량", "COD ― 산화제로 태워서 재는 값", "DO ― 쓰고 남은 산소"]}, {"n": "3", "t": "물 자체의 성질로 재는 지표 ― pH 와 경도", "subs": ["수소이온 농도(pH)", "경도(Hardness)"]}, {"n": "4", "t": "오염물질의 희석 후 혼합 농도", "subs": ["질량보존으로 세우는 식"]}], "link": [{"k": "목적", "html": "<p>앞 세 절은 값이 이미 손에 있다고 전제했다. 이 절은 <strong>그 값이 어떻게 나오는지</strong>를 답한다.\n재는 법이 없으면 기준도, 방류 허용량도, 부영양화 판정도 없다.</p>\n<p>1절의 대장균(병원균을 못 세니 대신 센다)이 쓴 <strong>지표의 논리</strong>를 오염물질 전체로 넓힌 것이 이 절이다.</p>\n"}, {"k": "연결", "html": "<p>재는 방법의 갈래⁠<sup class=\"rs\">1</sup> → 산소로 재는 세 지표와 그 계산⁠<sup class=\"rs\">2</sup> → 물 자신의 성질로 재는 둘⁠<sup class=\"rs\">3</sup> → 섞였을 때의 농도⁠<sup class=\"rs\">4</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 오염 정도를 왜 직접 재지 않고 산소소비량으로 대신 재는가\n② 미생물에게 먹이는 것과 산화제로 태우는 것은 결과가 어떻게 달라지는가\n③ 물이 오염되면 왜 용존산소가 떨어지고, 왜 다시 오르는가</p>\n"}}, {"subj": "상하수도공학", "subjName": "상하수도공학", "sid": "s-5da170", "unit": "상하수도공학/호소의물순환및부영양화", "name": "호소의물순환및부영양화", "title": "호소의 물순환 및 부영양화", "ch": 2, "chTitle": "수질관리", "ord": 3, "file": "n-63363687a5.html", "card": {"oneline": "흐르지 않는 물은 자정 방식이 다르다 ― 위아래로 층이 갈려 섞이지 않으니 <strong>바닥이 먼저 썩고</strong>, 거기에 영양염이 쌓이면 조류가 폭발한다. 갈림길은 오직 하나, <strong>위아래의 밀도가 같아지느냐</strong>다.", "bone": [{"n": "1", "t": "호소의 물순환", "subs": ["물의 밀도 ― 한 온도에서만 가장 무겁다", "수심에 따라 갈리는 세 층", "계절이 층을 만들고 허문다", "취수 ― 언제 뜨고 어디서 뜨나"]}, {"n": "2", "t": "부영양화(Eutrophication)", "subs": ["정의와 형성조건", "일어나는 일 ― 조류에서 시작하는 사슬", "판정 지표", "대책 ― 사슬의 어느 고리를 끊나"]}, {"n": "3", "t": "적조 및 녹조현상(Red Tide)", "subs": ["정의", "무엇이 어패류를 죽이나"]}], "link": [{"k": "목적", "html": "<p>2절의 자정은 <strong>흐르는 물</strong>의 이야기였다. 수원의 대부분인 저수지·호수는 갇혀 있다.\n없으면 못 하는 것 ― 바닥이 왜 썩는지 / 계절에 따라 취수 수질이 왜 달라지는지 / 호소에서 왜 조류가 폭발하는지.</p>\n"}, {"k": "연결", "html": "<p>물의 밀도 하나로 층이 갈리는 것을 세우고⁠<sup class=\"rs\">1</sup>, 그 위에 영양염과 생물을 얹는다⁠<sup class=\"rs\">2</sup>. 같은 일이 해역에서 벌어진 것이 ⁠<sup class=\"rs\">3</sup>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 층이 갈리는 까닭을 물의 밀도 하나로 설명할 수 있나\n② 계절이 바뀌면 무엇이 달라져서 층이 무너지는가\n③ 부영양화의 원인에서 결과까지를 끊기지 않는 사슬로 말할 수 있나</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/단위와차원", "name": "단위와차원", "title": "단위와 차원", "ch": 1, "chTitle": "유체의 기본 성질", "ord": 3, "file": "n-2be97116ed.html", "card": {"oneline": "차원은 물리량의 <strong>종류</strong>, 단위는 그것을 재는 <strong>눈금</strong>. 외울 표가 아니라 <strong>식이 맞는지 검사하는 도구</strong>다.", "bone": [{"n": "1", "t": "단위계와 차원", "subs": ["차원과 단위", "두 단위계", "정의에서 차원을 만든다", "단위계 변환", "자주 쓰는 환산값"]}, {"n": "2", "t": "차원해석 ― 식을 검사하고 만드는 데 쓴다", "subs": ["차원 동차성", "실제로 검사한다", "무차원량과 상사"]}], "link": [{"k": "목적", "html": "<p>세 가지가 필요해서 이 절이 있다. ① kgf 계 문제와 SI 문제를 오가야 한다 ― 못 하면 답이 정확히 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 배 틀리는데 검산으로 잘 안 잡힌다. ② 내가 쓴 식이 맞는지 <strong>스스로 검사</strong>할 잣대가 있어야 한다. ③ 크기가 다른 모형과 실물을 견주려면 <strong>무차원수</strong>가 있어야 한다.</p>\n"}, {"k": "연결", "html": "<p>어떤 문제는 물의 단위중량을 1 g/cm³ 로 주고 어떤 문제는 9.81 kN/m³ 로 준다. 같은 물의 같은 성질인데 숫자가 9,810 배 다르다. 게다가 앞 두 절에서 만든 식을 옮겨 적다가 지름을 위아래로 바꿔 놓아도 답은 그냥 나온다 ― 맞는지 확인할 방법이 없다. 이 절은 그 둘을 각각 해결한다.</p>\n<p>먼저 <strong>차원과 단위를 갈라야</strong> 한다⁠<sup class=\"rs\">1-1</sup>. 둘을 섞어 쓰면 &quot;cm 를 m 로 바꾸는 일&quot;과 &quot;밀도를 단위중량으로 바꾸는 일&quot;이 같은 일처럼 보이는데, 앞은 눈금만 바꾸는 일이라 언제나 가능하고 뒤는 <strong>질량에서 힘으로 건너가는 일</strong>이라 중력가속도를 곱해야 한다. 구분이 서면 단위계가 왜 둘인지도 자연스럽게 나온다⁠<sup class=\"rs\">1-2</sup> ― 물리학은 장소가 바뀌어도 안 변하는 질량을 기본으로 잡았고, 공학 현장은 저울로 바로 재는 힘을 기본으로 잡았다. 둘을 잇는 다리는 오직 하나, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>F</mi><mo>=</mo><mi>m</mi><mi>a</mi></mrow></math></span> 다.</p>\n<p>그다음이 이 절의 진짜 알맹이다. 파생량의 차원은 외우는 것이 아니라 <strong>정의에서 만들어 내는 것</strong>이다⁠<sup class=\"rs\">1-3</sup>. 속도는 길이를 시간으로 나눈 것이니 곧바로 나오고, 밀도는 질량을 부피로 나눈 것이니 그대로 나온다. 정의를 한글로 읽을 수만 있으면 표 전체가 그 자리에서 복원된다. 여기까지 오면 단위계 변환도 두 단계로 정리된다⁠<sup class=\"rs\">1-4</sup> ― <strong>차원을 바꾸고, 중력가속도를 처리한다.</strong> 질량에서 힘으로 갈 때는 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 를 곱해 흡수시키고, 힘에서 질량으로 갈 때는 숨어 있던 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 가 밖으로 나온다. 자주 쓰는 환산값도 함께 정리해 두는데⁠<sup class=\"rs\">1-5</sup>, 여기서도 차원이 다른 것끼리는 애초에 환산되지 않는다는 원칙이 그대로 검사기가 된다.</p>\n<p>도구가 서면 <strong>쓸 차례</strong>다⁠<sup class=\"rs\">2</sup>. 등호의 양변은 차원이 같아야 하고 더하고 빼는 항끼리도 같아야 한다⁠<sup class=\"rs\">2-1</sup> ― 법칙이 눈금을 바꿔도 성립해야 하기 때문이다. 이 한 줄이 검사기가 되어 앞 절들의 식을 몇 초 만에 확인해 주고, 일부러 틀리게 적은 식은 계산기 없이 걸러 낸다⁠<sup class=\"rs\">2-2</sup>. 게다가 나온 차원이 무엇인지가 <strong>어디를 고칠지까지</strong> 알려 준다. 다만 이 검사는 필요조건일 뿐이라 무차원 계수는 못 잡는다 ― 2절의 4 와 2 를 바꿔 써도 차원은 통과한다. 마지막으로 차원이 통째로 지워진 양들을 본다⁠<sup class=\"rs\">2-3</sup>. 눈금을 바꿔도 값이 변하지 않으므로 <strong>크기가 다른 모형과 실물을 견주는 유일한 언어</strong>가 되고, 뒷장의 상사와 모형실험이 전부 여기에 얹힌다.</p>\n<p>차원은 <strong>종류</strong>, 단위는 <strong>눈금</strong>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 차원과 단위의 차이\n② 두 단위계를 잇는 다리\n③ 차원 검사의 두 규칙과 그 검사가 못 잡는 것</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/부체와상대정지", "name": "부체와상대정지", "title": "부체와 상대정지", "ch": 2, "chTitle": "정수역학", "ord": 3, "file": "n-3d6084d599.html", "card": {"oneline": "물은 밀어낸 부피만큼의 제 무게로 물체를 떠받친다. 뜨느냐는 크기 싸움, 안 뒤집히느냐는 작용점 싸움. 그릇째 움직이면 수면은 중력에 관성력을 더한 방향에 직각으로 앉는다.", "bone": [{"n": "1", "t": "부력 ― 물이 떠받치는 힘", "subs": ["압력차가 곧 부력이다", "뜨는가 가라앉는가 ― 부체의 평형 일반식", "부체에서 눈여겨보는 자리들"]}, {"n": "2", "t": "부체의 안정", "subs": ["기울면 부심이 옮겨 간다 ― 경심", "경심고", "안정 판정"]}, {"n": "3", "t": "상대정지", "subs": ["겉보기 중력 ― 세 경우를 꿰는 하나", "수평 등가속도", "연직 등가속도", "등속 회전하는 원통 속의 수면"]}], "link": [{"k": "목적", "html": "<p>얼마나 잠기는지를 모르면 얼마나 실을 수 있는지 못 정하고, 기울었을 때 되돌아오는지를 모르면 뒤집힌다. 앞은 힘의 <strong>크기</strong>, 뒤는 힘의 <strong>작용 위치</strong> 문제다. 상대정지는 그릇이 움직이는데 물은 그릇에 대해 정지한 상황 ― 흐름이 아니라 아직 정수역학이다.</p>\n"}, {"k": "연결", "html": "<p>배 한 척에 짐을 얼마나 실을 수 있는지, 그리고 한쪽에 몰아 실었을 때 뒤집히지 않는지를 답해야 한다고 하자. 앞은 힘의 <strong>크기</strong> 문제이고 뒤는 힘의 <strong>작용 위치</strong> 문제다.</p>\n<p>먼저 물이 물체를 떠받치는 힘부터 세운다⁠<sup class=\"rs\">1-1</sup>. 새 원리가 아니라 1절 결과의 뺄셈이다 ― 옆면은 좌우가 같은 깊이라 상쇄되고, 아랫면이 윗면보다 깊어 더 세게 밀리므로 그 차이가 위로 남는다. 정리해 보면 남는 것이 <strong>밀어낸 부피에 유체의 단위중량을 곱한 값</strong>이고, 2절 곡면의 연직분력과 같은 논리다.</p>\n<p>이 힘과 무게를 저울에 올리면 &quot;얼마나 잠기나&quot;가 곧바로 나온다⁠<sup class=\"rs\">1-2</sup>. 떠 있을 때는 <strong>잠긴 비율이 곧 비중비</strong>가 되므로 빙산 유형의 문제가 전부 여기서 풀리고, 짐을 얹거나 가라앉는 경우도 같은 식의 특수한 경우로 정리된다. 뒤에서 쓸 자리들의 이름도 여기서 정해 둔다⁠<sup class=\"rs\">1-3</sup> ― 무게가 걸리는 무게중심과 부력이 걸리는 부심, 그리고 부양면과 흘수다. 평형이면 두 점이 같은 연직선 위에 있어야 하는데, 어긋나면 짝힘이 생겨 돌기 때문이다.</p>\n<p>그런데 <strong>뜨기만 해서는 안 된다.</strong> 짐을 한쪽에 실으면 배가 기운다. 그래서 작용 위치로 옮겨 간다⁠<sup class=\"rs\">2-1</sup>. 기울면 무게중심은 물체에 붙어 있어 제자리인데 부심은 잠긴 <strong>모양</strong>이 바뀌어 잠긴 쪽으로 옮겨 간다 ― 이 비대칭이 안정의 유일한 원천이다. 옮겨 간 부력의 작용선이 중심선과 만나는 점이 경심이고, 그 높이가 무게중심보다 위냐 아래냐로 되돌아오느냐 뒤집히느냐가 갈린다.</p>\n<p>그 높이 차이가 곧 안정의 척도이므로 이름을 붙이고 실제로 재는 법을 본다⁠<sup class=\"rs\">2-2</sup>. 하중을 옆으로 옮겨 기울인 뒤 기울이는 모멘트와 복원 모멘트를 같다고 놓으면 되는데, 각을 라디안으로 넣어야 한다는 것만 조심하면 된다. 계산으로 판정할 때는 부양면의 단면 2차 모멘트를 수중 부피로 나눈 값에서 두 점 사이 거리를 뺀다⁠<sup class=\"rs\">2-3</sup>. 분모가 전체 부피가 아니라 <strong>수중 부피</strong>라는 것, 그리고 단면 2차 모멘트를 가장 작은 축으로 잡아야 한다는 것이 함정이다 ― 작은 쪽이 위험하니 가장 불리한 축으로 검토해야 한다.</p>\n<p>마지막은 주인공이 바뀐다⁠<sup class=\"rs\">3</sup>. 물체가 아니라 <strong>그릇</strong>이 움직이는데 물은 그릇에 대해 정지해 있는 경우다⁠<sup class=\"rs\">3-1</sup>. 물 입자끼리 상대운동이 없으니 전단이 없고, 그래서 정수역학이 그대로 성립한다. 함께 움직이는 좌표에서 보면 중력에 관성력이 더해진 하나의 방향이 남고, <strong>수면은 언제나 그 방향에 직각으로 앉는다.</strong> 세 경우를 따로 외울 필요가 없는 이유가 이것이다.</p>\n<p>수평으로 가속하면 겉보기 중력이 기울어 수면이 기운 평면이 되고⁠<sup class=\"rs\">3-2</sup>, 그 기울기가 곧 가속도와 중력가속도의 비다. 연직으로 가속하면 방향은 그대로라 수면이 평면인 채이고 <strong>압력만</strong> 변한다⁠<sup class=\"rs\">3-3</sup> ― 자유낙하하면 압력이 0 이 되는 것으로 검산된다. 등속으로 회전하면 관성력이 반지름에 비례해 커지므로 수면이 파인 곡면이 된다⁠<sup class=\"rs\">3-4</sup>. 바닥이 받는 힘은 그 안에 든 물의 무게인데, 안 넘쳤다면 가운데가 판 만큼 둘레가 깊어져 상쇄되므로 정지 때와 같다.</p>\n<p><strong>뜨느냐는 크기 싸움, 안 뒤집히느냐는 작용점 싸움.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 떠받치는 힘이 왜 &quot;밀어낸 물의 무게&quot;와 정확히 같은가\n② 뜨는 것과 안정한 것이 왜 다른 물음인가\n③ 상대정지 세 경우가 왜 한 뿌리인가</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/유체의기본성질", "name": "유체의기본성질", "title": "유체의 기본 성질", "ch": 1, "chTitle": "유체의 기본 성질", "ord": 1, "file": "n-119413004b.html", "card": {"oneline": "유체는 <strong>아무리 작은 전단응력에도 정지하지 못하고 계속 흐르는 물질</strong>이다. 그 정의에서 2장의 대전제(정지 → 전단응력 0 → 압력은 면에 수직)가 나오고, 나머지 용어는 전부 <strong>무게 쪽·점성 쪽 측정량</strong> 둘로 갈린다.", "bone": [{"n": "1", "t": "유체란 무엇인가 ― 전단응력을 못 버티는 물질", "subs": ["고체와 유체를 가르는 한 가지", "뉴턴의 점성법칙", "정지한 유체 ― 2장의 출발점"]}, {"n": "2", "t": "유체의 무게를 재는 양들 ― 밀도·단위중량·비중·비체적", "subs": ["밀도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ρ</mi></mrow></math></span> (= 비질량)", "중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>W</mi></mrow></math></span> 와 단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>γ</mi></mrow></math></span> (= 비중량)", "비중과 비체적", "네 양의 관계"]}, {"n": "3", "t": "유체의 점성을 재는 양들 ― 점성계수와 동점성계수", "subs": ["점성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>μ</mi></mrow></math></span>", "동점성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ν</mi></mrow></math></span>", "온도·압력에 따른 변화"]}], "link": [{"k": "목적", "html": "<p>계산을 시작하기 전에 <strong>&quot;물이란 어떤 물질인가&quot;</strong> 를 못 박고, 다음 장의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><msub><mi>γ</mi><mi>w</mi></msub><mi>h</mi></mrow></math></span> 에 넣을 숫자의 출처를 마련한다. 없으면 두 군데가 즉시 무너진다 ― 정지한 물의 압력이 왜 면에 수직으로만 작용하는지 설명할 수 없고, 밀도와 단위중량을 바꿔 써서 답이 정확히 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 배만큼 틀린다.</p>\n"}, {"k": "연결", "html": "<p>수도관 안의 물이 관벽을 얼마나 세게 미는지 계산해야 한다고 하자. 식에 넣을 숫자는 전부 물의 성질에서 나오는데, 그러려면 먼저 <strong>물이 어떤 물질인지</strong>를 정해야 한다. 강철도 힘을 받으면 변형하는데, 왜 강철은 &quot;흐른다&quot;고 하지 않는가.</p>\n<p>가르는 것은 무게도 모양도 아니고 <strong>전단응력 앞에서의 거동</strong> 하나다⁠<sup class=\"rs\">1-1</sup>. 고체는 저항이 변형량에 비례해서 어느 자리에선가 균형이 잡혀 멈추지만, 유체는 저항이 <strong>변형되는 빠르기</strong>에 비례해서 힘이 0 이 아닌 한 계속 흐른다. 이 정의를 그대로 식으로 옮긴 것이 뉴턴의 점성법칙이고⁠<sup class=\"rs\">1-2</sup>, 거기서 비례상수로 등장하는 것이 점성계수다. 고체의 훅의 법칙과는 자리 하나 차이인데 ― 변형각이 아니라 변형각의 <strong>변화율</strong>에 비례한다는 것이 그 차이다.</p>\n<p>그런데 이 정의를 거꾸로 읽으면 훨씬 큰 것이 나온다⁠<sup class=\"rs\">1-3</sup>. 물이 흐르지 않고 정지해 있다는 관찰 자체가 <strong>속도경사가 0</strong> 이라는 뜻이고, 그러면 전단응력이 0 이다. 면에 걸리는 힘은 나란한 성분과 수직 성분뿐이므로, 나란한 쪽이 사라지면 <strong>압력은 면에 수직으로만</strong> 남는다. 2장 정수압의 성질이 전부 이 한 줄 위에 선다.</p>\n<p>정의가 섰으면 이제 <strong>재야 한다.</strong> 재는 양은 두 가족뿐이다. 하나는 <strong>무게 쪽</strong>이다⁠<sup class=\"rs\">2</sup>. 뿌리는 밀도이고⁠<sup class=\"rs\">2-1</sup>, 여기에 중력가속도를 곱하면 단위중량이 된다⁠<sup class=\"rs\">2-2</sup>. 둘을 g/cm³ 나 t/m³ 로 쓰면 값이 똑같이 &quot;1&quot; 이라 구별이 지워지는데, SI 로 옮기는 순간 두 숫자가 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>g</mi></mrow></math></span> 배만큼 갈린다 ― 이 절에서 가장 비싸게 치르는 실수다. 물을 기준으로 나누면 단위가 사라져 비중이 되고, 뒤집으면 비체적이 된다⁠<sup class=\"rs\">2-3</sup>. 비중은 무차원이라 단위가 붙은 선지는 그 자리에서 오답이고, 거꾸로 쓰면 <strong>비중 하나로 밀도와 단위중량이 다 나온다</strong> ― 2장 액주계에 쓰는 수은의 값이 거기서 온다. 그러니 넷은 새로 외울 정의가 아니라 밀도 하나를 곱하고 나누고 뒤집은 것이다⁠<sup class=\"rs\">2-4</sup>.</p>\n<p>다른 하나는 <strong>점성 쪽</strong>이다⁠<sup class=\"rs\">3</sup>. ⁠<sup class=\"rs\">1</sup>에서 비례상수로만 등장했던 점성계수가 실제로 얼마이고 무엇으로 재는지를 여기서 본다⁠<sup class=\"rs\">3-1</sup>. 그것을 밀도로 나눈 동점성계수가 따로 필요한 이유는⁠<sup class=\"rs\">3-2</sup>, 점성계수가 붙잡는 힘이고 밀도가 계속 가려는 관성이라서 <strong>운동을 다루는 식에는 늘 이 묶음으로 나오기</strong> 때문이다 ― 뒷장의 레이놀즈수가 그것이다. 둘은 단위로 가르면 헷갈리지 않는다. 마지막으로 온도가 오르면 액체는 점성이 줄고 기체는 느는데⁠<sup class=\"rs\">3-3</sup>, 원인이 서로 달라 방향까지 반대다.</p>\n<p>유체는 <strong>전단으로 정의</strong>되고, <strong>무게와 점성 두 가족으로 측정</strong>된다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 고체와 유체를 가르는 기준, 그리고 거기서 &quot;정지 유체엔 전단응력이 없다&quot;가 나오는 길\n② 네 무게량이 밀도에 각각 어떤 연산을 한 것인가\n③ 점성계수와 동점성계수의 차이와 온도에 따른 방향</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/전수압", "name": "전수압", "title": "전수압 (Total Hydrostatic Force)", "ch": 2, "chTitle": "정수역학", "ord": 2, "file": "n-c890ed2fbd.html", "card": {"oneline": "전수압은 정수압 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><mi>γ</mi><mi>h</mi></mrow></math></span> 를 면 전체에 걸쳐 다 합친 하나의 합력이다. 묻는 것은 둘뿐 ― <strong>크기</strong>와 <strong>작용점</strong>. 등압분할·곡면·원관은 전부 이 둘의 변주다.", "bone": [{"n": "1", "t": "평면에 작용하는 전수압", "subs": ["압력 삼각형과 평균압력", "전수압의 크기", "작용점(수압중심)의 위치", "도형별 도심과 단면2차모멘트 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>G</mi></msub></mrow></math></span>", "작용점의 정체 ― 압력분포도의 도심"]}, {"n": "2", "t": "등압분할법", "subs": ["균등한 힘으로 나누기", "분할점의 깊이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>h</mi><mi>m</mi></msub></mrow></math></span>"]}, {"n": "3", "t": "곡면에 작용하는 전수압", "subs": ["수평분력 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P</mi><mi>x</mi></msub></mrow></math></span>", "연직분력 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P</mi><mi>y</mi></msub></mrow></math></span>", "수압에 의한 원관의 두께"]}], "link": [{"k": "목적", "html": "<p>정수압은 <strong>한 점</strong>의 압력이라 설계에 못 쓴다. 필요한 것은 면 전체의 <strong>총 힘</strong>(걸쇠·댐 단면 검토)과 그 힘의 <strong>작용 지점</strong>(힌지 위치·전도 모멘트)이다. 압력이 깊이마다 다르므로 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P</mi><mo>≠</mo><mi>p</mi><mo>×</mo><mi>A</mi></mrow></math></span> 이고, 면 위에서 적분해야 한다.</p>\n"}, {"k": "연결", "html": "<p>수문 하나를 설계하려면 걸쇠가 버틸 총 힘과 힌지를 놓을 자리를 알아야 한다. 그런데 1절이 준 것은 <strong>한 점</strong>의 압력이고, 압력이 깊이마다 다르므로 총 힘은 압력 곱하기 면적이 아니다. 면 위에서 적분해야 한다.</p>\n<p>먼저 <strong>평면</strong>부터 푼다⁠<sup class=\"rs\">1</sup>. 곡면은 지점마다 압력의 방향이 달라 손대기 어렵지만, 평면은 방향이 어디서나 같아 크기만 더하면 되기 때문이다. 옆에서 보면 압력이 깊이에 선형으로 늘어 분포가 삼각형이 되는데⁠<sup class=\"rs\">1-1</sup>, 선형 분포의 평균은 곧 <strong>도심 깊이의 압력</strong>이다. 여기서 이 절의 두 줄이 갈린다 ― <strong>크기는 도심에서, 위치는 도심보다 아래에서.</strong></p>\n<p>크기 쪽을 적분해 보면⁠<sup class=\"rs\">1-2</sup> 나오는 적분이 면적의 1차 모멘트이고, 그것이 곧 도심의 정의다. 공식을 정한 것이 아니라 <strong>적분하니 도심이 저절로 튀어나온</strong> 것이다. 여기서 도심까지의 깊이가 면을 따라 잰 거리가 아니라 연직 깊이라는 것, 그리고 압력이 큰 것과 힘이 센 것이 다르다는 것을 잡아 둔다.</p>\n<p>같은 적분에 거리를 한 번 더 곱해 <strong>모멘트로</strong> 계산하면 작용점이 나온다⁠<sup class=\"rs\">1-3</sup>. 깊은 곳에 가중치가 더 붙으므로 덧붙는 항이 항상 양수이고, 그래서 작용점은 <strong>언제나 도심보다 아래</strong>다. 재료는 둘뿐이다 ― 모멘트 평형과 평행축 정리. 깊이 잠길수록 도심에 수렴하고 수평면이면 아예 도심과 같아지는 것도 극한으로 확인된다.</p>\n<p>그 &quot;얼마나 아래인가&quot;를 재는 새 재료가 단면 2차 모멘트인데⁠<sup class=\"rs\">1-4</sup>, 어느 면의 어느 축인지가 헷갈리는 자리다. 수문을 정면에서 본 <strong>그 면 자체</strong>이고, 크기 계산에 쓴 면적과 완전히 같은 면에 가중치만 다르게 준 것이며, 축은 수면과 평행한 수평 도심축이다. 그리고 이 작용점의 정체가 무엇인지도 정리해 둔다⁠<sup class=\"rs\">1-5</sup> ― <strong>압력분포도의 도심</strong>이고, 공식은 그것을 임의 도형과 임의 각도로 일반화한 것뿐이다. 다만 지름길은 폭이 일정할 때만 통한다.</p>\n<p>그다음은 <strong>응용 셋인데 전부 재활용</strong>이다. 지지대들이 똑같은 힘을 받게 수심을 나누는 문제는 크기 공식을 <strong>누적</strong>으로 쓴 것이고⁠<sup class=\"rs\">2-1</sup>, 누적 힘이 깊이의 제곱으로 늘어나므로 분할점이 제곱근 간격으로 나온다⁠<sup class=\"rs\">2-2</sup>. 힘이 제곱으로 급증하니 <strong>간격이 아래로 갈수록 좁아진다</strong>는 것이 그 식의 뜻이다.</p>\n<p>곡면은 압력 방향이 지점마다 달라 직접 적분이 까다로우므로 수평과 연직으로 쪼갠다⁠<sup class=\"rs\">3</sup>. 수평 쪽은 평면 공식을 <strong>투영면</strong>에 그대로 적용하는데⁠<sup class=\"rs\">3-1</sup>, 굽어 들어간 쪽과 나온 쪽의 수평 성분이 상쇄되어 곡면의 실제 모양과 무관하고 그림자만으로 정해진다. 연직 쪽만 다른 뿌리를 쓴다⁠<sup class=\"rs\">3-2</sup> ― 곡면을 밑면으로 하는 <strong>물기둥의 무게</strong>이고, 부력과 같은 논리다. 그리고 원관의 두께는 그 수평분력의 특수 케이스다⁠<sup class=\"rs\">3-3</sup>. 반관을 잘라 보면 벌리는 힘이 반원의 연직 투영에 걸리는 압력이고, 붙잡는 것은 벽의 장력 둘이다.</p>\n<p>크기는 <strong>적분</strong>, 위치는 <strong>모멘트</strong>.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 크기는 왜 도심에서 나오고 작용점은 왜 도심보다 아래인가\n② <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>G</mi></msub></mrow></math></span> 는 어느 면의 어느 축에 대한 값인가\n③ 등압분할·곡면·원관이 각각 어느 공식의 재활용인가</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/정수압", "name": "정수압", "title": "정수압 (Static Pressure)", "ch": 2, "chTitle": "정수역학", "ord": 1, "file": "n-df62f397ba.html", "card": {"oneline": "정지한 물은 면을 수직으로, 깊이에 비례해서, 한 점에서는 모든 방향으로 똑같이 누른다. 셋을 따로 외우지 말고 두 뿌리로 ― 전단력 0 과 물기둥의 무게.", "bone": [{"n": "1", "t": "정수압의 정의와 성질", "subs": ["정수압과 단위중량", "전단력 0 ― 모든 성질의 뿌리", "수심에 비례한다", "한 점에서 모든 방향이 같다"]}, {"n": "2", "t": "절대압과 계기압", "subs": ["무엇을 0으로 보는가", "표준대기압"]}, {"n": "3", "t": "정수압의 응용", "subs": ["수압기와 파스칼 원리", "액주계", "단위·극한 검증"]}], "link": [{"k": "목적", "html": "<p>묻는 것은 늘 &quot;물이 이 면을 얼마나 세게 미는가&quot;다. 흐르면 속도·마찰·관성이 얽히므로 <strong>정지</strong>부터 연다. 남는 변수는 둘(깊이·단위중량)뿐이고, 거기서 나온 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><mi>γ</mi><mi>h</mi></mrow></math></span> 가 전수압·부력의 토대가 된다. 없으면 다음 절의 전수압이 성립하지 않는다.</p>\n"}, {"k": "연결", "html": "<p>댐 수문 하나를 설계하려면 물이 그 면을 얼마나 세게 미는지를 숫자로 내놓아야 한다. 그런데 물이 흐르기 시작하면 속도·마찰·관성이 한꺼번에 얽히므로, 가장 단순한 경우 ― 물이 <strong>정지해 있는 상태</strong> ― 부터 연다. 정지 상태에서 남는 변수는 깊이와 단위중량 둘뿐이다.</p>\n<p>먼저 재려는 양의 이름부터 정한다⁠<sup class=\"rs\">1-1</sup>. 면에 수직으로 작용하는 전체 힘을 면적으로 나눈 것이 압력강도이고, 분자에 있는 그 전체 힘이 다음 절의 주인공이 된다. 계산에 들어갈 물의 값이 무게이지 질량이 아니라는 것도 여기서 못 박는다.</p>\n<p>교재는 정수압의 성질을 여섯 개 늘어놓지만, 여섯을 따로 외우는 것은 이 단원을 가장 비싸게 배우는 방법이다. 실은 <strong>뿌리가 둘뿐</strong>이다⁠<sup class=\"rs\">1-2</sup>. 첫째는 정지한 액체가 <strong>전단력을 전혀 못 버틴다</strong>는 사실이다. 옆으로 미는 힘이 조금이라도 있으면 그냥 흘러버리므로, &quot;정지해 있다&quot;는 관찰 자체가 &quot;옆으로 미는 성분이 0&quot;이라는 조건이 된다. 둘째는 <strong>위에 얹힌 물기둥의 무게</strong>다. 여섯 성질이 이 둘의 자식으로 갈리고, 물의 무게를 0 으로 놓아 보면 무게 쪽 둘만 무너지는 것으로 검산된다.</p>\n<p>무게 쪽부터 보면⁠<sup class=\"rs\">1-3</sup>, 깊이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>h</mi></mrow></math></span> 인 점 위에 가상의 물기둥을 세워 연직 균형을 쓸 때 <strong>밑면적이 양변에서 지워진다.</strong> 그래서 압력이 그릇의 넓이나 모양이나 물의 양과 무관하고 오직 깊이로만 정해지는데, 이것이 수압의 역설이다. 거꾸로 읽으면 압력을 길이로 환산한 압력수두가 된다.</p>\n<p>전단력 쪽으로 가면⁠<sup class=\"rs\">1-4</sup>, 미소 쐐기를 잡고 힘의 균형을 쓴다. 압력 항은 면적에 비례해 2차 미소량이고 쐐기의 무게는 부피에 비례해 3차 미소량이라, <strong>점으로 줄이면 무게만 사라진다.</strong> 그래서 한 점의 압력은 방향에 무관해진다. 등방성은 <strong>한 점 안</strong>의 이야기이고 깊이 비례는 <strong>두 점 사이</strong>의 이야기라, 둘은 모순이 아니라 무게 항이 버려지느냐 남느냐의 차이다.</p>\n<p>두 뿌리가 서면 값이 나오는데, 그 값을 실제 계기에서 읽으려면 하나를 더 정해야 한다 ― <strong>무엇을 0 으로 보는가</strong>⁠<sup class=\"rs\">2-1</sup>. 완전진공을 0 으로 잡느냐 대기압을 0 으로 잡느냐에 따라 같은 상태의 물이 다른 숫자로 읽히기 때문이다. 대기압 자체도 결국 머리 위 공기 기둥의 무게라 같은 식이고 매질만 다르다. 표준대기압의 여러 표기도 따로 외울 것이 아니라 하나에서 만들어진다⁠<sup class=\"rs\">2-2</sup> ― 물기둥 높이로 바꾸고, 수은이 13.6 배 무거우니 그만큼 나누면 그대로 나온다.</p>\n<p>두 뿌리와 기준점이 서면 <strong>응용은 따라 나오는 것</strong>뿐이다⁠<sup class=\"rs\">3</sup>. 등방성을 밀폐용기에 적용하면 압력이 줄지 않고 전달되므로 면적이 큰 쪽에서 힘이 커지는데⁠<sup class=\"rs\">3-1</sup>, 대신 그만큼 적게 움직여 일은 그대로다. 수심 비례를 거꾸로 읽어 압력을 높이로 환산하면 액주계가 되고⁠<sup class=\"rs\">3-2</sup>, 관을 따라 걸으며 내려가면 더하고 올라가면 빼는 규칙 두 줄이면 식이 닫힌다. 수은처럼 무거운 액체를 쓰는 이유도 같은 식에서 나온다 ― 단위중량이 크면 같은 압력이 짧은 기둥으로 읽힌다. 마지막으로 만든 식들을 단위와 극한으로 때려 본다⁠<sup class=\"rs\">3-3</sup>.</p>\n<p><strong>수직</strong>과 <strong>등방</strong>은 전단력 0 에서, <strong>깊이 비례</strong>는 무게에서 나온다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 성질 여섯 가지가 어느 두 뿌리에서 갈라지나\n② <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>p</mi><mo>=</mo><mi>γ</mi><mi>h</mi></mrow></math></span> 에서 왜 넓이·모양이 사라지나\n③ 등방성과 깊이 비례가 왜 모순이 아닌가</p>\n"}}, {"subj": "수리학", "subjName": "수리학 및 수문학", "sid": "s-51da74", "unit": "수리학/표면장력과모관고", "name": "표면장력과모관고", "title": "표면장력과 모관고", "ch": 1, "chTitle": "유체의 기본 성질", "ord": 2, "file": "n-9c41c24f65.html", "card": {"oneline": "표면 분자는 아래쪽에서만 당겨져 표면이 오그라들려 한다. 그 인장력이 <strong>닫히면 물방울 내부압</strong>, <strong>벽에 붙으면 모관고</strong>를 만든다.", "bone": [{"n": "1", "t": "표면장력", "subs": ["표면이 막처럼 행동하는 이유", "물방울의 내부압력"]}, {"n": "2", "t": "모관현상 (capillarity)", "subs": ["응집력과 부착력 ― 접촉각이 갈림길", "유리관 모관고", "연직 평판 모관고"]}, {"n": "3", "t": "압축율과 유체의 분류", "subs": ["평균 압축율과 체적탄성계수", "유체의 분류"]}], "link": [{"k": "목적", "html": "<p>유체를 <strong>덩어리로</strong> 재는 양(1절)만으로는 물방울이 둥근 것도, 가는 관에서 물이 저 혼자 오르는 것도 설명이 안 된다. 표면에서만 분자의 사정이 달라지기 때문이다. 이것이 없으면 막히는 곳이 셋 ― <strong>액주계·피에조미터의 읽음 오차</strong>(관이 가늘면 없는 압력이 읽힌다), <strong>토질의 모관현상과 동상</strong>, 그리고 물을 비압축성으로 놓는 <strong>가정의 근거</strong>.</p>\n"}, {"k": "연결", "html": "<p>가느다란 유리관을 물에 담그면 물이 저 혼자 위로 기어오른다. 아무도 밀지 않았는데 중력을 거스른다. 1절이 만든 덩어리 잣대로는 이 장면을 설명할 수 없다 ― 이것은 유체 내부가 아니라 <strong>표면</strong>에서만 일어나는 일이기 때문이다.</p>\n<p>이유는 분자 수준에 있다⁠<sup class=\"rs\">1-1</sup>. 안쪽 분자는 사방에서 당겨져 합력이 0 이지만, <strong>표면 분자는 위쪽에 이웃이 없어 안쪽으로만 당겨진다.</strong> 표면 전체가 안으로 당겨지면 표면은 넓이를 줄이려 하고, 그 성질이 인장력으로 나타난다. 여기서 곧바로 <strong>표면장력은 힘이 아니라 단위 길이당 힘</strong>이라는 사실이 따라 나오는데, 이 한 줄을 놓치면 뒤의 모든 식에서 길이를 곱하는 자리를 놓친다.</p>\n<p>그 막이 무엇을 하는지는 두 장면으로 갈린다. 첫 장면은 <strong>막이 닫힌 경우</strong>다⁠<sup class=\"rs\">1-2</sup>. 물방울처럼 사방을 감싸면 막이 오그라들며 안에 든 것을 눌러 내부 압력이 바깥보다 높아진다. 얼마나 높은지는 물방울을 반으로 잘라 힘의 평형을 세우면 나오고, 거기서 튀어나온 계수 4 의 정체는 <strong>둘레 나누기 단면적</strong>이다. 비눗방울에서 8 이 되는 것도 막이 두 겹이라 붙잡는 길이가 두 배이기 때문이다.</p>\n<p>둘째 장면은 <strong>막이 벽에 붙은 경우</strong>다⁠<sup class=\"rs\">2</sup>. 그런데 벽에 붙을지 말지는 액체 혼자 정하지 못한다⁠<sup class=\"rs\">2-1</sup> ― 액체끼리 뭉치려는 응집력과 벽에 달라붙으려는 부착력이 겨루고, 그 승부가 <strong>접촉각</strong>으로 드러난다. 부착력이 이기면 액체가 벽을 타고 올라 물기둥을 매달아 들고, 응집력이 이기면 반대로 내려간다. 오르는 높이는 물방울과 <strong>완전히 같은 논법</strong> ― 드는 힘과 매달린 무게를 같다고 놓는 것 ― 으로 나온다⁠<sup class=\"rs\">2-2</sup>. 드는 힘은 관 둘레에 붙고 버틸 무게는 단면적에 붙으므로, 가늘어지면 무게가 훨씬 빨리 줄어 <strong>가는 관일수록 높이 오른다.</strong> 접촉각이 90° 를 넘으면 코사인이 음수가 되어 부호가 그대로 하강을 말해 주니 수은용 식을 따로 둘 필요도 없다. 관을 평판으로 바꾸면 계수가 4 에서 2 로 바뀌는데⁠<sup class=\"rs\">2-3</sup>, 4 도 2 도 외울 숫자가 아니라 둘 다 <strong>붙잡는 길이 ÷ 매달리는 단면적</strong>이다.</p>\n<p>여기까지가 절 이름이 가리키는 내용이다. 나머지 둘은 앞과 인과로 이어지지 않지만 <strong>서로는 이어진다</strong>⁠<sup class=\"rs\">3</sup>. 압력을 걸었을 때 부피가 얼마나 주는지를 재는 것이 압축율이고⁠<sup class=\"rs\">3-1</sup>, 그 값이 사실상 0 이냐 아니냐가 <strong>압축성과 비압축성</strong>이라는 유체 분류의 첫 갈림길이 되기 때문이다⁠<sup class=\"rs\">3-2</sup>. 물을 비압축성으로 놓는 것이 정의가 아니라 공학적 근사라는 사실이 여기서 드러나고, 점성까지 함께 지운 완전유체가 왜 이 세상에 없는지도 같은 자리에서 정리된다.</p>\n<blockquote>\n<p>표면장력은 <strong>닫히면 내부압</strong>, <strong>벽에 붙으면 모관고</strong>.</p>\n</blockquote>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 표면장력이 왜 &quot;힘&quot;이 아니라 &quot;단위 길이당 힘&quot;인가\n② 물방울의 4, 원관의 4, 평판의 2 가 각각 어디서 온 숫자인가\n③ 물을 비압축성으로 놓는 근거는 무엇이고 완전유체는 왜 없는가</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/단면1차모멘트", "name": "단면1차모멘트", "title": "단면 1차 모멘트", "ch": 1, "chTitle": "힘·모멘트와 단면의 성질", "ord": 2, "file": "n-33b09db397.html", "card": {"oneline": "1절에서 <strong>힘</strong>에 거리를 곱해 더했다. 여기서는 <strong>넓이</strong>에 거리를 곱해 더한다. 그 값이 0 이 되는 축이 지나는 점이 도심이고, 뒤 단원의 계산은 전부 그 축에서 시작한다.", "bone": [{"n": "1", "t": "단면 1차 모멘트 ― 넓이에 거리를 곱해 더한 것", "subs": ["힘의 모멘트를 넓이로 옮긴다", "정의 ― 넓이 × 축까지의 거리를 전부 더한다", "단위와 부호 ― 길이³ 이고, 축을 옮기면 값이 달라진다"]}, {"n": "2", "t": "도심 ― 단면 1차 모멘트가 0 이 되는 축이 지나는 점", "subs": ["도심의 정의", "도심축에 대한 단면 1차 모멘트는 0 이다", "왜 도심을 찾는가 ― 다음 계산의 기준선"]}, {"n": "3", "t": "계산 ― 쪼개 더하고, 구멍은 빼고, 기본단면은 외운다", "subs": ["복합단면 ― 조각의 넓이 × 그 조각 도심까지의 거리를 더한다", "구멍은 음의 넓이", "기본단면의 도심과 1차 모멘트"]}], "link": [{"k": "목적", "html": "<p>단면적이 같아도 <strong>넓이가 어디에 퍼져 있느냐</strong>에 따라 보의 성능이 달라진다. 그것을 세는 양이 이 절이고, 그 값이 0 이 되는 축(= 도심축)이 뒤 단원 계산의 <strong>기준선</strong>이 된다. 기준선을 잘못 잡으면 그 뒤의 숫자가 전부 틀린다.</p>\n"}, {"k": "연결", "html": "<p>같은 재료, 같은 양의 강재로 만든 두 보가 있다. 하나는 납작하게 눕힌 판이고 하나는 세워 놓은 판인데, 단면적이 똑같은데도 <strong>세운 쪽이 훨씬 잘 버틴다.</strong> 달라진 것은 넓이가 어디에 퍼져 있는가 하나뿐이다. 그러니 단면을 넓이 하나의 숫자로만 보면 안 되고, 넓이가 축에서 얼마나 떨어져 앉아 있는지를 세는 양이 따로 있어야 한다.</p>\n<p>그 셈은 새로 만들 필요가 없다⁠<sup class=\"rs\">1-1</sup>. 1절 바리뇽의 식에서 <strong>힘 자리에 넓이를 넣기만</strong> 하면 된다. 얇고 균질한 판이면 무게가 넓이에 비례하니 물리적으로도 같은 이야기이고, 힘도 재료도 들어가지 않으므로 결과는 <strong>모양과 좌표만으로 정해지는 수</strong>가 된다. 정의는 적분으로 적히지만⁠<sup class=\"rs\">1-2</sup>, 실전에서 쓰는 것은 거의 언제나 <strong>전체 넓이 곱하기 도심까지의 거리</strong>라는 곱셈 한 줄이다.</p>\n<p>곱해지는 것이 바뀌었으니 성질도 바뀐다⁠<sup class=\"rs\">1-3</sup>. 단위가 길이의 세제곱이 되고, 좌표에는 부호가 있으니 값이 음수도 0 도 될 수 있다. 이 두 가지가 3절의 단면 2차 모멘트와 갈리는 지점인데, 거기서는 거리를 두 번 곱해 <strong>부호가 지워지기</strong> 때문이다. 그리고 축을 평행이동하면 값이 따라 움직이므로, 축을 모르면 값 하나는 아무 정보도 되지 못한다.</p>\n<p>값이 축에 딸려 있다는 것을 확인하고 나면 질문이 자연스럽게 뒤집힌다 ― 그렇다면 <strong>값을 0 으로 만드는 축은 어디인가</strong>⁠<sup class=\"rs\">2</sup>. 그 축이 지나는 점이 도심이고⁠<sup class=\"rs\">2-1</sup>, 정의를 그대로 뒤집으면 도심의 좌표 식이 나온다. 균질한 판을 손가락으로 받쳐 균형이 잡히는 점이라는 그림도 같은 것을 말한다. 그러니 &quot;도심축에 대한 1차 모멘트는 0&quot;이라는 문장은 새 정리가 아니라 <strong>정의를 다시 읽은 것</strong>이다⁠<sup class=\"rs\">2-2</sup> ― 축 위쪽 몫과 아래쪽 몫이 정확히 상쇄된다.</p>\n<p>이 자리를 왜 찾는가 하면, <strong>다음 계산의 자를 어디에 대고 잴지 정하는 일</strong>이기 때문이다⁠<sup class=\"rs\">2-3</sup>. 보가 휘면 늘지도 줄지도 않는 층이 생기는데, 순수휨에서 축방향 합력이 0 이어야 하므로 그 층은 1차 모멘트가 0 인 축, 곧 도심축을 지난다. 3절의 평행축 정리가 깔끔한 것도 유도 중에 나오는 항이 도심축에서 사라지기 때문이다.</p>\n<p>마지막은 계산이다⁠<sup class=\"rs\">3</sup>. 정의는 적분이지만 실제로는 아는 모양으로 쪼개서 <strong>조각의 넓이에 그 조각 도심까지의 거리를 곱해 더하면</strong> 된다⁠<sup class=\"rs\">3-1</sup> ― 바리뇽 그대로이고, 대칭축이 있으면 도심이 반드시 그 위에 있으니 계산 전에 대칭부터 찾는 것이 빠르다. 뚫린 구멍은 <strong>음의 넓이</strong>로 다루는데⁠<sup class=\"rs\">3-2</sup>, 분자에서도 분모에서도 빼야 한다는 것이 가장 흔한 실수다. 그리고 직사각형·삼각형·반원의 도심 위치만 외워 두면 대부분의 문제가 곱셈과 덧셈으로 끝난다⁠<sup class=\"rs\">3-3</sup>.</p>\n<p><strong>넓이에 거리를 곱해 더한다. 그 값이 0 이 되는 자리가 도심이다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 1절의 어느 식에서 왔고 무엇이 바뀌었나\n② 왜 음수·0 이 될 수 있나\n③ 도심을 찾아 두면 뒤에서 무엇이 편해지나</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/단면2차극모멘트", "name": "단면2차극모멘트", "title": "단면 2차 극모멘트", "ch": 1, "chTitle": "힘·모멘트와 단면의 성질", "ord": 3, "file": "n-2fad3b8893.html", "card": {"oneline": "2절에서 넓이에 거리를 <strong>한 번</strong> 곱했다. 여기서는 <strong>두 번</strong> 곱한다. 축에서 재면 휨에 대한 저항, 점에서 재면 비틀림에 대한 저항이고, 제곱이라 부호가 지워져 값이 항상 양수다.", "bone": [{"n": "1", "t": "단면 2차 모멘트 ― 거리를 두 번 곱하면 저항이 된다", "subs": ["정의 ― 2절에서 무엇이 갈리나", "평행축 정리 ― 도심축에서만 출발할 수 있다", "기본단면의 단면 2차 모멘트"]}, {"n": "2", "t": "단면 2차 극모멘트 ― 축이 아니라 점에 대한 저항", "subs": ["정의 ― 거리를 극(점)에서 잰다", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>P</mi></msub><mo>=</mo><msub><mi>I</mi><mi>X</mi></msub><mo>+</mo><msub><mi>I</mi><mi>Y</mi></msub></mrow></math></span> ― 외울 식이 아니라 두 줄로 만드는 식", "기본단면의 극모멘트"]}, {"n": "3", "t": "단면 상승모멘트 ― 부호를 가질 수 있는 유일한 2차량", "subs": ["정의 ― 두 거리를 한 번씩 곱한다", "대칭축이 있으면 0 이 된다", "평행축 정리"]}, {"n": "4", "t": "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I</mi></mrow></math></span> 를 나눠 쓰는 두 양 ― 단면계수와 단면 2차 반지름", "subs": ["단면계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Z</mi></mrow></math></span> ― 연단거리로 나눈다", "단면 2차 반지름 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi></mrow></math></span> ― 넓이로 나누고 뿌리를 씌운다", "여섯 양을 한 줄로 ― 단위와 부호로 구별한다"]}], "link": [{"k": "목적", "html": "<p>2절 여백 필기가 정의 그 자체다: <strong>&quot;이 단면이 휘어지는 것에 얼마나 저항하는가.&quot;</strong> 그런데 1차 모멘트는 하필 <strong>도심축(= 중립축)에서 0</strong> 이 되어 그 &quot;얼마나&quot;를 못 잰다. 원인은 부호이고, 부호를 지우는 방법이 제곱이다. 게다가 제곱은 먼 것을 크게 세므로 &quot;넓이가 멀리 퍼질수록 잘 버틴다&quot;가 식에 저절로 들어온다. 없으면 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi><mo>=</mo><mi>M</mi><mi>y</mi><mo>/</mo><mi>I</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E</mi><mi>I</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>τ</mi><mo>=</mo><mi>T</mi><mi>r</mi><mo>/</mo><msub><mi>I</mi><mi>P</mi></msub></mrow></math></span> · 세장비를 전부 못 쓴다.</p>\n"}, {"k": "연결", "html": "<p>2절이 만든 자로는 &quot;이 단면이 휘어지는 것에 얼마나 저항하는가&quot;를 잴 수 없다. 1차 모멘트는 하필 <strong>도심축에서 정확히 0</strong> 이 되는데, 보가 휠 때 기준이 되는 축이 바로 그 도심축이기 때문이다 ― 재려는 자리에서 자가 0 을 가리키는 셈이다.</p>\n<p>0 이 되는 원인은 부호다. 축 위쪽 조각과 아래쪽 조각이 서로 상쇄되니, <strong>부호를 지우면 된다.</strong> 가장 자연스러운 방법이 제곱이고, 거리를 한 번 더 곱하는 순간 위아래가 똑같이 양수로 쌓여 상쇄가 사라진다⁠<sup class=\"rs\">1-1</sup>. 게다가 제곱은 먼 것을 훨씬 크게 세므로 <strong>&quot;넓이가 축에서 멀리 퍼질수록 잘 버틴다&quot;가 식 안에 저절로 들어온다</strong> ― 같은 넓이를 어디에 두느냐로 값이 열아홉 배까지 갈리는 것이 그 결과이고, I형강과 중공단면을 쓰는 이유가 그 안에 다 있다. 거리가 하나 늘었을 뿐인데 <strong>단위·부호·도심축에서의 값</strong> 셋이 한꺼번에 달라지는 것이 이 항의 요점이다.</p>\n<p>축을 옮기는 방법도 2절과 같은 구조다⁠<sup class=\"rs\">1-2</sup>. 전개하면 나오는 교차항이 <strong>도심축에 대한 1차 모멘트</strong>라 0 으로 사라지고, 남는 것이 넓이 곱하기 거리의 제곱이다. 붙는 항이 언제나 양수이므로 <strong>도심축 값이 항상 최소</strong>라는 사실도 이 한 줄에서 증명된다. 그러니 기본단면도 도심축 값 셋만 외우면 되고, 상·하단축 값은 그 정리로 그 자리에서 만들어 낸다⁠<sup class=\"rs\">1-3</sup>.</p>\n<p>그다음이 절 이름이다⁠<sup class=\"rs\">2</sup>. 회전에 두 종류가 있기 때문인데, 보가 휘는 것은 단면이 <strong>축</strong>을 중심으로 기우는 일이고 축이 비틀리는 것은 단면이 <strong>점</strong>을 중심으로 도는 일이다. 거리를 점에서 재기만 하면 극모멘트가 되고⁠<sup class=\"rs\">2-1</sup>, 원형 축의 비틀림 식이 여기에 선다. 그리고 피타고라스 한 줄 때문에 <strong>극모멘트가 직교하는 두 축 값의 합</strong>이라는 사실이 곧바로 따라 나온다⁠<sup class=\"rs\">2-2</sup> ― 외울 식이 아니라 두 줄이면 다시 만들어지는 식이다. 기본단면의 극모멘트도 그 합으로 만든다⁠<sup class=\"rs\">2-3</sup>.</p>\n<p>세 번째는 상승모멘트다⁠<sup class=\"rs\">3</sup>. 같은 거리를 두 번 곱하는 대신 두 방향 거리를 한 번씩 곱한 것인데, 제곱이 아니라서 <strong>부호가 살아남는다</strong>⁠<sup class=\"rs\">3-1</sup>. 이 절에서 유일하게 음수가 될 수 있어 &quot;2차 모멘트는 항상 양수&quot;라는 문장의 예외처럼 보이는데, 갈림선은 하나 ― 제곱이냐 아니냐다. 그리고 대칭축이 하나라도 있으면 짝이 상쇄되어 0 이 되는데⁠<sup class=\"rs\">3-2</sup>, 조건이 <strong>대칭축</strong>이지 도심축이 아니라는 점이 2절과 갈리는 자리다. 축을 옮기는 식도 있는데⁠<sup class=\"rs\">3-3</sup>, 여기서는 이동거리를 <strong>부호까지 살려서</strong> 곱해야 한다.</p>\n<p>마지막은 만든 값을 <strong>나누어 쓰는 두 양</strong>이다⁠<sup class=\"rs\">4</sup>. 연단까지의 거리로 나누면 단면계수가 되어 휨응력을 바로 주고⁠<sup class=\"rs\">4-1</sup>, 넓이로 나누고 뿌리를 씌우면 단면 2차 반지름이 되어 기둥의 좌굴을 판정한다⁠<sup class=\"rs\">4-2</sup>. 새 개념이 아니라 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>I</mi></mrow></math></span> 의 사용설명서다. 여섯 양이 다 모이면 헷갈리기 쉬운데, <strong>단위와 부호</strong> 두 가지로 가르면 그 자리에서 정리된다⁠<sup class=\"rs\">4-3</sup>.</p>\n<p><strong>거리를 두 번 곱한다. 축에서 재면 휨, 점에서 재면 비틀림이다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 거리를 한 번 더 곱했을 뿐인데 단위·부호·도심축 값이 왜 셋 다 달라지나\n② 휨과 비틀림은 각각 어떤 회전이고 거리를 어디서 재나\n③ <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>I</mi><mi>P</mi></msub><mo>=</mo><msub><mi>I</mi><mi>X</mi></msub><mo>+</mo><msub><mi>I</mi><mi>Y</mi></msub></mrow></math></span> 를 두 줄로 유도할 수 있나</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/변형률및탄성계수", "name": "변형률및탄성계수", "title": "변형률 및 탄성계수", "ch": 2, "chTitle": "응력과 변형", "ord": 1, "file": "n-01a283a401.html", "card": {"oneline": "1장은 힘을 셌고, 2장은 그 힘이 물체를 얼마나 바꾸는지를 센다. 힘은 <strong>단면적으로</strong>, 변형은 <strong>원래 길이로</strong> 나눠야 크기의 영향이 지워지고 재료의 성질만 남는다.", "bone": [{"n": "1", "t": "변형률 ― 변형을 원래 크기로 나눈 무차원 값", "subs": ["변형은 되돌아오기도 하고 남기도 한다", "종변형률과 횡변형률", "포아송비와 포아송수", "체적변형률"]}, {"n": "2", "t": "탄성계수 ― 응력과 변형률을 잇는 재료 고유의 상수", "subs": ["탄성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>E</mi></mrow></math></span>", "온도변화가 만드는 변형과 응력", "전단탄성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G</mi></mrow></math></span> 와 전단변형", "체적탄성계수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>K</mi></mrow></math></span> 와 세 계수의 관계"]}], "link": [{"k": "목적", "html": "<p>같은 강봉이라도 굵기가 다르면 늘어난 길이가 100 배 차이 난다. 힘과 변형을 그대로 적으면 <strong>그 부재의 기록</strong>일 뿐 재료의 성질이 아니다. 나눠서 무차원으로 만들어야 재료표가 생기고 설계가 된다.</p>\n"}, {"k": "연결", "html": "<p>지름 20 mm 강봉과 지름 200 mm 강봉을 같은 힘으로 당기면 늘어난 길이가 100 배 차이 난다. 그렇다고 재료가 다른 것은 아니다. 힘과 늘어난 길이를 그대로 적으면 그것은 <strong>그 봉의 기록</strong>이지 강이라는 재료의 성질이 아니라서, 부재마다 실험을 다시 해야 하고 설계에 쓸 재료표를 만들 수가 없다. 그러니 크기의 영향을 먼저 지워야 한다 ― 힘은 단면적으로, 변형은 원래 길이로 나눈다.</p>\n<p>먼저 <strong>변형률</strong>부터 세운다⁠<sup class=\"rs\">1</sup>. 응력보다 재기 쉽고 정의도 단순하기 때문이다. 그런데 재기 전에 물어야 할 것이 하나 있다 ― 힘을 뺐을 때 <strong>되돌아오는 변형인지 남는 변형인지</strong>다⁠<sup class=\"rs\">1-1</sup>. 되돌아오는 구간에서만 응력과 변형률이 비례하므로, 이 절의 모든 식이 그 구간의 이야기가 된다.</p>\n<p>변형률을 세면 곧 <strong>방향이 둘</strong>임을 알게 된다⁠<sup class=\"rs\">1-2</sup>. 힘 방향으로 늘어나는 비와 그와 직각으로 줄어드는 비인데, 둘 다 길이를 길이로 나눈 값이라 무차원이다. 크기가 다르고 재료가 달라도 서로 비교되는 것이 그 덕분이다.</p>\n<p>당기면 가늘어진다는 것은 경험으로 알지만, <strong>얼마나</strong> 가늘어지는지는 재료마다 정해져 있다⁠<sup class=\"rs\">1-3</sup>. 그 정해진 비율이 포아송비이고, 이것 하나로 세 방향의 변형이 다 정해진다. 비와 수를 뒤집는 것이 함정인데, 1 보다 작은 쪽이 비다.</p>\n<p>그러면 부피의 변화도 포아송비가 정한다⁠<sup class=\"rs\">1-4</sup>. 늘어난 길이가 부피를 키우고 줄어든 지름이 <strong>두 방향에서</strong> 부피를 깎으므로, 어느 쪽이 이기는지가 포아송비로 갈린다. 값이 0.5 이면 부피가 변하지 않고, 그보다 크면 부피가 늘어나야 해서 물리적으로 불가능해진다 ― 포아송비의 상한이 여기서 나온다.</p>\n<p>그다음이 <strong>탄성계수</strong>다⁠<sup class=\"rs\">2</sup>. 응력을 변형률로 나눈 값인데, 이것이 응력-변형률 선도의 <strong>직선구간 기울기</strong>이자 그 재료의 딱딱함이다⁠<sup class=\"rs\">2-1</sup>. 강도가 아니라는 점이 중요한데, 고강도강으로 바꿔도 이 값은 같아서 <strong>처짐은 줄지 않는다.</strong></p>\n<p>계수가 서면 <strong>하중 없이도 응력이 생기는 경우</strong>를 다룰 수 있다⁠<sup class=\"rs\">2-2</sup>. 온도가 변하면 재료가 늘어나려 하는데 완전히 구속되어 있으면 그 변형이 그대로 응력이 된다. 식에 단면적이 없으므로 굵기와 무관하고, 자유롭게 늘어나면 응력이 0 이 되므로 신축이음이 바로 그것을 노린 장치다.</p>\n<p>그런데 변형에는 모드가 셋 있다 ― 늘어나기, 밀려나기, 쪼그라들기. 밀려나는 쪽에도 <strong>같은 골격의 식</strong>이 서고 하중과 계수 이름만 전단 쪽으로 바뀐다⁠<sup class=\"rs\">2-3</sup>. 쪼그라드는 쪽까지 세면 계수가 셋이 되는데⁠<sup class=\"rs\">2-4</sup>, 셋이 서로 무관하지 않다는 것이 이 절의 마지막 요점이다. 등방재료에서는 <strong>둘만 알면 나머지가 따라 나오고</strong>, 그 다리를 놓는 것이 포아송비다 ― 늘이는 변형을 돌려 보면 전단이고, 세 방향으로 동시에 늘이면 체적이기 때문이다.</p>\n<p><strong>힘을 단면적으로, 변형을 원래 길이로 나눈다. 남는 것이 재료의 성질이다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 원래 길이로 나누는가\n② 종·횡을 따로 세는 이유\n③ 계수가 셋인데 독립이 둘인 이유</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/응력", "name": "응력", "title": "응력", "ch": 2, "chTitle": "응력과 변형", "ord": 2, "file": "n-dc74a38001.html", "card": {"oneline": "1절이 &quot;얼마나 변했나&quot;를 셌고, 이 절은 &quot;속에서 얼마나 버티고 있나&quot;를 센다. 같은 힘이라도 <strong>잘라 보는 면</strong>에 따라 그 면의 응력이 달라진다 ― 응력은 면과 방향을 함께 가진 양이다.", "bone": [{"n": "1", "t": "수직응력과 전단응력 ― 응력은 면에 딸린 양이다", "subs": ["두 갈래를 가르는 것은 힘의 방향 하나", "경사면의 응력 ― 1축 응력상태", "2축 응력상태"]}, {"n": "2", "t": "조합응력 ― 두 재료가 한 하중을 나눠 받는다", "subs": ["탄성계수비 ― 변형이 같으니 딱딱한 쪽이 더 받는다", "각 재료가 받는 응력"]}, {"n": "3", "t": "하중이 축력이 아닐 때 ― 비틀림응력과 원환응력", "subs": ["비틀림응력", "원환응력"]}], "link": [{"k": "목적", "html": "<p>1절의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi><mo>=</mo><mi>P</mi><mo>/</mo><mi>A</mi></mrow></math></span> 에는 &quot;축에 직각인 면&quot;이라는 전제가 숨어 있다. 면을 기울이면 <strong>면적이 커지고 힘이 갈려</strong> 값이 달라진다. 이 절이 없으면 45° 파괴도, 조합 부재의 검토도, 관 두께 산정도 안 된다.</p>\n"}, {"k": "연결", "html": "<p>1절은 응력을 힘 나누기 단면적으로 한 줄 정의하고 지나갔는데, 거기에는 말하지 않은 전제가 하나 있다 ― 봉을 <strong>축에 직각으로</strong> 잘랐을 때의 값이라는 것이다. 같은 봉을 비스듬히 자르면 자른 면의 넓이가 커지고 힘이 두 성분으로 갈리므로, 같은 하중인데도 그 면 위의 응력이 달라진다.</p>\n<p>그러니 먼저 두 응력을 가르는 기준부터 못 박는다⁠<sup class=\"rs\">1-1</sup>. 크기도 원인도 아니고 <strong>힘이 그 면에 대해 어느 방향인가</strong> 하나다. 그리고 응력은 벡터가 아니라서 &quot;이 점의 응력이 얼마&quot;만으로는 답이 되지 않는다 ― 어느 면인지가 붙어야 한다.</p>\n<p>기준이 서면 다음 물음이 자연스럽게 나온다. 면을 돌리면 그 둘이 어떻게 되나⁠<sup class=\"rs\">1-2</sup>. <strong>두 가지가 동시에 변한다</strong> ― 면적이 커지고 힘이 두 성분으로 갈린다. 그것을 각으로 적으면 식 두 줄이 나오고, 각을 극단으로 때려 보면 왜 45° 가 특별한지가 드러난다. 거기서 전단응력이 최대가 되므로, 당기기만 했는데 미끄러짐이 생겨 무른 재료의 파괴면이 그 각으로 난다.</p>\n<p>경사면 이야기는 한 방향으로만 당긴 경우다. 실제 부재에는 직각인 두 방향의 응력이 함께 걸리는 일이 흔하므로 같은 논리를 두 방향으로 넓힌다⁠<sup class=\"rs\">1-3</sup>. 식이 <strong>평균이 자리를 잡고 차가 흔드는</strong> 모양이 되어, 최대와 최소가 평균에 차의 절반을 더하고 뺀 값으로 곧바로 읽힌다. 그리고 여기에 한 방향을 0 으로 넣으면 앞의 1축 식이 그대로 나오므로, <strong>외울 것은 셋이 아니라 이 두 줄뿐</strong>이다. 두 식에서 각을 없애면 원이 남는데, 그것이 뒤에 나올 Mohr 원이다.</p>\n<p>그다음은 <strong>상황이 바뀌는 두 경우</strong>다. 재료가 둘이면 하중을 어떻게 나눠 받는가⁠<sup class=\"rs\">2-1</sup> ― 한 몸으로 붙어 있으니 <strong>변형률이 같다</strong>는 조건 하나에서 모든 것이 나온다. 변형이 같으면 응력이 탄성계수에 비례하므로 <strong>딱딱한 쪽이 더 받는다.</strong> 평형식에 그것을 넣으면 각 재료의 응력이 나오는데⁠<sup class=\"rs\">2-2</sup>, 분모가 한쪽을 다른 쪽으로 환산한 단면적이 된다. 면적이 작은 철선이 오히려 큰 응력을 받으므로 검토는 그쪽부터 한다.</p>\n<p>마지막은 <strong>하중이 축력이 아닐 때</strong>다⁠<sup class=\"rs\">3</sup>. 비틀면 단면이 늘어나지 않고 돌아가므로 생기는 것이 전단응력이고, 움직인 거리가 중심에서의 거리에 비례하니 <strong>응력도 반지름에 비례한다</strong>⁠<sup class=\"rs\">3-1</sup>. 중심이 0 이고 표면이 최대이므로 안쪽은 별로 버티지 않고, 그래서 비틀림 축은 속 빈 관이 유리하다. 여기 쓰이는 단면 2차 극모멘트는 1장에서 만들어 둔 값이다. 안에서 압력이 밀면 고리를 벌리는 인장응력이 생기는데⁠<sup class=\"rs\">3-2</sup>, 반쪽을 떼어 평형을 쓰면 압력이 미는 힘을 <strong>지름면에 투영</strong>해 세고 잘린 두 단면이 그것을 버틴다. 지름을 쓰느냐 반지름을 쓰느냐로 분모가 갈리므로 섞으면 정확히 두 배 틀린다.</p>\n<p><strong>면을 정하지 않고 응력을 말할 수 없다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 두 응력을 가르는 기준 하나\n② 면을 돌리면 무엇 둘이 동시에 변하나\n③ 조합 부재에서 어느 쪽이 더 받나, 그 근거 조건은</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/축하중부재", "name": "축하중부재", "title": "축하중 부재", "ch": 2, "chTitle": "응력과 변형", "ord": 3, "file": "n-9d584fa1ae.html", "card": {"oneline": "1절이 변형률을, 2절이 응력을 세웠다. 이 절은 그 둘을 곱해 <strong>&quot;몇 mm 늘어나는가&quot;</strong> 를 낸다. 그 관계를 뒤집으면 부재가 스프링 하나(상수 둘)로 바뀐다.", "bone": [{"n": "1", "t": "축방향 변형량 ― 두 절의 결과를 곱한 것", "subs": ["늘어난 길이", "구간마다 다르면 나눠서 더한다", "자중이 만드는 늘어남"]}, {"n": "2", "t": "강성도와 유연도 ― 같은 관계를 양쪽에서 본 두 상수", "subs": ["강성도", "유연도", "두 상수가 구조해석의 두 갈래를 가른다"]}], "link": [{"k": "목적", "html": "<p>현장이 묻는 것은 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ε</mi></mrow></math></span> 도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi></mrow></math></span> 도 아니라 <strong>늘어난 길이</strong>다(부재 이음·케이블 처짐·신축이음). 그리고 그 비례관계를 상수로 굳혀야 부재를 스프링 하나로 바꿔 3장 이후의 구조해석에 넘길 수 있다.</p>\n"}, {"k": "연결", "html": "<p>트러스 부재를 이어 붙일 수 있는지, 신축이음 틈을 얼마로 둘지는 전부 &quot;이 부재가 몇 mm 늘어나느냐&quot;로 정해진다. 그런데 2절이 준 응력은 <strong>부재 안의 상태</strong>이고 길이는 <strong>부재 전체의 결과</strong>라, 원래 길이를 다시 곱해 되돌리는 단계가 필요하다.</p>\n<p>되돌리는 데 새로 외울 것은 없다⁠<sup class=\"rs\">1-1
