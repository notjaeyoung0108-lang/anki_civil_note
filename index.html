const PROBS = [{"id": "396c2f589603818cb89df46c90fd3001", "subj": "상하수도공학", "subjKey": "상하수도공학", "subjName": "상하수도공학", "q": "어느 도시의 상하수도 계획을 수립하고 인구 추정을 하였다. 1986년부터 1990년 사이의 인구통계 자료를 이용하여 2001년의 인구를 등차급수법에 의하여 추정하면 얼마인가?", "choices": ["24,272인", "30,024인", "33,274인", "34,689인"], "ans": 3, "sol": "<p>등차급수법으로 1986~1990년의 자료에서 연평균 인구 증가수를 구한 뒤, 1990년을 기준으로 2001년 인구를 추정한다.</p>\n<p>1986년 인구 20,483인, 1990년 인구 24,272인이므로 4년 동안의 증가분은 3,789인이고, 연평균 증가수는 947.25인이다. 이를 947인으로 보아 1990년부터 2001년까지 11년을 적용하면 24,272 + 11×947 = 34,689인이다.</p>\n", "img": "q-396c2f589603818c.webp"}, {"id": "396c2f589603814196bbc7e8f982d784", "subj": "상하수도공학", "subjKey": "상하수도공학", "subjName": "상하수도공학", "q": "현재의 인구가 100,000명인 발전 가능성 있는 도시의 장래 급수량을 추정하기 위해 인구 증가 현황을 조사하니 연평균 인구 증가율이 5%로 일정하였다. 이 도시의 20년 후 추정 인구는?", "choices": ["15050명", "116440명", "200000명", "265330명"], "ans": 3, "sol": "<p>등비급수법을 사용한다. 현재 인구<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P</mi><mn>0</mn></msub><mo>=</mo><mn>100</mn><mo>,</mo><mn>000</mn></mrow></math></span>명, 연평균 증가율<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>=</mo><mn>0.05</mn></mrow></math></span>, 기간<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><mn>20</mn></mrow></math></span>년이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P</mi><mi>n</mi></msub><mo>=</mo><msub><mi>P</mi><mn>0</mn></msub><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><msup><mo stretchy=\"false\">)</mo><mi>n</mi></msup></mrow></math></span>에 대입한다. 계산하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100</mn><mo>,</mo><mn>000</mn><mo stretchy=\"false\">(</mo><mn>1.05</mn><msup><mo stretchy=\"false\">)</mo><mrow><mn>20</mn></mrow></msup><mo>=</mo><mn>265</mn><mo>,</mo><mn>330</mn></mrow></math></span>명이다.</p>\n", "img": "q-396c2f5896038141.webp"}, {"id": "396c2f5896038180b815ee4040ddb88f", "subj": "상하수도공학", "subjKey": "상하수도공학", "subjName": "상하수도공학", "q": "어떤 도시에 대한 다음의 인구통계표에서 1999년 현재로부터 5년 후의 인구를 추정하려 할 때 인구증가율(r)은? (단, 등비급수법에 의한 인구추정임)", "choices": ["1.028570", "0.285700", "0.028570", "0.022790"], "ans": 2, "sol": "<p>인구증가율은 등비급수법에서<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>=</mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mfrac><mrow><msub><mi>P</mi><mn>0</mn></msub></mrow><mrow><msub><mi>P</mi><mi>t</mi></msub></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mi>t</mi></mrow></msup><mo>−</mo><mn>1</mn></mrow></math></span>로 구한다. 표에서 1995년 인구는 10,900명, 1999년 인구는 12,200명이므로 4년 동안의 증가율을 계산하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>=</mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mfrac><mrow><mn>12</mn><mo>,</mo><mn>200</mn></mrow><mrow><mn>10</mn><mo>,</mo><mn>900</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>4</mn></mrow></msup><mo>−</mo><mn>1</mn><mo>=</mo><mn>0.02857</mn></mrow></math></span>이다.</p>\n", "img": "q-396c2f5896038180.webp"}, {"id": "396c2f58960381119c3deffd204ccd25", "subj": "상하수도공학", "subjKey": "상하수도공학", "subjName": "상하수도공학", "q": "다음의 인구추정방법 중에서 대상지역의 포화인구를 먼저 추정한 후 계획기간의 인구를 추정하는 방법은?", "choices": ["등차급수법", "등비급수법", "최소자승법", "로지스틱 곡선법"], "ans": 3, "sol": "<p>로지스틱 곡선법은 대상지역의 포화인구를 먼저 추정한 뒤 계획기간의 인구를 추정하는 방법이다.</p>\n", "img": "q-396c2f5896038111.webp"}, {"id": "38ec2f58960381e49fc8fe69c788d24b", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "뉴턴 유체(Newtonian fluids)에 대한 설명으로 옳은 것은?", "choices": ["물이나 공기 등 보통의 유체는 비뉴턴 유체이다.", "각 변형률의 크기에 따라 선형으로 점도가 변한다.", "전단응력(τ)과 각 변형률(dv/dy)의 관계는 원점을 지나는 직선이다.", "유체가 압력의 변화에 따라 밀도의 변화를 무시할 수 없는 상태가 된 유체를 의미한다."], "ans": 2, "sol": "<p>τ = μ·dv/dy 즉, 원점을 지나는 직선의 관계이다.</p>\n", "img": "q-38ec2f58960381e4.webp"}, {"id": "38ec2f5896038131aa6ac48cd186804e", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "모세관 현상에 관한 설명으로 옳지 않은 것은?", "choices": ["모세관의 상승높이는 액체의 응집력과 액체와 관벽의 부착력에 의해 좌우된다.", "액체의 응집력이 관 벽과의 부착력보다 크면 관 내의 액체 높이는 관 밖의 액체보다 낮게 된다.", "모세관의 상승높이는 모세관의 지름 d에 반비례한다.", "모세관의 상승높이는 액체의 단위중량에 비례한다."], "ans": 3, "sol": "<p>모세관 상승고 h = 4Tcosθ/wd 이므로 액체의 단위중량에는 반비례한다.</p>\n", "img": "q-38ec2f5896038131.webp"}, {"id": "38ec2f5896038122bda4fd9f1ba40afd", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "실린더 내에서 압축된 유체가 압력 1,000kg/cm²에서는 0.4m³의 체적이고, 압력 2,000kg/cm²에서는 0.396m³의 체적을 갖는다. 이러한 액체의 체적탄성계수는?", "choices": ["10⁵kg/cm²", "10⁴kg/cm²", "2×10⁵kg/cm²", "2×10⁴kg/cm²"], "ans": 0, "sol": "<p>E = dP/(dV/V)  1,000kg/cm² → 0.4m³  2,000kg/cm² → 0.396m³  E = (2,000-1,000)/((0.4-0.396)/0.4) = 100,000kg/cm²</p>\n", "img": "q-38ec2f5896038122.webp"}, {"id": "38ec2f589603811392fcc562148dae22", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "뉴턴(Newton)의 점성법칙에 관한 설명 중 틀린 것은?", "choices": ["비례상수로 μ를 사용하며, 이를 점성계수라 하고 Poise의 단위를 갖는다.", "내부마찰력의 크기는 속도구배에 비례한다.", "밀도를 점성계수 μ로 나누는 것을 동점성계수라 하고 Stokes의 단위를 갖는다.", "내부마찰력의 크기는 두 층간의 상대속도에 비례하고 거리에 반비례한다."], "ans": 2, "sol": "<p>v(동점성계수) = μ(점성계수)/ρ(밀도)\n내부마찰력 : τ = μ dv/dy</p>\n", "img": "q-38ec2f5896038113.webp"}, {"id": "38ec2f5896038148889fd493d9177c78", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "동점성계수와 비중이 각각 0.0019m²/sec와 1.2인 액체의 점성계수는?", "choices": ["0.233kg· sec/m²", "0.213kg· sec/m²", "0.1938kg· sec/m²", "0.243kg· sec/m²"], "ans": 0, "sol": "<p>v = 0.0019m²/sec, γ = 1.2 → μ = ?\n방법 ②\nv = μ/ρ 이므로 μ = v · ρ\n비중 = 물체의 밀도/물의 밀도\n물체의 밀도 = 비중×물의 밀도\nρ = 1.2×1g/cm³ = 1.2g/cm³\nμ = v · ρ = 0.0019m²/sec×1.2g/cm³\n= 0.0019m²/sec×1.2×10^-3kg/(10^-2m)³\n= 2.28kg/m·sec → [MLT]\nFLT계로 변환하기 위해 중력가속도를 분모와 분자에 곱해 주면\n(2.28kg/m·sec×9.8m/sec²)/(9.8m/sec²) = 2.28/9.8 kg·sec/m²\n= 0.233kg·sec/m²\n방법 ①\n점성계수 μ의 단위는 poise(=g/cm·sec)이므로 문항과의 차원이 맞지 않으므로 FLT계의 차원이라는 것을 알 수 있다.\nv = μ/ρ 에서 μ = v·ρ, ρ = w/g\n문제의 조건에서 비중이 1.2이므로 물체의 단위 중량 w = 1.2t/m³ 이 된다.\nρ = 1,200kg/m³ / 9.8m/sec² = 122.45kg·sec²/m⁴\nμ = v·ρ = 0.0019m²/sec×122.45kg·sec²/m⁴\n= 0.233kg·sec/m²</p>\n", "img": "q-38ec2f5896038148.webp"}, {"id": "38ec2f58960381e6a8bdda0e3312616a", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "지름 0.3cm의 작은 물방울에 표면장력 T₁₅ = 0.00075N/cm가 작용할 때 물방울 내부와 외부의 압력차는?", "choices": ["30Pa", "50Pa", "80Pa", "100Pa"], "ans": 3, "sol": "<p><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>P</mi><mi>d</mi></mrow><mrow><mn>4</mn></mrow></mfrac></mstyle></mrow></math></span><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mi>d</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>4</mn><mo>×</mo><mn>0.00075</mn><mo>×</mo><msup><mn>10</mn><mn>2</mn></msup></mrow><mrow><mn>0.3</mn></mrow></mfrac></mstyle><mo>=</mo><mn>1.02</mn><mi>g</mi><mo>/</mo><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mn>1.02</mn><mo>×</mo><mn>98</mn><mi>P</mi><mi>a</mi><mo>=</mo><mn>100</mn><mi>P</mi><mi>a</mi></mrow></math></span></p>\n", "img": "q-38ec2f58960381e6.webp"}, {"id": "399c2f5896038192aadfe00333cc2b06", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "대기압을 무시한 압력을 무엇이라 하는가?", "choices": ["정압력", "부압력", "절대압력", "계기압력"], "ans": 3, "sol": "<p>계기압력은 대기압을 무시한 기계에 의한 압력이다. 절대압력=계기압력+대기압력</p>\n", "img": "q-399c2f5896038192.webp"}, {"id": "397c2f58960381619bf1c606dd8a4181", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "다음 그림과 같이 강선 A와 B가 서로 평형상태를 이루고 있다. 이때 각도 θ의 값은?", "choices": ["67.84°", "56.63°", "42.26°", "28.35°"], "ans": 1, "sol": "<p>A, B점에서 합력의 크기는 같아야 한다. (방향반대)\n· 합력 R = √(P_1² + P_2² + 2P_1P_2 cos α)\n· √(300² + 600² + 2×300×600cos60°) = √(400² + 500² + 2×400×500cosθ)\n참고 SOLVE 사용\n∴ θ = 56.63°</p>\n", "img": "q-397c2f5896038161.webp"}, {"id": "397c2f58960381e4b704fbf9d8653838", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "다음 그림과 같은 T형 단면에서 도심축 C-C축의 위치 x는?", "choices": ["2.5h", "3.0h", "3.5h", "4.0h"], "ans": 3, "sol": "<p>해답 ④\nx = Gx/A\nGx = (5b×h)×(5h + h/2) + (b×5h)×(5h/2)\n= 40bh²\nA = (5b×h) + (b×5h)\n= 10bh\n∴ x = 40bh² / 10bh = 4.0h</p>\n", "img": "q-397c2f58960381e4.webp"}, {"id": "397c2f589603812d9ca6ca3b9881c830", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "다음 단면에서 y축에 대한 회전반지름은?", "choices": ["3.07cm", "3.20cm", "3.81cm", "4.24cm"], "ans": 0, "sol": "<p>해답 ①\n회전반지름 r_y = √(I_y/A)\n· A = bh - πd²/4 = 5×10 - π×4²/4 = 37.434cm²\n· I_y = {bh³/12 + bh×(h/2)²} - {πd⁴/64 + πd²/4×(d/2)²}\n= bh³/3 - 5πd⁴/64 = 10×5³/3 - 5×π×4⁴/64\n= 353.835cm⁴\n∴ r_y = √(I_y/A) = √(353.835/37.434) = 3.07cm</p>\n", "img": "q-397c2f589603812d.webp"}, {"id": "397c2f58960381249d94d5f8277a18c0", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "그림과 같이 속이 빈 원형단면(빗금 친 부분)의 도심에 대한 극관성모멘트는?", "choices": ["460cm⁴", "760cm⁴", "840cm⁴", "920cm⁴"], "ans": 3, "sol": "<p>해답 ④\n· 단면 2차 극모멘트(극관성모멘트)는 좌표축의 회전에 관계없이 항상 일정하다.\n· I_p = I_x + I_y = 2I_x = constant\n∴ I_p = 2(πd1⁴/64 - πd2⁴/64) = 2(π×10⁴/64 - π×5⁴/64)\n= 920cm⁴</p>\n", "img": "q-397c2f5896038124.webp"}, {"id": "397c2f589603814b8965e61870517da5", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "폭 10cm, 높이 20cm인 직사각형 단면의 다음 x, y에 대한 상승모멘트값은?", "choices": ["10000cm⁴", "20000cm⁴", "30000cm⁴", "40000cm⁴"], "ans": 0, "sol": "<p>해답 ①\n단면 상승모멘트 I_xy = A x_0 y_0\n· A = 10×20 = 200cm², x_0 = 5cm, y_0 = 10cm\n∴ I_xy = A x_0 y_0 = 200×5×10 = 10000cm⁴</p>\n", "img": "q-397c2f589603814b.webp"}, {"id": "399c2f5896038112ad3af1ea93e28809", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "철근콘크리트 부재에 이형 철근으로 2종인 SD300을 사용한다고 하였을 때 SD300에서 300은 무엇을 뜻하는가?", "choices": ["철근의 공칭지름", "철근의 인장강도", "철근의 연신율", "철근의 항복점 응력"], "ans": 3, "sol": "<p>철근의 강도는 항복강도<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span>를 말하며, SD300에서 300은<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mn>300</mn><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>이라는 뜻이다.</p>\n", "img": "q-399c2f5896038112.webp"}, {"id": "399c2f589603813b9540f640b8ff91f2", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "보통중량 골재를 사용하였을 때,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub><mo>=</mo><mn>21</mn><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>이면 탄성계수비((n))는? (단,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>s</mi></msub><mo>=</mo><mn>2.0</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>)", "choices": ["7", "8", "9", "10"], "ans": 1, "sol": "<p>탄성계수비는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><msub><mi>E</mi><mi>s</mi></msub><mo>/</mo><msub><mi>E</mi><mi>c</mi></msub></mrow></math></span>로 구하며, 보통중량골재 콘크리트의 경우<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>c</mi></msub><mo>=</mo><mn>8500</mn><mroot><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>m</mi></mrow></msub></mrow><mn>3</mn></mroot><mspace width=\"0.167em\" /><mo stretchy=\"false\">(</mo><mtext>MPa</mtext><mo stretchy=\"false\">)</mo></mrow></math></span>를 쓴다. 여기서<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>m</mi></mrow></msub><mo>=</mo><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub><mo>+</mo><mn>4</mn><mo>=</mo><mn>25</mn><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>이므로 계산하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><mn>8.05</mn></mrow></math></span>가 되어 가깝게는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><mn>8</mn></mrow></math></span>이다.</p>\n", "img": "q-399c2f589603813b.webp"}, {"id": "399c2f58960381f7b92ecf32c2a7a4e5", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "다음 중 철근콘크리트 부재 설계시 하중항으로 고려해야 할 사항이 아닌 것은?", "choices": ["연직 활하중 및 고정하중", "온도 변화", "건조수축과 크리프", "탄성계수비"], "ans": 3, "sol": "<p>온도변화, 건조수축, 크리프는 구조물에 변형을 유발하여 하중항으로 고려할 수 있으나 탄성계수비는 재료의 성질로서 하중항이 아니다.</p>\n", "img": "q-399c2f58960381f7.webp"}, {"id": "399c2f58960381a8b434c9d4f84f4d71", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "부(-)모멘트가 일어나는 단순보의 단면에서 배근이 가장 적당한 것은?", "choices": ["①", "②", "③", "④"], "ans": 2, "sol": "<p>단순보에서 부(-)의 휨모멘트가 작용하는 경우는 복철근보로 설계하며 동시에 종방향철근을 폐합스터럽으로 둘러 감는다.</p>\n", "img": "q-399c2f58960381a8.webp"}, {"id": "399c2f58960381749b7ce391fa6abe4f", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "다음은 배력 철근을 배치하는 이유이다. 옳지 않은 것은?", "choices": ["응력을 분포시켜 균열 폭을 최소화하기 위함이다.", "주철근의 부착력을 확보하기 위함이다.", "주철근의 간격을 유지하기 위함이다.", "콘크리트의 건조수축이나 온도변화에 의한 콘크리트의 신축을 억제하기 위함이다."], "ans": 1, "sol": "<p>배력철근을 배치하는 이유는 응력분포, 주철근 간격 유지, 수축·온도변화에 의한 신축 억제이다.</p>\n", "img": "q-399c2f5896038174.webp"}, {"id": "399c2f5896038176b380ff1d9a9681a5", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "응력 계산에 의하여 그 단면적을 결정하는 것이 아닌 철근은 어느 것인가?", "choices": ["사인장 철근", "조립 철근", "정철근", "부철근"], "ans": 1, "sol": "<p>조립철근은 철근을 조립할 때 사용되는 보조적인 철근이다.</p>\n", "img": "q-399c2f5896038176.webp"}, {"id": "396c2f589603812c8075fbf8022763e6", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "균형철근비<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>b</mi></msub><mo>=</mo><mn>0.0365</mn></mrow></math></span>이고,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b</mi><mo>=</mo><mn>300</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d</mi><mo>=</mo><mn>500</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>일 때 유효한 철근량은? (단,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mn>400</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">a</mi></mrow></mrow></math></span>이다)", "choices": ["3,800 mm²", "3,975 mm²", "4,110 mm²", "5,330 mm²"], "ans": 1, "sol": "<p>유효철근량은 최대철근량과 같으므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub><mo>=</mo><msub><mi>ρ</mi><mrow><mo>max</mo></mrow></msub><mo stretchy=\"false\">(</mo><msub><mi>b</mi><mi>w</mi></msub><mi>d</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.726</mn><msub><mi>ρ</mi><mi>b</mi></msub><mo stretchy=\"false\">(</mo><msub><mi>b</mi><mi>w</mi></msub><mi>d</mi><mo stretchy=\"false\">)</mo></mrow></math></span>를 사용한다. 따라서<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub><mo>=</mo><mn>0.726</mn><mo>×</mo><mn>0.0365</mn><mo>×</mo><mo stretchy=\"false\">(</mo><mn>300</mn><mo>×</mo><mn>500</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>3</mn><mrow><mo>,</mo></mrow><mn>975</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></mrow></mrow></math></span>이다.</p>\n", "img": "q-396c2f589603812c.webp"}, {"id": "396c2f5896038186813bd14a50682c1a", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "인장철근이 필요한 휨부재의 모든 단면은 규정된 최소철근량 이상을 사용해야 하는데, 이 때 해석상 필요한 철근량보다 얼마 이상 철근을 더 배근하면 이들 규정을 적용하지 않아도 되는가?", "choices": ["1/3", "1/4", "1/5", "1/6"], "ans": 0, "sol": "<p>해석상 필요한 철근량의<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>/</mo><mn>3</mn></mrow></math></span>이상의 철근이 배치된 부재는 최소철근비 규정을 적용하지 않아도 된다.</p>\n", "img": "q-396c2f5896038186.webp"}, {"id": "396c2f58960381a18b67fbfe50c83163", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "휨부재의 설계시 최소철근량을 제한하는 이유 중 옳은 것은?", "choices": ["압축측 콘크리트의 취성파괴를 방지하기 위해서", "철근의 연성파괴를 방지하기 위해서", "콘크리트와 철근이 동시에 항복하도록 하기 위해서", "인장측 콘크리트의 취성 파괴를 방지하기 위해서"], "ans": 3, "sol": "<p>인장철근이 너무 적으면 인장측 콘크리트가 파괴되므로 최소철근량을 규정하는 이유는 인장측 콘크리트의 취성 파괴를 막기 위해서이다.</p>\n", "img": "q-396c2f58960381a1.webp"}, {"id": "396c2f5896038144a73fc8f68508f553", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "그림과 같은 인장철근을 갖는 보의 유효길이는? (여기서, D19철근의 공칭단면적은 287mm²임)", "choices": ["350mm", "410mm", "440mm", "500mm"], "ans": 2, "sol": "<p>유효길이는 압축연단에서 인장철근군까지의 도심거리이다. 도심거리를 구하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>∑</mo><msub><mi>A</mi><mi>s</mi></msub><mi>d</mi></mrow><mrow><mo>∑</mo><msub><mi>A</mi><mi>s</mi></msub></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>A</mi><mi>s</mi></msub><mo stretchy=\"false\">(</mo><mn>350</mn><mo stretchy=\"false\">)</mo><mo>×</mo><mn>2</mn><mo>+</mo><msub><mi>A</mi><mi>s</mi></msub><mo stretchy=\"false\">(</mo><mn>500</mn><mo stretchy=\"false\">)</mo><mo>×</mo><mn>3</mn></mrow><mrow><msub><mi>A</mi><mi>s</mi></msub><mo>×</mo><mn>5</mn></mrow></mfrac></mstyle><mo>=</mo><mn>440</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>이다.</p>\n", "img": "q-396c2f5896038144.webp"}, {"id": "396c2f58960381308beccc6a675db7ec", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "다음 단면에서 중립축까지의 거리 c는 얼마인가? (단,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub><mo>=</mo><mn>24</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">a</mi></mrow></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mn>400</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">a</mi></mrow></mrow></math></span>이고, 콘크리트는 등가 직사각형 압축응력분포한다고 가정한다.)", "choices": ["151 mm", "159 mm", "181 mm", "199 mm"], "ans": 3, "sol": "<p>(1) 등가응력깊이<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span>를 구하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>A</mi><mi>s</mi></msub><msub><mi>f</mi><mi>y</mi></msub></mrow><mrow><mn>0.85</mn><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub><mi>b</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>2027</mn><mo>×</mo><mn>400</mn></mrow><mrow><mn>1.0</mn><mo>×</mo><mn>0.85</mn><mo>×</mo><mn>24</mn><mo>×</mo><mn>250</mn></mrow></mfrac></mstyle><mo>=</mo><mn>159</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>이다. (2)<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi><mo>=</mo><msub><mi>β</mi><mn>1</mn></msub><mi>c</mi></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>a</mi></mrow><mrow><msub><mi>β</mi><mn>1</mn></msub></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>159</mn></mrow><mrow><mn>0.80</mn></mrow></mfrac></mstyle><mo>≈</mo><mn>198.75</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>이어서<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c</mi><mo>≈</mo><mn>199</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>이다.</p>\n", "img": "q-396c2f5896038130.webp"}, {"id": "396c2f589603810ba069f44f54d81bfa", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "그림과 같은 임의 단면에서 중립축거리<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>c</mi></mrow></math></span>에 작용하는 압축응력 분포인 포물선을 직사각형으로 환산했을 때 빗금친 부분으로 나타나면 철근량<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" di th xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi><mo>·</mo><msub><mi>M</mi><mi>n</mi></msub><mo>=</mo><msub><mi>ϕ</mi><mi>f</mi></msub><mo>·</mo><msub><mi>A</mi><mi>s</mi></msub><mo>·</mo><msub><mi>f</mi><mrow><mi>s</mi><mi>a</mi></mrow></msub><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mi>d</mi><mo>−</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>a</mi></mrow><mrow><mn>2</mn></mrow></mfrac></mstyle><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi><mo>·</mo><msub><mi>M</mi><mi>n</mi></msub><mo>=</mo><msub><mi>ϕ</mi><mi>f</mi></msub><mo>·</mo><mi>b</mi><mo>·</mo><msup><mi>d</mi><mn>2</mn></msup><mo>·</mo><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub><mo>·</mo><mi>q</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.59</mn><mi>q</mi><mo stretchy=\"false\">)</mo></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi><mo>·</mo><msub><mi>M</mi><mi>n</mi></msub><mo>=</mo><msub><mi>ϕ</mi><mi>f</mi></msub><mo>·</mo><msub><mi>A</mi><mi>s</mi></msub><mo>·</mo><msub><mi>f</mi><mi>s</mi></msub><mo stretchy=\"false\">(</mo><mi>d</mi><mo>−</mo><mi>a</mi><mo stretchy=\"false\">)</mo></mrow></math></span>"], "ans": 2, "sol": "<p>단철근 직사각형보의 설계휨강도는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>d</mi></msub><mo>=</mo><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub><mo>=</mo><mi>ϕ</mi><mi>T</mi><mi>z</mi></mrow></math></span>에서 유도되며, 정리하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>d</mi></msub><mo>=</mo><mi>ϕ</mi><mi>b</mi><msup><mi>d</mi><mn>2</mn></msup><msubsup><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow><mi>′</mi></msubsup><mi>q</mi><mo stretchy=\"false\">(</mo><mn>1</mn><mo>−</mo><mn>0.59</mn><mi>q</mi><mo stretchy=\"false\">)</mo></mrow></math></span>가 된다.</p>\n", "img": "q-396c2f58960381d4.webp"}, {"id": "396c2f589603817a8da1ecb26400de83", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b</mi><mo>=</mo><mn>300</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d</mi><mo>=</mo><mn>500</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mi>s</mi></msub><mo>=</mo><mn>3</mn></mrow></math></span>-D25<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mo>=</mo><mn>1</mn><mrow><mo>,</mo></mrow><mn>520</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></mrow></mrow></math></span>인 직사각형 단면보의 파괴는? (단, 강도설계법에 의하며<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub><mo>=</mo><mn>24</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">a</mi></mrow></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mn>400</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">a</mi></mrow></mrow></math></span>, 균형철근비<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>b</mi></msub><mo>=</mo><mn>0.02620</mn></mrow></math></span>이다.)", "choices": ["취성파괴", "연성파괴", "균형파괴", "파괴되지 않는다."], "ans": 1, "sol": "<p>(1) 배근된 인장철근비는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ρ</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>A</mi><mi>s</mi></msub></mrow><mrow><msub><mi>b</mi><mi>w</mi></msub><mi>d</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>1</mn><mrow><mo>,</mo></mrow><mn>520</mn></mrow><mrow><mn>300</mn><mo>×</mo><mn>500</mn></mrow></mfrac></mstyle><mo>=</mo><mn>0.0101</mn></mrow></math></span>이다. (2) 최대철근비는 균형철근비가 주어졌으므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub><mo>=</mo><mn>0.726</mn><msub><mi>ρ</mi><mi>b</mi></msub><mo>=</mo><mn>0.726</mn><mo>×</mo><mn>0.0262</mn><mo>≈</mo><mn>0.019</mn></mrow></math></span>이다. (3)<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>s</mi></msub><mo>&lt;</mo><msub><mi>ρ</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub></mrow></math></span>이므로 연성파괴가 발생한다.</p>\n", "img": "q-396c2f589603817a.webp"}, {"id": "398c2f589603813db7b8fc85e637aa16", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "강도설계법에서 복철근 직사각형보의 중립축까지의 거리 C = 300mm일 때 압축연단에서 50mm 떨어진 곳에 배치된 압축철근의 응력 f's는 얼마인가? (여기서, 철근의 항복강도는 300MPa이고 철근의 탄성계수는 2.0×10^5MPa이다.)", "choices": ["200 MPa", "300 MPa", "259 MPa", "500 MPa"], "ans": 1, "sol": "<p>(1) 압축철근의 변형률은<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>ε</mi><mi>s</mi><mi>′</mi></msubsup><mo>=</mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mfrac><mrow><mi>c</mi><mo>−</mo><msup><mi>d</mi><mi>′</mi></msup></mrow><mrow><mi>c</mi></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow><msub><mi>ε</mi><mrow><mi>c</mi><mi>u</mi></mrow></msub><mo>=</mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mfrac><mrow><mn>300</mn><mo>−</mo><mn>50</mn></mrow><mrow><mn>300</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow><mo>×</mo><mn>0.0033</mn><mo>=</mo><mn>0.00275</mn></mrow></math></span>이다. 이는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ε</mi><mi>y</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>f</mi><mi>y</mi></msub></mrow><mrow><msub><mi>E</mi><mi>s</mi></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>300</mn></mrow><mrow><mn>2</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup></mrow></mfrac><mo>=</mo><mn>0.0015</mn></mrow></math></span>보다 크므로 압축철근은 항복한다. (2) 따라서 압축철근의 응력은<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>f</mi><mi>s</mi><mi>′</mi></msubsup><mo>=</mo><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mn>300</mn><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>이다.</p>\n", "img": "q-398c2f589603813d.webp"}, {"id": "398c2f58960381c4b008f6dab2eeb085", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "b = 300mm, d = 550mm, d' = 50mm, A_s = 4,500mm², A'_s = 2,200mm²인 단면이 연성파괴를 한다면 설계휨강도는 얼마인가? (여기서, 인장철근이 항복응력에 도달하면 압축철근도 항복응력을 나타내며 f_ck = 21MPa, f_y = 300MPa임)", "choices": ["516 kN·m", "565 kN·m", "599 kN·m", "613 kN·m"], "ans": 1, "sol": "<p>복철근 직사각형보의 공칭휨강도는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub><mo>=</mo><mi>ϕ</mi><mo stretchy=\"false\">(</mo><msub><mi>M</mi><mrow><mi>n</mi><mn>1</mn></mrow></msub><mo>+</mo><msub><mi>M</mi><mrow><mi>n</mi><mn>2</mn></mrow></msub><mo stretchy=\"false\">)</mo></mrow></math></span>이며, 본 문제는 연성파괴 조건에서 설계휨강도를 구하는 문제이다. 해설에 따라 압축철근이 항복하는 복철근 단면으로 보고<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ε</mi><mi>t</mi></msub></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi></mrow></math></span>를 차례로 구한 뒤<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>d</mi></msub><mo>=</mo><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span>을 계산하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>565</mn><mspace width=\"0.167em\" /><mtext>kN</mtext><mo>·</mo><mtext>m</mtext></mrow></math></span>가 된다.</p>\n", "img": "q-398c2f58960381c4.webp"}, {"id": "38fc2f58960381bfa9f1cd5702e63c65", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "다음 중 점토광물과 가장 관계가 먼 것은?", "choices": ["격자구조(sheet)", "결정구조(crystal)", "Kaolinite", "단립구조"], "ans": 3, "sol": "<p>점토는 거의 모든 광물이 쉬트(Sheet)로 이루어진 결정체(crystal)이다. 단립(單粒)구조는 조립토(자갈, 모래)가 물 속에서 침강할 때 생기는 구조이다. 단립(團粒)구조에는 봉소구조, 면모구조, 분산구조가 있다.</p>\n", "img": "q-38fc2f58960381bf.webp"}, {"id": "38fc2f589603819db676fff8f74d8e9b", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "다음 중 틀린 것은?", "choices": ["액성한계 측정용 시료는 40번체를 통과한 노건조 시료를 사용해야 한다.", "소성한계는 소성범위의 함수량 중 가장 작은 함수량을 말한다.", "원심함수량이 큰 흙일수록 보수력이 크다.", "Montmorillonite계 점토는 물을 흡수하면 팽창성이 매우 크다."], "ans": 0, "sol": "<p>② 액성한계, 소성한계, 수축한계 시험용 시료는 No.40체 통과시료를 사용한다. 그러나 습윤시료이다.\n④ 소성한계는 소성상태의 함수비 중에서 가장 작은 함수비를 말한다.\n① 원심함수량(CME)\n・점토가 많을수록 CME가 커진다.\n・CME &gt; 12%이면 투수성이 작아 보수력이 크다.\n③ 점토광물 중 몬모릴로나이트(Montmorillonite sub></mrow></math></span>"], "ans": 3, "sol": "<p>흙의 삼상도에서 흙 입자만의 체적을<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>s</mi></msub><mo>=</mo><mn>1</mn></mrow></math></span>로 두면, 간극비<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>V</mi><mi>v</mi></msub></mrow><mrow><msub><mi>V</mi><mi>s</mi></msub></mrow></mfrac></mstyle></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>v</mi></msub><mo>=</mo><mi>e</mi></mrow></math></span>이다. 또 포화도<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>V</mi><mi>w</mi></msub></mrow><mrow><msub><mi>V</mi><mi>v</mi></msub></mrow></mfrac></mstyle><mo>×</mo><mn>100</mn></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>w</mi></msub><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>S</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><msub><mi>V</mi><mi>v</mi></msub></mrow></math></span>이다. 물의 무게는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W</mi><mi>w</mi></msub><mo>=</mo><msub><mi>γ</mi><mi>w</mi></msub><msub><mi>V</mi><mi>w</mi></msub></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W</mi><mi>w</mi></msub><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>S</mi><mi>e</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><msub><mi>γ</mi><mi>w</mi></msub></mrow></math></span>가 된다.</p>\n", "img": "q-38fc2f58960381be.webp"}, {"id": "38fc2f5896038102b4ade05b65b9db50", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "다음 밀도 중 큰 것부터 차례로 된 것은? (단,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span>: 포화밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>: 수중밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>t</mi></msub></mrow></math></span>: 습윤밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>d</mi></msub></mrow></math></span>: 건조밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub></mrow></math></span>: 흙 골격만의 밀도)", "choices": ["<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>d</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub></mrow></math></span>"], "ans": 0, "sol": "<p>단위중량의 대소는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>이다.</p>\n", "img": "q-38fc2f5896038102.webp"}];      // [{id, subj, subjKey, q, choices, ans, sol, img}]
const BUILT = "2026-08-31 00:12 UTC", BUILD = "99b9a04f", ORDER = ["응용역학", "측량학", "수리학", "철콘", "토질", "상하수도공학"];
const KEY = "j0-review-v1", OKEY = "j0-open", DAY = 86400000;
const J = window.J0Sync;      // 동기화 코드는 render_note.py 의 SYNC_JS 한 곳에만 있다

function load(){ try{ const r=JSON.parse(localStorage.getItem(KEY)||"{}");
    return {s:r.s||{}, log:r.log||[]}; }catch(e){ return {s:{}, log:[]}; } }

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayKey = t => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const today0 = () => dayKey(Date.now());
const today1 = () => today0() + DAY - 1;
function openSet(){ try{ return new Set(JSON.parse(localStorage.getItem(OKEY)||"[]")); }
                   catch(e){ return new Set(); } }
function setOpen(s){ localStorage.setItem(OKEY, JSON.stringify([...s])); }

/* ── 2주 한 바퀴 배정 ──────────────────────────────────────
   월~금에 한 장씩. 첫 주가 1~5장, 다음 주가 6~10장 → 열흘이면 열 장을 다 돈다.
   기준은 **고정된 월요일 하나**(2026-01-05)다. "이번 주가 홀수 주인가" 를 ISO 주차로
   물으면 해가 바뀔 때 짝이 뒤집힌다 — 한 점에서 세는 쪽이 어긋나지 않는다. */
const CYCLE0 = (function(){ const d = new Date(2026, 0, 5); d.setHours(0,0,0,0);
                            return d.getTime(); })();
function mondayOf(t){
  const d = new Date(t); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getTime();
}
const weekIdx = t => Math.round((mondayOf(t) - CYCLE0) / (7*DAY));
function chapterOn(t){                       // 그날 배정된 장 (주말은 0)
  const dow = new Date(t).getDay();
  if (dow === 0 || dow === 6) return 0;
  return dow + (((weekIdx(t) % 2) + 2) % 2 ? 5 : 0);
}
/* 그 장이 **다음에 돌아오는 날**. '맞혔어요' 의 간격은 이걸로 정한다 —
   임의로 14일을 더하는 것보다 사이클과 어긋나지 않는다. */
function nextSlot(ch, from){
  const start = dayKey(from || Date.now());
  for (let i = 1; i <= 21; i++){
    const t = start + i*DAY;
    if (chapterOn(t) === ch) return t;
  }
  return start + 14*DAY;
}
const WEEKDAY = ["일","월","화","수","목","금","토"];

/* 목록의 순서를 섞는다. 과목·장 순서대로 나오면 **다음 카드가 무엇인지 알고** 뒤집게
   되어(순서가 단서가 된다) 인출이 아니라 확인이 된다. 덱을 짤 때 한 번만 섞고, 그 뒤로는
   같은 순서를 유지한다 — 채점할 때마다 다시 섞이면 어디까지 했는지 알 수 없다. */
function shuffled(list){
  const r = list.slice();
  for (let i = r.length - 1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

/* ── 카드 신원 ────────────────────────────────────────────
   암기카드는 절 하나(`m|과목/단원`), 오답카드는 노션 페이지(`p|<id>`).
   접두어를 두는 이유는 하나 — 같은 저장소에 둘이 섞여 살기 때문이다. */
const mid = u => "m|" + u.unit;
const pid = p => "p|" + p.id;

const WRITTEN = UNITS.filter(u => u.file && u.card);

/* ── 암기노트 일정 ────────────────────────────────────────
     몰랐어요 → 다음날 · 헷갈려요 → 사흘 뒤 · 맞혔어요 → 그 장이 돌아오는 날
   Anki 의 쉬움계수 대신 **세 칸 고정**이다. 카드가 묻는 것이 낱개 사실이 아니라
   '절 하나의 뼈대' 라서, 며칠 만에 다시 보느냐보다 **사이클을 지키는 것**이 중요하다. */
const MEMO_G = [null, {t:"몰랐어요", d:1}, {t:"헷갈려요", d:3}, {t:"맞혔어요", d:0}];
function memoDue(u, g){
  if (g === 3) return nextSlot(u.ch);
  return today0() + MEMO_G[g].d*DAY;
}
function memoIvlText(u, g){
  const t = memoDue(u, g);
  const d = Math.max(1, Math.round((t - today0()) / DAY));
  /* '맞혔어요' 는 **그 장이 돌아오는 날**이라 요일을 같이 보인다. 그러지 않으면
     사이클 밖에서 미리 본 카드가 "3일 후" 로 떠서 '헷갈려요' 와 똑같아 보인다. */
  return g === 3 ? WEEKDAY[new Date(t).getDay()] + "요일 · " + d + "일 후"
                 : d + "일 후";
}
function gradeMemo(u, g){
  const id = mid(u), st = S.s[id] || {reps:0, ok:0};
  st.reps = (st.reps||0) + 1;
  st.ok = (g === 3) ? (st.ok||0) + 1 : 0;
  st.due = memoDue(u, g);
  st.last = Date.now(); st.lastG = g; st.kind = "m";
  st.unit = u.unit; st.ch = u.ch;
  S.s[id] = st;
  S.log.push({ t: Date.now(), id: id, g: g, u: u.unit });
  save();
}
function memoState(u){ return S.s[mid(u)]; }
const skey = u => (ORDER.indexOf(u.subj) < 0 ? 99 : ORDER.indexOf(u.subj))*1000
                  + u.ch*20 + u.ord;
function memoDeck(mode){
  /* 오늘 볼 것 = **그날 배정된 장** + **밀린 것**(어제 몰랐던 것·사흘 전 헷갈렸던 것).
     오늘 이미 채점한 카드는 빠진다.

     mode 로 덮어쓸 수 있다 — 주말이거나 그날 몫을 다 끝냈을 때 쓰라고 둔 문이다:
       숫자   그 장만 (2주 표에서 아무 날이나 눌러 미리 하거나 밀린 것을 따라잡을 때)
       "new"  아직 한 번도 안 본 카드 전부 */
  const ch = chapterOn(Date.now()), t1 = today1(), t0 = today0();
  const slot = [], late = [];
  for (const u of WRITTEN){
    const st = memoState(u);
    if (st && st.last >= t0) continue;                 // 오늘 이미 봤다
    if (mode === "new"){ if (!st) slot.push(u); continue; }
    if (+mode){ if (u.ch === +mode) slot.push(u); continue; }
    if (ch && u.ch === ch) slot.push(u);
    else if (st && st.due <= t1) late.push(u);
  }
  slot.sort((a,b) => skey(a) - skey(b));
  late.sort((a,b) => (memoState(a).due - memoState(b).due));
  return { ch: ch, slot: slot, late: late, all: slot.concat(late) };
}
const unseenCount = () => WRITTEN.filter(u => !memoState(u)).length;

/* ── 오답노트 일정 ────────────────────────────────────────
   틀리면 다음날, 맞으면 7일 → 그다음부터는 14일. 사용자가 정한 그대로다. */
function wrongDue(st, right){
  if (!right) return today0() + DAY;
  return today0() + ((st && st.ok >= 1) ? 14 : 7)*DAY;
}
function gradeWrong(p, right){
  const id = pid(p), st = S.s[id] || {reps:0, ok:0};
  st.due = wrongDue(st, right);
  st.ok = right ? (st.ok||0) + 1 : 0;
  st.reps = (st.reps||0) + 1;
  st.last = Date.now(); st.lastG = right ? 3 : 1; st.kind = "p";
  st.subj = p.subjKey;
  S.s[id] = st;
  S.log.push({ t: Date.now(), id: id, g: right ? 3 : 1, u: p.subjKey + "/오답" });
  save();
}
function wrongDeck(){
  const t0 = today0(), t1 = today1();
  const due = [], fresh = [];
  for (const p of PROBS){
    if (p.ans < 0) continue;                            // 정답이 안 적힌 문제는 뺀다
    const st = S.s[pid(p)];
    if (st && st.last >= t0) continue;
    if (!st) fresh.push(p);
    else if (st.due <= t1) due.push(p);
  }
  due.sort((a,b) => S.s[pid(a)].due - S.s[pid(b)].due);
  return { due: due, fresh: fresh, all: due.concat(fresh) };
}

/* ── 과목 → 장 → 절 ──────────────────────────────────────── */
const SUBJ = (() => {
  const out = [];
  for (const u of UNITS){
    let g = out.find(x => x.key === u.subj);
    if (!g){ g = { key:u.subj, name:u.subjName, sid:u.sid, units:[] }; out.push(g); }
    g.units.push(u);
  }
  out.sort((a,b) => {
    const ia = ORDER.indexOf(a.key), ib = ORDER.indexOf(b.key);
    if (ia !== ib) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    return a.name.localeCompare(b.name, "ko");
  });
  for (const g of out){
    const chs = [];
    for (const u of g.units){
      let c = chs.find(x => x.ch === u.ch);
      if (!c){ c = { ch:u.ch, title:u.chTitle, units:[] }; chs.push(c); }
      c.units.push(u);
      if (!c.title && u.chTitle) c.title = u.chTitle;
    }
    chs.sort((a,b) => a.ch - b.ch);
    chs.forEach(c => c.units.sort((a,b) => a.ord - b.ord));
    g.chs = chs;
  }
  return out;
})();

/* ── 셈 ──────────────────────────────────────────────────── */
/* 단원 하나의 상태 — 0 안 봄 / 1 흔들림 / 2 익힘 / 3 굳음.
   '굳음' 은 **맞혔어요를 연달아 세 번** 이다. 2주 한 바퀴이므로 한 달 반을 안 틀렸다는 뜻. */
function ustate(u){
  const st = memoState(u);
  if (!st) return 0;
  if (st.ok >= 3) return 3;
  if (st.ok >= 1) return 2;
  return 1;
}
function gstat(g){
  const o = { units:0, done:0, seen:0, solid:0, due:0 };
  const t1 = today1();
  for (const u of g.units){
    o.units++;
    if (!u.file) continue;
    o.done++;
    const st = memoState(u);
    if (st){ o.seen++; if (st.ok >= 3) o.solid++; if (st.due <= t1) o.due++; }
  }
  return o;
}
/* 기록이 어느 과목의 것인지 — 채점할 때 넣은 u("과목/단원")로 가른다. */
function subjOf(l){
  let u = l.u;
  if (!u && S.s[l.id]) u = S.s[l.id].unit;
  return u ? String(u).split("/")[0] : "";
}
function byDayOf(key){
  const o = {};
  for (const l of S.log){
    if (key && subjOf(l) !== key) continue;
    const k = dayKey(l.t); o[k] = (o[k]||0) + 1;
  }
  return o;
}
function weekStart(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // 월요일부터
  return d.getTime();
}
/* 붙어 있던 시간을 **채점 사이 간격으로 어림한다.** 간격이 3분 넘게 벌어지면 딴짓한
   것으로 보고 끊고, 끊긴 자리는 20초만 센다. 카드 한 장이 빈칸 하나보다 오래 걸린다. */
function minutesOf(list){
  if (!list.length) return 0;
  const ts = list.map(l => l.t).sort((a,b) => a-b);
  let ms = 20000;
  for (let i=1; i<ts.length; i++){
    const d = ts[i] - ts[i-1];
    ms += (d <= 180000) ? d : 20000;
  }
  return Math.max(1, Math.round(ms/60000));
}
const fmtMin = m => m >= 60 ? Math.floor(m/60) + "시간 " + (m%60) + "분" : m + "분";
function streaks(byDay){
  const days = Object.keys(byDay).map(Number).sort((a,b) => a-b);
  let max = 0, run = 0, prev = null;
  for (const d of days){ run = (prev !== null && d - prev === DAY) ? run+1 : 1; prev = d;
                         if (run > max) max = run; }
  const t = today0();
  let cur = 0;
  for (let d = byDay[t] ? t : t - DAY; byDay[d]; d -= DAY) cur++;
  return { cur, max };
}
const tile = (k, v, sub, hot) => `<div class="tile${hot ? " hot" : ""}">`
  + `<div class="k">${k}</div><div class="v">${v}</div>`
  + (sub ? `<div class="s">${sub}</div>` : "") + `</div>`;

/* 12주 히트맵. 일요일에서 시작해 열이 주 단위로 떨어진다. */
function heat(byDay){
  const t = today0();
  const start = t - 83*DAY - (new Date(t).getDay())*DAY;
  let max = 1;
  for (const k in byDay) if (byDay[k] > max) max = byDay[k];
  let h = "";
  for (let d=start; d<=t; d+=DAY){
    const n = byDay[d]||0, al = n ? (0.30 + 0.70*Math.min(1, n/max)) : 0;
    h += `<i title="${new Date(d).toLocaleDateString()} · ${n}회"`
       + (n ? ` style="background:rgba(var(--fill),${al.toFixed(2)})"` : "") + `></i>`;
  }
  return h;
}

/* ── 화면 1 · 정리노트 — 과목 목록 ───────────────────────── */
function noteHome(){
  const t0 = today0(), all = byDayOf(null), w0 = weekStart();
  const todayLog = S.log.filter(l => l.t >= t0);
  const weekLog  = S.log.filter(l => l.t >= w0);
  const st = streaks(all);
  const weekDays = new Set(weekLog.map(l => dayKey(l.t))).size;
  let doneN = 0, allN = 0, solidN = 0;
  const panels = SUBJ.map(g => {
    const s = gstat(g);
    doneN += s.done; allN += s.units; solidN += s.solid;
    const gt = S.log.filter(l => l.t >= t0 && subjOf(l) === g.key).length;
    const gw = S.log.filter(l => l.t >= w0 && subjOf(l) === g.key).length;
    return `<a class="panel" href="#${g.sid}">
      <div class="ph"><span class="nm">${esc(g.name)}</span>
        <span class="n">${s.done}/${s.units}단원</span></div>
      <div class="pbody">
        <div class="hm">${heat(byDayOf(g.key))}</div>
        <div class="pstat">오늘 <b>${gt}</b>장 · 이번 주 <b>${gw}</b>장<br>
          굳은 단원 <b>${s.solid}</b> / 쓴 단원 <b>${s.done}</b>
          <div class="prog"><i style="width:${s.done ? (s.solid/s.done*100).toFixed(0) : 0}%"></i></div>
        </div>
      </div>
    </a>`;
  }).join("");
  head("정리노트", false);
  document.getElementById("app").innerHTML = `
    <div class="tiles">
      ${tile("오늘 학습", `${todayLog.length}<u>장</u>`,
             todayLog.length ? fmtMin(minutesOf(todayLog)) + " 공부"
                             : "아직 시작 안 함", !!todayLog.length)}
      ${tile("이번 주", `${weekLog.length}<u>장</u>`,
             weekDays ? `${weekDays}일 · 하루 평균 ${Math.round(weekLog.length/weekDays)}장`
                      : "이번 주는 아직")}
      ${tile("연속 학습", `${st.cur}<u>일</u>`, `최장 ${st.max}일`)}
      ${tile("쓴 단원", `${doneN}<u>/${allN}</u>`, `굳은 단원 ${solidN}개`)}
    </div>
    ${panels}`;
}

/* ── 화면 2 · 과목 하나 ─────────────────────────────────── */
const DOTNAME = ["아직", "흔들림", "익힘", "굳음"];
function subject(g){
  const opened = openSet(), s = gstat(g), t0 = today0();
  const gLog = S.log.filter(l => l.t >= t0 && subjOf(l) === g.key);
  let inner = "";
  for (const c of g.chs){
    let cw = 0, lines = "";
    for (const u of c.units){
      if (!u.file){
        lines += `<div class="unit todo"><div class="t">`
          + `<span>${u.ord}. ${esc(u.title)}</span><span class="n">아직</span></div></div>`;
        continue;
      }
      cw++;
      const s2 = ustate(u);
      lines += `<a class="unit" href="${u.file}?v=${BUILD}"><div class="t">`
        + `<span><i class="dot s${s2}"></i>${u.ord}. ${esc(u.title)}</span>`
        + `<span class="n">${DOTNAME[s2]}</span></div></a>`;
    }
    const ck = g.key + "|" + c.ch;
    inner += `<div class="ch"${opened.has(ck) ? " open" : ""} data-k="${esc(ck)}">`
      + `<button class="chh"><span class="caret"></span>`
      + `<span class="nm">제${c.ch}장${c.title ? " " + esc(c.title) : ""}</span>`
      + `<span class="n">${cw}/${c.units.length}</span></button>`
      + `<div class="chu">${lines}</div></div>`;
  }
  head(g.name, true);
  document.getElementById("app").innerHTML = `
    <div class="tiles">
      ${tile("쓴 단원", `${s.done}<u>/${s.units}</u>`, `아직 ${s.units - s.done}단원`)}
      ${tile("오늘 학습", `${gLog.length}<u>장</u>`,
             gLog.length ? fmtMin(minutesOf(gLog)) + " 공부" : "아직 시작 안 함")}
      ${tile("굳은 단원", `${s.solid}<u>개</u>`, `본 단원 ${s.seen}개 중`)}
      ${tile("복습할 것", `${s.due}<u>개</u>`, s.due ? "암기노트에서" : "밀린 것 없음", !!s.due)}
    </div>
    <div class="card pad"><div class="hm big">${heat(byDayOf(g.key))}</div></div>
    <div class="card">${inner}</div>`;

  document.querySelectorAll(".ch > button.chh").forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const d = b.parentElement, k = d.getAttribute("data-k"), o = openSet();
      if (d.hasAttribute("open")){ d.removeAttribute("open"); o.delete(k); }
      else { d.setAttribute("open",""); o.add(k); }
      setOpen(o);
    };
  });
}

/* ── 화면 3 · 암기노트 — 오늘의 덱 ──────────────────────── */
function memoHome(){
  const d = memoDeck(), t0 = today0(), fresh = unseenCount();
  const deckView = location.hash.replace(/^#/, "") === "memo~";
  const dow = new Date().getDay();
  const plan = d.ch
    ? `${WEEKDAY[dow]}요일 — <b>제${d.ch}장</b>`
    : `${WEEKDAY[dow]}요일 — 배정된 장 없음`;
  const chHas = d.ch ? WRITTEN.filter(u => u.ch === d.ch).length : 0;
  const nx = d.ch ? new Date(nextSlot(d.ch)) : null;
  /* 배정된 장을 아직 안 썼을 수 있다 — 진도가 1~3장인데 오늘이 10장 자리인 식으로.
     그때 "오늘 몫은 끝났습니다" 라고 하면 거짓말이 된다. */
  const chLine = !d.ch
    ? "주말은 배정이 없습니다 — 밀린 것만 봅니다."
    : chHas
      ? `제${d.ch}장이 오늘 자리입니다. 다음은 ${nx.getMonth()+1}월 ${nx.getDate()}일.`
      : `제${d.ch}장은 아직 안 쓴 단원입니다 — 밀린 것만 봅니다.`;
  const done = S.log.filter(l => l.t >= t0 && String(l.id).startsWith("m|")).length;
  head("암기노트", deckView);
  document.getElementById("app").innerHTML = `
    <div class="deckhead">
      <h3>${plan}</h3>
      <div class="big">${d.all.length}<u>장</u></div>
      <div class="sub">${chLine}</div>
      <div class="mix">
        <span>오늘 자리 ${d.slot.length}</span>
        <span>밀린 것 ${d.late.length}</span>
        <span>오늘 푼 것 ${done}</span>
      </div>
      <button class="go" id="start"${(d.all.length || fresh) ? "" : " disabled"}>
        ${d.all.length ? "시작하기"
            : fresh ? `안 본 카드 ${fresh}장부터 보기`
            : "볼 카드가 없습니다"}</button>
      ${(d.all.length && fresh) ? `<button class="go" id="startn"
          style="background:var(--card);color:var(--accent);border:1px solid var(--accent)">
          안 본 카드 ${fresh}장 먼저 보기</button>` : ""}
    </div>
    <div class="card pad">
      <div class="kv" style="line-height:1.9">
        앞면은 <b>장과 절 이름</b>, 뒷면은 그 절의 <b>뼈대</b>입니다.
        떠올려 본 뒤 뒤집고, <b>풀이</b>에서 왜 그 순서인지(연결)를 확인하세요.<br>
        몰랐어요 → 내일 · 헷갈려요 → 사흘 뒤 · 맞혔어요 → 그 장이 돌아오는 날.
      </div>
    </div>
    ${cycleTable()}`;
  const b = document.getElementById("start");
  if (b) b.onclick = () => { location.hash = "memo"; };
  const bn = document.getElementById("startn");
  if (bn) bn.onclick = () => { location.hash = "memo!new"; };
}
/* 2주 한 바퀴가 어떻게 도는지를 표로 — 오늘이 어디인지 보이게 한다.
   줄을 누르면 그 장을 지금 돌 수 있다. 주말이거나 그날 몫을 끝냈을 때, 그리고 여행·야근으로
   하루를 건너뛴 다음날 따라잡을 때 필요한 문이다. */
function cycleTable(){
  const t = today0();
  let rows = "";
  for (let i = 0; i < 14; i++){
    const d = mondayOf(t) + i*DAY, ch = chapterOn(d);
    const on = d === t;
    const n = ch ? WRITTEN.filter(u => u.ch === ch).length : 0;
    const label = `${new Date(d).getMonth()+1}/${new Date(d).getDate()}`
      + ` (${WEEKDAY[new Date(d).getDay()]})${on ? " · 오늘" : ""}`;
    const right = ch ? `제${ch}장 <span class="n">· ${n}장</span>` : "쉼";
    rows += ch
      ? `<a class="unit" href="#memo!${ch}"><div class="t">`
        + `<span${on ? ' style="color:var(--accent)"' : ''}>${label}</span>`
        + `<span class="n">${right}</span></div></a>`
      : `<div class="unit todo"><div class="t"><span>${label}</span>`
        + `<span class="n">쉼</span></div></div>`;
  }
  return `<h2 class="sec">2주 한 바퀴 <span style="opacity:.7">· 줄을 누르면 그 장을 지금 봅니다</span></h2>`
       + `<div class="card">${rows}</div>`;
}

/* ── 화면 4 · 암기 카드 돌리기 ──────────────────────────── */
let mq = [], mi = 0, mflip = false, mmode = "", mfall = "";
function memoRun(){
  if (!mq.length){
    const d = memoDeck(mmode);
    mq = shuffled(d.all); mfall = "";
    /* 오늘 자리가 비어도(주말 · 아직 안 쓴 장 · 오늘 몫 끝) **탭을 눌렀으면 카드가**
       **나와야 한다.** 그래서 아직 한 번도 안 본 카드로 흘러간다 — 안내 화면을 한 장
       더 두면 매일 그걸 지나쳐 누르게 된다. */
    if (!mmode && !mq.length){
      const fresh = WRITTEN.filter(u => !memoState(u));
      if (fresh.length){ mq = shuffled(fresh); mfall = "안 본 카드"; }
    }
    mi = 0; mflip = false;
  }
  /* 여기까지 와서 비었으면 **정말로 볼 것이 없다** — 다 봤고 밀린 것도 없다. */
  if (mi >= mq.length) return memoDone();
  const u = mq[mi], c = u.card;
  head(mmode === "new" ? "안 본 카드" : (+mmode ? "제" + mmode + "장" : "암기노트"),
       !!mmode);
  const front = `<div class="fq"><div class="ch">제${u.ch}장 ${esc(u.chTitle)}</div>
      <div class="ti">${u.ord}. ${esc(u.title)}</div></div>`;
  const back = `<div class="fa">
      <div class="ti">${u.ord}. ${esc(u.title)}</div>
      ${c.bone.map(b => `<div class="bn"><div class="bh"><i><span>${esc(b.n)}</span></i>`
        + `<span>${b.t}</span></div>`
        + (b.subs.length
            ? `<ol class="bs">${b.subs.map(s => `<li>${s}</li>`).join("")}</ol>` : "")
        + `</div>`).join("")}
      <button class="solve" id="solve">풀이 ›</button>
    </div>`;
  const acts = mflip
    ? `<div id="grades">${[1,2,3].map(g =>
         `<button class="g${g}" data-g="${g}"><b>${MEMO_G[g].t}</b>`
         + `<span>${memoIvlText(u, g)}</span></button>`).join("")}</div>`
    : `<button class="flip" id="flip">뒷면 보기</button>`;
  document.getElementById("app").innerHTML = `
    <div class="cnt"><a href="#memo~"><b>${mi+1}</b> / ${mq.length}`
       + `${mfall ? " · " + mfall : ""} · 덱</a></div>
    <div class="fcard">
      <div class="fsubj">${esc(u.subjName)}</div>
      ${mflip ? back : front}
    </div>
    <div class="acts">${acts}</div>`;

  const f = document.getElementById("flip");
  if (f) f.onclick = () => { mflip = true; memoRun(); };
  const sv = document.getElementById("solve");
  if (sv) sv.onclick = () => showSheet(u);
  document.querySelectorAll("#grades button").forEach(b => {
    b.onclick = () => {
      gradeMemo(u, +b.getAttribute("data-g"));
      mi++; mflip = false; window.scrollTo(0,0); memoRun();
    };
  });
}
/* 큐를 다 돌았을 때. 짧게 끝내고 **덱 화면으로 밀어내지 않는다** — 방금 다 한 사람에게
   2주 표를 다시 펼쳐 보일 이유가 없다. */
function memoDone(){
  const t0 = today0();
  const done = S.log.filter(l => l.t >= t0 && String(l.id).startsWith("m|")).length;
  /* 한 장만 골라 돌고 나왔을 수도 있다 — **다음에 무엇이 남았는지** 보고 그리로 잇는다.
     "밀린 것도 없습니다" 를 무턱대고 찍으면 거짓말이 된다. */
  const left = memoDeck("").all.length, fresh = unseenCount();
  const more = left ? { n: left, t: "오늘 몫 " + left + "장 보기", h: "memo" }
             : fresh ? { n: fresh, t: "안 본 카드 " + fresh + "장 보기", h: "memo!new" }
             : null;
  head("암기노트", false);
  document.getElementById("app").innerHTML = `
    <div class="deckhead">
      <h3>여기까지</h3>
      <div class="big">${done}<u>장 봤습니다</u></div>
      <div class="sub">${more ? "더 하겠다면 아래로." : "밀린 것도 없습니다. 내일 또."}</div>
      ${more ? `<a class="go" href="#${more.h}"
          style="text-align:center;text-decoration:none">${more.t}</a>` : ""}
      <a class="go" href="#memo~" style="text-align:center;text-decoration:none;
         background:var(--card);color:var(--accent);border:1px solid var(--accent)">덱 보기</a>
    </div>`;
  syncNow(true);
}

function showSheet(u){
  const c = u.card;
  document.getElementById("sheetbox").innerHTML = `
    <div class="hd"><b>${u.ord}. ${esc(u.title)}</b>
      <button id="closeSheet">닫기</button></div>
    ${c.oneline ? `<div class="ol">${c.oneline}</div>` : ""}
    ${c.link.map(x => `<h4>${esc(x.k)}</h4>${x.html}`).join("")}
    ${c.check ? `<div class="chk">${c.check}</div>` : ""}
    ${u.file ? `<p style="margin-top:18px"><a href="${u.file}?v=${BUILD}">정리노트에서 이어 읽기 ›</a></p>` : ""}`;
  document.getElementById("sheet").hidden = false;
  document.getElementById("closeSheet").onclick = hideSheet;
}
function hideSheet(){ document.getElementById("sheet").hidden = true; }
document.getElementById("sheet").onclick = ev => {
  if (ev.target.id === "sheet") hideSheet();
};

/* ── 화면 5 · 오답노트 ──────────────────────────────────── */
function wrongHome(){
  const d = wrongDeck(), t0 = today0();
  const done = S.log.filter(l => l.t >= t0 && String(l.id).startsWith("p|")).length;
  const solid = PROBS.filter(p => { const st = S.s[pid(p)]; return st && st.ok >= 2; }).length;
  head("오답노트", location.hash.replace(/^#/, "") === "wrong~");
  document.getElementById("app").innerHTML = `
    <div class="deckhead">
      <h3>노션에 모은 문제 ${PROBS.length}개</h3>
      <div class="big">${d.all.length}<u>문제</u></div>
      <div class="sub">틀리면 내일 · 맞으면 7일 → 그다음부터 14일.</div>
      <div class="mix">
        <span>밀린 것 ${d.due.length}</span>
        <span>처음 보는 것 ${d.fresh.length}</span>
        <span>오늘 푼 것 ${done}</span>
      </div>
      <button class="go" id="startw"${d.all.length ? "" : " disabled"}>
        ${d.all.length ? "풀기" : "오늘 몫은 끝났습니다"}</button>
    </div>
    <div class="tiles">
      ${tile("굳은 문제", `${solid}<u>개</u>`, "두 번 이상 연달아 맞힘")}
      ${tile("전체", `${PROBS.length}<u>문제</u>`, "problem_uploader.py 로 늘립니다")}
    </div>
    ${wrongBySubj()}`;
  const b = document.getElementById("startw");
  if (b) b.onclick = () => { location.hash = "wrong"; };
}
function wrongBySubj(){
  const by = {};
  for (const p of PROBS){
    const k = p.subjName || "그 밖";
    (by[k] = by[k] || []).push(p);
  }
  const rows = Object.keys(by).sort().map(k => {
    const list = by[k];
    const seen = list.filter(p => S.s[pid(p)]).length;
    return `<div class="unit" style="border-top:1px solid var(--line)"><div class="t">
      <span>${esc(k)}</span><span class="n">${seen}/${list.length}</span></div></div>`;
  }).join("");
  return `<h2 class="sec">과목별</h2><div class="card">${rows}</div>`;
}

function wrongDone(){
  const t0 = today0();
  const done = S.log.filter(l => l.t >= t0 && String(l.id).startsWith("p|")).length;
  head("오답노트", false);
  document.getElementById("app").innerHTML = `
    <div class="deckhead">
      <h3>오늘 몫 끝</h3>
      <div class="big">${done}<u>문제 풀었습니다</u></div>
      <div class="sub">틀린 것은 내일 다시 나옵니다.</div>
      <a class="go" href="#wrong~" style="text-align:center;text-decoration:none;
         background:var(--card);color:var(--accent);border:1px solid var(--accent)">덱 보기</a>
    </div>`;
  syncNow(true);
}

let wq = [], wi = 0, wpick = -1, worder = [];
/* 보기 순서는 **볼 때마다 섞는다.** 자리로 답을 외우는 것을 막는다 (노션 쪽도 같은 이유로
   섞기시각을 두고 있다). 섞기는 화면에서만 하고 기록에는 원래 번호가 남는다. */
function shuffle(n){
  const a = Array.from({length:n}, (_, i) => i);
  for (let i = n-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1));
                                 [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function wrongRun(){
  if (!wq.length){ wq = shuffled(wrongDeck().all); wi = 0; wpick = -1; worder = []; }
  if (wi >= wq.length) return wrongDone();
  const p = wq[wi];
  if (!worder.length) worder = shuffle(p.choices.length);
  head("오답노트", false);
  const graded = wpick >= 0;
  const opts = worder.map((src, i) => {
    let cls = "";
    if (graded){
      if (src === p.ans) cls = " right";
      else if (src === wpick) cls = " wrong";
    }
    return `<button class="opt${cls}" data-src="${src}"><i>${"①②③④"[i]}</i>`
         + `<span>${p.choices[src]}</span></button>`;
  }).join("");
  document.getElementById("app").innerHTML = `
    <div class="cnt"><a href="#wrong~"><b>${wi+1}</b> / ${wq.length}`
       + ` · ${esc(p.subjName || "")} · 덱</a></div>
    <div class="card pad qcard">
      <div class="qtext">${p.q}</div>
      <div class="opts">${opts}</div>
      ${graded && p.sol ? `<div class="sol">${p.sol}</div>` : ""}
      ${p.img ? `<details class="src"><summary>교재 원본 보기</summary>
                   <img src="${p.img}?v=${BUILD}" alt="문제 원본" loading="lazy"></details>` : ""}
    </div>
    ${graded ? `<div class="acts"><button class="flip" id="nextq">다음 문제</button></div>` : ""}`;

  document.querySelectorAll(".opts button").forEach(b => {
    b.onclick = () => {
      if (wpick >= 0) return;
      wpick = +b.getAttribute("data-src");
      gradeWrong(p, wpick === p.ans);
      wrongRun();
    };
  });
  const nx = document.getElementById("nextq");
  if (nx) nx.onclick = () => { wi++; wpick = -1; worder = []; window.scrollTo(0,0); wrongRun(); };
}

/* ── 설정 ────────────────────────────────────────────────── */
function settings(){
  const w = J.where(), c = J.cfg();
  head("설정", true);
  document.getElementById("app").innerHTML = `
    <div class="card pad">
      <div class="kv">기록 저장소 <b>${esc(w.repo || "(없음)")}</b><br>
        파일 <b>${esc(w.path)}</b></div>
      <label class="row">GitHub 토큰 (이 저장소의 Contents 읽기·쓰기)</label>
      <input type="password" id="token" value="${esc(c.token||"")}" placeholder="github_pat_...">
      <div class="tools">
        <button class="pri" id="savetok">저장</button>
        <button id="now">지금 맞추기</button>
      </div>
      <div class="note">토큰이 없으면 <b>읽기만</b> 됩니다 — 진도는 보이지만 이 기기에서 채점한
        것은 올라가지 않습니다. 토큰은 이 브라우저에만 저장되고 어디에도 올라가지 않습니다.
        폰에 넣을 때는 주소 끝에 <b>#t=토큰</b> 을 붙여 한 번 열어도 됩니다.
        <br>마지막으로 맞춘 때 ${c.last ? new Date(c.last).toLocaleString() : "없음"}
        <br>빌드 ${BUILT}</div>
    </div>`;
  document.getElementById("savetok").onclick = () => {
    const c2 = J.cfg(); c2.token = document.getElementById("token").value.trim();
    J.setCfg(c2); say(c2.token ? "토큰을 저장했습니다" : "토큰을 비웠습니다 (읽기 전용)", "ok");
  };
  document.getElementById("now").onclick = () => syncNow();
}

/* ── 머리·탭 ─────────────────────────────────────────────── */
function head(title, back){
  document.getElementById("ttl").textContent = title;
  document.getElementById("back").disabled = !back;
}
function markTab(t){
  document.querySelectorAll("#tabs a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("data-t") === t));
}
function tabBadges(){
  const m = memoDeck().all.length, w = wrongDeck().all.length;
  const set = (t, n) => {
    const a = document.querySelector(`#tabs a[data-t="${t}"]`);
    if (!a) return;
    const old = a.querySelector(".n"); if (old) old.remove();
    if (n) a.insertAdjacentHTML("beforeend", `<span class="n"><span>${n}</span></span>`);
  };
  set("memo", m); set("wrong", w);
}
function say(msg, kind, ms){ if (window.J0Toast) window.J0Toast(msg, kind, ms); }

/* ── 동기화 — 열 때 자동, 덱을 다 돌면 한 번 더 ─────────── */
let syncing = false;
async function syncNow(quiet){
  if (syncing || !J.ready()) return;
  syncing = true;
  if (!quiet) say("맞추는 중…", "", 0);
  try{
    const r = await J.sync();
    S = load(); route();
    const got = r.n ? " · 새 기록 " + r.n + "건" : "";
    say(r.readonly
          ? (r.empty
              ? "받지 못했습니다 — 기록 파일이 아직 없거나, 비공개 저장소라 토큰이 필요합니다"
              : "받았습니다 (이 기기는 읽기 전용)" + got)
          : r.uptodate ? "최신입니다" + got
          : "맞췄습니다" + got,
        r.readonly && r.empty ? "err" : "ok");
  }catch(e){ say(e.message, "err"); }
  syncing = false;
}

/* ── 길 찾기 ─────────────────────────────────────────────── */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  hideSheet();
  if (h.startsWith("t=")){                 // 주소로 토큰 넘기기 (폰에 넣을 때 편하다)
    const c = J.cfg(); c.token = h.slice(2).trim(); J.setCfg(c);
    history.replaceState(null, "", "#set");
    say("토큰을 저장했습니다", "ok");
    markTab(""); return settings();
  }
  /* 탭을 누르면 **바로 카드**다 (`#memo` · `#wrong`). 덱 요약(2주 표·미리 보기·통계)은
     카드 위의 카운터를 눌러 들어가는 `~` 화면으로 물러났다 — 매일 여는 곳이 카드인데
     그 앞에 요약 화면을 한 장 두면 하루에 한 번씩 쓸데없이 더 누르게 된다.
       #memo   오늘 몫 카드      #memo~   덱 요약
       #memo!new 안 본 카드      #memo!7  제7장
     볼 카드가 없으면 memoRun 이 스스로 덱 요약으로 넘긴다. */
  const mm = h === "memo" ? "" : (h.startsWith("memo!") ? h.slice(5) : null);
  if (mm === null || mm !== mmode) { mq = []; mflip = false; mmode = mm || ""; }
  if (h !== "wrong") { wq = []; wpick = -1; worder = []; }
  tabBadges();
  if (h === "set"){ markTab(""); return settings(); }
  if (h === "memo~"){ markTab("memo"); return memoHome(); }
  if (mm !== null){ markTab("memo"); return memoRun(); }
  if (h === "wrong~"){ markTab("wrong"); return wrongHome(); }
  if (h === "wrong"){ markTab("wrong"); return wrongRun(); }
  const g = SUBJ.find(x => x.sid === h);
  if (g){ markTab("note"); return subject(g); }
  markTab("note"); noteHome();
}

document.getElementById("back").onclick = () => {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("memo")) location.hash = "memo";
  else if (h.startsWith("wrong")) location.hash = "wrong";
  else location.hash = "note";
};
document.getElementById("gear").onclick = () => { location.hash = "set"; };
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") hideSheet();
  const gb = document.querySelectorAll("#grades button");
  if (gb.length && "123".includes(ev.key)) gb[+ev.key - 1].click();
  const fb = document.getElementById("flip");
  if (fb && (ev.key === " " || ev.key === "Enter")){ ev.preventDefault(); fb.click(); }
});
route();
syncNow(true);
window.addEventListener("focus", () => { S = load(); route(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){ S = load(); route(); }
});
