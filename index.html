sub></mrow></math></span>"], "ans": 3, "sol": "<p>흙의 삼상도에서 흙 입자만의 체적을<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>s</mi></msub><mo>=</mo><mn>1</mn></mrow></math></span>로 두면, 간극비<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>V</mi><mi>v</mi></msub></mrow><mrow><msub><mi>V</mi><mi>s</mi></msub></mrow></mfrac></mstyle></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>v</mi></msub><mo>=</mo><mi>e</mi></mrow></math></span>이다. 또 포화도<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>V</mi><mi>w</mi></msub></mrow><mrow><msub><mi>V</mi><mi>v</mi></msub></mrow></mfrac></mstyle><mo>×</mo><mn>100</mn></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>w</mi></msub><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>S</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><msub><mi>V</mi><mi>v</mi></msub></mrow></math></span>이다. 물의 무게는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W</mi><mi>w</mi></msub><mo>=</mo><msub><mi>γ</mi><mi>w</mi></msub><msub><mi>V</mi><mi>w</mi></msub></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W</mi><mi>w</mi></msub><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>S</mi><mi>e</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><msub><mi>γ</mi><mi>w</mi></msub></mrow></math></span>가 된다.</p>\n", "img": "q-38fc2f58960381be.webp"}, {"id": "38fc2f5896038102b4ade05b65b9db50", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "다음 밀도 중 큰 것부터 차례로 된 것은? (단,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span>: 포화밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>: 수중밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>t</mi></msub></mrow></math></span>: 습윤밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>d</mi></msub></mrow></math></span>: 건조밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub></mrow></math></span>: 흙 골격만의 밀도)", "choices": ["<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>d</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub></mrow></math></span>"], "ans": 0, "sol": "<p>단위중량의 대소는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>이다.</p>\n", "img": "q-38fc2f5896038102.webp"}];      // [{id, subj, subjKey, q, choices, ans, sol, img}]
const BUILT = "2026-08-28 08:25 UTC", BUILD = "077eacf4", ORDER = ["응용역학", "측량학", "수리학", "철콘", "토질", "상하수도공학"];
const KEY = "j0-review-v1", OKEY = "j0-open", DAY = 86400000;

    return {s:r.s||{}, log:r.log||[]}; }catch(e){ return {s:{}, log:[]}; } }

const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dayKey = t => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };
const today0 = () => dayKey(Date.now());
const today1 = () => today0() + DAY - 1;

                   catch(e){ return new Set(); } }
function setOpen(s){ localStorage.setItem(OKEY, JSON.stringify([...s])); }

/* ── 2주 한 바퀴 배정 ──────────────────────────────────────
   월~금에 한 장씩. 첫 주가 1~5장, 다음 주가 6~10장 → 열흘이면 열 장을 다 돈다.
   기준은 **고정된 월요일 하나**(2026-01-05)다. "이번 주가 홀수 주인가" 를 ISO 주차로
   물으면 해가 바뀔 때 짝이 뒤집힌다 — 한 점에서 세는 쪽이 어긋나지 않는다. */
const CYCLE0 = (function(){ const d = new Date(2026, 0, 5); d.setHours(0,0,0,0);
                            return d.getTime(); })();
function mondayOf(t){
  const d = new Date(t); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getTime();
}
const weekIdx = t => Math.round((mondayOf(t) - CYCLE0) / (7*DAY));
function chapterOn(t){                       // 그날 배정된 장 (주말은 0)
  const dow = new Date(t).getDay();
  if (dow === 0 || dow === 6) return 0;
  return dow + (((weekIdx(t) % 2) + 2) % 2 ? 5 : 0);
}
/* 그 장이 **다음에 돌아오는 날**. '맞혔어요' 의 간격은 이걸로 정한다 —
   임의로 14일을 더하는 것보다 사이클과 어긋나지 않는다. */
function nextSlot(ch, from){
  const start = dayKey(from || Date.now());
  for (let i = 1; i <= 21; i++){
    const t = start + i*DAY;
    if (chapterOn(t) === ch) return t;
  }
  return start + 14*DAY;
}
const WEEKDAY = ["일","월","화","수","목","금","토"];

/* 목록의 순서를 섞는다. 과목·장 순서대로 나오면 **다음 카드가 무엇인지 알고** 뒤집게
   되어(순서가 단서가 된다) 인출이 아니라 확인이 된다. 덱을 짤 때 한 번만 섞고, 그 뒤로는
   같은 순서를 유지한다 — 채점할 때마다 다시 섞이면 어디까지 했는지 알 수 없다. */
function shuffled(list){
  const r = list.slice();
  for (let i = r.length - 1; i > 0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [r[i], r[j]] = [r[j], r[i]];
  }
  return r;
}

/* ── 카드 신원 ────────────────────────────────────────────
   암기카드는 절 하나(`m|과목/단원`), 오답카드는 노션 페이지(`p|<id>`).
   접두어를 두는 이유는 하나 — 같은 저장소에 둘이 섞여 살기 때문이다. */
const mid = u => "m|" + u.unit;
const pid = p => "p|" + p.id;

const WRITTEN = UNITS.filter(u => u.file && u.card);

/* ── 암기노트 일정 ────────────────────────────────────────
     몰랐어요 → 다음날 · 헷갈려요 → 사흘 뒤 · 맞혔어요 → 그 장이 돌아오는 날
   Anki 의 쉬움계수 대신 **세 칸 고정**이다. 카드가 묻는 것이 낱개 사실이 아니라
   '절 하나의 뼈대' 라서, 며칠 만에 다시 보느냐보다 **사이클을 지키는 것**이 중요하다. */
const MEMO_G = [null, {t:"몰랐어요", d:1}, {t:"헷갈려요", d:3}, {t:"맞혔어요", d:0}];
function memoDue(u, g){
  if (g === 3) return nextSlot(u.ch);
  return today0() + MEMO_G[g].d*DAY;
}
function memoIvlText(u, g){
  const t = memoDue(u, g);
  const d = Math.max(1, Math.round((t - today0()) / DAY));
  /* '맞혔어요' 는 **그 장이 돌아오는 날**이라 요일을 같이 보인다. 그러지 않으면
     사이클 밖에서 미리 본 카드가 "3일 후" 로 떠서 '헷갈려요' 와 똑같아 보인다. */
  return g === 3 ? WEEKDAY[new Date(t).getDay()] + "요일 · " + d + "일 후"
                 : d + "일 후";
}
function gradeMemo(u, g){
  const id = mid(u), st = S.s[id] || {reps:0, ok:0};
  st.reps = (st.reps||0) + 1;
  st.ok = (g === 3) ? (st.ok||0) + 1 : 0;
  st.due = memoDue(u, g);
  st.last = Date.now(); st.lastG = g; st.kind = "m";
  st.unit = u.unit; st.ch = u.ch;
  S.s[id] = st;
  S.log.push({ t: Date.now(), id: id, g: g, u: u.unit });
  save();
}
function memoState(u){ return S.s[mid(u)]; }
const skey = u => (ORDER.indexOf(u.subj) < 0 ? 99 : ORDER.indexOf(u.subj))*1000
                  + u.ch*20 + u.ord;
function memoDeck(mode){
  /* 오늘 볼 것 = **그날 배정된 장** + **밀린 것**(어제 몰랐던 것·사흘 전 헷갈렸던 것).
     오늘 이미 채점한 카드는 빠진다.

     mode 로 덮어쓸 수 있다 — 주말이거나 그날 몫을 다 끝냈을 때 쓰라고 둔 문이다:
       숫자   그 장만 (2주 표에서 아무 날이나 눌러 미리 하거나 밀린 것을 따라잡을 때)
       "new"  아직 한 번도 안 본 카드 전부 */
  const ch = chapterOn(Date.now()), t1 = today1(), t0 = today0();
  const slot = [], late = [];
  for (const u of WRITTEN){
    const st = memoState(u);
    if (st && st.last >= t0) continue;                 // 오늘 이미 봤다
    if (mode === "new"){ if (!st) slot.push(u); continue; }
    if (+mode){ if (u.ch === +mode) slot.push(u); continue; }
    if (ch && u.ch === ch) slot.push(u);
    else if (st && st.due <= t1) late.push(u);
  }
  slot.sort((a,b) => skey(a) - skey(b));
  late.sort((a,b) => (memoState(a).due - memoState(b).due));
  return { ch: ch, slot: slot, late: late, all: slot.concat(late) };
}
const unseenCount = () => WRITTEN.filter(u => !memoState(u)).length;

/* ── 오답노트 일정 ────────────────────────────────────────
   틀리면 다음날, 맞으면 7일 → 그다음부터는 14일. 사용자가 정한 그대로다. */
function wrongDue(st, right){
  if (!right) return today0() + DAY;
  return today0() + ((st && st.ok >= 1) ? 14 : 7)*DAY;
}
function gradeWrong(p, right){
  const id = pid(p), st = S.s[id] || {reps:0, ok:0};
  st.due = wrongDue(st, right);
  st.ok = right ? (st.ok||0) + 1 : 0;
  st.reps = (st.reps||0) + 1;
  st.last = Date.now(); st.lastG = right ? 3 : 1; st.kind = "p";
  st.subj = p.subjKey;
  S.s[id] = st;
  S.log.push({ t: Date.now(), id: id, g: right ? 3 : 1, u: p.subjKey + "/오답" });
  save();
}
function wrongDeck(){
  const t0 = today0(), t1 = today1();
  const due = [], fresh = [];
  for (const p of PROBS){
    if (p.ans < 0) continue;                            // 정답이 안 적힌 문제는 뺀다
    const st = S.s[pid(p)];
    if (st && st.last >= t0) continue;
    if (!st) fresh.push(p);
    else if (st.due <= t1) due.push(p);
  }
  due.sort((a,b) => S.s[pid(a)].due - S.s[pid(b)].due);
  return { due: due, fresh: fresh, all: due.concat(fresh) };
}

/* ── 과목 → 장 → 절 ──────────────────────────────────────── */
const SUBJ = (() => {
  const out = [];
  for (const u of UNITS){
    let g = out.find(x => x.key === u.subj);
    if (!g){ g = { key:u.subj, name:u.subjName, sid:u.sid, units:[] }; out.push(g); }
    g.units.push(u);
  }
  out.sort((a,b) => {
    const ia = ORDER.indexOf(a.key), ib = ORDER.indexOf(b.key);
    if (ia !== ib) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    return a.name.localeCompare(b.name, "ko");
  });
  for (const g of out){
    const chs = [];
    for (const u of g.units){
      let c = chs.find(x => x.ch === u.ch);
      if (!c){ c = { ch:u.ch, title:u.chTitle, units:[] }; chs.push(c); }
      c.units.push(u);
      if (!c.title && u.chTitle) c.title = u.chTitle;
    }
    chs.sort((a,b) => a.ch - b.ch);
    chs.forEach(c => c.units.sort((a,b) => a.ord - b.ord));
    g.chs = chs;
  }
  return out;
})();

/* ── 셈 ──────────────────────────────────────────────────── */
/* 단원 하나의 상태 — 0 안 봄 / 1 흔들림 / 2 익힘 / 3 굳음.
   '굳음' 은 **맞혔어요를 연달아 세 번** 이다. 2주 한 바퀴이므로 한 달 반을 안 틀렸다는 뜻. */
function ustate(u){
  const st = memoState(u);
  if (!st) return 0;
  if (st.ok >= 3) return 3;
  if (st.ok >= 1) return 2;
  return 1;
}
function gstat(g){
  const o = { units:0, done:0, seen:0, solid:0, due:0 };
  const t1 = today1();
  for (const u of g.units){
    o.units++;
    if (!u.file) continue;
    o.done++;
    const st = memoState(u);
    if (st){ o.seen++; if (st.ok >= 3) o.solid++; if (st.due <= t1) o.due++; }
  }
  return o;
}
/* 기록이 어느 과목의 것인지 — 채점할 때 넣은 u("과목/단원")로 가른다. */
function subjOf(l){
  let u = l.u;
  if (!u && S.s[l.id]) u = S.s[l.id].unit;
  return u ? String(u).split("/")[0] : "";
}
function byDayOf(key){
  const o = {};
  for (const l of S.log){
    if (key && subjOf(l) !== key) continue;
    const k = dayKey(l.t); o[k] = (o[k]||0) + 1;
  }
  return o;
}
function weekStart(){
  const d = new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   // 월요일부터
  return d.getTime();
}
/* 붙어 있던 시간을 **채점 사이 간격으로 어림한다.** 간격이 3분 넘게 벌어지면 딴짓한
   것으로 보고 끊고, 끊긴 자리는 20초만 센다. 카드 한 장이 빈칸 하나보다 오래 걸린다. */
function minutesOf(list){
  if (!list.length) return 0;
  const ts = list.map(l => l.t).sort((a,b) => a-b);
  let ms = 20000;
  for (let i=1; i<ts.length; i++){
    const d = ts[i] - ts[i-1];
    ms += (d <= 180000) ? d : 20000;
  }
  return Math.max(1, Math.round(ms/60000));
}
const fmtMin = m => m >= 60 ? Math.floor(m/60) + "시간 " + (m%60) + "분" : m + "분";
function streaks(byDay){
  const days = Object.keys(byDay).map(Number).sort((a,b) => a-b);
  let max = 0, run = 0, prev = null;
  for (const d of days){ run = (prev !== null && d - prev === DAY) ? run+1 : 1; prev = d;
                         if (run > max) max = run; }
  const t = today0();
  let cur = 0;
  for (let d = byDay[t] ? t : t - DAY; byDay[d]; d -= DAY) cur++;
  return { cur, max };
}
const tile = (k, v, sub, hot) => `<div class="tile${hot ? " hot" : ""}">`
  + `<div class="k">${k}</div><div class="v">${v}</div>`
  + (sub ? `<div class="s">${sub}</div>` : "") + `</div>`;

/* 12주 히트맵. 일요일에서 시작해 열이 주 단위로 떨어진다. */
function heat(byDay){
  const t = today0();
  const start = t - 83*DAY - (new Date(t).getDay())*DAY;
  let max = 1;
  for (const k in byDay) if (byDay[k] > max) max = byDay[k];
  let h = "";
  for (let d=start; d<=t; d+=DAY){
    const n = byDay[d]||0, al = n ? (0.30 + 0.70*Math.min(1, n/max)) : 0;
    h += `<i title="${new Date(d).toLocaleDateString()} · ${n}회"`
       + (n ? ` style="background:rgba(var(--fill),${al.toFixed(2)})"` : "") + `></i>`;
  }
  return h;
}

/* ── 화면 1 · 정리노트 — 과목 목록 ───────────────────────── */
function noteHome(){
  const t0 = today0(), all = byDayOf(null), w0 = weekStart();
  const todayLog = S.log.filter(l => l.t >= t0);
  const weekLog  = S.log.filter(l => l.t >= w0);
  const st = streaks(all);
  const weekDays = new Set(weekLog.map(l => dayKey(l.t))).size;
  let doneN = 0, allN = 0, solidN = 0;
  const panels = SUBJ.map(g => {
    const s = gstat(g);
    doneN += s.done; allN += s.units; solidN += s.solid;
    const gt = S.log.filter(l => l.t >= t0 && subjOf(l) === g.key).length;
    const gw = S.log.filter(l => l.t >= w0 && subjOf(l) === g.key).length;
    return `<a class="panel" href="#${g.sid}">
      <div class="ph"><span class="nm">${esc(g.name)}</span>
        <span class="n">${s.done}/${s.units}단원</span></div>
      <div class="pbody">
        <div class="hm">${heat(byDayOf(g.key))}</div>
        <div class="pstat">오늘 <b>${gt}</b>장 · 이번 주 <b>${gw}</b>장<br>
          굳은 단원 <b>${s.solid}</b> / 쓴 단원 <b>${s.done}</b>
          <div class="prog"><i style="width:${s.done ? (s.solid/s.done*100).toFixed(0) : 0}%"></i></div>
        </div>
      </div>
    </a>`;
  }).join("");
  head("정리노트", false);
  document.getElementById("app").innerHTML = `
    <div class="tiles">
      ${tile("오늘 학습", `${todayLog.length}<u>장</u>`,
             todayLog.length ? fmtMin(minutesOf(todayLog)) + " 공부"
                             : "아직 시작 안 함", !!todayLog.length)}
      ${tile("이번 주", `${weekLog.length}<u>장</u>`,
             weekDays ? `${weekDays}일 · 하루 평균 ${Math.round(weekLog.length/weekDays)}장`
                      : "이번 주는 아직")}
      ${tile("연속 학습", `${st.cur}<u>일</u>`, `최장 ${st.max}일`)}
      ${tile("쓴 단원", `${doneN}<u>/${allN}</u>`, `굳은 단원 ${solidN}개`)}
    </div>
    ${panels}`;
}

/* ── 화면 2 · 과목 하나 ─────────────────────────────────── */
const DOTNAME = ["아직", "흔들림", "익힘", "굳음"];
function subject(g){
  const opened = openSet(), s = gstat(g), t0 = today0();
  const gLog = S.log.filter(l => l.t >= t0 && subjOf(l) === g.key);
  let inner = "";
  for (const c of g.chs){
    let cw = 0, lines = "";
    for (const u of c.units){
      if (!u.file){
        lines += `<div class="unit todo"><div class="t">`
          + `<span>${u.ord}. ${esc(u.title)}</span><span class="n">아직</span></div></div>`;
        continue;
      }
      cw++;
      const s2 = ustate(u);
      lines += `<a class="unit" href="${u.file}?v=${BUILD}"><div class="t">`
        + `<span><i class="dot s${s2}"></i>${u.ord}. ${esc(u.title)}</span>`
        + `<span class="n">${DOTNAME[s2]}</span></div></a>`;
    }
    const ck = g.key + "|" + c.ch;
    inner += `<div class="ch"${opened.has(ck) ? " open" : ""} data-k="${esc(ck)}">`
      + `<button class="chh"><span class="caret"></span>`
      + `<span class="nm">제${c.ch}장${c.title ? " " + esc(c.title) : ""}</span>`
      + `<span class="n">${cw}/${c.units.length}</span></button>`
      + `<div class="chu">${lines}</div></div>`;
  }
  head(g.name, true);
  document.getElementById("app").innerHTML = `
    <div class="tiles">
      ${tile("쓴 단원", `${s.done}<u>/${s.units}</u>`, `아직 ${s.units - s.done}단원`)}
      ${tile("오늘 학습", `${gLog.length}<u>장</u>`,
             gLog.length ? fmtMin(minutesOf(gLog)) + " 공부" : "아직 시작 안 함")}
      ${tile("굳은 단원", `${s.solid}<u>개</u>`, `본 단원 ${s.seen}개 중`)}
      ${tile("복습할 것", `${s.due}<u>개</u>`, s.due ? "암기노트에서" : "밀린 것 없음", !!s.due)}
    </div>
    <div class="card pad"><div class="hm big">${heat(byDayOf(g.key))}</div></div>
    <div class="card">${inner}</div>`;

  document.querySelectorAll(".ch > button.chh").forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const d = b.parentElement, k = d.getAttribute("data-k"), o = openSet();
      if (d.hasAttribute("open")){ d.removeAttribute("open"); o.delete(k); }
      else { d.setAttribute("open",""); o.add(k); }
      setOpen(o);
    };
  });
}

/* ── 화면 3 · 암기노트 — 오늘의 덱 ──────────────────────── */
function memoHome(){
  const d = memoDeck(), t0 = today0(), fresh = unseenCount();
  const deckView = location.hash.replace(/^#/, "") === "memo~";
  const dow = new Date().getDay();
  const plan = d.ch
    ? `${WEEKDAY[dow]}요일 — <b>제${d.ch}장</b>`
    : `${WEEKDAY[dow]}요일 — 배정된 장 없음`;
  const chHas = d.ch ? WRITTEN.filter(u => u.ch === d.ch).length : 0;
  const nx = d.ch ? new Date(nextSlot(d.ch)) : null;
  /* 배정된 장을 아직 안 썼을 수 있다 — 진도가 1~3장인데 오늘이 10장 자리인 식으로.
     그때 "오늘 몫은 끝났습니다" 라고 하면 거짓말이 된다. */
  const chLine = !d.ch
    ? "주말은 배정이 없습니다 — 밀린 것만 봅니다."
    : chHas
      ? `제${d.ch}장이 오늘 자리입니다. 다음은 ${nx.getMonth()+1}월 ${nx.getDate()}일.`
      : `제${d.ch}장은 아직 안 쓴 단원입니다 — 밀린 것만 봅니다.`;
  const done = S.log.filter(l => l.t >= t0 && String(l.id).startsWith("m|")).length;
  head("암기노트", deckView);
  document.getElementById("app").innerHTML = `
    <div class="deckhead">
      <h3>${plan}</h3>
      <div class="big">${d.all.length}<u>장</u></div>
      <div class="sub">${chLine}</div>
      <div class="mix">
        <span>오늘 자리 ${d.slot.length}</span>
        <span>밀린 것 ${d.late.length}</span>
        <span>오늘 푼 것 ${done}</span>
      </div>
      <button class="go" id="start"${(d.all.length || fresh) ? "" : " disabled"}>
        ${d.all.length ? "시작하기"
            : fresh ? `안 본 카드 ${fresh}장부터 보기`
            : "볼 카드가 없습니다"}</button>
      ${(d.all.length && fresh) ? `<button class="go" id="startn"
          style="background:var(--card);color:var(--accent);border:1px solid var(--accent)">
          안 본 카드 ${fresh}장 먼저 보기</button>` : ""}
    </div>
    <div class="card pad">
      <div class="kv" style="line-height:1.9">
        앞면은 <b>장과 절 이름</b>, 뒷면은 그 절의 <b>뼈대</b>입니다.
        떠올려 본 뒤 뒤집고, <b>풀이</b>에서 왜 그 순서인지(연결)를 확인하세요.<br>
        몰랐어요 → 내일 · 헷갈려요 → 사흘 뒤 · 맞혔어요 → 그 장이 돌아오는 날.
      </div>
    </div>
    ${cycleTable()}`;
  const b = document.getElementById("start");
  if (b) b.onclick = () => { location.hash = "memo"; };
  const bn = document.getElementById("startn");
  if (bn) bn.onclick = () => { location.hash = "memo!new"; };
}
/* 2주 한 바퀴가 어떻게 도는지를 표로 — 오늘이 어디인지 보이게 한다.
   줄을 누르면 그 장을 지금 돌 수 있다. 주말이거나 그날 몫을 끝냈을 때, 그리고 여행·야근으로
   하루를 건너뛴 다음날 따라잡을 때 필요한 문이다. */
function cycleTable(){
  const t = today0();
  let rows = "";
  for (let i = 0; i < 14; i++){
    const d = mondayOf(t) + i*DAY, ch = chapterOn(d);
    const on = d === t;
    const n = ch ? WRITTEN.filter(u => u.ch === ch).length : 0;
    const label = `${new Date(d).getMonth()+1}/${new Date(d).getDate()}`
      + ` (${WEEKDAY[new Date(d).getDay()]})${on ? " · 오늘" : ""}`;
    const right = ch ? `제${ch}장 <span class="n">· ${n}장</span>` : "쉼";
    rows += ch
      ? `<a class="unit" href="#memo!${ch}"><div class="t">`
        + `<span${on ? ' style="color:var(--accent)"' : ''}>${label}</span>`
        + `<span class="n">${right}</span></div></a>`
      : `<div class="unit todo"><div class="t"><span>${label}</span>`
        + `<span class="n">쉼</span></div></div>`;
  }
  return `<h2 class="sec">2주 한 바퀴 <span style="opacity:.7">· 줄을 누르면 그 장을 지금 봅니다</span></h2>`
       + `<div class="card">${rows}</div>`;
}

/* ── 화면 4 · 암기 카드 돌리기 ──────────────────────────── */
let mq = [], mi = 0, mflip = false, mmode = "", mfall = "";
function memoRun(){
  if (!mq.length){
    const d = memoDeck(mmode);
    mq = shuffled(d.all); mfall = "";
    /* 오늘 자리가 비어도(주말 · 아직 안 쓴 장 · 오늘 몫 끝) **탭을 눌렀으면 카드가**
       **나와야 한다.** 그래서 아직 한 번도 안 본 카드로 흘러간다 — 안내 화면을 한 장
       더 두면 매일 그걸 지나쳐 누르게 된다. */
    if (!mmode && !mq.length){
      const fresh = WRITTEN.filter(u => !memoState(u));
      if (fresh.length){ mq = shuffled(fresh); mfall = "안 본 카드"; }
    }
    mi = 0; mflip = false;
  }
  /* 여기까지 와서 비었으면 **정말로 볼 것이 없다** — 다 봤고 밀린 것도 없다. */
  if (mi >= mq.length) return memoDone();
  const u = mq[mi], c = u.card;
  head(mmode === "new" ? "안 본 카드" : (+mmode ? "제" + mmode + "장" : "암기노트"),
       !!mmode);
  const front = `<div class="fq"><div class="ch">제${u.ch}장 ${esc(u.chTitle)}</div>
      <div class="ti">${u.ord}. ${esc(u.title)}</div></div>`;
  const back = `<div class="fa">
      <div class="ti">${u.ord}. ${esc(u.title)}</div>
      ${c.bone.map(b => `<div class="bn"><div class="bh"><i><span>${esc(b.n)}</span></i>`
        + `<span>${b.t}</span></div>`
        + (b.subs.length
            ? `<ol class="bs">${b.subs.map(s => `<li>${s}</li>`).join("")}</ol>` : "")
        + `</div>`).join("")}
      <button class="solve" id="solve">풀이 ›</button>
    </div>`;
  const acts = mflip
    ? `<div id="grades">${[1,2,3].map(g =>
         `<button class="g${g}" data-g="${g}"><b>${MEMO_G[g].t}</b>`
         + `<span>${memoIvlText(u, g)}</span></button>`).join("")}</div>`
    : `<button class="flip" id="flip">뒷면 보기</button>`;
  document.getElementById("app").innerHTML = `
    <div class="cnt"><a href="#memo~"><b>${mi+1}</b> / ${mq.length}`
       + `${mfall ? " · " + mfall : ""} · 덱</a></div>
    <div class="fcard">
      <div class="fsubj">${esc(u.subjName)}</div>
      ${mflip ? back : front}
    </div>
    <div class="acts">${acts}</div>`;

  const f = document.getElementById("flip");
  if (f) f.onclick = () => { mflip = true; memoRun(); };
  const sv = document.getElementById("solve");
  if (sv) sv.onclick = () => showSheet(u);
  document.querySelectorAll("#grades button").forEach(b => {
    b.onclick = () => {
      gradeMemo(u, +b.getAttribute("data-g"));
      mi++; mflip = false; window.scrollTo(0,0); memoRun();
    };
  });
}
/* 큐를 다 돌았을 때. 짧게 끝내고 **덱 화면으로 밀어내지 않는다** — 방금 다 한 사람에게
   2주 표를 다시 펼쳐 보일 이유가 없다. */
function memoDone(){
  const t0 = today0();
  const done = S.log.filter(l => l.t >= t0 && String(l.id).startsWith("m|")).length;
  /* 한 장만 골라 돌고 나왔을 수도 있다 — **다음에 무엇이 남았는지** 보고 그리로 잇는다.
     "밀린 것도 없습니다" 를 무턱대고 찍으면 거짓말이 된다. */
  const left = memoDeck("").all.length, fresh = unseenCount();
  const more = left ? { n: left, t: "오늘 몫 " + left + "장 보기", h: "memo" }
             : fresh ? { n: fresh, t: "안 본 카드 " + fresh + "장 보기", h: "memo!new" }
             : null;
  head("암기노트", false);
  document.getElementById("app").innerHTML = `
    <div class="deckhead">
      <h3>여기까지</h3>
      <div class="big">${done}<u>장 봤습니다</u></div>
      <div class="sub">${more ? "더 하겠다면 아래로." : "밀린 것도 없습니다. 내일 또."}</div>
      ${more ? `<a class="go" href="#${more.h}"
          style="text-align:center;text-decoration:none">${more.t}</a>` : ""}
      <a class="go" href="#memo~" style="text-align:center;text-decoration:none;
         background:var(--card);color:var(--accent);border:1px solid var(--accent)">덱 보기</a>
    </div>`;
  syncNow(true);
}

function showSheet(u){
  const c = u.card;
  document.getElementById("sheetbox").innerHTML = `
    <div class="hd"><b>${u.ord}. ${esc(u.title)}</b>
      <button id="closeSheet">닫기</button></div>
    ${c.oneline ? `<div class="ol">${c.oneline}</div>` : ""}
    ${c.link.map(x => `<h4>${esc(x.k)}</h4>${x.html}`).join("")}
    ${c.check ? `<div class="chk">${c.check}</div>` : ""}
    ${u.file ? `<p style="margin-top:18px"><a href="${u.file}?v=${BUILD}">정리노트에서 이어 읽기 ›</a></p>` : ""}`;
  document.getElementById("sheet").hidden = false;
  document.getElementById("closeSheet").onclick = hideSheet;
}
function hideSheet(){ document.getElementById("sheet").hidden = true; }
document.getElementById("sheet").onclick = ev => {
  if (ev.target.id === "sheet") hideSheet();
};

/* ── 화면 5 · 오답노트 ──────────────────────────────────── */
function wrongHome(){
  const d = wrongDeck(), t0 = today0();
  const done = S.log.filter(l => l.t >= t0 && String(l.id).startsWith("p|")).length;
  const solid = PROBS.filter(p => { const st = S.s[pid(p)]; return st && st.ok >= 2; }).length;
  head("오답노트", location.hash.replace(/^#/, "") === "wrong~");
  document.getElementById("app").innerHTML = `
    <div class="deckhead">
      <h3>노션에 모은 문제 ${PROBS.length}개</h3>
      <div class="big">${d.all.length}<u>문제</u></div>
      <div class="sub">틀리면 내일 · 맞으면 7일 → 그다음부터 14일.</div>
      <div class="mix">
        <span>밀린 것 ${d.due.length}</span>
        <span>처음 보는 것 ${d.fresh.length}</span>
        <span>오늘 푼 것 ${done}</span>
      </div>
      <button class="go" id="startw"${d.all.length ? "" : " disabled"}>
        ${d.all.length ? "풀기" : "오늘 몫은 끝났습니다"}</button>
    </div>
    <div class="tiles">
      ${tile("굳은 문제", `${solid}<u>개</u>`, "두 번 이상 연달아 맞힘")}
      ${tile("전체", `${PROBS.length}<u>문제</u>`, "problem_uploader.py 로 늘립니다")}
    </div>
    ${wrongBySubj()}`;
  const b = document.getElementById("startw");
  if (b) b.onclick = () => { location.hash = "wrong"; };
}
function wrongBySubj(){
  const by = {};
  for (const p of PROBS){
    const k = p.subjName || "그 밖";
    (by[k] = by[k] || []).push(p);
  }
  const rows = Object.keys(by).sort().map(k => {
    const list = by[k];
    const seen = list.filter(p => S.s[pid(p)]).length;
    return `<div class="unit" style="border-top:1px solid var(--line)"><div class="t">
      <span>${esc(k)}</span><span class="n">${seen}/${list.length}</span></div></div>`;
  }).join("");
  return `<h2 class="sec">과목별</h2><div class="card">${rows}</div>`;
}

function wrongDone(){
  const t0 = today0();
  const done = S.log.filter(l => l.t >= t0 && String(l.id).startsWith("p|")).length;
  head("오답노트", false);
  document.getElementById("app").innerHTML = `
    <div class="deckhead">
      <h3>오늘 몫 끝</h3>
      <div class="big">${done}<u>문제 풀었습니다</u></div>
      <div class="sub">틀린 것은 내일 다시 나옵니다.</div>
      <a class="go" href="#wrong~" style="text-align:center;text-decoration:none;
         background:var(--card);color:var(--accent);border:1px solid var(--accent)">덱 보기</a>
    </div>`;
  syncNow(true);
}

let wq = [], wi = 0, wpick = -1, worder = [];
/* 보기 순서는 **볼 때마다 섞는다.** 자리로 답을 외우는 것을 막는다 (노션 쪽도 같은 이유로
   섞기시각을 두고 있다). 섞기는 화면에서만 하고 기록에는 원래 번호가 남는다. */
function shuffle(n){
  const a = Array.from({length:n}, (_, i) => i);
  for (let i = n-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1));
                                 [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function wrongRun(){
  if (!wq.length){ wq = shuffled(wrongDeck().all); wi = 0; wpick = -1; worder = []; }
  if (wi >= wq.length) return wrongDone();
  const p = wq[wi];
  if (!worder.length) worder = shuffle(p.choices.length);
  head("오답노트", false);
  const graded = wpick >= 0;
  const opts = worder.map((src, i) => {
    let cls = "";
    if (graded){
      if (src === p.ans) cls = " right";
      else if (src === wpick) cls = " wrong";
    }
    return `<button class="opt${cls}" data-src="${src}"><i>${"①②③④"[i]}</i>`
         + `<span>${p.choices[src]}</span></button>`;
  }).join("");
  document.getElementById("app").innerHTML = `
    <div class="cnt"><a href="#wrong~"><b>${wi+1}</b> / ${wq.length}`
       + ` · ${esc(p.subjName || "")} · 덱</a></div>
    <div class="card pad qcard">
      <div class="qtext">${p.q}</div>
      <div class="opts">${opts}</div>
      ${graded && p.sol ? `<div class="sol">${p.sol}</div>` : ""}
      ${p.img ? `<details class="src"><summary>교재 원본 보기</summary>
                   <img src="${p.img}?v=${BUILD}" alt="문제 원본" loading="lazy"></details>` : ""}
    </div>
    ${graded ? `<div class="acts"><button class="flip" id="nextq">다음 문제</button></div>` : ""}`;

  document.querySelectorAll(".opts button").forEach(b => {
    b.onclick = () => {
      if (wpick >= 0) return;
      wpick = +b.getAttribute("data-src");
      gradeWrong(p, wpick === p.ans);
      wrongRun();
    };
  });
  const nx = document.getElementById("nextq");
  if (nx) nx.onclick = () => { wi++; wpick = -1; worder = []; window.scrollTo(0,0); wrongRun(); };
}

/* ── 설정 ────────────────────────────────────────────────── */
function settings(){
  const w = J.where(), c = J.cfg();
  head("설정", true);
  document.getElementById("app").innerHTML = `
    <div class="card pad">
      <div class="kv">기록 저장소 <b>${esc(w.repo || "(없음)")}</b><br>
        파일 <b>${esc(w.path)}</b></div>
      <label class="row">GitHub 토큰 (이 저장소의 Contents 읽기·쓰기)</label>
      <input type="password" id="token" value="${esc(c.token||"")}" placeholder="github_pat_...">
      <div class="tools">
        <button class="pri" id="savetok">저장</button>
        <button id="now">지금 맞추기</button>
      </div>
      <div class="note">토큰이 없으면 <b>읽기만</b> 됩니다 — 진도는 보이지만 이 기기에서 채점한
        것은 올라가지 않습니다. 토큰은 이 브라우저에만 저장되고 어디에도 올라가지 않습니다.
        폰에 넣을 때는 주소 끝에 <b>#t=토큰</b> 을 붙여 한 번 열어도 됩니다.
        <br>마지막으로 맞춘 때 ${c.last ? new Date(c.last).toLocaleString() : "없음"}
        <br>빌드 ${BUILT}</div>
    </div>`;
  document.getElementById("savetok").onclick = () => {
    const c2 = J.cfg(); c2.token = document.getElementById("token").value.trim();
    J.setCfg(c2); say(c2.token ? "토큰을 저장했습니다" : "토큰을 비웠습니다 (읽기 전용)", "ok");
  };
  document.getElementById("now").onclick = () => syncNow();
}

/* ── 머리·탭 ─────────────────────────────────────────────── */
function head(title, back){
  document.getElementById("ttl").textContent = title;
  document.getElementById("back").disabled = !back;
}
function markTab(t){
  document.querySelectorAll("#tabs a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("data-t") === t));
}
function tabBadges(){
  const m = memoDeck().all.length, w = wrongDeck().all.length;
  const set = (t, n) => {
    const a = document.querySelector(`#tabs a[data-t="${t}"]`);
    if (!a) return;
    const old = a.querySelector(".n"); if (old) old.remove();
    if (n) a.insertAdjacentHTML("beforeend", `<span class="n"><span>${n}</span></span>`);
  };
  set("memo", m); set("wrong", w);
}
function say(msg, kind, ms){ if (window.J0Toast) window.J0Toast(msg, kind, ms); }

/* ── 동기화 — 열 때 자동, 덱을 다 돌면 한 번 더 ─────────── */
let syncing = false;
async function syncNow(quiet){
  if (syncing || !J.ready()) return;
  syncing = true;
  if (!quiet) say("맞추는 중…", "", 0);
  try{
    const r = await J.sync();
    S = load(); route();
    const got = r.n ? " · 새 기록 " + r.n + "건" : "";
    say(r.readonly
          ? (r.empty
              ? "받지 못했습니다 — 기록 파일이 아직 없거나, 비공개 저장소라 토큰이 필요합니다"
              : "받았습니다 (이 기기는 읽기 전용)" + got)
          : r.uptodate ? "최신입니다" + got
          : "맞췄습니다" + got,
        r.readonly && r.empty ? "err" : "ok");
  }catch(e){ say(e.message, "err"); }
  syncing = false;
}

/* ── 길 찾기 ─────────────────────────────────────────────── */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  hideSheet();
  if (h.startsWith("t=")){                 // 주소로 토큰 넘기기 (폰에 넣을 때 편하다)
    const c = J.cfg(); c.token = h.slice(2).trim(); J.setCfg(c);
    history.replaceState(null, "", "#set");
    say("토큰을 저장했습니다", "ok");
    markTab(""); return settings();
  }
  /* 탭을 누르면 **바로 카드**다 (`#memo` · `#wrong`). 덱 요약(2주 표·미리 보기·통계)은
     카드 위의 카운터를 눌러 들어가는 `~` 화면으로 물러났다 — 매일 여는 곳이 카드인데
     그 앞에 요약 화면을 한 장 두면 하루에 한 번씩 쓸데없이 더 누르게 된다.
       #memo   오늘 몫 카드      #memo~   덱 요약
       #memo!new 안 본 카드      #memo!7  제7장
     볼 카드가 없으면 memoRun 이 스스로 덱 요약으로 넘긴다. */
  const mm = h === "memo" ? "" : (h.startsWith("memo!") ? h.slice(5) : null);
  if (mm === null || mm !== mmode) { mq = []; mflip = false; mmode = mm || ""; }
  if (h !== "wrong") { wq = []; wpick = -1; worder = []; }
  tabBadges();
  if (h === "set"){ markTab(""); return settings(); }
  if (h === "memo~"){ markTab("memo"); return memoHome(); }
  if (mm !== null){ markTab("memo"); return memoRun(); }
  if (h === "wrong~"){ markTab("wrong"); return wrongHome(); }
  if (h === "wrong"){ markTab("wrong"); return wrongRun(); }
  const g = SUBJ.find(x => x.sid === h);
  if (g){ markTab("note"); return subject(g); }
  markTab("note"); noteHome();
}

document.getElementById("back").onclick = () => {
  const h = location.hash.replace(/^#/, "");
  if (h.startsWith("memo")) location.hash = "memo";
  else if (h.startsWith("wrong")) location.hash = "wrong";
  else location.hash = "note";
};
document.getElementById("gear").onclick = () => { location.hash = "set"; };
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") hideSheet();
  const gb = document.querySelectorAll("#grades button");
  if (gb.length && "123".includes(ev.key)) gb[+ev.key - 1].click();
  const fb = document.getElementById("flip");
  if (fb && (ev.key === " " || ev.key === "Enter")){ ev.preventDefault(); fb.click(); }
});
route();
syncNow(true);
window.addEventListener("focus", () => { S = load(); route(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){ S = load(); route(); }
});
