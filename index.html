/sup>. 5절에서 &quot;그물을 그리기 전에 네 변을 먼저 정한다&quot;고 했던 그 일을 흙 댐에서 다시 하는 것인데, 여기서는 <strong>한 변이 둘 다 아니다.</strong> 하류 사면은 물이 면을 뚫고 나오니 면을 따라 흐르지 않아 유선이 아니고, 나오는 점마다 높이가 달라 전수두가 다르니 등수두선도 아니다. 시험이 네 항목 중 하나만 바꿔 내는 자리가 정확히 여기다. 그리고 침투유량을 구하는 순서가 왜 침윤선부터인지를 확인하는데⁠<sup class=\"rs\">1-3</sup>, 새 식이 있는 것이 아니라 <strong>침윤선을 그려야 5절 식을 쓸 칸이 생기기</strong> 때문이다.</p>\n<p>성질을 알았으니 <strong>실제로 그린다</strong>⁠<sup class=\"rs\">2</sup>. 미지의 곡선을 맨손으로 찾을 수는 없으므로 모양을 <strong>포물선이라 가정해</strong> 자와 컴퍼스로 그릴 수 있는 곡선을 하나 세우고, 안 맞는 양 끝만 고친다. 포물선을 정하려면 초점과 준선이 필요하니 물이 최종적으로 빠져나가는 자리를 초점으로 잡고⁠<sup class=\"rs\">2-1</sup>, 준선과 꼭짓점을 차례로 정해 곡선을 잇는다⁠<sup class=\"rs\">2-2</sup>. 꼭짓점이 초점과 준선의 중점이라는 것도 외울 값이 아니라 포물선의 정의에서 그냥 나온다. 마지막에 양 끝을 보정하는데⁠<sup class=\"rs\">2-3</sup>, 보정하는 이유가 전부 앞의 경계조건에서 나온다 ― 상류 사면이 등수두선이므로 침윤선이 거기에 직각으로 들어가야 하고, 하류 쪽은 물이 실제로 나오는 자리가 포물선과 어긋난다. <strong>작도법은 경계조건을 그림으로 옮긴 것</strong>이다.</p>\n<p>마지막이 <strong>대책</strong>이다⁠<sup class=\"rs\">3</sup>. 침윤선을 끌어내리려면 물을 빼 줄 층이 필요한데, 그 층은 물은 통과시키되 흙은 잡아 두어야 한다⁠<sup class=\"rs\">3-1</sup>. 두 요구가 <strong>서로 반대 방향</strong>이라 공극 크기에 위아래 양쪽 조건이 붙고, 그것을 입경비로 적은 것이 설계기준이다⁠<sup class=\"rs\">3-2</sup> ― 세 식 모두 분자가 필터이고 분모가 보호층이라, 뒤집으면 전부 틀린다.</p>\n<p>왜 이렇게까지 하는지는 마지막에 드러난다⁠<sup class=\"rs\">3-3</sup>. 침윤선이 하류 사면으로 나오는 자리는 5절에서 본 <strong>유출부</strong>이고, 거기가 동수경사가 가장 큰 곳이다. 물이 알갱이를 데리고 나가면 통로가 상류로 자라 제체를 관통한다 ― 댐은 넘쳐서보다 <strong>속에서 새어서</strong> 무너진다. 대책의 원리는 한 줄이다: 침투거리를 늘려 동수경사를 낮춘다. 코어와 필터는 침윤선의 위치를 끌어내리고 널말뚝과 차수벽은 물길을 늘리는데, <strong>막는 것은 상류와 내부에, 빼는 것은 하류에</strong> 놓는다.</p>\n<p><strong>뚜껑을 먼저 그리고, 그 안에 그물을 친다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 흙 댐은 5절처럼 바로 유선망을 그릴 수 없는가\n② 침윤선이 자유수면이라는 사실에서 무엇이 따라 나오는가\n③ 침윤선이 하류 사면으로 빠져나오면 무엇이 문제인가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의각성분의상관관계", "name": "흙의각성분의상관관계", "title": "흙의 각 성분의 상관관계", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 2, "file": "n-21c08856e4.html", "card": {"oneline": "3상을 재는 잣대 다섯은 <strong>서로 독립이 아니다.</strong> 몇 개만 알면 나머지가 따라 나오고, 그 다리가 <strong>포화도 × 간극비 = 비중 × 함수비</strong> 다.", "bone": [{"n": "1", "t": "3상을 재는 양들", "subs": ["3상 모형과 세는 규칙", "부피로 재는 양 ― 간극비 · 간극률 · 포화도", "무게로 재는 양 ― 함수비 · 함수율", "부피와 무게를 잇는 하나 ― 비중"]}, {"n": "2", "t": "관계식 ― 몇 개에서 나머지를 만든다", "subs": ["흙 입자 부피를 1 로 놓는다", "분모를 바꾸는 환산 ― <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi><mo>↔</mo><mi>n</mi></mrow></math></span>, <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w</mi><mo>↔</mo><msup><mi>w</mi><mi>′</mi></msup></mrow></math></span>", "부피와 무게를 잇는 다리", "부피가 변하면 ― 체적 변화와 간극비"]}], "link": [{"k": "목적", "html": "<p>현장에서 잴 수 있는 것은 무게뿐이다. 젖은 채로 한 번, 말려서 한 번. 그런데 설계에서 알고 싶은 것은 <strong>간극이 얼마나 남았는가</strong>, 곧 부피다. 잴 수 있는 것과 알고 싶은 것이 어긋나 있으니 그 사이를 잇는 환산식이 필요하고, 그것을 만드는 자리가 이 절이다. 이 절이 없으면 3절의 단위중량 넷과 3장의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span>, 4장의 압밀침하식이 전부 근거 없는 암기식이 된다.</p>\n"}, {"k": "연결", "html": "<p>시료를 받아 저울에 올리면 나오는 숫자는 무게 둘뿐이다 ― 젖은 무게와 110 ℃ 에 말린 무게. 이것으로 &quot;간극이 얼마나 남았나&quot;에 답해야 한다.</p>\n<p>먼저 흙을 세는 규칙부터 정한다⁠<sup class=\"rs\">1-1</sup>. 흙은 알갱이·물·공기의 3상인데 <strong>부피는 세 칸이고 무게는 두 칸</strong>이다 ― 공기의 무게는 물의 800분의 1 수준이라 버리기 때문이다. 이 비대칭 때문에 부피로 재는 잣대와 무게로 재는 잣대를 따로 세워야 한다.</p>\n<p>잣대는 부피 쪽에 셋, 무게 쪽에 둘이다⁠<sup class=\"rs\">1-2</sup>⁠<sup class=\"rs\">1-3</sup>. 분자는 서로 비슷하고 <strong>다른 것은 분모뿐</strong>이다. 간극비와 함수비는 분모가 입자만이고, 간극률과 함수율은 전체이고, 포화도는 간극이다. 시험에서 묻는 함정이 전부 여기서 나온다 ― 분모가 자기를 품는 전체면 값이 100 % 를 넘을 수 없고, 분모가 입자만이면 얼마든지 넘을 수 있다. 간극비가 1 을 넘어도 되는 것과 함수비가 수백 % 까지 가는 것이 같은 이유다.</p>\n<p>그런데 부피 잣대와 무게 잣대는 서로 말이 통하지 않는다. 둘을 잇는 환율이 있어야 하고, 그것이 <strong>비중</strong>이다⁠<sup class=\"rs\">1-4</sup>. 비중은 입자만의 단위중량을 물의 단위중량으로 나눈 값이라, 뒤집어 읽으면 부피 1 을 무게로 바꿔 주는 값이 된다.</p>\n<p>환율까지 갖췄으면 관계식을 만들 수 있다⁠<sup class=\"rs\">2</sup>. 요령은 하나다. 다섯 잣대가 전부 비율이라 크기를 마음대로 정해도 값이 안 변하니, <strong>물이 드나들어도 변하지 않는 입자 부피를 1 로 놓는다</strong>⁠<sup class=\"rs\">2-1</sup>. 그러면 삼상도의 모든 칸이 간극비·포화도·함수비·비중으로 적힌다. 그 뒤로는 그림을 읽기만 하면 된다. 분모만 바꾸는 환산이 언제나 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mfrac><mrow><mi>x</mi></mrow><mrow><mn>1</mn><mo>+</mo><mi>x</mi></mrow></mfrac></mrow></math></span> 꼴인 이유가 눈에 보이고⁠<sup class=\"rs\">2-2</sup>, 물의 무게를 부피 쪽으로 한 번 무게 쪽으로 한 번 세어 같다고 놓으면 <strong>포화도 × 간극비 = 비중 × 함수비</strong>라는 다리가 그 자리에서 나온다⁠<sup class=\"rs\">2-3</sup>. 넷 중 셋을 주고 하나를 묻는 문제는 거의 이 식이다.</p>\n<p>마지막으로 흙이 눌리는 경우를 본다. 눌려도 알갱이는 줄지 않고 <strong>간극만 준다.</strong> 그러니 부피 변화는 곧 간극비의 변화이고, 전체 부피가 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>+</mo><mi>e</mi></mrow></math></span> 였으므로 변화율도 그 자리에서 나온다⁠<sup class=\"rs\">2-4</sup>. 4장의 압밀침하가 이 식이다.</p>\n<p><strong>재는 것은 무게, 알고 싶은 것은 부피.</strong> 그 사이를 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>G</mi><mi>s</mi></msub></mrow></math></span> 가 잇는다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 다섯 잣대의 분모가 각각 무엇인가, 그리고 100 % 를 넘을 수 있는 것은 어느 것인가\n② 부피와 무게 사이에 왜 비중이 끼어야 하는가\n③ <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>s</mi></msub><mo>=</mo><mn>1</mn></mrow></math></span> 로 놓으면 무엇이 편해지는가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의공학적분류방법", "name": "흙의공학적분류방법", "title": "흙의 공학적 분류방법", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 9, "file": "n-3a001b76aa.html", "card": {"oneline": "체로 <strong>굵기</strong>를 자르고 물 두 값으로 <strong>찰기</strong>를 재서, 그 둘을 <strong>두 글자 기호</strong>(GW · SM · CH …)로 압축한다. 기호 하나가 곧 그 흙의 거동 예보다.", "bone": [{"n": "1", "t": "분류의 두 축 ― 굵기와 찰기", "subs": ["체 ― 굵기를 자르는 칸막이", "굵은 쪽의 잣대 ― 입도", "가는 쪽의 잣대 ― 연경도와 소성도표"]}, {"n": "2", "t": "통일분류법 (USCS)", "subs": ["기호 두 글자 읽는 법", "분류 기호표 ― 열다섯 개의 기호", "판정 순서와 이중기호"]}, {"n": "3", "t": "AASHTO 분류법", "subs": ["도로의 언어 ― 무엇이 다른가", "군지수 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>G</mi><mi>I</mi></mrow></math></span>", "A-1 ~ A-7 분류표"]}], "link": [{"k": "목적", "html": "<p>같은 '흙'이라도 강바닥 자갈과 논바닥 진흙은 <strong>완전히 다른 재료</strong>다. 그런데 &quot;이 흙 좀 무른데요&quot;라는 현장 말로는 듣는 사람마다 다른 그림을 떠올린다. 그래서 <strong>측정 가능한 소수의 값</strong>만 재서 기호로 묶는다. 기호 하나로 거동을 예측하는 <strong>통신 코드</strong>이지 암기 게임이 아니다. 이것이 없으면 &quot;N치·함수비&quot; 같은 날것의 숫자가 &quot;이 층은 CH니 압밀침하를 검토한다&quot;는 <strong>설계 판단</strong>으로 번역되지 않는다.</p>\n"}, {"k": "연결", "html": "<p>시추 보고서에 &quot;무른 흙&quot;이라고만 적혀 있으면 읽는 사람마다 다른 그림을 떠올린다. 그런데 흙에서 실제로 잴 수 있는 것은 몇 개 되지 않는다 ― 체를 몇 % 통과했나, 물을 얼마나 먹으면 물러지나. 그 몇 개만으로 흙의 성격을 압축해 전달하는 코드를 만드는 것이 이 절이다.</p>\n<p>먼저 <strong>무엇으로 가를 것인가</strong>부터 정한다⁠<sup class=\"rs\">1-1</sup>. 알갱이를 크기 순으로 늘어놓으면 연속 스펙트럼인데, 체로 칸막이를 치면 굵은 쪽과 가는 쪽이 갈린다. 그 칸막이 중 No.200 이 특별한 것은 그 크기가 <strong>눈과 손의 한계</strong>이고, 그 지점이 공학적 거동이 갈리는 지점과 거의 일치하기 때문이다. 그리고 두 쪽은 <strong>버티는 원리가 다르다</strong> ― 굵은 쪽은 맞물린 마찰로 버티고, 가는 쪽은 표면이 물을 붙잡는 힘이 지배한다. 그래서 잣대는 하나일 수 없고 둘이어야 한다. 8절의 삼각좌표가 공학용에서 밀린 이유도 여기서 설명된다 ― 크기만 보고 찰기를 못 보기 때문이다.</p>\n<p>굵은 쪽 잣대는 8절이 이미 만들어 두었다⁠<sup class=\"rs\">1-2</sup>. 세 대표 입경에서 나온 두 계수가 분포의 폭과 곡선의 매끈함을 재고, 둘 다 만족해야 입도가 양호하다. 자갈과 모래의 기준이 다른 것은 자갈은 조금만 섞여도 틈이 메워지지만 모래는 더 다양한 크기가 있어야 촘촘해지기 때문이다. 가는 쪽 잣대는 4·5절이 만들어 두었다⁠<sup class=\"rs\">1-3</sup>. 세립토는 전부 No.200 을 통과해 입도곡선이 왼쪽에 뭉치므로, 대신 액성한계와 소성지수를 두 축으로 놓은 <strong>소성도표</strong> 위에 찍는다. 그 위의 선 셋이 각각 다른 물음에 답한다 ― A선은 무엇으로 찰진가, B선은 얼마나 먹는가, U선은 그 값이 애초에 가능한가.</p>\n<p>잣대가 서면 기호를 찍는다⁠<sup class=\"rs\">2</sup>. 통일분류법은 <strong>첫 글자에 주된 입자를, 둘째 글자에 그 흙의 성격을</strong> 담아 두 글자로 압축한다⁠<sup class=\"rs\">2-1</sup>. 첫 글자는 체가 정하고 둘째 글자는 두 잣대가 정하므로, <strong>읽는 법만 알면 열다섯 개의 기호표가 매번 다시 만들어진다</strong>⁠<sup class=\"rs\">2-2</sup>. 표를 통째로 외우면 경계에 걸린 흙에서 무너지는데, 걸릴 축이 굵기와 찰기 둘뿐이라 이중기호가 나오는 경우도 딱 둘이다⁠<sup class=\"rs\">2-3</sup>.</p>\n<p>같은 재료로 다른 언어도 만들 수 있다⁠<sup class=\"rs\">3</sup>. 도로 노반만 따지는 쪽은 세립분이 조금만 들어와도 곤란하므로 세립토 문턱을 더 낮게 잡았다⁠<sup class=\"rs\">3-1</sup>. 그리고 &quot;쓸 만한가&quot;를 숫자 하나로 듣고 싶어 하니, 세립분의 <strong>양</strong>과 그 세립분의 <strong>질</strong>을 곱해 벌점으로 합산한 군지수를 얹었다⁠<sup class=\"rs\">3-2</sup> ― 많으면서 찰지기까지 한 흙이 훨씬 나쁘다는 상승효과가 그 곱셈 항에 들어 있다. 마지막 분류표의 번호는 세립분이 적은 순서가 아니라 <strong>노반으로 좋은 순서</strong>이고, 그래서 번호만 들어도 판단이 선다⁠<sup class=\"rs\">3-3</sup>. 두 체계가 다른 것은 흙이 달라서가 아니라 <strong>묻는 질문이 달라서</strong>다.</p>\n<p>굵기는 <strong>자르고</strong>, 찰기는 <strong>재고</strong>, 기호는 <strong>찍는다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 잣대가 하나가 아니라 둘이어야 하는가\n② 두 글자에서 첫 글자·둘째 글자는 각각 무엇이 정하는가\n③ 조립·세립 경계가 왜 USCS 50 %, AASHTO 35 % 로 다른가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의단위중량", "name": "흙의단위중량", "title": "흙의 단위중량", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 3, "file": "n-5978634731.html", "card": {"oneline": "단위중량은 하나가 아니다. <strong>분모는 넷 다 전체 부피 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>V</mi></mrow></math></span> 로 같고, 분자에 무엇을 무게로 세느냐</strong>로 습윤·건조·포화·수중이 갈린다.", "bone": [{"n": "1", "t": "네 가지 단위중량 ― 분모는 같고 분자가 다르다", "subs": ["단위중량 ― 분모는 언제나 전체 부피", "습윤단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>t</mi></msub></mrow></math></span> · 건조단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>d</mi></msub></mrow></math></span>", "포화단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span> · 수중단위중량 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "다섯의 대소"]}, {"n": "2", "t": "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w</mi></mrow></math></span> · <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>G</mi><mi>s</mi></msub></mrow></math></span> 로 표현하기 ― 한 그림에서 넷을 만든다", "subs": ["흙 입자 부피를 1 로 놓는다", "분자만 갈아 끼운다 ― 분모는 넷 다 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>+</mo><mi>e</mi></mrow></math></span>", "식들 사이의 지름길", "단위와 극한", "확인용 계산"]}, {"n": "3", "t": "상대밀도 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>D</mi><mi>r</mi></msub></mrow></math></span> ― 같은 흙이 얼마나 촘촘히 쌓였나", "subs": ["왜 필요한가, 왜 사질토뿐인가", "정의와 두 표현", "판정과 시험 방법"]}], "link": [{"k": "목적", "html": "<p>2절이 만든 잣대 다섯은 전부 비(ratio)라서 <strong>무게가 없다.</strong> 그런데 설계가 요구하는 것은 힘이다 ― 깊이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>Z</mi></mrow></math></span> 인 점의 연직응력, 옹벽에 걸리는 토압, 사면을 미끄러뜨리는 활동력. 전부 <strong>&quot;이 흙 1 m³ 이 몇 kN 인가&quot;</strong> 를 알아야 첫 줄이 써진다. 게다가 같은 흙이라도 비 온 뒤와 마른 뒤가 다르고 지하수위 위와 아래가 다르므로, 단위중량은 하나로 정의될 수 없고 네 가지 이름이 필요해진다. 이 절이 없으면 3장의 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>σ</mi><mo>=</mo><mi>γ</mi><mi>Z</mi></mrow></math></span> 와 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msup><mi>σ</mi><mi>′</mi></msup><mo>=</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub><mi>h</mi></mrow></math></span>, 8장의 다짐관리가 전부 시작되지 않는다.</p>\n"}, {"k": "연결", "html": "<p>지하 8 m 지점의 흙이 위쪽 흙에 얼마나 눌리는지를 계산해야 한다고 하자. 필요한 것은 &quot;이 흙 1 m³ 이 몇 kN 인가&quot; 하나인데, 손에 있는 것은 2절이 만든 비율뿐이라 무게가 안 나온다. 게다가 그 8 m 중 위쪽 3 m 는 지하수위 위, 아래 5 m 는 물에 잠겨 있다면 같은 흙이라도 무게가 달라진다.</p>\n<p>먼저 이 값이 무엇을 재는 값인지부터 못 박는다⁠<sup class=\"rs\">1-1</sup>. 분모는 언제나 <strong>간극까지 포함한 전체 부피</strong>다. 2절과 정반대 구조라는 것을 눈여겨 둘 만하다 ― 2절은 분자가 비슷하고 분모가 제각각이었는데, 여기서는 분모가 하나로 고정되고 분자만 갈린다. 그러니 넷을 따로 외울 것이 아니라 &quot;이 이름은 무엇을 무게로 세는가&quot; 한 줄만 갈라 읽으면 된다.</p>\n<p>물까지 전부 세면 습윤이고, 알갱이만 세면 건조다⁠<sup class=\"rs\">1-2</sup>. 건조단위중량은 분자에서만 물을 뺐기 때문에 함수비에 흔들리지 않고 <strong>알갱이가 얼마나 촘촘한지만</strong> 잰다 ― 뒤에서 다짐 판정값과 상대밀도가 굳이 이 값을 쓰는 이유가 이것이다. 간극이 물로 가득 차면 포화인데, 이것은 새 정의가 아니라 습윤의 특별한 경우다⁠<sup class=\"rs\">1-3</sup>. 넷 중 수중만 성격이 다르다. 다른 셋이 &quot;무엇을 셀까&quot;라는 약속의 문제라면 수중은 <strong>물속에서는 무게가 실제로 줄어든다</strong>는 물리이고, 그래서 빼는 대상이 습윤이 아니라 포화여야 한다 ― 완전히 잠겨야 부력이 성립하고, 잠겼다면 간극도 이미 물로 차 있기 때문이다. 여기까지 오면 다섯의 대소는 외울 목록이 아니라 <strong>분자를 세면 나오는 순서</strong>가 된다⁠<sup class=\"rs\">1-4</sup>.</p>\n<p>그런데 정의만으로는 계산이 안 된다. 현장에서 무게와 부피를 직접 재기 어렵고, 문제도 무게가 아니라 간극비·함수비·비중을 준다. 그래서 네 정의를 2절의 잣대로 옮겨 적어야 한다⁠<sup class=\"rs\">2</sup>. 요령은 2절과 같다 ― <strong>입자 부피를 1 로 놓으면</strong>⁠<sup class=\"rs\">2-1</sup> 모든 칸이 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>w</mi></mrow></math></span>·<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>G</mi><mi>s</mi></msub></mrow></math></span> 로 적히고, 분모가 넷 다 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>+</mo><mi>e</mi></mrow></math></span> 로 같아진다. 남는 일은 분자를 갈아 끼우는 것뿐이라 <strong>네 식이 그림 한 장에서 전부 나온다</strong>⁠<sup class=\"rs\">2-2</sup>. 부산물로 지름길이 딸려 나오는데⁠<sup class=\"rs\">2-3</sup>, 그중 하나가 2절이 남긴 숙제를 끝낸다 ― 자로 잴 수 없던 간극비를 흙을 말려 무게만 재면 얻는다. 만든 식이 맞는지는 단위와 극한으로 스스로 검사할 수 있고⁠<sup class=\"rs\">2-4</sup>, 숫자를 한 벌 넣어 세 갈래로 검산해 보면 확실해진다⁠<sup class=\"rs\">2-5</sup>.</p>\n<p>마지막 물음은 <strong>같은 흙이 얼마나 촘촘히 쌓였나</strong>이다⁠<sup class=\"rs\">3</sup>. 간극비 값 하나만으로는 답할 수 없다. 흙마다 담을 수 있는 간극비의 범위 자체가 다르기 때문이다⁠<sup class=\"rs\">3-1</sup>. 그러니 그 흙 자신의 가장 느슨한 상태와 가장 조밀한 상태를 양 끝으로 잡고 지금이 그 사이 어디인지를 재야 하고, 그 백분율이 상대밀도다⁠<sup class=\"rs\">3-2</sup>. 양 끝을 재현성 있게 만들어 낼 수 있는 흙이 사질토뿐이라 상대밀도도 사질토의 잣대가 되며, 그 시험이 하는 일도 <strong>최대한 엉성하게 쌓아 보고 최대한 촘촘하게 쌓아 보는 것</strong>뿐이다⁠<sup class=\"rs\">3-3</sup>. 점성토의 되고 무름은 4절 연경도가 맡는다.</p>\n<p><strong>분모는 늘 전체 부피. 갈리는 것은 분자뿐이다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 네 단위중량의 분자와 분모가 각각 무엇인가\n② 수중단위중량은 왜 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>t</mi></msub></mrow></math></span> 가 아니라 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span> 에서 빼는가\n③ <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>s</mi></msub><mo>=</mo><mn>1</mn></mrow></math></span> 그림에서 네 식이 어떻게 한꺼번에 나오는가</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의연경도", "name": "흙의연경도", "title": "흙의 연경도", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 4, "file": "n-2d4d44f846.html", "card": {"oneline": "같은 점토가 물의 양에 따라 액체처럼도 고체처럼도 행동한다. 그 사이의 <strong>경계 함수비 세 개</strong>를 정해진 시험으로 못 박은 것이 아터버그한계다.", "bone": [{"n": "1", "t": "연경도 ― 물의 양이 흙의 상태를 바꾼다", "subs": ["연경도 ― 점착성이 있는 흙에서만", "네 상태와 세 경계 ― 아터버그한계", "경계는 약속이다 ― 규정된 시험이 곧 정의"]}, {"n": "2", "t": "액성한계 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w</mi><mi>L</mi></msub></mrow></math></span> 와 소성한계 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w</mi><mi>p</mi></msub></mrow></math></span> ― 반죽 구간의 두 끝", "subs": ["액성한계 ― 정의와 시험", "액성한계가 말해 주는 것 (교재 특성)", "소성한계 ― 지름 3 mm 국수", "자연함수비가 셋 중 어디에 있나"]}, {"n": "3", "t": "수축한계 <span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>w</mi><mi>s</mi></msub></mrow></math></span> ― 부피로 정의되는 한계", "subs": ["왜 부피로 정의되나", "수축한계의 두 공식", "수축비와 파생값 ― 한 시험에서 다섯", "단위와 극한"]}], "link": [{"k": "목적", "html": "<p>3절까지의 잣대(간극비·함수비·단위중량)는 흙의 <strong>양</strong>만 말할 뿐 흙이 <strong>어떻게 행동하는지</strong>는 말하지 않는다. 함수비 40 % 라는 말만 듣고는 그 흙을 밟을 수 있는지 흘러내릴지 알 수 없다. 게다가 교재가 못 박은 대로 <strong>세립토는 입도분포보다 연경도가 공학적 성질을 좌우한다.</strong> 그래서 그 흙 자신을 기준으로 한 눈금 ― 몇 % 부터 흐르고, 몇 % 부터 빚어지고, 몇 % 부터 부피가 안 주는가 ― 이 필요하다. 없으면 9절의 소성도표와 5절의 지수들이 통째로 멈춘다.</p>\n"}, {"k": "연결", "html": "<p>현장에서 파낸 점토의 함수비를 쟀더니 40 % 가 나왔다고 하자. 이 숫자 하나로는 아무 판단도 못 한다. 어떤 점토에서 40 % 는 벽돌처럼 단단한 상태이고 다른 점토에서는 흘러내리는 상태이기 때문이다. 그 흙 자신을 기준으로 한 눈금이 없으면 함수비는 뜻을 갖지 못한다.</p>\n<p>먼저 이 눈금이 왜 점성토에만 그어지는지부터 본다⁠<sup class=\"rs\">1-1</sup>. 모래에 물을 부어도 반죽이 되지 않는다 ― 알갱이가 굵어 표면의 힘이 자중에 못 미치므로 물이 그냥 사이를 빠져나간다. 반면 점토는 1절에서 본 대로 판처럼 얇고 표면이 음전하를 띠어 <strong>물을 껍질처럼 붙잡고</strong>, 그 껍질이 윤활막처럼 작동해 미끄러지되 떨어지지는 않게 만든다. 그래서 물의 양이 곧 굳기가 되고, 물이 줄어드는 동안 흙은 액성·소성·반고체·고체 네 상태를 지나며 경계 셋을 만든다⁠<sup class=\"rs\">1-2</sup>. 3절의 상대밀도가 사질토 전용이라 비워 둔 자리를 이 절이 점성토 쪽에서 메운다.</p>\n<p>그런데 이 변화는 <strong>연속</strong>이다. 어디부터 소성인지 눈에 보이는 선이 없고, 손으로 만져 판정하면 사람마다 달라진다. 그래서 경계를 <strong>정해진 동작으로 약속</strong>해 버렸다⁠<sup class=\"rs\">1-3</sup>. 시험 절차에 나오는 숫자들 ― 낙하 높이 1 cm, 홈이 닫히는 길이 1.5 cm, 타격 25 회, 국수 지름 3 mm ― 이 물리상수가 아니라 재현성을 위한 약속인 이유가 이것이다. 다만 그 약속이 <strong>강도 한 점을 고정</strong>하기 때문에, 액성한계 시험은 결과적으로 아주 작은 전단강도 시험이 된다.</p>\n<p>약속을 정했으면 실제로 재야 한다⁠<sup class=\"rs\">2</sup>. 액성한계는 접시에 담은 흙에 홈을 내고 두드려 흙이 스스로 흘러 홈을 메우게 하고, 그때의 타격 횟수를 그 함수비에서의 강도 눈금으로 읽는다⁠<sup class=\"rs\">2-1</sup>. 액성한계가 크다는 것은 그 흙이 물을 많이 먹는다는 뜻이고, 물을 많이 먹으면 마르고 젖을 때 부피가 크게 변하며 하중을 받으면 크게 가라앉는다 ― 노반 재료로 부적당하다는 결론까지가 한 사슬이다⁠<sup class=\"rs\">2-2</sup>. 소성한계는 반대쪽 끝으로, 흙을 국수처럼 밀어 지름 3 mm 에서 막 갈라지는 순간을 잡는다⁠<sup class=\"rs\">2-3</sup>. 두 값 사이가 흙이 물러진 채 버티는 구간이고, 그 폭이 0 이거나 음수이면 아예 소성이 없는 흙이다. 자를 다 만들었으면 마지막으로 현장의 자연함수비를 그 위에 얹어 본다 ― 이 지반이 지금 어느 상태에 서 있는지가 거기서 읽힌다⁠<sup class=\"rs\">2-4</sup>.</p>\n<p>셋 중 수축한계만 성격이 다르다⁠<sup class=\"rs\">3</sup>. 앞의 둘이 동작으로 정의된 반면 이것은 <strong>현상</strong>으로 정의된다 ― 물을 더 빼도 부피가 줄지 않기 시작하는 자리다⁠<sup class=\"rs\">3-1</sup>. 왜 멈추는가 하면, 그때까지는 간극이 물로 꽉 차 있어 물이 나간 만큼 그대로 오그라들다가 알갱이가 서로 닿는 순간부터는 나간 물 자리에 <strong>공기</strong>가 들어오기 때문이다. 곧 <strong>마르면서 마지막까지 포화를 유지하는 함수비</strong>라는 이 한 줄이 이 절의 공식 둘을 낳는다⁠<sup class=\"rs\">3-2</sup>. 그리고 정의가 부피이기 때문에 시험도 무게가 아니라 체적을 재게 되고, 그 한 번의 시험에서 수축비·체적변화계수·선수축·비중 근사·동상성 판정까지 딸려 나온다⁠<sup class=\"rs\">3-3</sup>. 만든 식이 맞는지는 단위와 극한으로 때려 보면 된다⁠<sup class=\"rs\">3-4</sup>.</p>\n<p><strong>같은 흙, 다른 물의 양. 경계는 눈에 없으므로 시험으로 약속한다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 연경도가 왜 점성토에서만 의미를 갖는가 ― 흡착수까지 내려가서\n② 네 상태와 세 경계의 이름·순서, 그리고 셋이 전부 무엇으로 표시되는가\n③ 시험 절차의 숫자들이 물리상수가 아니라 약속인 이유</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의입도분포선", "name": "흙의입도분포선", "title": "흙의 입도분포선", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 7, "file": "n-436babb53b.html", "card": {"oneline": "알갱이의 크기 분포는 <strong>굵은 것은 체로 걸러 남은 무게를 달고, 체를 빠져나간 잔 것은 물속에서 가라앉는 속도로 크기를 되짚어</strong> 알아낸다.", "bone": [{"n": "1", "t": "흙의 입도와 시험의 분업", "subs": ["입도와 입도분석", "적용범위 ― 어디서 방법이 갈리나", "표준체와 체 번호"]}, {"n": "2", "t": "체가름 분석", "subs": ["잔유율과 가적잔유율", "가적통과율과 보정"]}, {"n": "3", "t": "비중계 분석", "subs": ["Stokes 법칙", "현탁액 속 입자의 최대지름", "비중계의 유효깊이", "분산제"]}], "link": [{"k": "목적", "html": "<p>1절의 입경 구분과 6절 활성도의 분모(점토 함유율)를 <strong>실제로 재는 방법</strong>이 여기다. 그런데 알갱이 크기의 범위가 수만 배라 한 가지 방법으로는 전 구간을 못 잰다. 굵은 쪽은 체로 걸러 무게를 달면 되지만 체 눈금은 무한히 작아질 수 없으므로, <strong>체가 항복하는 경계</strong> 아래는 가라앉는 속도로 잰다. 이것이 없으면 8절 곡선에 찍을 점이 없고, 9절 분류의 &quot;No.200체 통과율 50 %&quot; 같은 기준도 셀 수가 없다.</p>\n"}, {"k": "연결", "html": "<p>흙 한 삽을 손에 쥐고 &quot;이 안에 0.002 mm 보다 작은 알갱이가 몇 % 인가&quot;에 답해야 한다고 하자. 6절의 활성도가 그 값을 분모로 요구했는데 재는 방법은 아직 없었다. 그런데 알갱이 크기가 자갈 수십 mm 에서 점토 0.001 mm 까지 <strong>수만 배</strong>라, 한 가지 방법으로 끝에서 끝까지 잴 수가 없다.</p>\n<p>그래서 먼저 <strong>어디서 방법이 갈리는지</strong>를 정한다⁠<sup class=\"rs\">1</sup>. 입도라는 것이 값 하나가 아니라 분포라는 점을 확인하고⁠<sup class=\"rs\">1-1</sup>, 체가 실제로 걸러낼 수 있는 한계에서 경계를 긋는다⁠<sup class=\"rs\">1-2</sup>. 경계가 정해지면 시험이 세 토막으로 나뉜다 ― 굵은 쪽 체가름, 잔 쪽 침강, 그리고 침강이 끝난 시료를 다시 거르는 마무리. 마지막 토막이 필요한 이유는 침강에 넣은 시료 안에 경계보다 굵은 모래가 아직 섞여 있기 때문이다. 이 자리에서 <strong>체 번호와 눈금 크기가 반대로 움직인다</strong>는 것도 함께 정리해 둔다⁠<sup class=\"rs\">1-3</sup>.</p>\n<p>체가름 쪽은 셈이 전부다⁠<sup class=\"rs\">2</sup>. 체마다 남은 무게를 전체 시료로 나누면 잔유율이고, 굵은 체부터 차례로 더해 내려가면 가적잔유율이다⁠<sup class=\"rs\">2-1</sup>. 100 에서 빼면 통과율인데, <strong>남았다와 통과했다는 서로의 여집합</strong>이라는 이 한 줄이 항목 전부이고 시험은 바로 그 뒤집기에서 걸려 넘어지게 만든다⁠<sup class=\"rs\">2-2</sup>. 침강에 쓴 시료가 애초에 No.10 체를 통과한 것뿐이므로 전체 기준으로 되돌리는 보정도 여기에 붙는다.</p>\n<p>침강 쪽은 물리가 하나 필요하다⁠<sup class=\"rs\">3</sup>. 물속의 알갱이는 무게로 내려가고 부력과 항력으로 버티는데, <strong>항력만 속도에 비례</strong>하므로 셋이 맞는 순간부터 더 빨라지지 않는다. 그 일정한 속도를 지름으로 푼 것이 Stokes 법칙이고, 그래서 <strong>속도를 재면 지름을 되짚을 수 있다</strong>⁠<sup class=\"rs\">3-1</sup>. 되짚을 때 실제로 답하는 것은 &quot;지금 이 깊이에 아직 떠 있는 알갱이 중 가장 굵은 것은 얼마인가&quot;이며⁠<sup class=\"rs\">3-2</sup>, 그 깊이를 제대로 세는 일이 유효깊이다⁠<sup class=\"rs\">3-3</sup>. 다만 이 물리는 <strong>알갱이를 구라고 가정</strong>하고 세운 것이라 양 끝에서 깨진다 ― 굵으면 가라앉으며 물을 휘젓고, 너무 잔하면 브라운 운동에 밀린다. 게다가 알갱이가 서로 엉겨 뭉쳐 있으면 덩어리 하나가 굵은 알갱이처럼 가라앉아 아예 다른 흙을 재게 되므로, 분산제로 먼저 떼어놓는다⁠<sup class=\"rs\">3-4</sup>.</p>\n<p><strong>굵은 것은 무게로, 잔 것은 시간으로 잰다.</strong></p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 왜 한 방법으로 전 구간을 못 재는가, 경계는 무엇으로 정해지는가\n② 왜 가라앉는 속도에서 입경을 역산할 수 있는가\n③ 그 역산을 못 믿을 곳은 어디인가 ― 굵은 쪽 · 잔 쪽 · 모양</p>\n"}}, {"subj": "토질", "subjName": "토질 및 기초", "sid": "s-a92a56", "unit": "토질/흙의입자구성", "name": "흙의입자구성", "title": "흙의 입자구성", "ch": 1, "chTitle": "흙의 기본적 성질과 분류", "ord": 1, "file": "n-33c13bd2f9.html", "card": {"oneline": "알갱이가 무엇인지가 같아도 <strong>배열(골격)</strong> 이 다르면 투수성·압축성·강도가 달라진다. 배열 네 가지의 이름과, 무엇이 배열을 정하는가.", "bone": [{"n": "1", "t": "흙의 생성", "subs": ["암석의 순환", "풍화의 두 갈래", "잔적토와 운반토"]}, {"n": "2", "t": "비점성 흙의 입자구성", "subs": ["골격과 간극", "단립구조 (single grained structure)", "봉소구조 (honeycombed structure)"]}, {"n": "3", "t": "점성토의 구조", "subs": ["무엇이 배열을 정하나", "면모구조 (flocculated structure)", "분산구조 (dispersed structure)", "되비빔과 흐트러진 흙"]}, {"n": "4", "t": "흙의 성질", "subs": ["두 성질과 각각의 시험", "왜 시료 상태가 갈리는가", "다음 절로"]}], "link": [{"k": "목적", "html": "<p>흙은 규격을 정해 만들어 온 재료가 아니라 땅에 있던 알갱이 더미다. 그래서 성분표를 읽는 것으로는 강도도 투수성도 알 수 없다. 같은 점토를 성분도 함수비도 그대로 둔 채 손으로 되비비기만 해도 물러지는데, 그때 바뀐 것은 <strong>알갱이의 배열</strong> 하나뿐이다. 흙의 공학적 성질은 성분이 아니라 배열에 적혀 있고, 그 배열에 이름을 붙이는 자리가 이 절이다.</p>\n"}, {"k": "연결", "html": "<p>시추공에서 올린 점토를 두 통 떠서, 하나는 통째로 두고 하나만 손으로 주물러 시험실에 넣었다고 하자. 물을 더 넣지도 빼지도 않았고 성분도 하나 안 바뀌었는데 주무른 쪽이 훨씬 무르게 나온다. 이 한 가지를 설명하려고 절 전체가 움직인다.</p>\n<p>먼저 이 알갱이가 무엇으로 되어 있는지부터 본다⁠<sup class=\"rs\">1</sup>. 암석은 부서져 흙이 되고 흙은 다시 굳어 암석이 되는데, 흙은 그 순환의 종착지가 아니라 <strong>정류장</strong>이다⁠<sup class=\"rs\">1-1</sup>. 여기서 놓치면 안 되는 것은 부서지는 방식이 두 갈래라는 점이다. 물리적 풍화는 잘게 쪼개기만 하고, 화학적 풍화는 광물 자체를 바꾼다. 그래서 <strong>모래는 부서진 조각이고 점토는 새로 만들어진 광물</strong>이다⁠<sup class=\"rs\">1-2</sup> ― 둘은 크기만 다른 것이 아니고, 이 사실이 뒤에서 ⁠<sup class=\"rs\">2</sup>과 ⁠<sup class=\"rs\">3</sup>가 갈리는 뿌리가 된다. 부서진 뒤 제자리에 남았는지 옮겨졌는지로 잔적토와 운반토가 갈리는데⁠<sup class=\"rs\">1-3</sup>, 옮겨졌다는 말은 곧 <strong>물속을 가라앉으며 자리를 잡았다</strong>는 뜻이므로 이야기가 자연히 배열로 넘어간다.</p>\n<p>배열을 보려면 눈을 한 번 바꿔야 한다. 흙을 덩어리 하나로 보지 말고 <strong>알갱이 골격과 그 사이의 간극</strong>으로 갈라 보는 것이다⁠<sup class=\"rs\">2-1</sup>. 그러면 &quot;느슨하다&quot;는 말이 &quot;간극이 많다&quot;가 되고, 다시 공극비라는 숫자가 된다.</p>\n<p>이 눈으로 보면 배열을 정하는 힘이 흙마다 다르다는 것이 드러난다. 굵은 알갱이는 부피에 비해 표면이 좁아 <strong>제 무게가 압도적</strong>이므로, 가라앉아 아래 알갱이에 바로 맞물린다. 이것이 단립구조다⁠<sup class=\"rs\">2-2</sup>. 그런데 알갱이가 작아지면 무게는 세제곱으로 줄고 표면은 제곱으로만 줄어서, 어느 크기부터는 <strong>표면에서 붙잡는 힘이 제 무게를 이긴다.</strong> 그러면 처음 닿은 자리를 지키며 아치를 세워 큰 빈 방을 이고 있게 된다. 이것이 봉소구조다⁠<sup class=\"rs\">2-3</sup>. 아치이기 때문에 간극이 많고, 아치이기 때문에 한 번 무너지면 한꺼번에 내려앉는다.</p>\n<p>점토까지 내려가면 표면의 힘이 이기는 정도가 아니라 <strong>승부를 가린다</strong>⁠<sup class=\"rs\">3</sup>. 판처럼 얇은 입자 사이에는 끌어당기는 흡인력과, 표면에 달라붙은 물 껍질이 겹칠 때 밀어내는 반발력이 함께 있다⁠<sup class=\"rs\">3-1</sup>. 흡인력이 이기면 모서리가 남의 넓은 면에 붙어 엉성한 카드집이 되고(면모구조)⁠<sup class=\"rs\">3-2</sup>, 반발력이 이기면 서로 밀어내며 하나씩 천천히 가라앉아 나란히 눕는다(분산구조)⁠<sup class=\"rs\">3-3</sup>. 카드집은 물길이 넓고 걸리는 데가 있어 투수성과 강도가 크고, 누운 판은 그 반대다. 그리고 맨 처음의 주무른 시료가 여기서 답을 얻는다 ― 되비빔이란 카드집을 부수고 판을 눕히는 일이라, 간극이 늘고 밀도가 떨어지고 강도가 빠진다⁠<sup class=\"rs\">3-4</sup>.</p>\n<p>그러면 이 이야기를 왜 1장 맨 앞에 놓았는지가 정리된다⁠<sup class=\"rs\">4</sup>. 흙의 성질은 <strong>무엇으로 되어 있나</strong>를 묻는 물리적 성질과 <strong>어떻게 거동하나</strong>를 묻는 공학적 성질로 갈리는데⁠<sup class=\"rs\">4-1</sup>, 성분은 부수어도 바뀌지 않지만 거동은 배열이 만들기 때문에 부수면 답이 달라진다. 공학적 성질 시험에 불교란 시료를 써야 한다는 규칙이 여기서 나온다⁠<sup class=\"rs\">4-2</sup>. 그러고 나면 남는 일은 배열을 말이 아니라 숫자로 세는 것이고, 그것이 2절과 3절이다⁠<sup class=\"rs\">4-3</sup>.</p>\n<p>성분은 <strong>생성이</strong>, 배열은 <strong>힘이</strong>, 공학적 성질은 <strong>배열이</strong> 정한다.</p>\n<hr />\n"}], "check": "<p><strong>개요를 알았다면 이만큼은 설명할 수 있어야 한다.</strong>\n① 잔적토와 운반토를 가르는 한 가지 기준\n② 배열을 정하는 힘이 굵은 흙과 점토에서 왜 다른가 ― 크기와 표면적의 관계로\n③ 네 구조 중 간극이 많은 것은 어느 것들이고, 그 이유는 무엇인가</p>\n"}}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/단순보", "name": "단순보", "title": "단순보", "ch": 3, "chTitle": "정정 구조물", "ord": 1, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/캔틸레버보와 게르버보", "name": "캔틸레버보와 게르버보", "title": "캔틸레버보와 게르버보", "ch": 3, "chTitle": "정정 구조물", "ord": 2, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/내민보", "name": "내민보", "title": "내민보", "ch": 3, "chTitle": "정정 구조물", "ord": 3, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": "응용역학/보의 응력", "name": "보의 응력", "title": "보의 응력", "ch": 3, "chTitle": "정정 구조물", "ord": 4, "file": null, "card": null}, {"subj": "응용역학", "subjName": "응용역학", "sid": "s-37d403", "unit": const PROBS = [{"id": "396c2f589603818cb89df46c90fd3001", "subj": "상하수도공학", "subjKey": "상하수도공학", "subjName": "상하수도공학", "q": "어느 도시의 상하수도 계획을 수립하고 인구 추정을 하였다. 1986년부터 1990년 사이의 인구통계 자료를 이용하여 2001년의 인구를 등차급수법에 의하여 추정하면 얼마인가?", "choices": ["24,272인", "30,024인", "33,274인", "34,689인"], "ans": 3, "sol": "<p>등차급수법으로 1986~1990년의 자료에서 연평균 인구 증가수를 구한 뒤, 1990년을 기준으로 2001년 인구를 추정한다.</p>\n<p>1986년 인구 20,483인, 1990년 인구 24,272인이므로 4년 동안의 증가분은 3,789인이고, 연평균 증가수는 947.25인이다. 이를 947인으로 보아 1990년부터 2001년까지 11년을 적용하면 24,272 + 11×947 = 34,689인이다.</p>\n", "img": "q-396c2f589603818c.webp"}, {"id": "396c2f589603814196bbc7e8f982d784", "subj": "상하수도공학", "subjKey": "상하수도공학", "subjName": "상하수도공학", "q": "현재의 인구가 100,000명인 발전 가능성 있는 도시의 장래 급수량을 추정하기 위해 인구 증가 현황을 조사하니 연평균 인구 증가율이 5%로 일정하였다. 이 도시의 20년 후 추정 인구는?", "choices": ["15050명", "116440명", "200000명", "265330명"], "ans": 3, "sol": "<p>등비급수법을 사용한다. 현재 인구<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P</mi><mn>0</mn></msub><mo>=</mo><mn>100</mn><mo>,</mo><mn>000</mn></mrow></math></span>명, 연평균 증가율<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>=</mo><mn>0.05</mn></mrow></math></span>, 기간<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><mn>20</mn></mrow></math></span>년이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>P</mi><mi>n</mi></msub><mo>=</mo><msub><mi>P</mi><mn>0</mn></msub><mo stretchy=\"false\">(</mo><mn>1</mn><mo>+</mo><mi>r</mi><msup><mo stretchy=\"false\">)</mo><mi>n</mi></msup></mrow></math></span>에 대입한다. 계산하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>100</mn><mo>,</mo><mn>000</mn><mo stretchy=\"false\">(</mo><mn>1.05</mn><msup><mo stretchy=\"false\">)</mo><mrow><mn>20</mn></mrow></msup><mo>=</mo><mn>265</mn><mo>,</mo><mn>330</mn></mrow></math></span>명이다.</p>\n", "img": "q-396c2f5896038141.webp"}, {"id": "396c2f5896038180b815ee4040ddb88f", "subj": "상하수도공학", "subjKey": "상하수도공학", "subjName": "상하수도공학", "q": "어떤 도시에 대한 다음의 인구통계표에서 1999년 현재로부터 5년 후의 인구를 추정하려 할 때 인구증가율(r)은? (단, 등비급수법에 의한 인구추정임)", "choices": ["1.028570", "0.285700", "0.028570", "0.022790"], "ans": 2, "sol": "<p>인구증가율은 등비급수법에서<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>=</mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mfrac><mrow><msub><mi>P</mi><mn>0</mn></msub></mrow><mrow><msub><mi>P</mi><mi>t</mi></msub></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mi>t</mi></mrow></msup><mo>−</mo><mn>1</mn></mrow></math></span>로 구한다. 표에서 1995년 인구는 10,900명, 1999년 인구는 12,200명이므로 4년 동안의 증가율을 계산하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>r</mi><mo>=</mo><msup><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mfrac><mrow><mn>12</mn><mo>,</mo><mn>200</mn></mrow><mrow><mn>10</mn><mo>,</mo><mn>900</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow><mrow><mn>1</mn><mo>/</mo><mn>4</mn></mrow></msup><mo>−</mo><mn>1</mn><mo>=</mo><mn>0.02857</mn></mrow></math></span>이다.</p>\n", "img": "q-396c2f5896038180.webp"}, {"id": "396c2f58960381119c3deffd204ccd25", "subj": "상하수도공학", "subjKey": "상하수도공학", "subjName": "상하수도공학", "q": "다음의 인구추정방법 중에서 대상지역의 포화인구를 먼저 추정한 후 계획기간의 인구를 추정하는 방법은?", "choices": ["등차급수법", "등비급수법", "최소자승법", "로지스틱 곡선법"], "ans": 3, "sol": "<p>로지스틱 곡선법은 대상지역의 포화인구를 먼저 추정한 뒤 계획기간의 인구를 추정하는 방법이다.</p>\n", "img": "q-396c2f5896038111.webp"}, {"id": "38ec2f58960381e49fc8fe69c788d24b", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "뉴턴 유체(Newtonian fluids)에 대한 설명으로 옳은 것은?", "choices": ["물이나 공기 등 보통의 유체는 비뉴턴 유체이다.", "각 변형률의 크기에 따라 선형으로 점도가 변한다.", "전단응력(τ)과 각 변형률(dv/dy)의 관계는 원점을 지나는 직선이다.", "유체가 압력의 변화에 따라 밀도의 변화를 무시할 수 없는 상태가 된 유체를 의미한다."], "ans": 2, "sol": "<p>τ = μ·dv/dy 즉, 원점을 지나는 직선의 관계이다.</p>\n", "img": "q-38ec2f58960381e4.webp"}, {"id": "38ec2f5896038131aa6ac48cd186804e", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "모세관 현상에 관한 설명으로 옳지 않은 것은?", "choices": ["모세관의 상승높이는 액체의 응집력과 액체와 관벽의 부착력에 의해 좌우된다.", "액체의 응집력이 관 벽과의 부착력보다 크면 관 내의 액체 높이는 관 밖의 액체보다 낮게 된다.", "모세관의 상승높이는 모세관의 지름 d에 반비례한다.", "모세관의 상승높이는 액체의 단위중량에 비례한다."], "ans": 3, "sol": "<p>모세관 상승고 h = 4Tcosθ/wd 이므로 액체의 단위중량에는 반비례한다.</p>\n", "img": "q-38ec2f5896038131.webp"}, {"id": "38ec2f5896038122bda4fd9f1ba40afd", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "실린더 내에서 압축된 유체가 압력 1,000kg/cm²에서는 0.4m³의 체적이고, 압력 2,000kg/cm²에서는 0.396m³의 체적을 갖는다. 이러한 액체의 체적탄성계수는?", "choices": ["10⁵kg/cm²", "10⁴kg/cm²", "2×10⁵kg/cm²", "2×10⁴kg/cm²"], "ans": 0, "sol": "<p>E = dP/(dV/V)  1,000kg/cm² → 0.4m³  2,000kg/cm² → 0.396m³  E = (2,000-1,000)/((0.4-0.396)/0.4) = 100,000kg/cm²</p>\n", "img": "q-38ec2f5896038122.webp"}, {"id": "38ec2f589603811392fcc562148dae22", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "뉴턴(Newton)의 점성법칙에 관한 설명 중 틀린 것은?", "choices": ["비례상수로 μ를 사용하며, 이를 점성계수라 하고 Poise의 단위를 갖는다.", "내부마찰력의 크기는 속도구배에 비례한다.", "밀도를 점성계수 μ로 나누는 것을 동점성계수라 하고 Stokes의 단위를 갖는다.", "내부마찰력의 크기는 두 층간의 상대속도에 비례하고 거리에 반비례한다."], "ans": 2, "sol": "<p>v(동점성계수) = μ(점성계수)/ρ(밀도)\n내부마찰력 : τ = μ dv/dy</p>\n", "img": "q-38ec2f5896038113.webp"}, {"id": "38ec2f5896038148889fd493d9177c78", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "동점성계수와 비중이 각각 0.0019m²/sec와 1.2인 액체의 점성계수는?", "choices": ["0.233kg· sec/m²", "0.213kg· sec/m²", "0.1938kg· sec/m²", "0.243kg· sec/m²"], "ans": 0, "sol": "<p>v = 0.0019m²/sec, γ = 1.2 → μ = ?\n방법 ②\nv = μ/ρ 이므로 μ = v · ρ\n비중 = 물체의 밀도/물의 밀도\n물체의 밀도 = 비중×물의 밀도\nρ = 1.2×1g/cm³ = 1.2g/cm³\nμ = v · ρ = 0.0019m²/sec×1.2g/cm³\n= 0.0019m²/sec×1.2×10^-3kg/(10^-2m)³\n= 2.28kg/m·sec → [MLT]\nFLT계로 변환하기 위해 중력가속도를 분모와 분자에 곱해 주면\n(2.28kg/m·sec×9.8m/sec²)/(9.8m/sec²) = 2.28/9.8 kg·sec/m²\n= 0.233kg·sec/m²\n방법 ①\n점성계수 μ의 단위는 poise(=g/cm·sec)이므로 문항과의 차원이 맞지 않으므로 FLT계의 차원이라는 것을 알 수 있다.\nv = μ/ρ 에서 μ = v·ρ, ρ = w/g\n문제의 조건에서 비중이 1.2이므로 물체의 단위 중량 w = 1.2t/m³ 이 된다.\nρ = 1,200kg/m³ / 9.8m/sec² = 122.45kg·sec²/m⁴\nμ = v·ρ = 0.0019m²/sec×122.45kg·sec²/m⁴\n= 0.233kg·sec/m²</p>\n", "img": "q-38ec2f5896038148.webp"}, {"id": "38ec2f58960381e6a8bdda0e3312616a", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "지름 0.3cm의 작은 물방울에 표면장력 T₁₅ = 0.00075N/cm가 작용할 때 물방울 내부와 외부의 압력차는?", "choices": ["30Pa", "50Pa", "80Pa", "100Pa"], "ans": 3, "sol": "<p><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>T</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>P</mi><mi>d</mi></mrow><mrow><mn>4</mn></mrow></mfrac></mstyle></mrow></math></span><span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>P</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>4</mn><mi>T</mi></mrow><mrow><mi>d</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>4</mn><mo>×</mo><mn>0.00075</mn><mo>×</mo><msup><mn>10</mn><mn>2</mn></msup></mrow><mrow><mn>0.3</mn></mrow></mfrac></mstyle><mo>=</mo><mn>1.02</mn><mi>g</mi><mo>/</mo><mi>c</mi><msup><mi>m</mi><mn>2</mn></msup><mo>=</mo><mn>1.02</mn><mo>×</mo><mn>98</mn><mi>P</mi><mi>a</mi><mo>=</mo><mn>100</mn><mi>P</mi><mi>a</mi></mrow></math></span></p>\n", "img": "q-38ec2f58960381e6.webp"}, {"id": "399c2f5896038192aadfe00333cc2b06", "subj": "수리학", "subjKey": "수리학", "subjName": "수리학 및 수문학", "q": "대기압을 무시한 압력을 무엇이라 하는가?", "choices": ["정압력", "부압력", "절대압력", "계기압력"], "ans": 3, "sol": "<p>계기압력은 대기압을 무시한 기계에 의한 압력이다. 절대압력=계기압력+대기압력</p>\n", "img": "q-399c2f5896038192.webp"}, {"id": "397c2f58960381619bf1c606dd8a4181", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "다음 그림과 같이 강선 A와 B가 서로 평형상태를 이루고 있다. 이때 각도 θ의 값은?", "choices": ["67.84°", "56.63°", "42.26°", "28.35°"], "ans": 1, "sol": "<p>A, B점에서 합력의 크기는 같아야 한다. (방향반대)\n· 합력 R = √(P_1² + P_2² + 2P_1P_2 cos α)\n· √(300² + 600² + 2×300×600cos60°) = √(400² + 500² + 2×400×500cosθ)\n참고 SOLVE 사용\n∴ θ = 56.63°</p>\n", "img": "q-397c2f5896038161.webp"}, {"id": "397c2f58960381e4b704fbf9d8653838", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "다음 그림과 같은 T형 단면에서 도심축 C-C축의 위치 x는?", "choices": ["2.5h", "3.0h", "3.5h", "4.0h"], "ans": 3, "sol": "<p>해답 ④\nx = Gx/A\nGx = (5b×h)×(5h + h/2) + (b×5h)×(5h/2)\n= 40bh²\nA = (5b×h) + (b×5h)\n= 10bh\n∴ x = 40bh² / 10bh = 4.0h</p>\n", "img": "q-397c2f58960381e4.webp"}, {"id": "397c2f589603812d9ca6ca3b9881c830", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "다음 단면에서 y축에 대한 회전반지름은?", "choices": ["3.07cm", "3.20cm", "3.81cm", "4.24cm"], "ans": 0, "sol": "<p>해답 ①\n회전반지름 r_y = √(I_y/A)\n· A = bh - πd²/4 = 5×10 - π×4²/4 = 37.434cm²\n· I_y = {bh³/12 + bh×(h/2)²} - {πd⁴/64 + πd²/4×(d/2)²}\n= bh³/3 - 5πd⁴/64 = 10×5³/3 - 5×π×4⁴/64\n= 353.835cm⁴\n∴ r_y = √(I_y/A) = √(353.835/37.434) = 3.07cm</p>\n", "img": "q-397c2f589603812d.webp"}, {"id": "397c2f58960381249d94d5f8277a18c0", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "그림과 같이 속이 빈 원형단면(빗금 친 부분)의 도심에 대한 극관성모멘트는?", "choices": ["460cm⁴", "760cm⁴", "840cm⁴", "920cm⁴"], "ans": 3, "sol": "<p>해답 ④\n· 단면 2차 극모멘트(극관성모멘트)는 좌표축의 회전에 관계없이 항상 일정하다.\n· I_p = I_x + I_y = 2I_x = constant\n∴ I_p = 2(πd1⁴/64 - πd2⁴/64) = 2(π×10⁴/64 - π×5⁴/64)\n= 920cm⁴</p>\n", "img": "q-397c2f5896038124.webp"}, {"id": "397c2f589603814b8965e61870517da5", "subj": "응용역학", "subjKey": "응용역학", "subjName": "응용역학", "q": "폭 10cm, 높이 20cm인 직사각형 단면의 다음 x, y에 대한 상승모멘트값은?", "choices": ["10000cm⁴", "20000cm⁴", "30000cm⁴", "40000cm⁴"], "ans": 0, "sol": "<p>해답 ①\n단면 상승모멘트 I_xy = A x_0 y_0\n· A = 10×20 = 200cm², x_0 = 5cm, y_0 = 10cm\n∴ I_xy = A x_0 y_0 = 200×5×10 = 10000cm⁴</p>\n", "img": "q-397c2f589603814b.webp"}, {"id": "399c2f5896038112ad3af1ea93e28809", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "철근콘크리트 부재에 이형 철근으로 2종인 SD300을 사용한다고 하였을 때 SD300에서 300은 무엇을 뜻하는가?", "choices": ["철근의 공칭지름", "철근의 인장강도", "철근의 연신율", "철근의 항복점 응력"], "ans": 3, "sol": "<p>철근의 강도는 항복강도<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub></mrow></math></span>를 말하며, SD300에서 300은<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mn>300</mn><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>이라는 뜻이다.</p>\n", "img": "q-399c2f5896038112.webp"}, {"id": "399c2f589603813b9540f640b8ff91f2", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "보통중량 골재를 사용하였을 때,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub><mo>=</mo><mn>21</mn><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>이면 탄성계수비((n))는? (단,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>s</mi></msub><mo>=</mo><mn>2.0</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>)", "choices": ["7", "8", "9", "10"], "ans": 1, "sol": "<p>탄성계수비는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><msub><mi>E</mi><mi>s</mi></msub><mo>/</mo><msub><mi>E</mi><mi>c</mi></msub></mrow></math></span>로 구하며, 보통중량골재 콘크리트의 경우<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>E</mi><mi>c</mi></msub><mo>=</mo><mn>8500</mn><mroot><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>m</mi></mrow></msub></mrow><mn>3</mn></mroot><mspace width=\"0.167em\" /><mo stretchy=\"false\">(</mo><mtext>MPa</mtext><mo stretchy=\"false\">)</mo></mrow></math></span>를 쓴다. 여기서<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mrow><mi>c</mi><mi>m</mi></mrow></msub><mo>=</mo><msub><mi>f</mi><mrow><mi>c</mi><mi>k</mi></mrow></msub><mo>+</mo><mn>4</mn><mo>=</mo><mn>25</mn><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>이므로 계산하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><mn>8.05</mn></mrow></math></span>가 되어 가깝게는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>n</mi><mo>=</mo><mn>8</mn></mrow></math></span>이다.</p>\n", "img": "q-399c2f589603813b.webp"}, {"id": "399c2f58960381f7b92ecf32c2a7a4e5", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "다음 중 철근콘크리트 부재 설계시 하중항으로 고려해야 할 사항이 아닌 것은?", "choices": ["연직 활하중 및 고정하중", "온도 변화", "건조수축과 크리프", "탄성계수비"], "ans": 3, "sol": "<p>온도변화, 건조수축, 크리프는 구조물에 변형을 유발하여 하중항으로 고려할 수 있으나 탄성계수비는 재료의 성질로서 하중항이 아니다.</p>\n", "img": "q-399c2f58960381f7.webp"}, {"id": "399c2f58960381a8b434c9d4f84f4d71", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "부(-)모멘트가 일어나는 단순보의 단면에서 배근이 가장 적당한 것은?", "choices": ["①", "②", "③", "④"], "ans": 2, "sol": "<p>단순보에서 부(-)의 휨모멘트가 작용하는 경우는 복철근보로 설계하며 동시에 종방향철근을 폐합스터럽으로 둘러 감는다.</p>\n", "img": "q-399c2f58960381a8.webp"}, {"id": "399c2f58960381749b7ce391fa6abe4f", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "다음은 배력 철근을 배치하는 이유이다. 옳지 않은 것은?", "choices": ["응력을 분포시켜 균열 폭을 최소화하기 위함이다.", "주철근의 부착력을 확보하기 위함이다.", "주철근의 간격을 유지하기 위함이다.", "콘크리트의 건조수축이나 온도변화에 의한 콘크리트의 신축을 억제하기 위함이다."], "ans": 1, "sol": "<p>배력철근을 배치하는 이유는 응력분포, 주철근 간격 유지, 수축·온도변화에 의한 신축 억제이다.</p>\n", "img": "q-399c2f5896038174.webp"}, {"id": "399c2f5896038176b380ff1d9a9681a5", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "응력 계산에 의하여 그 단면적을 결정하는 것이 아닌 철근은 어느 것인가?", "choices": ["사인장 철근", "조립 철근", "정철근", "부철근"], "ans": 1, "sol": "<p>조립철근은 철근을 조립할 때 사용되는 보조적인 철근이다.</p>\n", "img": "q-399c2f5896038176.webp"}, {"id": "396c2f589603812c8075fbf8022763e6", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "균형철근비<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>b</mi></msub><mo>=</mo><mn>0.0365</mn></mrow></math></span>이고,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>b</mi><mo>=</mo><mn>300</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d</mi><mo>=</mo><mn>500</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><mi mathvariant=\"normal\">m</mi></mrow></mrow></math></span>일 때 유효한 철근량은? (단,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mn>400</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">M</mi><mi mathvariant=\"normal\">P</mi><mi mathvariant=\"normal\">a</mi></mrow></mrow></math></span>이다)", "choices": ["3,800 mm²", "3,975 mm²", "4,110 mm²", "5,330 mm²"], "ans": 1, "sol": "<p>유효철근량은 최대철근량과 같으므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub><mo>=</mo><msub><mi>ρ</mi><mrow><mo>max</mo></mrow></msub><mo stretchy=\"false\">(</mo><msub><mi>b</mi><mi>w</mi></msub><mi>d</mi><mo stretchy=\"false\">)</mo><mo>=</mo><mn>0.726</mn><msub><mi>ρ</mi><mi>b</mi></msub><mo stretchy=\"false\">(</mo><msub><mi>b</mi><mi>w</mi></msub><mi>d</mi><mo stretchy=\"false\">)</mo></mrow></math></span>를 사용한다. 따라서<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>A</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub><mo>=</mo><mn>0.726</mn><mo>×</mo><mn>0.0365</mn><mo>×</mo><mo stretchy=\"false\">(</mo><mn>300</mn><mo>×</mo><mn>500</mn><mo stretchy=\"false\">)</mo><mo>≈</mo><mn>3</mn><mrow><mo>,</mo></mrow><mn>975</mn><mspace width=\"0.167em\" /><mrow><mi mathvariant=\"normal\">m</mi><msup><mi mathvariant=\"normal\">m</mi><mn>2</mn></msup></mrow></mrow></math></span>이다.</p>\n", "img": "q-396c2f589603812c.webp"}, {"id": "396c2f5896038186813bd14a50682c1a", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "인장철근이 필요한 휨부재의 모든 단면은 규정된 최소철근량 이상을 사용해야 하는데, 이 때 해석상 필요한 철근량보다 얼마 이상 철근을 더 배근하면 이들 규정을 적용하지 않아도 되는가?", "choices": ["1/3", "1/4", "1/5", "1/6"], "ans": 0, "sol": "<p>해석상 필요한 철근량의<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>1</mn><mo>/</mo><mn>3</mn></mrow></math></span>이상의 철근이 배치된 부재는 최소철근비 규정을 적용하지 않아도 된다.</p>\n", "img": "q-396c2f5896038186.webp"}, {"id": "396c2f58960381a18b67fbfe50c83163", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "휨부재의 설계시 최소철근량을 제한하는 이유 중 옳은 것은?", "choices": ["압축측 콘크리트의 취성파괴를 방지하기 위해서", "철근의 연성파괴를 방지하기 위해서", "콘크리트와 철근이 동시에 항복하도록 하기 위해서", "인장측 콘크리트의 취성 파괴를 방지하기 위해서"], "ans": 3, "sol": "<p>인장철근이 너무 적으면 인장측 콘크리트가 파괴되므로 최소철근량을 규정하는 이유는 인장측 콘크리트의 취성 파괴를 막기 위해서이다.</p>\n", "img": "q-396c2f58960381a1.webp"}, {"id": "396c2f5896038144a73fc8f68508f553", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "그림과 같은 인장철근을 갖는 보의 유효길이는? (여기서, D19철근의 공칭단면적은 287mm²임)", "choices": ["350mm", "410mm", "440mm", "500mm"], "ans": 2, "sol": "<p>유효길이는 압축연단에서 인장철근군까지의 도심거리이다. 도심거리를 구하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>d</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mo>∑</mo><msub><m /mi></mrow></mrow></math></span>, 균형철근비<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>b</mi></msub><mo>=</mo><mn>0.02620</mn></mrow></math></span>이다.)", "choices": ["취성파괴", "연성파괴", "균형파괴", "파괴되지 않는다."], "ans": 1, "sol": "<p>(1) 배근된 인장철근비는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ρ</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>A</mi><mi>s</mi></msub></mrow><mrow><msub><mi>b</mi><mi>w</mi></msub><mi>d</mi></mrow></mfrac></mstyle><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mn>1</mn><mrow><mo>,</mo></mrow><mn>520</mn></mrow><mrow><mn>300</mn><mo>×</mo><mn>500</mn></mrow></mfrac></mstyle><mo>=</mo><mn>0.0101</mn></mrow></math></span>이다. (2) 최대철근비는 균형철근비가 주어졌으므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub><mo>=</mo><mn>0.726</mn><msub><mi>ρ</mi><mi>b</mi></msub><mo>=</mo><mn>0.726</mn><mo>×</mo><mn>0.0262</mn><mo>≈</mo><mn>0.019</mn></mrow></math></span>이다. (3)<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ρ</mi><mi>s</mi></msub><mo>&lt;</mo><msub><mi>ρ</mi><mrow><mi>s</mi><mo>,</mo><mo>max</mo></mrow></msub></mrow></math></span>이므로 연성파괴가 발생한다.</p>\n", "img": "q-396c2f589603817a.webp"}, {"id": "398c2f589603813db7b8fc85e637aa16", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "강도설계법에서 복철근 직사각형보의 중립축까지의 거리 C = 300mm일 때 압축연단에서 50mm 떨어진 곳에 배치된 압축철근의 응력 f's는 얼마인가? (여기서, 철근의 항복강도는 300MPa이고 철근의 탄성계수는 2.0×10^5MPa이다.)", "choices": ["200 MPa", "300 MPa", "259 MPa", "500 MPa"], "ans": 1, "sol": "<p>(1) 압축철근의 변형률은<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>ε</mi><mi>s</mi><mi>′</mi></msubsup><mo>=</mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mfrac><mrow><mi>c</mi><mo>−</mo><msup><mi>d</mi><mi>′</mi></msup></mrow><mrow><mi>c</mi></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow><msub><mi>ε</mi><mrow><mi>c</mi><mi>u</mi></mrow></msub><mo>=</mo><mrow><mo stretchy=\"true\" fence=\"true\" form=\"prefix\">(</mo><mfrac><mrow><mn>300</mn><mo>−</mo><mn>50</mn></mrow><mrow><mn>300</mn></mrow></mfrac><mo stretchy=\"true\" fence=\"true\" form=\"postfix\">)</mo></mrow><mo>×</mo><mn>0.0033</mn><mo>=</mo><mn>0.00275</mn></mrow></math></span>이다. 이는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ε</mi><mi>y</mi></msub><mo>=</mo><mfrac><mrow><msub><mi>f</mi><mi>y</mi></msub></mrow><mrow><msub><mi>E</mi><mi>s</mi></msub></mrow></mfrac><mo>=</mo><mfrac><mrow><mn>300</mn></mrow><mrow><mn>2</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup></mrow></mfrac><mo>=</mo><mn>0.0015</mn></mrow></math></span>보다 크므로 압축철근은 항복한다. (2) 따라서 압축철근의 응력은<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msubsup><mi>f</mi><mi>s</mi><mi>′</mi></msubsup><mo>=</mo><msub><mi>f</mi><mi>y</mi></msub><mo>=</mo><mn>300</mn><mspace width=\"0.167em\" /><mtext>MPa</mtext></mrow></math></span>이다.</p>\n", "img": "q-398c2f589603813d.webp"}, {"id": "398c2f58960381c4b008f6dab2eeb085", "subj": "철근콘크리트공학", "subjKey": "철콘", "subjName": "철근콘크리트 및 강구조", "q": "b = 300mm, d = 550mm, d' = 50mm, A_s = 4,500mm², A'_s = 2,200mm²인 단면이 연성파괴를 한다면 설계휨강도는 얼마인가? (여기서, 인장철근이 항복응력에 도달하면 압축철근도 항복응력을 나타내며 f_ck = 21MPa, f_y = 300MPa임)", "choices": ["516 kN·m", "565 kN·m", "599 kN·m", "613 kN·m"], "ans": 1, "sol": "<p>복철근 직사각형보의 공칭휨강도는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub><mo>=</mo><mi>ϕ</mi><mo stretchy=\"false\">(</mo><msub><mi>M</mi><mrow><mi>n</mi><mn>1</mn></mrow></msub><mo>+</mo><msub><mi>M</mi><mrow><mi>n</mi><mn>2</mn></mrow></msub><mo stretchy=\"false\">)</mo></mrow></math></span>이며, 본 문제는 연성파괴 조건에서 설계휨강도를 구하는 문제이다. 해설에 따라 압축철근이 항복하는 복철근 단면으로 보고<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>a</mi></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>ε</mi><mi>t</mi></msub></mrow></math></span>,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>ϕ</mi></mrow></math></span>를 차례로 구한 뒤<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>M</mi><mi>d</mi></msub><mo>=</mo><mi>ϕ</mi><msub><mi>M</mi><mi>n</mi></msub></mrow></math></span>을 계산하면<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mn>565</mn><mspace width=\"0.167em\" /><mtext>kN</mtext><mo>·</mo><mtext>m</mtext></mrow></math></span>가 된다.</p>\n", "img": "q-398c2f58960381c4.webp"}, {"id": "38fc2f58960381bfa9f1cd5702e63c65", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "다음 중 점토광물과 가장 관계가 먼 것은?", "choices": ["격자구조(sheet)", "결정구조(crystal)", "Kaolinite", "단립구조"], "ans": 3, "sol": "<p>점토는 거의 모든 광물이 쉬트(Sheet)로 이루어진 결정체(crystal)이다. 단립(單粒)구조는 조립토(자갈, 모래)가 물 속에서 침강할 때 생기는 구조이다. 단립(團粒)구조에는 봉소구조, 면모구조, 분산구조가 있다.</p>\n", "img": "q-38fc2f58960381bf.webp"}, {"id": "38fc2f589603819db676fff8f74d8e9b", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "다음 중 틀린 것은?", "choices": ["액성한계 측정용 시료는 40번체를 통과한 노건조 시료를 사용해야 한다.", "소성한계는 소성범위의 함수량 중 가장 작은 함수량을 말한다.", "원심함수량이 큰 흙일수록 보수력이 크다.", "Montmorillonite계 점토는 물을 흡수하면 팽창성이 매우 크다."], "ans": 0, "sol": "<p>② 액성한계, 소성한계, 수축한계 시험용 시료는 No.40체 통과시료를 사용한다. 그러나 습윤시료이다.\n④ 소성한계는 소성상태의 함수비 중에서 가장 작은 함수비를 말한다.\n① 원심함수량(CME)\n・점토가 많을수록 CME가 커진다.\n・CME &gt; 12%이면 투수성이 작아 보수력이 크다.\n③ 점토광물 중 몬모릴로나이트(Montmorillonite)는 공학적 안정성이 가장 작기 때문에 물에 매우 약해 팽창, 수축이 매우 크다.</p>\n", "img": "q-38fc2f589603819d.webp"}, {"id": "38fc2f58960381369a88cf4656adfcad", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "흙의 공학적 성질을 구하기 위한 시험이 아닌 것은?", "choices": ["다짐 시험", "함수량 시험", "투수 시험", "CBR 시험"], "ans": 1, "sol": "<p>③ 흙의 물리적 성질 : 아터버그 한계, 함수비 시험, 비중 시험 등이 있다.\n④ 흙의 공학적 성질 : 흙의 강도, 압축성, 투수성 등을 의미한다.</p>\n", "img": "q-38fc2f5896038136.webp"}, {"id": "38fc2f58960381fdb2aefb6f4ec069ef", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "교란된 시료로 실내 토질 시험을 하면 결과가 불교란 시료에 대한 시험에 비해 현저한 차이를 가져온다. 그러나 차이가 나지 않는 것은?", "choices": ["전단강도", "압밀곡선", "흙의 구조", "액성한계"], "ans": 3, "sol": "<p>액성한계 시험은 흙의 물리적 성질을 알기 위한 시험으로 교란된(흐트러진) 시료를 사용한다.</p>\n", "img": "q-38fc2f58960381fd.webp"}, {"id": "38fc2f58960381be9e92e44eb68cbc1b", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "흙의 삼상에서 흙만의 체적을 “1”로 가정하는 경우 물만의 무게는 다음 중 어느 것인가?", "choices": ["<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi><mo>·</mo><msub><mi>γ</mi><mi>w</mi></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>w</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><mo>·</mo><msub><mi>γ</mi><mi>w</mi></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>w</mi><mo>·</mo><mi>e</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><mo>·</mo><msub><mi>γ</mi><mi>w</mi></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>S</mi><mo>·</mo><mi>e</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><mo>·</mo><msub><mi>γ</mi><mi>w</mi></msub></mrow></math></span>"], "ans": 3, "sol": "<p>흙의 삼상도에서 흙 입자만의 체적을<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>s</mi></msub><mo>=</mo><mn>1</mn></mrow></math></span>로 두면, 간극비<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>e</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>V</mi><mi>v</mi></msub></mrow><mrow><msub><mi>V</mi><mi>s</mi></msub></mrow></mfrac></mstyle></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>v</mi></msub><mo>=</mo><mi>e</mi></mrow></math></span>이다. 또 포화도<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><mi>S</mi><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><msub><mi>V</mi><mi>w</mi></msub></mrow><mrow><msub><mi>V</mi><mi>v</mi></msub></mrow></mfrac></mstyle><mo>×</mo><mn>100</mn></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>V</mi><mi>w</mi></msub><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>S</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><msub><mi>V</mi><mi>v</mi></msub></mrow></math></span>이다. 물의 무게는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W</mi><mi>w</mi></msub><mo>=</mo><msub><mi>γ</mi><mi>w</mi></msub><msub><mi>V</mi><mi>w</mi></msub></mrow></math></span>이므로<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>W</mi><mi>w</mi></msub><mo>=</mo><mstyle displaystyle=\"true\" scriptlevel=\"0\"><mfrac><mrow><mi>S</mi><mi>e</mi></mrow><mrow><mn>100</mn></mrow></mfrac></mstyle><msub><mi>γ</mi><mi>w</mi></msub></mrow></math></span>가 된다.</p>\n", "img": "q-38fc2f58960381be.webp"}, {"id": "38fc2f5896038102b4ade05b65b9db50", "subj": "토질", "subjKey": "토질", "subjName": "토질 및 기초", "q": "다음 밀도 중 큰 것부터 차례로 된 것은? (단,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub></mrow></math></span>: 포화밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>: 수중밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>t</mi></msub></mrow></math></span>: 습윤밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>d</mi></msub></mrow></math></span>: 건조밀도,<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub></mrow></math></span>: 흙 골격만의 밀도)", "choices": ["<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>", "<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>d</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>s</mi></msub></mrow></math></span>"], "ans": 0, "sol": "<p>단위중량의 대소는<span class=\"math-inline\"><math xmlns=\"http://www.w3.org/1998/Math/MathML\" display=\"inline\"><mrow><msub><mi>γ</mi><mi>s</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>a</mi><mi>t</mi></mrow></msub><mo>≥</mo><msub><mi>γ</mi><mi>t</mi></msub><mo>≥</mo><msub><mi>γ</mi><mrow><mi>s</mi><mi>u</mi><mi>b</mi></mrow></msub></mrow></math></span>이다.</p>\n", "img": "q-38fc2f5896038102.webp"}];      // [{id, subj, subjKey, q, choices, ans, sol, img}]
