:root{ --bg:#f4f5f7; --card:#fff; --ink:#1e242b; --dim:#6b747d; --line:#e2e5e9;
       --ok:#2f7d5d; --accent:#2f5d8a; --warn:#a8552f;
       --cell:#e6e8ea; --fill:74,124,229; }
@media (prefers-color-scheme: dark){
  :root{ --bg:#14181c; --card:#1c2126; --ink:#e6e9ec; --dim:#98a1aa; --line:#2b3238;
         --accent:#7aa6d2; --cell:#262c32; --fill:110,152,240; } }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink);
  font-family:"NoteHead","NoteBody","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:16px; line-height:1.6; }

/* ── 머리 (앱처럼: 왼쪽 뒤로, 가운데 제목, 오른쪽 설정) ── */
header{ position:sticky; top:0; z-index:10; background:var(--card);
  border-bottom:1px solid var(--line); padding:13px 10px;
  padding-top:calc(13px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:6px; }
header b{ flex:1; text-align:center; font-size:19px; font-weight:normal;
  letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
header button{ background:none; border:0; color:var(--dim); font:inherit; font-size:13.5px;
  cursor:pointer; padding:6px 8px; border-radius:8px; display:flex; align-items:center;
  gap:5px; min-width:62px; }
header button:disabled{ visibility:hidden; }
header #gear{ justify-content:flex-end; }
.tri{ width:0; height:0; border-right:6px solid currentColor;
  border-top:4.5px solid transparent; border-bottom:4.5px solid transparent; }

main{ max-width:720px; margin:0 auto; padding:12px 14px 48px; }
.bar{ display:flex; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--dim);
  margin:2px 0 12px; padding:0 4px; }
.bar b{ color:var(--ink); font-size:18px; }

/* ── 과목 패널 — 끝이 둥근 직사각형 하나에 그 과목의 12주가 들어간다 ── */
.panel{ display:block; text-decoration:none; color:inherit; background:var(--card);
  border:1px solid var(--line); border-radius:24px; padding:14px 18px 12px;
  margin:0 0 10px; }
.panel:active{ background:var(--bg); }
.ph{ display:flex; align-items:baseline; gap:10px; margin-bottom:10px; }
.ph .nm{ flex:1; font-size:17px; }
.ph .n{ font-size:12.5px; color:var(--dim); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.due{ color:var(--accent); font-weight:700; }
/* 히트맵 왼쪽 · 숫자 오른쪽. 12주 칸이 폭의 절반만 쓰므로 남는 자리에 숫자를 앉힌다. */
.pbody{ display:flex; gap:16px; align-items:flex-start; }
.pstat{ flex:1; min-width:0; font-size:12px; color:var(--dim); line-height:1.75;
  font-variant-numeric:tabular-nums; }
.pstat b{ color:var(--ink); font-weight:normal; }
.pstat .prog{ margin-top:6px; }
.prog{ height:4px; border-radius:3px; background:var(--line); overflow:hidden; }
.prog i{ display:block; height:100%; background:var(--ok); }

/* 12주 = 7행 × 12열. 칸을 **고정 크기로 작게** 잡아 촘촘하게 붙인다 —
   1fr 로 늘리면 폰에서 칸이 30px 이 되어 패널이 히트맵 하나로 꽉 찬다. */
.hm{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,10px);
  grid-auto-columns:10px; gap:3px; width:fit-content; }
.hm i{ border-radius:2.5px; background:var(--cell); }
.hm.big{ grid-template-rows:repeat(7,13px); grid-auto-columns:13px; gap:4px;
  margin:0 auto; }

/* ── 과목 화면: 장 → 단원 ── */
.card{ background:var(--card); border:1px solid var(--line); border-radius:20px;
  padding:4px 16px; margin:0 0 12px; }
.card.pad{ padding:15px 18px; }
h2{ font-size:13px; margin:20px 0 8px; padding:0 6px; color:var(--dim); }
.ch{ border-top:1px solid var(--line); }
.ch:first-child{ border-top:0; }
.chh{ width:100%; display:flex; align-items:center; gap:9px; padding:12px 2px;
  background:none; border:0; color:var(--dim); font:inherit; font-size:14.5px;
  cursor:pointer; text-align:left; }
.chh .caret{ width:0; height:0; flex:0 0 7px;
  border-left:5px solid var(--line); border-top:4px solid transparent;
  border-bottom:4px solid transparent; transition:transform .15s; }
.ch[open] .chh{ color:var(--ink); }
.ch[open] .chh .caret{ transform:rotate(90deg); border-left-color:var(--dim); }
.chh .nm{ flex:1; }
.chh .n{ font-size:12px; white-space:nowrap; font-variant-numeric:tabular-nums; }
.chu{ display:none; padding:0 0 8px 15px; }
.ch[open] .chu{ display:block; }
a.unit, .unit.todo{ display:block; color:inherit; text-decoration:none;
  padding:9px 2px 9px 10px; border-top:1px solid var(--line); }
.unit.todo{ opacity:.42; }
.unit .t{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.unit .t > span:first-child{ font-size:15px; }   /* > 없으면 .n 안의 .due 까지 잡힌다 */
.unit .n{ font-size:12.5px; color:var(--dim); white-space:nowrap;
  font-variant-numeric:tabular-nums; }
.unit .prog{ margin-top:5px; }
.unit.todo .n{ font-size:11.5px; }

/* ── 설정 ── */
.note{ font-size:12.5px; color:var(--dim); margin-top:9px; line-height:1.55; }
label.row{ display:block; font-size:12.5px; color:var(--dim); margin:10px 0 3px; }
input[type=password]{ width:100%; padding:10px 11px; border-radius:11px;
  border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit;
  font-size:14px; }
.tools{ display:flex; gap:8px; flex-wrap:wrap; margin-top:11px; }
.tools button{ border:1px solid var(--line); background:var(--card); color:var(--ink);
  border-radius:11px; padding:9px 14px; font:inherit; font-size:14px; cursor:pointer; }
.tools button.go{ border-color:var(--accent); background:var(--accent); color:#fff;
  font-weight:700; }
.kv{ font-size:13px; color:var(--dim); }
.kv b{ color:var(--ink); font-weight:normal; }
.empty{ text-align:center; color:var(--dim); font-size:13.5px; padding:26px 10px; }

window.J0Toast = (function () {

  var CSS = ""
    + "#j0toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));"
    + "transform:translateX(-50%) translateY(10px);z-index:9999;max-width:min(92vw,520px);"

    + "#j0toast.on{opacity:1;transform:translateX(-50%) translateY(0);}"
    + "#j0toast[hidden]{display:none;}"
    + "#j0toast .j0t-m{flex:1;min-width:0;}"
    + "#j0toast.ok .j0t-m{color:#9fd3b6;}"
    + "#j0toast.err .j0t-m{color:#ffc9a3;}"
    + "#j0toast a{color:#9fd3b6;}"
    + "#j0toast .j0t-x{position:relative;flex:0 0 auto;width:24px;height:24px;border:0;"
    + "background:none;padding:0;cursor:pointer;color:#9aa5b1;}"
    + "#j0toast .j0t-x:hover{color:#eef1f4;}"
    + "#j0toast .j0t-x::before,#j0toast .j0t-x::after{content:'';position:absolute;left:5px;"
    + "top:11px;width:14px;height:1.6px;background:currentColor;border-radius:1px;}"
    + "#j0toast .j0t-x::before{transform:rotate(45deg);}"
    + "#j0toast .j0t-x::after{transform:rotate(-45deg);}"
    + "@media print{#j0toast{display:none !important;}}";

  function ensure() {
    if (box) return box;
    var st = document.createElement("style");
    st.textContent = CSS;
    document.head.appendChild(st);
    box = document.createElement("div");
    box.id = "j0toast";
    box.setAttribute("hidden", "");
    box.innerHTML = '<span class="j0t-m"></span>'
                  + '<button class="j0t-x" type="button" title="닫기"></button>';
    box.querySelector(".j0t-x").onclick = hide;
    document.body.appendChild(box);
    return box;
  }
  function hide() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (!box) return;
    box.classList.remove("on");
    setTimeout(function () {
      if (box && !box.classList.contains("on")) box.setAttribute("hidden", "");
    }, 220);
  }
  /* show(글, 종류, 살아있을 ms). ms=0 이면 다음 알림이나 X 로만 사라진다.
     기본은 잠깐(3.2초), 오류는 읽을 시간을 주려고 길게(9초). */
  function show(msg, kind, ms) {
    var b = ensure();
    if (timer) { clearTimeout(timer); timer = null; }
    b.className = kind || "";
    b.querySelector(".j0t-m").innerHTML = msg;
    b.removeAttribute("hidden");
    requestAnimationFrame(function () { b.classList.add("on"); });
    var life = (ms === undefined) ? (kind === "err" ? 9000 : 3200) : ms;
    if (life > 0) timer = setTimeout(hide, life);
  }
  show.hide = hide;
  return show;
})();

window.J0Sync = (function () {
  var KEY = "j0-review-v1", SKEY = "j0-sync";
  /* 저장소·경로는 **빌드에서 박는다.** 사이트를 올린 그 저장소에 기록 파일을 같이 둔다 —
     사람이 화면에서 저장소 이름을 적어 넣게 하면 기기마다 틀리게 적어 어긋난다. */
  var REPO = "notjaeyoung0108-lang/anki_civil_note", PATH = "review-log.json";

  function cfg() { try { return JSON.parse(localStorage.getItem(SKEY) || "{}"); }
                   catch (e) { return {}; } }
  function setCfg(c) { localStorage.setItem(SKEY, JSON.stringify(c)); }
  function where() { return { repo: REPO, path: PATH }; }
  /* 공개 저장소는 **읽기에 토큰이 필요 없다.** 쓰기만 토큰이 필요하다 —
     그래서 토큰을 안 넣은 기기에서도 진도는 보인다(읽기 전용). */
  function ready() { return !!REPO; }
  function canWrite() { return !!(REPO && cfg().token); }

  function load() {
    try { var r = JSON.parse(localStorage.getItem(KEY) || "{}");
          return { s: r.s || {}, log: r.log || [] }; }
    catch (e) { return { s: {}, log: [] }; }
  }
  function save(S) { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  /* 양쪽 방향으로 합친다 — 같은 빈칸은 복습 횟수가 많은 쪽을 남긴다.
     저장소(localStorage)에 바로 쓰므로, 부르는 쪽은 끝나고 다시 읽어야 한다.
     돌려주는 수는 **새로 들어온 채점 기록(log) 건수**다. 상태(s) 갱신까지 같이 세면
     다른 기기에서 한 번 채점한 것이 사람에게 "2건" 으로 보인다. */
  function merge(inc) {
    var S = load(), n = 0;
    var incS = (inc && inc.s) || {}, incL = (inc && inc.log) || [];
    for (var id in incS) {
      var mine = S.s[id];
      if (!mine || (incS[id].reps || 0) > (mine.reps || 0)) S.s[id] = incS[id];
    }
    var seen = {};
    S.log.forEach(function (l) { seen[l.t + "|" + l.id] = 1; });
    incL.forEach(function (l) {
      var k = l.t + "|" + l.id;
      if (!seen[k]) { S.log.push(l); seen[k] = 1; n++; }
    });
    S.log.sort(function (a, b) { return a.t - b.t; });
    save(S);
    return n;
  }

  function headers() {
    var c = cfg();
    var h = { "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28" };
    // 토큰이 없으면 Authorization 을 붙이지 않는다 — 붙이면 빈 값으로 401 이 된다
    if (c.token) h["Authorization"] = "Bearer " + c.token;
    return h;
  }
  function gh(path, opt) {
    return fetch("https://api.github.com/repos/" + REPO + "/contents/" + path, opt)
      .catch(function (e) {
        throw new Error("GitHub 에 닿지 못했습니다 — 인터넷 연결이나 사내망 차단을 확인하세요 ("
                        + e.message + ")");
      });
  }
  function b64enc(str) {
    var b = new TextEncoder().encode(str), s = "";
    b.forEach(function (x) { s += String.fromCharCode(x); });
    return btoa(s);
  }
  function b64dec(b64) {
    var bin = atob(String(b64).replace(/\s/g, ""));
    var arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(arr);
  }
  function guard() {
    if (!REPO) throw new Error("기록 저장소가 정해지지 않았습니다 (빌드에서 박습니다)");
  }
  function guardWrite() {
    guard();
    if (!cfg().token) throw new Error("올리려면 토큰이 필요합니다 — 목록의 '설정'에서 넣으세요");
  }
  function why(r, put) {
    if (r.status === 401) return "토큰이 거부됐습니다 (401) — 토큰을 다시 확인하세요";
    if (r.status === 403) return put
      ? "권한이 없습니다 (403) — 토큰에 이 저장소의 Contents 읽기·쓰기를 주세요"
      : "요청이 너무 많거나 막혔습니다 (403) — 토큰을 넣으면 넉넉해집니다";
    if (r.status === 404) return put
      ? "저장소를 찾지 못했습니다 (404) — 이름이 맞는지, 토큰에 그 저장소 권한이 있는지 보세요"
      : "찾지 못했습니다 (404)";
    if (r.status === 409) return "다른 기기와 부딪혔습니다 (409) — 잠시 뒤 다시 하세요";
    if (r.status === 422) return "올리지 못했습니다 (422) — 파일 경로를 확인하세요";
    return "실패 " + r.status;
  }

  function pull() {
    guard();
    return gh(PATH, { headers: headers() }).then(function (r) {
      if (r.status === 404) return { n: 0, sha: null, empty: true,
                                     ahead: load().log.length };
      if (!r.ok) return r.text().then(function (t) {
        throw new Error(why(r, false) + " — " + t.slice(0, 120)); });
      return r.json().then(function (j) {
        var inc = JSON.parse(b64dec(j.content));
        // 합치기 **전에** '내게만 있는 기록' 을 센다. 0 이면 올릴 게 없다는 뜻이라
        // 빈 커밋을 만들지 않는다 — 앱을 열 때마다 커밋이 쌓이면 이력이 쓰레기가 된다.
        var rem = {};
        (inc.log || []).forEach(function (l) { rem[l.t + "|" + l.id] = 1; });
        var ahead = load().log.filter(function (l) {
          return !rem[l.t + "|" + l.id]; }).length;
        return { n: merge(inc), sha: j.sha, empty: false, ahead: ahead };
      });
    });
  }

  function put(sha) {
    var p = PATH;
    var body = { message: "복습 기록 "
                   + new Date().toISOString().slice(0, 16).replace("T", " "),
                 content: b64enc(JSON.stringify(load())) };
    if (sha) body.sha = sha;
    return gh(p, { method: "PUT", headers: headers(), body: JSON.stringify(body) })
      .then(function (r) {
        if (!r.ok) return r.text().then(function (t) {
          throw new Error(why(r, true) + " — " + t.slice(0, 120)); });
        stamp();
      });
  }

  function push(sha) {
    guardWrite();
    if (sha !== undefined) return put(sha);
    return gh(PATH, { headers: headers() }).then(function (r0) {
      return r0.ok ? r0.json().then(function (j) { return put(j.sha); }) : put(null);
    });
  }

  /* 받고 → 합치고 → 올린다. 두 기기에서 같은 날 공부해도 서로 지우지 않는다.
     토큰이 없는 기기에서는 **받기까지만** 하고 조용히 끝낸다 (readonly). */
  function sync() {
    return pull().then(function (r) {
      // 비공개 저장소를 토큰 없이 치면 404 가 온다 — '파일이 아직 없음' 과 구분이
      // 안 되므로 empty 를 그대로 넘겨 부르는 쪽이 솔직하게 말하게 한다.
      if (!canWrite()) { stamp(); return { n: r.n, readonly: true, empty: r.empty }; }
      if (!r.ahead) { stamp(); return { n: r.n, uptodate: true }; }
      return put(r.empty ? null : r.sha).then(function () { return { n: r.n }; });
    });
  }
  function stamp() { var c = cfg(); c.last = Date.now(); setCfg(c); }
  /* 마지막으로 맞춘 뒤 ms 가 지났나 — 새로고침마다 무턱대고 치지 않게 한다 */
  function stale(ms) {
    var c = cfg();
    return !c.last || (Date.now() - c.last) > (ms || 120000);
  }

  return { cfg: cfg, setCfg: setCfg, ready: ready, canWrite: canWrite, where: where,
           load: load, save: save, merge: merge, pull: pull, push: push, sync: sync,
           stale: stale };
})();

</script>

const BUILT = "2026-08-12 00:23 UTC", BUILD = "37fc8260", ORDER = ["응용역학", "측량학", "수리학", "철콘", "토질", "상하수도공학"];

    return {s:r.s||{}, log:r.log||[]}; }catch(e){ return {s:{}, log:[]}; } }
const dayKey = t => { const d=new Date(t); d.setHours(0,0,0,0); return d.getTime(); };

/* ── 과목 → 장 → 단원 으로 한 번만 묶는다 ───────────────── */
const SUBJ = (() => {
  const out = [];
  for (const u of UNITS){
    let g = out.find(x => x.key === u.subj);
    if (!g){ g = { key:u.subj, name:u.subjName, sid:u.sid, units:[] }; out.push(g); }
    g.units.push(u);
  }
  out.sort((a,b) => {
    const ia = ORDER.indexOf(a.key), ib = ORDER.indexOf(b.key);
    if (ia !== ib) return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    return a.name.localeCompare(b.name, "ko");
  });
  for (const g of out){
    const chs = [];
    for (const u of g.units){
      let c = chs.find(x => x.ch === u.ch);
      if (!c){ c = { ch:u.ch, title:u.chTitle, units:[] }; chs.push(c); }
      c.units.push(u);
      if (!c.title && u.chTitle) c.title = u.chTitle;
    }
    chs.sort((a,b) => a.ch - b.ch);
    chs.forEach(c => c.units.sort((a,b) => a.ord - b.ord));
    g.chs = chs;
  }
  return out;
})();

/* ── 셈 ──────────────────────────────────────────────────── */
function stat(u){
  const t = Date.now();
  const seen = u.rids.filter(r => S.s[r]).length;
  const due  = u.rids.filter(r => S.s[r] && S.s[r].due <= t).length;
  const solid= u.rids.filter(r => S.s[r] && S.s[r].step === null && S.s[r].ivl >= 21).length;
  return { all:u.rids.length, seen, due, solid };
}
function gstat(g){
  const o = { all:0, seen:0, due:0, solid:0, done:0 };
  for (const u of g.units){
    if (!u.file) continue;
    o.done++;
    const s = stat(u);
    o.all += s.all; o.seen += s.seen; o.due += s.due; o.solid += s.solid;
  }
  return o;
}
/* 기록이 어느 과목의 것인지 — 채점할 때 넣은 u("과목/단원")를 쓰고,
   그게 없는 옛 기록은 빈칸 상태에 남은 unit 으로 되짚는다. */
function subjOf(l){
  let u = l.u;
  if (!u && S.s[l.id]) u = S.s[l.id].unit;
  return u ? String(u).split("/")[0] : "";
}
function byDayOf(key){
  const o = {};
  for (const l of S.log){
    if (key && subjOf(l) !== key) continue;
    const k = dayKey(l.t); o[k] = (o[k]||0) + 1;
  }
  return o;
}
/* 12주 히트맵. 일요일에서 시작해 열이 주 단위로 떨어진다. */
function heat(byDay){
  const today = dayKey(Date.now());
  const start = today - 83*DAY - (new Date(today).getDay())*DAY;
  let max = 1;
  for (const k in byDay) if (byDay[k] > max) max = byDay[k];
  let h = "";
  for (let d=start; d<=today; d+=DAY){
    const n = byDay[d]||0, al = n ? (0.30 + 0.70*Math.min(1, n/max)) : 0;
    h += `<i title="${new Date(d).toLocaleDateString()} · ${n}회"`
       + (n ? ` style="background:rgba(var(--fill),${al.toFixed(2)})"` : "") + `></i>`;
  }
  return h;
}

/* ── 화면 1: 과목 목록 ───────────────────────────────────── */
function home(){
  const today = dayKey(Date.now()), all = byDayOf(null);
  let streak = 0; for (let d=today; all[d]; d-=DAY) streak++;
  let dueN = 0;
  const panels = SUBJ.map(g => {
    const s = gstat(g);
    dueN += s.due;
    return `<a class="panel" href="#${g.sid}">
      <div class="ph"><span class="nm">${esc(g.name)}</span>
        <span class="n">${s.due ? `<span class="due">복습 ${s.due}</span> · ` : ""}`
        + `${s.done}/${g.units.length}단원</span></div>
      <div class="pbody">
        <div class="hm">${heat(byDayOf(g.key))}</div>
        <div class="pstat">빈칸 <b>${s.seen}</b>/${s.all}<br>단단함 <b>${s.solid}</b>
          <div class="prog"><i style="width:${s.all ? (s.solid/s.all*100).toFixed(0) : 0}%"></i></div>
        </div>
      </div>
    </a>`;
  }).join("");
  head("정리노트", false);
  document.getElementById("app").innerHTML = `
    <div class="bar"><span>오늘 <b>${all[today]||0}</b>회</span>
      <span>연속 <b>${streak}</b>일</span>
      <span>누적 <b>${S.log.length}</b>회</span>
      <span>복습할 것 <b>${dueN}</b></span></div>
    ${panels}`;
}

/* ── 화면 2: 과목 하나 — 장별 단원 ──────────────────────── */
function subject(g){
  const opened = openSet(), s = gstat(g);
  let inner = "";
  for (const c of g.chs){
    let cd = 0, cw = 0, lines = "";
    for (const u of c.units){
      if (!u.file){
        lines += `<div class="unit todo"><div class="t">`
          + `<span>${u.ord}. ${esc(u.title)}</span><span class="n">아직</span></div></div>`;
        continue;
      }
      cw++;
      const st = stat(u); cd += st.due;
      lines += `<a class="unit" href="${u.file}?v=${BUILD}"><div class="t">`
        + `<span>${u.ord}. ${esc(u.title)}</span>`
        + `<span class="n">${st.due ? `<span class="due">복습 ${st.due}</span> · ` : ""}`
        + `${st.seen}/${st.all}</span></div>`
        + `<div class="prog"><i style="width:${st.all ? (st.solid/st.all*100).toFixed(0) : 0}%"></i></div></a>`;
    }
    const ck = g.key + "|" + c.ch;
    inner += `<div class="ch"${opened.has(ck) ? " open" : ""} data-k="${esc(ck)}">`
      + `<button class="chh"><span class="caret"></span>`
      + `<span class="nm">제${c.ch}장${c.title ? " " + esc(c.title) : ""}</span>`
      + `<span class="n">${cd ? `<span class="due">복습 ${cd}</span> · ` : ""}`
      + `${cw}/${c.units.length}</span></button>`
      + `<div class="chu">${lines}</div></div>`;
  }
  head(g.name, true);
  document.getElementById("app").innerHTML = `
    <div class="bar"><span>복습할 것 <b>${s.due}</b></span>
      <span>단원 <b>${s.done}</b>/${g.units.length}</span>
      <span>빈칸 <b>${s.seen}</b>/${s.all}</span>
      <span>단단함 <b>${s.solid}</b></span></div>
    <div class="card pad"><div class="hm big">${heat(byDayOf(g.key))}</div></div>
    <div class="card">${inner}</div>`;

  document.querySelectorAll(".ch > button.chh").forEach(b => {
    b.onclick = ev => {
      ev.stopPropagation();
      const d = b.parentElement, k = d.getAttribute("data-k"), o = openSet();
      if (d.hasAttribute("open")){ d.removeAttribute("open"); o.delete(k); }
      else { d.setAttribute("open",""); o.add(k); }
      setOpen(o);
    };
  });
}

  document.getElementById("savetok").onclick = () => {
    const c2 = J.cfg(); c2.token = document.getElementById("token").value.trim();
    J.setCfg(c2); say(c2.token ? "토큰을 저장했습니다" : "토큰을 비웠습니다 (읽기 전용)", "ok");
  };
  document.getElementById("now").onclick = () => syncNow();
}

/* ── 머리·상태줄 ─────────────────────────────────────────── */
function head(title, back){
  document.getElementById("ttl").textContent = title;
  document.getElementById("back").disabled = !back;
}
/* 안내는 **팝업**으로 띄운다 (render_note.py 의 TOAST_JS — 단원 페이지와 같은 것).
   화면 안에 글자로 얹으면 다음 그리기에서 지워지거나 눈에 안 들어온다.
   ms=0 은 "진행 중" 처럼 다음 알림이 덮을 때까지 남겨둘 때 쓴다. */
function say(msg, kind, ms){ if (window.J0Toast) window.J0Toast(msg, kind, ms); }

/* ── 동기화 — 열 때(새로고침) 자동, 단원의 '학습완료' 에서도 ── */
let syncing = false;
async function syncNow(quiet){
  if (syncing || !J.ready()) return;
  syncing = true;
  if (!quiet) say("맞추는 중…", "", 0);
  try{
    const r = await J.sync();
    S = load(); route();
    const got = r.n ? " · 새 기록 " + r.n + "건" : "";
    say(r.readonly
          ? (r.empty
              ? "받지 못했습니다 — 기록 파일이 아직 없거나, 비공개 저장소라 토큰이 필요합니다"
              : "받았습니다 (이 기기는 읽기 전용)" + got)
          : r.uptodate ? "최신입니다" + got
          : "맞췄습니다" + got,
        r.readonly && r.empty ? "err" : "ok");
  }catch(e){ say(e.message, "err"); }
  syncing = false;
}

/* ── 길 찾기 (해시 한 칸) ────────────────────────────────── */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (h.startsWith("t=")){                 // 주소로 토큰 넘기기 (폰에 넣을 때 편하다)
    const c = J.cfg(); c.token = h.slice(2).trim(); J.setCfg(c);
    history.replaceState(null, "", "#set");
    say("토큰을 저장했습니다", "ok");
    return settings();
  }
  if (h === "set") return settings();
  const g = SUBJ.find(x => x.sid === h);
  if (g) return subject(g);
  home();
}

document.getElementById("back").onclick = () => { location.hash = ""; };
document.getElementById("gear").onclick = () => { location.hash = "set"; };
window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
route();
syncNow(true);
window.addEventListener("focus", () => { S = load(); route(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible"){ S = load(); route(); }
});
</script></body></html>
